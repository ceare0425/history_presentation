<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모바일 복습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #F7F3EE;
    --surface:   #FFFFFF;
    --header-bg: #2C1A0E;
    --accent:    #C5A028;
    --main:      #8B4513;
    --text:      #1A1208;
    --text-sec:  #6B5740;
    --border:    #E2D5C3;
  }

  html, body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 16px;
    line-height: 1.6;
  }

  /* ── 상단바 ── */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--header-bg);
    border-bottom: 3px solid var(--accent);
    padding: 0.85rem 1rem;
    display: flex; align-items: center; gap: 0.6rem;
  }
  .topbar .logo {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 1.05rem; font-weight: 800; color: var(--accent);
  }
  .back-btn {
    display: none;
    align-items: center; gap: 0.3rem;
    background: transparent; border: 1.5px solid rgba(197,160,40,0.5);
    color: var(--accent); border-radius: 6px;
    padding: 0.35rem 0.7rem; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .back-btn svg { width: 14px; height: 14px; fill: currentColor; }

  /* ── 목록 화면 ── */
  #listView { padding: 1rem; max-width: 640px; margin: 0 auto; }
  .search-box {
    display: flex; align-items: center; gap: 0.5rem;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 8px; padding: 0.6rem 0.9rem; margin-bottom: 1.1rem;
  }
  .search-box svg { width: 16px; height: 16px; fill: var(--text-sec); flex-shrink: 0; }
  .search-box input { border: none; outline: none; background: transparent; font-family: inherit; font-size: 0.95rem; width: 100%; }

  /* ── 아코디언 (과목 / 단원 접기·펼치기) ── */
  .subject-acc { margin-bottom: 0.7rem; }
  .subject-acc summary.subject-name {
    font-family: 'Nanum Myeongjo', serif; font-size: 1.05rem; font-weight: 700;
    padding: 0.75rem 0.9rem; margin: 0; border-radius: 10px;
    background: var(--surface); border: 1.5px solid var(--border);
    display: flex; align-items: center; gap: 0.5rem; cursor: pointer;
    list-style: none; user-select: none;
  }
  .subject-acc summary.subject-name::-webkit-details-marker { display: none; }
  .subject-acc[open] > summary.subject-name { border-radius: 10px 10px 0 0; border-bottom-color: transparent; }
  .acc-chevron { flex-shrink: 0; width: 10px; height: 10px; transition: transform 0.2s; fill: var(--main); }
  details[open] > summary .acc-chevron { transform: rotate(90deg); }
  .subject-count {
    margin-left: auto; font-size: 0.74rem; font-weight: 700; color: var(--text-sec);
    background: var(--bg); border-radius: 20px; padding: 0.1rem 0.55rem; flex-shrink: 0;
  }
  .subject-body {
    background: var(--surface); border: 1.5px solid var(--border); border-top: none;
    border-radius: 0 0 10px 10px; padding: 0.6rem 0.7rem 0.7rem;
  }

  .group-acc { margin: 0.3rem 0; }
  .group-acc summary.group-name {
    font-size: 0.85rem; font-weight: 700; color: var(--main);
    display: flex; align-items: center; gap: 0.4rem; cursor: pointer;
    padding: 0.55rem 0.6rem; background: var(--bg); border-radius: 8px;
    list-style: none; user-select: none;
  }
  .group-acc summary.group-name::-webkit-details-marker { display: none; }
  .group-body { padding: 0.5rem 0.1rem 0.2rem; }
  .lesson-row {
    display: flex; align-items: center; gap: 0.7rem;
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px;
    padding: 0.75rem 0.9rem; margin-bottom: 0.5rem;
    text-decoration: none; color: inherit;
  }
  .lesson-row:active { background: #FDFAF5; border-color: var(--accent); }
  .lesson-emoji { font-size: 1.3rem; flex-shrink: 0; }
  .lesson-title { font-weight: 700; font-size: 0.94rem; line-height: 1.4; }
  .lesson-desc { font-size: 0.78rem; color: var(--text-sec); margin-top: 0.15rem; line-height: 1.5; }
  .lesson-arrow { margin-left: auto; flex-shrink: 0; width: 14px; height: 14px; fill: var(--text-sec); }

  .status-box { text-align: center; padding: 3rem 1rem; color: var(--text-sec); }
  .status-box .icon { font-size: 2.3rem; margin-bottom: 0.7rem; }
  .status-box h3 { font-size: 1rem; margin-bottom: 0.4rem; color: var(--text); }
  .status-box p { font-size: 0.85rem; line-height: 1.7; }
  .status-box code { display: inline-block; background: #F0E8DC; border: 1px solid var(--border); border-radius: 4px; padding: 0.2rem 0.5rem; font-size: 0.8rem; color: var(--main); margin-top: 0.5rem; }

  /* ── 뷰어 화면 ──
     레슨 원본 CSS(html/body 규칙)는 서로 배경 설계가 달라 신뢰할 수 없으므로 주입하지 않고,
     대신 모든 레슨에 공통으로 세계사 스타일의 은은한 양피지 질감 배경을 고정으로 적용한다. */
  #viewerView {
    display: none;
    background-color: #F5E6C4;
    background-image:
      repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(160,120,60,0.04) 2px, rgba(160,120,60,0.04) 4px),
      repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(140,100,40,0.06) 28px, rgba(140,100,40,0.06) 29px);
  }
  .viewer-head { padding: 1rem 1rem 0.4rem; max-width: 760px; margin: 0 auto; }
  .viewer-title { font-family: 'Nanum Myeongjo', serif; font-size: 1.15rem; font-weight: 800; }
  .viewer-hint { font-size: 0.78rem; color: var(--text-sec); margin-top: 0.3rem; }
  #slideList { padding: 0.6rem 0.8rem 3rem; max-width: 760px; margin: 0 auto; }

  /* position:relative로 지정해, 레슨 원본이 슬라이드 안에 pseudo-element(::before)로 넣은
     장식용 줄무늬 배경 등이 페이지 전체로 새어나가지 않고 이 슬라이드 박스 안에만 갇히게 함.
     scroll-margin-top은 목차 탭으로 이동할 때 상단바(sticky)에 안 가리도록 하는 여유값 */
  .mslide { margin-bottom: 1.3rem; position: relative; scroll-margin-top: 64px; }
  .mslide-num {
    display: inline-block; font-size: 0.72rem; font-weight: 700;
    color: #fff; background: var(--main); border-radius: 20px;
    padding: 0.15rem 0.6rem; margin-bottom: 0.4rem;
  }

  /* ── 레슨별 원본 스타일을 뒤엎는 규칙 (항상 이겨야 하므로 !important) ──
     원본은 16:9 고정 · 화면 꽉 채우기 전제로 만들어졌기 때문에,
     여기서는 세로로 자연스럽게 이어지는 스크롤 레이아웃으로 강제 전환한다.
     특히 원본의 html,body{overflow:hidden}을 반드시 덮어써야
     페이지 전체 스크롤이 살아난다. */
  html, body { overflow: visible !important; height: auto !important; font-size: clamp(15px, 4.2vw, 18px) !important; }
  #slideList .slide {
    display: block !important; position: static !important;
    aspect-ratio: auto !important; width: 100% !important; height: auto !important;
    margin: 0 !important; animation: none !important;
  }
  #slideList .browser-card {
    width: 100% !important; height: auto !important;
    box-shadow: 0 2px 12px rgba(44,26,14,0.18) !important;
  }
  #slideList .browser-content {
    overflow: visible !important; flex: none !important; height: auto !important;
  }
  #slideList .photo-gallery { flex-direction: column !important; }
  #slideList .photo-frame { height: auto !important; }
  #slideList .photo-frame img { width: 100% !important; height: auto !important; max-height: none !important; }
  #slideList .grid-2, #slideList .grid-3, #slideList .grid-4 { grid-template-columns: 1fr !important; }
  /* 손가락 터치 정확도를 위해 빈칸류 탭 영역을 살짝 키움 */
  #slideList .blank, #slideList .ox, #slideList .ans-btn, #slideList .q-blank, #slideList .ox-reveal, #slideList .answer-reveal { padding: 0.25em 0.6em !important; }
</style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" id="backBtn" onclick="showList()">
    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    목록
  </button>
  <span class="logo">📱 모바일 복습</span>
</div>

<!-- 목록 화면 -->
<div id="listView">
  <div class="search-box">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="text" id="searchInput" placeholder="자료 검색..." oninput="filterList()">
  </div>
  <div id="listContent">
    <div class="status-box"><div class="icon">⏳</div><h3>불러오는 중...</h3></div>
  </div>
</div>

<!-- 뷰어 화면 -->
<div id="viewerView">
  <div class="viewer-head">
    <div class="viewer-title" id="viewerTitle"></div>
    <div class="viewer-hint">🔎 빈칸이나 정답 버튼을 탭하면 정답이 보여요 · 전체 슬라이드를 이어서 볼 수 있어요</div>
  </div>
  <div id="slideList"></div>
</div>

<script>
  let allLessons = [];
  let savedListScroll = 0; // 레슨을 열기 직전 목록 화면의 스크롤 위치 (목록으로 돌아올 때 복원)

  async function loadPages() {
    try {
      const res = await fetch('../pages.json', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      flattenLessons(data);
      renderList(allLessons);
    } catch (err) {
      document.getElementById('listContent').innerHTML = `
        <div class="status-box">
          <div class="icon">⚠️</div>
          <h3>목록을 불러올 수 없습니다</h3>
          <p>브라우저에서 파일을 직접 열면 보안 정책으로 데이터를 읽을 수 없습니다.<br>로컬 서버나 GitHub Pages 주소로 접속해 주세요.</p>
          <code>python -m http.server 8000</code>
          <p style="margin-top:0.5rem; font-size:0.72rem; color:#B0A090;">${esc(err.message)}</p>
        </div>`;
    }
  }

  function flattenLessons(data) {
    allLessons = [];
    (data.subjects || []).forEach(sub => {
      (sub.pages || []).forEach(p => allLessons.push({ ...p, subjectName: sub.name, subjectEmoji: sub.emoji, groupName: null }));
      (sub.groups || []).forEach(g => {
        (g.pages || []).forEach(p => allLessons.push({ ...p, subjectName: sub.name, subjectEmoji: sub.emoji, groupName: g.name, groupEmoji: g.emoji }));
      });
    });
  }

  // 과목/단원 펼침 상태를 기억해서, 검색을 지워도 사용자가 열어둔 상태가 유지되도록 함
  const openState = {};
  const CHEVRON = '<svg class="acc-chevron" viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>';

  function lessonRowHtml(p) {
    return `
      <a class="lesson-row" href="?path=${encodeURIComponent(p.path)}" onclick="openLesson(event,'${escAttr(p.path)}','${escAttr(p.title)}')">
        <span class="lesson-emoji">${p.emoji || '📄'}</span>
        <span style="flex:1; min-width:0;">
          <div class="lesson-title">${esc(p.title)}</div>
          ${p.description ? `<div class="lesson-desc">${esc(truncate(p.description, 60))}</div>` : ''}
        </span>
        <svg class="lesson-arrow" viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
      </a>`;
  }

  function renderList(lessons, opts) {
    const searching = !!(opts && opts.searching);
    const content = document.getElementById('listContent');
    if (lessons.length === 0) {
      content.innerHTML = `<div class="status-box"><div class="icon">📭</div><h3>검색 결과가 없습니다</h3></div>`;
      return;
    }

    // 과목 → 단원(그룹) → 레슨 순으로 다시 묶는다 (pages.json에 등장하는 순서를 그대로 유지)
    const subjects = [];
    lessons.forEach(p => {
      let subj = subjects.find(s => s.name === p.subjectName);
      if (!subj) { subj = { name: p.subjectName, emoji: p.subjectEmoji, groups: [] }; subjects.push(subj); }
      const groupKey = p.groupName || null;
      let grp = subj.groups.find(g => g.name === groupKey);
      if (!grp) { grp = { name: groupKey, emoji: p.groupEmoji, lessons: [] }; subj.groups.push(grp); }
      grp.lessons.push(p);
    });

    let html = '';
    subjects.forEach(subj => {
      const countText = subj.groups.reduce((n, g) => n + g.lessons.length, 0) + '개';
      const subjKey = 'subject:' + subj.name;
      const subjOpen = searching || !!openState[subjKey];
      html += `<details class="subject-acc" data-key="${escAttr(subjKey)}" ${subjOpen ? 'open' : ''}>
        <summary class="subject-name">${CHEVRON}${subj.emoji || '📁'} ${esc(subj.name)}<span class="subject-count">${countText}</span></summary>
        <div class="subject-body">`;
      subj.groups.forEach(grp => {
        if (grp.name) {
          const grpKey = 'group:' + subj.name + '||' + grp.name;
          const grpOpen = searching || !!openState[grpKey];
          html += `<details class="group-acc" data-key="${escAttr(grpKey)}" ${grpOpen ? 'open' : ''}>
            <summary class="group-name">${CHEVRON}${grp.emoji || '📂'} ${esc(grp.name)}</summary>
            <div class="group-body">${grp.lessons.map(lessonRowHtml).join('')}</div>
          </details>`;
        } else {
          html += grp.lessons.map(lessonRowHtml).join('');
        }
      });
      html += `</div></details>`;
    });
    content.innerHTML = html;

    content.querySelectorAll('details[data-key]').forEach(d => {
      d.addEventListener('toggle', () => { openState[d.dataset.key] = d.open; });
    });
  }

  function filterList() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) { renderList(allLessons); return; }
    renderList(allLessons.filter(p =>
      (p.title || '').toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q)
    ), { searching: true });
  }

  function openLesson(e, path, title) {
    e.preventDefault();
    savedListScroll = window.scrollY; // 지금 보고 있던 목록 위치를 기억해뒀다가 돌아올 때 복원
    history.pushState({ path }, '', '?path=' + encodeURIComponent(path));
    showViewer(path, title);
  }

  function showList() {
    history.pushState({}, '', location.pathname);
    document.getElementById('listView').style.display = 'block';
    document.getElementById('viewerView').style.display = 'none';
    document.getElementById('backBtn').style.display = 'none';
    // 레슨을 열기 직전 스크롤해 있던 위치로 복원 (항상 맨 위가 아니라 선택했던 그 화면 그대로)
    window.scrollTo(0, savedListScroll);
  }

  // 레슨 파일마다 만들어진 시기가 달라 원본 CSS 설계가 두 갈래로 갈린다.
  //   - 세계사 계열: body 배경이 밝은 크림색이라 그대로 주입해도 안전
  //   - 한국사·한능검 계열: body 배경이 거의 검정(#1A0D00) + body 자체에 flex 중앙정렬을 걸어둠
  //     (PC 풀스크린 프레젠테이션에서 카드 바깥 여백을 어둡게 칠하기 위한 설계).
  //     이걸 그대로 주입하면 모바일 페이지 자체의 상단바·제목 영역까지 덮어써서
  //     어두운 배경에 어두운 글씨가 겹쳐 보이는 문제가 생긴다.
  // 그래서 어느 계열이든 안전하게 주입되도록, 전역 html/body 규칙은 제거하고
  // :root 커스텀 변수는 #slideList 범위로 좁혀서 슬라이드 내부 스타일(카드·빈칸 등)만 적용되게 한다.
  function sanitizeLessonCss(css) {
    return css
      .replace(/:root(?![\w-])/g, '#slideList')
      // 연속된 html{...} body{...} 규칙도 놓치지 않도록, 앞선 규칙의 '}'를 소비하지 않는
      // 전방탐색(lookbehind)으로 "직전이 문자열 시작 / } / ;" 인 경우만 매치한다.
      .replace(/(?<=^|\}|;)\s*((?:html|body)(?:\s*,\s*(?:html|body))*)\s*\{[^{}]*\}/g, '');
  }

  async function showViewer(path, title) {
    document.getElementById('listView').style.display = 'none';
    document.getElementById('viewerView').style.display = 'block';
    document.getElementById('backBtn').style.display = 'inline-flex';
    document.getElementById('viewerTitle').textContent = title || path;
    // 목록에서 스크롤해 내려간 상태로 레슨을 열면 뷰어도 그 위치에서 시작하므로 맨 위로 복귀
    window.scrollTo(0, 0);
    const slideList = document.getElementById('slideList');
    slideList.innerHTML = `<div class="status-box"><div class="icon">⏳</div><h3>불러오는 중...</h3></div>`;

    // 기존 레슨 스타일 제거 후 새로 주입
    const oldStyle = document.getElementById('lessonStyle');
    if (oldStyle) oldStyle.remove();

    try {
      const res = await fetch('../' + path, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');

      // 원본 <style> 그대로 가져와 주입 (색상/폰트/디자인 유지)
      const styleEl = doc.querySelector('style');
      if (styleEl) {
        const injected = document.createElement('style');
        injected.id = 'lessonStyle';
        injected.textContent = sanitizeLessonCss(styleEl.textContent);
        document.head.appendChild(injected);
      }

      const lessonDir = path.split('/').slice(0, -1).join('/');
      const slides = [...doc.querySelectorAll('.slide')];
      if (!title) document.getElementById('viewerTitle').textContent = doc.querySelector('title')?.textContent || path;

      slideList.innerHTML = slides.map((s, i) => {
        // 이미지 상대경로를 mobile/ 기준으로 재계산
        s.querySelectorAll('img').forEach(img => {
          const raw = img.getAttribute('src') || '';
          if (!/^(https?:)?\/\//i.test(raw)) {
            img.setAttribute('src', '../' + lessonDir + '/' + raw);
          }
        });
        // 한능검 목차(toc-item)의 onclick="goSlide(N)"은 원본 페이지 안에서만 쓰던 함수라
        // 여기선 호출할 수 없다 — 슬라이드 번호(N)만 data-goto-slide로 남겨 두고,
        // 아래 위임 클릭 핸들러에서 그 번호에 해당하는 .mslide로 직접 스크롤한다.
        s.querySelectorAll('[onclick^="goSlide("]').forEach(el => {
          const m = el.getAttribute('onclick').match(/goSlide\((\d+)\)/);
          if (m) el.dataset.gotoSlide = m[1];
        });
        // 원본 레슨마다 빈칸 공개 방식이 다름 (onclick 인라인 / data-reveal + 별도 스크립트).
        // 여기서는 원본 스크립트를 불러오지 않으므로, 기존 onclick은 제거하고
        // 아래 REVEAL_SELECTOR에 대한 공통 위임 클릭 핸들러 하나로 통일해서 처리한다.
        s.querySelectorAll('[onclick]').forEach(el => el.removeAttribute('onclick'));
        return `<div class="mslide"><span class="mslide-num">${i + 1} / ${slides.length}</span>${s.outerHTML}</div>`;
      }).join('');
    } catch (err) {
      slideList.innerHTML = `<div class="status-box"><div class="icon">⚠️</div><h3>불러오지 못했습니다</h3><p>${esc(err.message)}</p></div>`;
    }
  }

  function truncate(str, n) { return str.length > n ? str.slice(0, n) + '…' : str; }
  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function escAttr(str) { return esc(str).replace(/'/g, '&#39;'); }

  // 레슨 파일마다 빈칸 공개 방식이 다름 — 세계사 계열은 onclick으로 'on' 클래스를,
  // 한국사·한능검 계열은 PageDown 스크립트가 'revealed' 클래스를 토글해서 정답을 보여준다.
  // 모바일에서는 원본 스크립트를 불러오지 않으므로, 두 클래스를 항상 같이 토글해서
  // 어느 쪽 CSS 컨벤션이든 탭 한 번에 정답이 나오도록 통일한다.
  const REVEAL_SELECTOR = '.blank, .ox, .ans-btn, .q-blank, .ox-reveal, .answer-reveal, .reveal-photo, [data-reveal]';
  document.getElementById('slideList').addEventListener('click', e => {
    // 한능검 목차(toc-item): data-goto-slide에 담아 둔 슬라이드 번호로 스크롤 이동
    const gotoBtn = e.target.closest('[data-goto-slide]');
    if (gotoBtn) {
      const targets = document.querySelectorAll('#slideList .mslide');
      const target = targets[Number(gotoBtn.dataset.gotoSlide)];
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    // 한능검 '전체 공개' 버튼: 같은 슬라이드(.mslide) 안의 정답을 한 번에 공개
    const allBtn = e.target.closest('[data-reveal-all]');
    if (allBtn) {
      const scope = allBtn.closest('.mslide') || document;
      scope.querySelectorAll(REVEAL_SELECTOR).forEach(el => {
        el.classList.add('on', 'revealed');
      });
      return;
    }
    const el = e.target.closest(REVEAL_SELECTOR);
    if (!el) return;
    const show = !el.classList.contains('on') && !el.classList.contains('revealed');
    el.classList.toggle('on', show);
    el.classList.toggle('revealed', show);
  });

  window.addEventListener('popstate', () => {
    const params = new URLSearchParams(location.search);
    const path = params.get('path');
    if (path) showViewer(path, null); else showList();
  });

  // 초기 진입 처리
  loadPages().then(() => {
    const params = new URLSearchParams(location.search);
    const path = params.get('path');
    if (path) showViewer(path, null);
  });
</script>
</body>
</html>
