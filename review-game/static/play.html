<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>세계사 탑 오르기</title>
<style>
  :root{
    --sky1:#1e3c72; --sky2:#2a5298;
    --gold:#e8c76f; --gold-dark:#c5a028;
    --card:#ffffff; --ink:#22314f; --sub:#5b6a8a;
    --good:#2e9e5b; --bad:#d9534f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Malgun Gothic','Pretendard',-apple-system,sans-serif;
    background:linear-gradient(180deg,var(--sky1),var(--sky2) 60%,#3a6b8a);
    color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:16px;
  }
  .card{
    width:100%; max-width:460px; background:var(--card); border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35); padding:28px 24px; position:relative; overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:6px;
    background:linear-gradient(90deg,var(--gold-dark),var(--gold));
  }
  h1{ font-size:1.4rem; margin:.2rem 0 1.2rem; text-align:center; color:var(--sky1); }
  .sub{ text-align:center; color:var(--sub); font-size:.85rem; margin-bottom:1.4rem; }

  /* 참여 화면 */
  input[type=text]{
    width:100%; padding:14px 16px; font-size:1.05rem; border:2px solid #dfe3ec; border-radius:12px;
    outline:none; margin-bottom:12px;
  }
  input[type=text]:focus{ border-color:var(--gold-dark); }
  button{
    width:100%; padding:14px; font-size:1.05rem; font-weight:700; color:#fff; border:none;
    border-radius:12px; cursor:pointer; background:linear-gradient(90deg,var(--sky1),var(--sky2));
    transition:transform .1s;
  }
  button:active{ transform:scale(.98); }
  button:disabled{ opacity:.5; cursor:default; }

  /* 대기 화면 */
  .waiting{ text-align:center; padding:20px 0; }
  .waiting .big{ font-size:2.2rem; margin-bottom:.6rem; }
  .pulse{ animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }

  /* 플레이 화면 */
  .hud{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .floor-badge{
    background:linear-gradient(135deg,var(--gold),var(--gold-dark)); color:#3a2c05; font-weight:800;
    border-radius:14px; padding:8px 14px; font-size:1.1rem; box-shadow:0 4px 10px rgba(197,160,40,.4);
  }
  .timer{ font-weight:700; color:var(--sky1); font-variant-numeric:tabular-nums; font-size:1.1rem; }
  .streak{ font-size:.8rem; color:var(--sub); text-align:right; margin-bottom:6px; min-height:1.1em; }

  .qbox{
    background:#f4f6fb; border:2px solid #e3e8f2; border-radius:14px; padding:18px; margin-bottom:14px;
    font-size:1.15rem; line-height:1.6; min-height:90px; display:flex; align-items:center;
  }
  .qbox .blank-mark{ color:var(--sky1); font-weight:800; }
  .unit-tag{
    display:inline-block; font-size:.72rem; color:#fff; background:var(--sky2); border-radius:6px;
    padding:2px 8px; margin-bottom:8px;
  }

  .feedback{
    text-align:center; font-weight:800; font-size:1.05rem; border-radius:12px; padding:10px;
    margin-bottom:12px; display:none;
  }
  .feedback.show{ display:block; }
  .feedback.correct{ background:#e6f7ec; color:var(--good); }
  .feedback.wrong{ background:#fbeaea; color:var(--bad); }

  .tower-mini{
    height:64px; display:flex; align-items:flex-end; justify-content:center; margin-top:6px; gap:3px;
  }
  .tower-mini .bar{
    width:10px; background:linear-gradient(180deg,var(--gold),var(--gold-dark)); border-radius:3px 3px 0 0;
    transition:height .3s ease;
  }

  .ended{ text-align:center; padding:10px 0; }
  .ended .big{ font-size:2.6rem; font-weight:800; color:var(--sky1); margin:6px 0; }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="card">
  <h1>🏯 세계사 탑 오르기</h1>

  <!-- 참여 화면 -->
  <div id="joinView">
    <p class="sub">이름을 입력하고 참여하세요. 선생님이 게임을 시작하면 자동으로 시작됩니다.</p>
    <input type="text" id="nameInput" placeholder="이름 (예: 2반 홍길동)" maxlength="20">
    <button id="joinBtn">참여하기</button>
  </div>

  <!-- 대기 화면 -->
  <div id="waitingView" class="hidden">
    <div class="waiting">
      <div class="big pulse">🕐</div>
      <div id="waitName" style="font-weight:700; margin-bottom:4px;"></div>
      <div class="sub">선생님이 게임을 시작하기를 기다리는 중...</div>
    </div>
  </div>

  <!-- 플레이 화면 -->
  <div id="playView" class="hidden">
    <div class="hud">
      <div class="floor-badge">🏢 <span id="floorVal">0</span>층</div>
      <div class="timer">⏱ <span id="timerVal">--:--</span></div>
    </div>
    <div class="streak" id="streakVal"></div>

    <div id="feedback" class="feedback"></div>

    <div class="unit-tag" id="unitTag"></div>
    <div class="qbox" id="qText">문제를 불러오는 중...</div>

    <input type="text" id="answerInput" placeholder="정답 입력 후 Enter" autocomplete="off">
    <button id="submitBtn">제출</button>

    <div class="tower-mini" id="towerMini"></div>
  </div>

  <!-- 종료 화면 -->
  <div id="endedView" class="hidden">
    <div class="ended">
      <div>🏁 게임 종료!</div>
      <div class="big"><span id="finalFloor">0</span>층</div>
      <div class="sub" id="finalStat"></div>
    </div>
  </div>
</div>

<script>
const API = '';
let playerId = localStorage.getItem('rg_player_id') || '';
let playerName = localStorage.getItem('rg_name') || '';
let currentQuestion = null;
let pollTimer = null;

const el = (id) => document.getElementById(id);

function showView(name){
  ['joinView','waitingView','playView','endedView'].forEach(v=>{
    el(v).classList.toggle('hidden', v!==name);
  });
}

async function api(path, method='GET', body){
  const opts = {method};
  if(body){ opts.headers = {'Content-Type':'application/json'}; opts.body = JSON.stringify(body); }
  const res = await fetch(API+path, opts);
  return res.json();
}

async function join(name){
  const data = await api('/api/join', 'POST', {name, player_id: playerId});
  if(data.error){ alert('참여 실패: '+data.error); return; }
  playerId = data.player_id; playerName = data.name;
  localStorage.setItem('rg_player_id', playerId);
  localStorage.setItem('rg_name', playerName);
  startPolling();
}

el('joinBtn').onclick = () => {
  const name = el('nameInput').value.trim();
  if(!name){ el('nameInput').focus(); return; }
  el('joinBtn').disabled = true;
  join(name).finally(()=> el('joinBtn').disabled=false);
};
el('nameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') el('joinBtn').click(); });

function fmtTime(sec){
  if(sec===null || sec===undefined) return '--:--';
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function renderTowerMini(floor){
  const box = el('towerMini');
  box.innerHTML = '';
  const n = Math.min(24, Math.max(4, floor));
  for(let i=0;i<n;i++){
    const bar = document.createElement('div');
    bar.className = 'bar';
    const active = i < Math.min(floor, n);
    bar.style.height = active ? (14 + (i%6)*6)+'px' : '4px';
    bar.style.opacity = active ? '1' : '.25';
    box.appendChild(bar);
  }
}

function renderQuestion(q){
  currentQuestion = q;
  if(!q){
    el('qText').textContent = '출제할 문제가 없습니다. 선생님께 문의하세요.';
    el('unitTag').textContent = '';
    return;
  }
  el('unitTag').textContent = q.unit;
  el('qText').innerHTML = q.text.replace(/____/g, '<span class="blank-mark">＿＿＿＿</span>');
  el('answerInput').value = '';
  el('answerInput').disabled = false;
  el('submitBtn').disabled = false;
  el('answerInput').focus();
}

function flashFeedback(correct, correctAnswer, gain){
  const f = el('feedback');
  f.classList.add('show');
  if(correct){
    f.classList.remove('wrong'); f.classList.add('correct');
    f.textContent = `정답! +${gain}층 올라갑니다 🎉`;
  } else {
    f.classList.remove('correct'); f.classList.add('wrong');
    f.textContent = `아쉬워요. 정답: ${correctAnswer}`;
  }
  setTimeout(()=>{ f.classList.remove('show'); }, 1400);
}

async function submitAnswer(){
  const text = el('answerInput').value.trim();
  if(!text || !currentQuestion) return;
  el('submitBtn').disabled = true;
  el('answerInput').disabled = true;
  const data = await api('/api/answer', 'POST', {
    player_id: playerId, question_id: currentQuestion.id, text
  });
  if(data.stale || data.error){
    el('submitBtn').disabled = false; el('answerInput').disabled = false;
    return;
  }
  el('floorVal').textContent = data.player.floor;
  el('streakVal').textContent = data.player.streak >= 2 ? `🔥 ${data.player.streak}연속 정답!` : '';
  renderTowerMini(data.player.floor);
  flashFeedback(data.correct, data.correct_answer, data.gain);
  setTimeout(()=>{
    renderQuestion(data.next_question);
  }, data.correct ? 700 : 1100);
}

el('submitBtn').onclick = submitAnswer;
el('answerInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submitAnswer(); });

async function poll(){
  if(!playerId) return;
  const data = await api('/api/state?player_id='+encodeURIComponent(playerId));
  if(data.error){ return; }

  const round = data.round;
  if(round.status === 'idle'){
    el('waitName').textContent = playerName + '님';
    showView('waitingView');
  } else if(round.status === 'running'){
    el('floorVal').textContent = data.player.floor;
    el('timerVal').textContent = fmtTime(round.remaining_sec);
    renderTowerMini(data.player.floor);
    if(!currentQuestion || (data.question && data.question.id !== currentQuestion.id)){
      renderQuestion(data.question);
    }
    showView('playView');
  } else if(round.status === 'ended'){
    el('finalFloor').textContent = data.player.floor;
    const acc = data.player.accuracy;
    el('finalStat').textContent = acc!==null ? `정답 ${data.player.correct}개 · 정답률 ${acc}%` : '아직 문제를 풀지 않았어요';
    showView('endedView');
  }
}

function startPolling(){
  showView('waitingView');
  poll();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(poll, 1000);
}

// 새로고침 시 자동 재접속
if(playerId){
  el('nameInput').value = playerName;
  join(playerName || '이름없음');
}
</script>
</body>
</html>
