<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세계사 탑 오르기</title>
<style>
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Malgun Gothic','Pretendard',-apple-system,sans-serif;
    background:linear-gradient(180deg,#1e3c72,#2a5298 60%,#3a6b8a); color:#fff;
  }
  .box{ text-align:center; }
  h1{ font-size:1.8rem; margin-bottom:1.6rem; }
  a{
    display:block; margin:10px auto; width:260px; padding:16px; border-radius:12px;
    background:rgba(255,255,255,.12); color:#fff; text-decoration:none; font-weight:700; font-size:1.05rem;
    border:1px solid rgba(255,255,255,.25);
  }
  a:hover{ background:rgba(255,255,255,.22); }
  .hint{ font-size:.8rem; opacity:.7; margin-top:1.2rem; }
</style>
</head>
<body>
  <div class="box">
    <h1>🏯 세계사 탑 오르기</h1>
    <a href="/play">🎮 학생 참여 화면 (/play)</a>
    <a href="/admin">🛠 관리자 화면 (/admin)</a>
    <a href="/board">📺 대형 화면 (/board)</a>
    <div class="hint">학생 노트북에서는 이 컴퓨터의 IP 주소로 접속해야 합니다.<br>서버 실행 시 콘솔에 표시된 주소를 확인하세요.</div>
  </div>
</body>
</html>
