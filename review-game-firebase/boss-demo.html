<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보스전 시연</title>
<style>
  [hidden]{ display:none !important; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:#06060b; overflow:hidden; }
  body{ font-family:'Malgun Gothic','Pretendard',-apple-system,sans-serif; }
  #wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  /* 16:9 게임 화면을 창 크기에 맞춰 여백(레터박스)과 함께 보여 준다 */
  #cv{ display:block; width:min(100vw, 177.78vh); height:min(56.25vw, 100vh); }
  #ctrl{
    position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:5;
    display:flex; gap:6px; flex-wrap:nowrap; justify-content:center; max-width:calc(100vw - 16px);
    background:rgba(10,10,22,.78); padding:8px 10px; border-radius:14px; transition:opacity .35s;
  }
  #ctrl button{
    font:inherit; font-size:15px; font-weight:700; color:#fff; background:#2c3354;
    border:0; border-radius:9px; padding:8px 12px; cursor:pointer; white-space:nowrap;
  }
  #ctrl button:hover{ background:#3b4470; }
  #ctrl button.primary{ background:#c9563c; }
  body.idle #ctrl{ opacity:0; pointer-events:none; }
  body.idle{ cursor:none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="ctrl">
  <button type="button" id="startBtn" class="primary">▶ 시작</button>
  <button type="button" id="themeBtn">보스: 한국사 · 일제 순사</button>
  <button type="button" id="diffBtn">난이도: 매우 어려움</button>
  <button type="button" id="speedBtn">속도: 보통</button>
  <button type="button" id="hitBtn">⚡ 수동 타격</button>
  <button type="button" id="soundBtn">🔊 소리</button>
  <button type="button" id="resetBtn">↺ 처음부터</button>
</div>
<script>
// ─────────────────────────────────────────────────────────────
// 보스전 시연 페이지 — 실제 게임(Firebase)과 연결되지 않은 단독 데모.
// 가짜 학생 30명이 일정 확률로 "정답"을 내며 보스를 공격하고,
// 타격·치명타·콤보·분노·반격·격파 연출을 전광판(프로젝터) 크기로 보여 준다.
// ─────────────────────────────────────────────────────────────
const W = 1920, H = 1080;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
const off = document.createElement('canvas');   // 보스를 먼저 그려 두고 번쩍임·분노 색을 입히는 캔버스
off.width = 700; off.height = 780;
const octx = off.getContext('2d');
// 한국사 보스 그림: 배경이 투명한 900×900 네 장(평소·맞음·분노·크게 다침). 네 장 모두 발끝 위치가 같다.
const SPRITE_SIZE = 720, SPRITE_FEET = 715;   // 원본 1254px 기준 발끝이 약 1245px
const sprOff = document.createElement('canvas');
sprOff.width = SPRITE_SIZE; sprOff.height = SPRITE_SIZE;
const sctx = sprOff.getContext('2d');
const POLICE = {};
['idle', 'hit', 'rage', 'hurt'].forEach(k => { const im = new Image(); im.src = 'assets/boss/police_' + k + '.webp'; POLICE[k] = im; });
function spritesReady(){ return Object.values(POLICE).every(im => im.complete && im.naturalWidth > 0); }
const FONT = '"Malgun Gothic","Pretendard",sans-serif';
const OUT = '#0b0b12';

const NAMES = ['김민준','이서연','박지호','최하은','정도윤','강서윤','조시우','윤지우','장예준','임수아',
  '한주원','오하린','서지안','신유준','권채원','황은우','안다은','송건우','류소율','전지환',
  '홍예린','고민재','문서아','양태윤','손가은','배현우','백나윤','허준서','유시은','남도현'];

const THEMES = {
  korea: {
    label: '한국사 · 일제 순사', bossName: '일제 순사', sub: '무단 통치의 앞잡이',
    critText: '대한 독립 만세!', rageText: '분노! 순사가 곤봉을 휘두른다', counterText: '호루라기 반격!',
    attackName: '곤봉 내려치기', wrongText: '오답 반격!', healName: '헌병대 지원 요청', enrageText: '광폭화! 공격이 거세진다',
    shots: ['torch', 'ink'], winLine: '반 전체가 힘을 모아 일제 순사를 물리쳤습니다!', loseLine: '순사가 버텨 냈습니다… 다시 도전하세요!'
  },
  world: {
    label: '세계사 · 크세르크세스', bossName: '크세르크세스 대왕', sub: '페르시아 제국의 왕',
    critText: '스파르타!', rageText: '분노! 불사 부대가 깨어났다', counterText: '불사 부대 돌격!',
    attackName: '창 투척', wrongText: '오답 반격!', healName: '불사 부대 교대', enrageText: '광폭화! 공격이 거세진다',
    shots: ['arrow', 'spear'], winLine: '반 전체가 힘을 모아 크세르크세스 대왕을 물리쳤습니다!', loseLine: '대왕이 버텨 냈습니다… 다시 도전하세요!'
  }
};
// 모든 난이도에 공통인 규칙
const RAID_BASE = {
  limitMs: 180000,           // 제한 시간 3분
  firstAttackMs: 6000,
  telegraphMs: 1000,         // 공격 전 ⚠ 표시 시간
  whistleStunMs: 3000,
  healAt: [0.6, 0.3], healRepeatMs: 35000,   // 회복 의식: 60%·30% 도달 때, 25% 이하에선 35초마다
  healCastMs: 8000,
  breakStunMs: 4000          // 회복 의식을 끊으면 보스 기절 (피해 2배)
};
// 난이도 단계 (학생 30명 가짜 시뮬레이션으로 맞춘 값).
// 승률 메모는 '학생마다 약 9초에 한 번 답하는 속도' 기준: [정답률 70% / 82% / 90%]
//   attackGapMs·attackTargets: 평소 · 분노(50% 이하) · 광폭화(25% 이하), regenPerSec: 초당 최대 체력 대비 회복(광폭화 때 2배)
const DIFFS = [
  { name: '쉬움', emoji: '🙂', color: '#3ec46d', desc: '처음 해 보는 반', note: '거의 누구나 이겨요',   // 100 / 100 / 100%
    p: { hp: 25000, hearts: 5, reviveMs: 8000,  attackGapMs: [8000, 6500, 5500], attackTargets: [1, 2, 2], whistleGapMs: 12000, whistleTargets: 3, regenPerSec: 0.001,  healNeed: 15, healAmount: 0.06 } },
  { name: '보통', emoji: '😐', color: '#3d8bfd', desc: '대부분 맞히면 이겨요', note: '정답률 80%면 충분',   // 13 / 99 / 100%
    p: { hp: 36000, hearts: 3, reviveMs: 10000, attackGapMs: [6000, 4500, 3500], attackTargets: [1, 2, 3], whistleGapMs: 10000, whistleTargets: 4, regenPerSec: 0.002,  healNeed: 22, healAmount: 0.09 } },
  { name: '어려움', emoji: '😠', color: '#ffb020', desc: '거의 다 맞혀야 해요', note: '정답률 90%는 되어야',   // 0 / 11 / 94%
    p: { hp: 40000, hearts: 3, reviveMs: 12000, attackGapMs: [5500, 4000, 3000], attackTargets: [2, 3, 3], whistleGapMs: 9000,  whistleTargets: 5, regenPerSec: 0.0022, healNeed: 24, healAmount: 0.10 } },
  { name: '매우 어려움', emoji: '🔥', color: '#ff5a4a', desc: '빠르고 정확해야 해요', note: '보통 속도로는 거의 불가능',   // 0 / 0 / 7%
    p: { hp: 45000, hearts: 3, reviveMs: 12000, attackGapMs: [5000, 3500, 2500], attackTargets: [2, 3, 4], whistleGapMs: 9000,  whistleTargets: 6, regenPerSec: 0.0025, healNeed: 25, healAmount: 0.12 } },
  { name: '지옥', emoji: '💀', color: '#b86bff', desc: '빨라도 버티기 힘들어요', note: '목숨 2개 · 도전 과제용',   // 0 / 0 / 0% (2배 빠르게 90%여도 25%)
    p: { hp: 48000, hearts: 2, reviveMs: 15000, attackGapMs: [4500, 3200, 2500], attackTargets: [2, 3, 4], whistleGapMs: 8000,  whistleTargets: 6, regenPerSec: 0.0028, healNeed: 28, healAmount: 0.14 } }
];
let diffIdx = 3;
let RAID = null;   // reset() 때 RAID_BASE + 고른 난이도로 채운다
const SPEEDS = [
  { label: '보통', mean: 9000 },
  { label: '빠름', mean: 4500 },
  { label: '폭주', mean: 1600 }
];

let themeKey = 'korea', speedIdx = 0, running = false, soundOn = true;
let S = null;

// ── 유틸 ──────────────────────────────────────────────
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
function expRand(mean){ return -Math.log(1 - Math.random()) * mean; }
function fmtNum(n){ return Math.round(n).toLocaleString('ko-KR'); }
function fmtTime(ms){
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function rr(g, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function paint(g, fill, lw){
  g.fillStyle = fill; g.fill();
  if(lw !== 0){ g.lineWidth = lw || 7; g.strokeStyle = OUT; g.lineJoin = 'round'; g.stroke(); }
}
function outlinedText(g, txt, x, y, size, fill, stroke, lw){
  g.font = `900 ${size}px ${FONT}`;
  g.lineJoin = 'round';
  g.lineWidth = lw || Math.max(4, size / 7);
  g.strokeStyle = stroke || OUT;
  g.strokeText(txt, x, y);
  g.fillStyle = fill;
  g.fillText(txt, x, y);
}

// ── 효과음 (파일 없이 브라우저에서 합성) ─────────────────
let AC = null, master = null, noiseBuf = null;
const lastSfx = {};
function audio(){
  if(!AC){
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return null;
    AC = new Ctor();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(type, f0, f1, dur, vol, when){
  const a = AC, t = a.currentTime + (when || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
  return o;
}
function noise(dur, vol, filterType, f0, f1, when){
  const a = AC, t = a.currentTime + (when || 0);
  const s = a.createBufferSource(); s.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = filterType; f.frequency.setValueAtTime(f0, t);
  f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t, Math.random()); s.stop(t + dur + 0.02);
}
function sfx(kind){
  if(!soundOn || !audio()) return;
  const now = performance.now();
  const gap = { hit: 55, crit: 90, explode: 120, ouch: 70, ko: 150, warn: 200 }[kind] || 0;
  if(gap && now - (lastSfx[kind] || 0) < gap) return;   // 한꺼번에 많이 맞아도 소리가 뭉개지지 않게
  lastSfx[kind] = now;
  switch(kind){
    case 'hit':
      noise(0.09, 0.35, 'bandpass', 1800, 600);
      tone('sine', 160, 55, 0.12, 0.35);
      break;
    case 'crit':
      tone('sawtooth', 900, 120, 0.35, 0.18);
      noise(0.45, 0.5, 'highpass', 3000, 400);
      tone('sine', 90, 35, 0.4, 0.5);
      break;
    case 'roar':
      if(themeKey === 'korea'){ tone('sawtooth', 140, 70, 1.1, 0.25); noise(0.9, 0.25, 'lowpass', 900, 150); }
      else { tone('sawtooth', 110, 55, 1.3, 0.28); tone('square', 55, 40, 1.3, 0.12); }
      break;
    case 'counter':
      if(themeKey === 'korea'){
        // 호루라기: 높은 음을 빠르게 떨리게
        for(let i = 0; i < 9; i++) tone('sine', i % 2 ? 2650 : 2950, i % 2 ? 2600 : 2900, 0.06, 0.18, i * 0.06);
      } else {
        tone('sawtooth', 196, 190, 0.5, 0.2); tone('sawtooth', 294, 290, 0.5, 0.14, 0.05);
      }
      tone('sine', 70, 30, 0.5, 0.5, 0.35);
      noise(0.6, 0.35, 'lowpass', 1500, 100, 0.35);
      break;
    case 'drop':
      tone('sine', 110, 30, 0.6, 0.7);
      noise(0.5, 0.35, 'lowpass', 800, 80);
      break;
    case 'explode':
      noise(0.8, 0.6, 'lowpass', 2500, 80);
      tone('sine', 80, 25, 0.7, 0.5);
      break;
    case 'warn':      // 보스 공격 예고
      tone('square', 880, 880, 0.08, 0.08); tone('square', 660, 660, 0.08, 0.08, 0.11);
      break;
    case 'ouch':      // 학생이 맞음
      tone('square', 330, 140, 0.14, 0.12);
      noise(0.08, 0.2, 'bandpass', 900, 400);
      break;
    case 'ko':        // 학생이 쓰러짐
      tone('triangle', 440, 110, 0.5, 0.2);
      tone('sine', 120, 40, 0.4, 0.3, 0.1);
      break;
    case 'cast':      // 회복 의식 시작
      [392, 523, 659].forEach((f, i) => tone('sine', f, f * 1.01, 0.5, 0.12, i * 0.12));
      break;
    case 'break':     // 회복 의식 끊음
      noise(0.5, 0.5, 'highpass', 4000, 600);
      tone('sawtooth', 700, 90, 0.5, 0.2);
      break;
    case 'heal':      // 보스 큰 회복
      [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, f, 0.35, 0.12, i * 0.08));
      break;
    case 'lose': {
      const notes = [392, 349, 311, 262];
      notes.forEach((f, i) => tone('triangle', f, f * 0.98, i === notes.length - 1 ? 1.2 : 0.35, 0.18, i * 0.35));
      tone('sine', 80, 40, 1.5, 0.3, 1.05);
      break;
    }
    case 'win': {
      const notes = [523, 659, 784, 1047, 784, 1047];
      notes.forEach((f, i) => tone('square', f, f, i === notes.length - 1 ? 0.8 : 0.16, 0.12, i * 0.14));
      tone('triangle', 262, 262, 1.2, 0.18, 0.7);
      break;
    }
  }
}

// ── 배경 (한 번만 만들어 두는 건물 실루엣) ─────────────────
function seeded(seed){ return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
const CITY = (() => {
  const r = seeded(7), arr = [];
  let x = -20;
  while(x < W + 40){
    const w = 70 + r() * 110, h = 90 + r() * 200;
    const wins = [];
    for(let wy = 20; wy < h - 20; wy += 34) for(let wx = 14; wx < w - 20; wx += 30) if(r() < 0.35) wins.push([wx, wy]);
    arr.push({ x, w, h, wins });
    x += w + 6;
  }
  return arr;
})();
const COLUMNS = (() => {
  const r = seeded(11), arr = [];
  for(let i = 0; i < 14; i++) arr.push({ x: 60 + i * 140 + r() * 30, h: 240 + r() * 120, broken: r() < 0.3 });
  return arr;
})();
const STARS = (() => { const r = seeded(3), a = []; for(let i = 0; i < 90; i++) a.push([r() * W, r() * 480, r()]); return a; })();

function drawBackground(g){
  const t = S.clock / 1000;
  if(themeKey === 'korea'){
    const sky = ctx.createLinearGradient(0, 0, 0, 820);
    sky.addColorStop(0, '#0f1030'); sky.addColorStop(0.55, '#2b2250'); sky.addColorStop(1, '#6a3a3e');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    for(const [x, y, p] of STARS){ ctx.globalAlpha = 0.25 + 0.5 * Math.abs(Math.sin(t * 0.8 + p * 9)); ctx.fillStyle = '#fff'; ctx.fillRect(x, y, 2, 2); }
    ctx.globalAlpha = 1;
    // 둥근 지붕 건물(경성 거리 느낌)과 시가지 실루엣
    ctx.fillStyle = '#1a1530';
    ctx.fillRect(1260, 520, 420, 300);
    ctx.beginPath(); ctx.arc(1470, 520, 110, Math.PI, 0); ctx.fill();
    ctx.fillRect(1462, 360, 16, 60);
    ctx.fillStyle = '#231c3d';
    for(const b of CITY){
      ctx.fillRect(b.x, 820 - b.h, b.w, b.h);
    }
    ctx.fillStyle = 'rgba(255,208,120,.55)';
    for(const b of CITY) for(const [wx, wy] of b.wins) ctx.fillRect(b.x + wx, 820 - b.h + wy, 12, 16);
    const ground = ctx.createLinearGradient(0, 820, 0, H);
    ground.addColorStop(0, '#3a2c2a'); ground.addColorStop(1, '#16110f');
    ctx.fillStyle = ground; ctx.fillRect(0, 820, W, H - 820);
    ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 2;
    for(let i = -10; i <= 10; i++){ ctx.beginPath(); ctx.moveTo(960 + i * 60, 820); ctx.lineTo(960 + i * 260, H); ctx.stroke(); }
  } else {
    const sky = ctx.createLinearGradient(0, 0, 0, 820);
    sky.addColorStop(0, '#3a1d4a'); sky.addColorStop(0.5, '#b8563a'); sky.addColorStop(1, '#f2b25a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    const sun = ctx.createRadialGradient(960, 640, 10, 960, 640, 260);
    sun.addColorStop(0, 'rgba(255,240,200,.95)'); sun.addColorStop(0.35, 'rgba(255,200,120,.6)'); sun.addColorStop(1, 'rgba(255,160,80,0)');
    ctx.fillStyle = sun; ctx.fillRect(600, 300, 720, 700);
    // 페르세폴리스 기둥 실루엣
    ctx.fillStyle = '#4a2530';
    for(const c of COLUMNS){
      const top = 820 - c.h * (c.broken ? 0.6 : 1);
      ctx.fillRect(c.x, top, 30, 820 - top);
      if(!c.broken){ ctx.fillRect(c.x - 16, top - 26, 62, 26); ctx.fillRect(c.x - 6, top - 44, 42, 18); }
    }
    ctx.fillRect(0, 800, W, 20);
    const ground = ctx.createLinearGradient(0, 820, 0, H);
    ground.addColorStop(0, '#b0773f'); ground.addColorStop(1, '#5a3620');
    ctx.fillStyle = ground; ctx.fillRect(0, 820, W, H - 820);
    ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.lineWidth = 3;
    for(let i = 0; i < 6; i++){ ctx.beginPath(); ctx.moveTo(0, 860 + i * 40); ctx.bezierCurveTo(600, 840 + i * 44, 1300, 880 + i * 38, W, 850 + i * 42); ctx.stroke(); }
  }
  // 분노 상태: 붉은 테두리가 맥박처럼
  if(S.rage && S.phase !== 'victory'){
    const pulse = 0.25 + 0.15 * Math.sin(t * 5);
    const v = ctx.createRadialGradient(960, 560, 380, 960, 560, 1150);
    v.addColorStop(0, 'rgba(255,0,0,0)'); v.addColorStop(1, `rgba(200,0,0,${pulse})`);
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
}

// ── 보스 그리기 (발 가운데가 (350, 740)) ─────────────────
function limb(g, sx, sy, angle, len, width, color, handColor, handR, extra){
  g.save();
  g.translate(sx, sy); g.rotate(angle);
  rr(g, -width / 2, -width / 2, width, len + width / 2, width / 2); paint(g, color);
  if(extra) extra(g, len);
  g.beginPath(); g.arc(0, len, handR, 0, Math.PI * 2); paint(g, handColor);
  g.restore();
}

// 반격 동작: 들어 올린 팔을 더 뒤로 젖혔다가(준비) 앞으로 크게 내려친다
function swingAngle(p, base){
  if(p < 0.35) return lerp(base, base + 0.5, p / 0.35);
  if(p < 0.5) return lerp(base + 0.5, -0.5, (p - 0.35) / 0.15);
  return lerp(-0.5, base, easeOut((p - 0.5) / 0.5));
}

// 한국사 보스 그림 고르기: 치명타에 맞은 직후·쓰러질 때 → 맞음, 체력 25% 이하 → 크게 다침, 분노 → 분노, 그 외 → 평소
function policePose(){
  if(S.phase === 'lose') return 'rage';
  if(S.phase === 'dying' || S.hitPose > 0 || bossStunned()) return 'hit';
  if(S.hp <= S.max * 0.25) return 'hurt';
  if(S.rage || S.attack > 0) return 'rage';
  return 'idle';
}

// 보스를 따로 그린 뒤 번쩍임·분노 색을 입히고, 본 화면에 붙일 캔버스와 발끝 기준점을 돌려준다
function renderBoss(){
  const useSprite = themeKey === 'korea' && spritesReady();
  const g = useSprite ? sctx : octx, cvs = useSprite ? sprOff : off;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, cvs.width, cvs.height);
  if(useSprite){
    g.drawImage(POLICE[policePose()], 0, 0, SPRITE_SIZE, SPRITE_SIZE);
  } else {
    // 그림 파일을 아직 못 불러왔거나 세계사 보스일 때는 코드로 그린 캐릭터
    const p = { t: S.clock / 1000, rage: S.rage, attack: S.attack };
    if(themeKey === 'korea') drawPolice(g, p); else drawKing(g, p);
  }
  // 맞은 순간 하얗게 번쩍, 분노 땐 붉은 기운, 쓰러질 땐 점점 하얗게
  let white = S.bossFlash;
  if(S.phase === 'dying') white = Math.max(white, 0.25 + 0.35 * Math.abs(Math.sin(S.clock / 60)));
  g.globalCompositeOperation = 'source-atop';
  if(S.rage){ g.fillStyle = `rgba(255,30,20,${0.1 + 0.06 * Math.sin(S.clock / 120)})`; g.fillRect(0, 0, cvs.width, cvs.height); }
  if(white > 0){ g.fillStyle = `rgba(255,255,255,${clamp(white, 0, 1) * 0.85})`; g.fillRect(0, 0, cvs.width, cvs.height); }
  g.globalCompositeOperation = 'source-over';
  return useSprite ? { cvs, ax: SPRITE_SIZE / 2, ay: SPRITE_FEET } : { cvs, ax: 350, ay: 740 };
}

// ── 게임 상태 ─────────────────────────────────────────
const BOSS_X = 960, BOSS_FEET = 1010;
const TAG_W = 270, TAG_H = 48;
function tagPos(i){
  const left = i < 15, row = left ? i : i - 15;
  return { tx: left ? 28 : W - 28 - TAG_W, ty: 138 + row * 57, left };
}
function anchor(st){ return { x: st.left ? st.tx + TAG_W : st.tx, y: st.ty + TAG_H / 2 }; }

function reset(){
  RAID = Object.assign({}, RAID_BASE, DIFFS[diffIdx].p);
  S = {
    clock: 0, phase: 'ready', introT: 0, landed: false,
    hp: RAID.hp, ghost: RAID.hp, max: RAID.hp,
    rage: false, enrage: false, counterAt: 0, attack: 0, hitPose: 0,
    attackAt: 0, regenAcc: 0, regenShowAt: 0, healFlash: 0,
    cast: null, healsDone: [], nextHealAt: 0, bossStunUntil: 0,
    students: NAMES.map((name, i) => Object.assign({
      name, i, dmg: 0, correct: 0, streak: 0, next: 0, flash: 0, flashColor: '', stunUntil: 0, wrongT: 0,
      hearts: RAID.hearts, koUntil: 0, targetUntil: 0, hurtT: 0, kos: 0
    }, tagPos(i))),
    shots: [], parts: [], texts: [], rings: [], bolts: [], banner: null, timers: [],
    shake: 0, bossFlash: 0, knock: 0, squash: 0, bossY: -900, bossRot: 0, bossAlpha: 1,
    combo: 0, comboT: -9999, comboPop: 0,
    correct: 0, wrong: 0, lastHitter: null, fightStart: 0, endClock: 0, dyingT: 0, nextBoom: 0,
    loseReason: ''
  };
  running = false;
  updateButtons();
}

function startFight(){
  S.phase = 'fight'; S.fightStart = S.clock;
  S.attackAt = S.clock + RAID.firstAttackMs;
  S.regenShowAt = S.clock + 1000;   // 회복 숫자는 1초 분량씩 모아서 보여 준다
  const mean = SPEEDS[speedIdx].mean;
  for(const st of S.students) st.next = S.clock + rand(200, mean);
}

const isKo = st => st.koUntil > S.clock;
const canAct = st => !isKo(st) && st.stunUntil <= S.clock;
const bossStunned = () => S.bossStunUntil > S.clock;

function answer(st){
  const T = THEMES[themeKey];
  if(Math.random() > 0.82){      // 오답: 공격하지 못하고, 보스가 곧바로 그 학생을 반격한다
    st.streak = 0; S.wrong++;
    st.flash = 1; st.flashColor = '#e0483c'; st.wrongT = 1;
    if(!bossStunned()) bossStrike(st, 0.35, T.wrongText);
    return;
  }
  st.streak++; st.correct++; S.correct++;
  const crit = Math.random() < 0.08 || st.streak % 5 === 0;   // 5연속 정답마다 치명타
  const dmg = Math.round(rand(90, 130) * (1 + Math.min(st.streak, 10) * 0.05) * (crit ? 2.6 : 1));
  const a = anchor(st);
  const to = { x: BOSS_X + rand(-120, 120), y: BOSS_FEET - rand(260, 520) };
  const type = crit ? 'crit' : T.shots[randi(0, T.shots.length - 1)];
  S.shots.push({ type, x0: a.x, y0: a.y, x1: to.x, y1: to.y, cx: (a.x + to.x) / 2, cy: Math.min(a.y, to.y) - rand(120, 260), t: 0, dur: crit ? 0.42 : rand(0.45, 0.6), st, dmg, crit, trail: 0 });
  st.flash = 1; st.flashColor = crit ? '#ffd23f' : '#48d17a';
}

function impact(sh){
  const T = THEMES[themeKey];
  if(S.phase !== 'fight') return;
  const x = sh.x1, y = sh.y1, st = sh.st;
  const weak = bossStunned();                 // 회복 의식을 끊어 기절한 동안엔 피해 2배
  const dmg = weak ? sh.dmg * 2 : sh.dmg;
  S.hp = Math.max(0, S.hp - dmg);
  st.dmg += dmg; S.lastHitter = st;
  const dir = st.left ? 1 : -1;
  S.bossFlash = sh.crit ? 1 : 0.7;
  S.knock += dir * (sh.crit ? 30 : 9);
  S.squash = sh.crit ? 1 : 0.45;
  S.shake = Math.max(S.shake, sh.crit ? 24 : 7);
  if(S.clock - S.comboT < 1600) S.combo++; else S.combo = 1;
  S.comboT = S.clock; S.comboPop = 1;
  S.texts.push({ x: x + rand(-70, 70), y: y - 20 + rand(-30, 30), txt: fmtNum(dmg) + (weak ? '!' : ''), crit: sh.crit, t: 0 });
  burst(x, y, sh.type, sh.crit ? 46 : 16, dir);
  S.rings.push({ x, y, t: 0, life: sh.crit ? 0.5 : 0.3, r: sh.crit ? 190 : 70, color: sh.crit ? '#ffe98a' : 'rgba(255,255,255,.9)', w: sh.crit ? 10 : 5 });
  if(sh.crit){
    S.hitPose = 0.4;   // 치명타를 맞으면 잠깐 휘청이는 그림으로
    S.bolts.push({ x, y, t: 0, pts: boltPath(x + rand(-80, 80), -20, x, y) });
    if(!S.cast) S.banner = { txt: T.critText, sub: st.name + ' 치명타!', t: 0, life: 1.4, color: '#ffe14d' };
    sfx('crit');
  } else sfx('hit');
  // 회복 의식 끊기
  if(S.cast){
    S.cast.got++;
    if(S.cast.got >= S.cast.need) breakCast();
  }
  if(!S.rage && S.hp <= S.max / 2) enterRage();
  if(!S.enrage && S.hp <= S.max * 0.25) enterEnrage();
  checkHealTrigger();
  if(S.hp <= 0) startDying();
}

function burst(x, y, type, n, dir){
  const pal = {
    torch: ['#fff2a8', '#ffd166', '#ff8c42', '#ff4d2e'],
    ink: ['#10142c', '#23306e', '#3b4db0', '#e8ecff'],
    arrow: ['#f2d27a', '#c9a15a', '#8a5a2b', '#fff'],
    spear: ['#e0e6f0', '#a9b3c4', '#f2d27a', '#fff'],
    crit: ['#fff', '#fff3a0', '#ffd23f', '#7fd8ff'],
    boss: ['#ff3b30', '#b3121f', '#ff8a65', '#2a0a0a'],
    heal: ['#7dffb0', '#3ee07a', '#c8ffe0', '#fff']
  }[type] || ['#fff'];
  for(let i = 0; i < n; i++){
    const ang = rand(0, Math.PI * 2), sp = rand(180, type === 'crit' ? 900 : 600);
    S.parts.push({ x, y, vx: Math.cos(ang) * sp + dir * 120, vy: Math.sin(ang) * sp - 120, life: rand(0.3, 0.7), t: 0, size: rand(4, type === 'crit' ? 12 : 9), color: pal[randi(0, pal.length - 1)], g: 900, kind: Math.random() < 0.5 ? 'spark' : 'dot' });
  }
}
function boltPath(x0, y0, x1, y1){
  const pts = [[x0, y0]], n = 12;
  for(let i = 1; i < n; i++){ const t = i / n; pts.push([lerp(x0, x1, t) + rand(-45, 45), lerp(y0, y1, t)]); }
  pts.push([x1, y1]);
  return pts;
}

// ── 보스의 공격 ─────────────────────────────────────
// 보스 손에서 학생 이름표로 날아가는 공격. 맞으면 목숨 1개가 줄고, 다 잃으면 쓰러진다.
function bossStrike(st, dur, label, stunMs){
  const hand = { x: BOSS_X + (st.left ? -150 : 150), y: BOSS_FEET - 420 };
  const a = anchor(st);
  S.shots.push({ type: 'boss', enemy: true, x0: hand.x, y0: hand.y, x1: a.x, y1: a.y, cx: (hand.x + a.x) / 2, cy: Math.min(hand.y, a.y) - rand(80, 200), t: 0, dur, st, label, stunMs: stunMs || 0, trail: 0 });
}
function hurtStudent(sh){
  const st = sh.st;
  if(S.phase !== 'fight' || isKo(st)) return;
  const a = anchor(st);
  st.hearts--; st.hurtT = 1; st.streak = 0;
  st.flash = 1; st.flashColor = '#ff2d2d';
  if(sh.stunMs) st.stunUntil = Math.max(st.stunUntil, S.clock + sh.stunMs);
  burst(a.x, a.y, 'boss', 18, st.left ? -1 : 1);
  S.rings.push({ x: a.x, y: a.y, t: 0, life: 0.35, r: 80, color: 'rgba(255,60,50,.9)', w: 8 });
  S.shake = Math.max(S.shake, 8);
  const tx = a.x + (st.left ? 90 : -90);
  if(st.hearts <= 0){
    st.koUntil = S.clock + RAID.reviveMs; st.kos++;
    st.hearts = 0; st.stunUntil = 0;
    S.texts.push({ x: tx, y: a.y, txt: '💀 쓰러짐', stun: true, t: 0 });
    sfx('ko');
    const alive = S.students.filter(s => !isKo(s)).length;
    if(alive === 0) startLose('전원 쓰러짐');
  } else {
    S.texts.push({ x: tx, y: a.y, txt: (sh.label ? sh.label + ' ' : '') + '-1 ❤', stun: true, t: 0 });
    sfx('ouch');
  }
}
// 평소 공격: 목표를 ⚠로 1초 먼저 알려 준 뒤 내려친다
function basicAttack(){
  const T = THEMES[themeKey];
  const lvl = S.enrage ? 2 : S.rage ? 1 : 0;
  const pool = S.students.filter(s => !isKo(s));
  const targets = [];
  for(let k = 0; k < RAID.attackTargets[lvl] && pool.length; k++) targets.push(pool.splice(randi(0, pool.length - 1), 1)[0]);
  for(const st of targets) st.targetUntil = S.clock + RAID.telegraphMs;
  sfx('warn');
  S.timers.push({ at: S.clock + RAID.telegraphMs, fn: () => {
    if(S.phase !== 'fight' || bossStunned()) return;
    S.attack = 0.55;
    for(const st of targets) bossStrike(st, 0.4, T.attackName);
  }});
  S.attackAt = S.clock + RAID.attackGapMs[lvl];
}

function enterRage(){
  const T = THEMES[themeKey];
  S.rage = true;
  S.banner = { txt: T.rageText, sub: '체력 50% 이하 · 호루라기 반격으로 여러 명이 기절합니다!', t: 0, life: 2.2, color: '#ff5a4a', red: true };
  S.shake = Math.max(S.shake, 30);
  S.counterAt = S.clock + 4000;
  for(let i = 0; i < 40; i++) S.parts.push({ x: BOSS_X + rand(-200, 200), y: BOSS_FEET - rand(0, 500), vx: rand(-60, 60), vy: rand(-420, -160), life: rand(0.8, 1.6), t: 0, size: rand(4, 10), color: Math.random() < 0.5 ? '#ff4d2e' : '#ffb347', g: -50, kind: 'dot' });
  sfx('roar');
}
function enterEnrage(){
  const T = THEMES[themeKey];
  S.enrage = true;
  S.banner = { txt: T.enrageText, sub: '체력 25% 이하 · 회복 속도 2배 · 더 자주, 더 많이 공격합니다', t: 0, life: 2.2, color: '#ff3b30', red: true };
  S.shake = Math.max(S.shake, 36);
  S.nextHealAt = S.clock + RAID.healRepeatMs;
  sfx('roar');
}

// 분노 광역기: 호루라기로 여러 명을 한꺼번에 기절시키고 목숨도 깎는다
function counterAttack(){
  const T = THEMES[themeKey];
  S.attack = 1;
  sfx('counter');
  S.timers.push({ at: S.clock + 380, fn: () => {
    if(S.phase !== 'fight' || bossStunned()) return;
    S.shake = Math.max(S.shake, 34);
    S.rings.push({ x: BOSS_X, y: BOSS_FEET - 260, t: 0, life: 0.8, r: 1300, color: 'rgba(255,70,50,.9)', w: 26 });
    S.rings.push({ x: BOSS_X, y: BOSS_FEET - 260, t: -0.12, life: 0.8, r: 1100, color: 'rgba(255,200,120,.7)', w: 12 });
    const pool = S.students.filter(s => !isKo(s));
    const n = Math.min(RAID.whistleTargets, pool.length);
    for(let k = 0; k < n; k++){
      const st = pool.splice(randi(0, pool.length - 1), 1)[0];
      hurtStudent({ st, label: '😵 기절!', stunMs: RAID.whistleStunMs });
    }
    S.banner = { txt: T.counterText, sub: `${n}명이 ${RAID.whistleStunMs / 1000}초 동안 기절했습니다`, t: 0, life: 1.6, color: '#ff7a5a', red: true };
  }});
  S.counterAt = S.clock + RAID.whistleGapMs;
}

// ── 보스 회복 ───────────────────────────────────────
function checkHealTrigger(){
  if(S.cast || S.phase !== 'fight') return;
  const frac = S.hp / S.max;
  for(const th of RAID.healAt){
    if(frac <= th && !S.healsDone.includes(th)){ S.healsDone.push(th); startCast(); return; }
  }
}
function startCast(){
  const T = THEMES[themeKey];
  S.cast = { need: RAID.healNeed, got: 0, start: S.clock, end: S.clock + RAID.healCastMs };
  S.banner = { txt: '🩹 ' + T.healName + '!', sub: `${RAID.healCastMs / 1000}초 안에 ${RAID.healNeed}번 공격해서 끊어라!`, t: 0, life: 2, color: '#6dff9e', red: true };
  sfx('cast');
}
function breakCast(){
  S.cast = null;
  S.bossStunUntil = S.clock + RAID.breakStunMs;
  S.hitPose = 0.6;
  S.banner = { txt: '회복 차단!', sub: `보스 ${RAID.breakStunMs / 1000}초 기절 · 받는 피해 2배!`, t: 0, life: 1.8, color: '#ffe14d' };
  S.shake = Math.max(S.shake, 26);
  sfx('break');
}
function healBoss(amount, big){
  const before = S.hp;
  S.hp = Math.min(S.max, S.hp + amount);
  const got = S.hp - before;
  if(got <= 0) return;
  S.ghost = Math.max(S.ghost, S.hp);
  S.healFlash = big ? 1 : Math.max(S.healFlash, 0.4);
  if(big){
    for(let i = 0; i < 60; i++) S.parts.push({ x: BOSS_X + rand(-220, 220), y: BOSS_FEET - rand(0, 600), vx: rand(-40, 40), vy: rand(-300, -80), life: rand(0.8, 1.5), t: 0, size: rand(5, 12), color: ['#7dffb0', '#3ee07a', '#c8ffe0'][randi(0, 2)], g: -40, kind: 'dot' });
    S.texts.push({ x: BOSS_X, y: BOSS_FEET - 620, txt: '+' + fmtNum(got), heal: true, big: true, t: 0 });
  } else {
    S.texts.push({ x: BOSS_X + rand(-150, 150), y: BOSS_FEET - rand(500, 640), txt: '+' + fmtNum(got), heal: true, t: 0 });
  }
  // 회복으로 분노 기준선 위로 올라가도 한 번 시작한 분노·광폭화는 풀리지 않는다
}
function finishCastFail(){
  const T = THEMES[themeKey];
  S.cast = null;
  healBoss(S.max * RAID.healAmount, true);
  S.banner = { txt: T.bossName + ' 회복!', sub: `체력 ${Math.round(RAID.healAmount * 100)}% 회복 · 다음엔 더 빨리 공격하세요`, t: 0, life: 1.8, color: '#6dff9e', red: true };
  sfx('heal');
}

function startDying(){
  S.phase = 'dying'; S.dyingT = 0; S.endClock = S.clock; S.nextBoom = 0;
  S.shots = []; S.cast = null; S.timers = [];
  S.banner = null;
}
function startLose(reason){
  if(S.phase !== 'fight') return;
  S.phase = 'lose'; S.loseReason = reason; S.endClock = S.clock;
  S.shots = []; S.cast = null; S.timers = [];
  S.banner = null;
  sfx('lose');
  updateButtons();
}

function manualHit(){
  if(S.phase !== 'fight' || !running) return;
  const pool = S.students.filter(canAct);
  if(!pool.length) return;
  const st = pool[randi(0, pool.length - 1)];
  st.streak = 4;   // 수동 타격은 치명타가 나오도록 5연속 정답으로 만든다
  const saved = Math.random;
  Math.random = () => 0;   // 반드시 정답 처리
  try { answer(st); } finally { Math.random = saved; }
}

// ── 갱신 ─────────────────────────────────────────────
function update(dt){
  S.clock += dt * 1000;
  const now = S.clock, mean = SPEEDS[speedIdx].mean;

  if(S.phase === 'intro'){
    S.introT += dt;
    const k = clamp((S.introT - 0.3) / 0.7, 0, 1);
    S.bossY = k < 1 ? lerp(-900, 0, k * k) : 0;
    if(k >= 1 && !S.landed){
      S.landed = true; S.shake = 40; S.squash = 1.3; sfx('drop');
      for(let i = 0; i < 50; i++) S.parts.push({ x: BOSS_X + rand(-260, 260), y: BOSS_FEET - 10, vx: rand(-500, 500), vy: rand(-380, -60), life: rand(0.5, 1), t: 0, size: rand(6, 16), color: themeKey === 'korea' ? '#6b5a50' : '#d8a867', g: 700, kind: 'dot' });
    }
    if(S.introT >= 2.4) startFight();
  }

  if(S.phase === 'fight'){
    for(const st of S.students){
      // 부활
      if(st.koUntil && now >= st.koUntil){
        st.koUntil = 0; st.hearts = RAID.hearts;
        st.flash = 1; st.flashColor = '#48d17a';
        const a = anchor(st);
        S.texts.push({ x: a.x + (st.left ? 90 : -90), y: a.y, txt: '부활!', stun: true, revive: true, t: 0 });
      }
      if(now < st.next) continue;
      st.next = now + Math.max(700, expRand(mean));
      if(!canAct(st)) continue;
      answer(st);
    }
    if(!bossStunned()){
      if(now >= S.attackAt) basicAttack();
      if(S.rage && now >= S.counterAt) counterAttack();
      // 초당 회복 (광폭화 땐 2배), 1초마다 모아서 숫자로 보여 준다
      S.regenAcc += S.max * RAID.regenPerSec * (S.enrage ? 2 : 1) * dt;
      if(now >= S.regenShowAt){ S.regenShowAt = now + 1000; if(S.regenAcc >= 1){ healBoss(S.regenAcc, false); S.regenAcc = 0; } }
      if(S.enrage && !S.cast && S.healsDone.length >= RAID.healAt.length && now >= S.nextHealAt){ S.nextHealAt = now + RAID.healRepeatMs; startCast(); }
    } else {
      // 기절한 동안엔 회복 의식·공격 예약이 밀린다
      S.attackAt = Math.max(S.attackAt, S.bossStunUntil + 1200);
      S.counterAt = Math.max(S.counterAt, S.bossStunUntil + 2500);
    }
    if(S.cast && now >= S.cast.end) finishCastFail();
    if(now - S.fightStart >= RAID.limitMs) startLose('시간 초과');
  }

  if(S.phase === 'dying'){
    S.dyingT += dt;
    if(S.dyingT < 2.2 && S.dyingT >= S.nextBoom){
      S.nextBoom = S.dyingT + rand(0.1, 0.2);
      const x = BOSS_X + rand(-190, 190), y = BOSS_FEET - rand(80, 560);
      burst(x, y, 'torch', 26, 0);
      S.rings.push({ x, y, t: 0, life: 0.45, r: rand(110, 190), color: 'rgba(255,190,90,.95)', w: 12 });
      S.shake = Math.max(S.shake, 18);
      sfx('explode');
    }
    if(S.dyingT >= 2.2){
      const k = clamp((S.dyingT - 2.2) / 0.8, 0, 1);
      S.bossRot = (themeKey === 'korea' ? -1 : 1) * 0.45 * easeOut(k);
      S.bossY = 80 * k; S.bossAlpha = 1 - k;
    }
    if(S.dyingT >= 3.1){
      S.phase = 'victory';
      updateButtons();
      sfx('win');
      for(let i = 0; i < 160; i++) confetti(true);
    }
  }
  if(S.phase === 'victory' && Math.random() < dt * 30) confetti(false);

  // 예약된 동작
  for(let i = S.timers.length - 1; i >= 0; i--) if(now >= S.timers[i].at){ const tm = S.timers.splice(i, 1)[0]; tm.fn(); }

  // 날아가는 공격 (학생 → 보스, 보스 → 학생)
  for(let i = S.shots.length - 1; i >= 0; i--){
    const sh = S.shots[i];
    sh.t += dt / sh.dur;
    const p = shotPos(sh, Math.min(1, sh.t));
    sh.trail += dt;
    while(sh.trail > 0.012){
      sh.trail -= 0.012;
      trailParticle(sh, p);
    }
    if(sh.t >= 1){ S.shots.splice(i, 1); if(sh.enemy) hurtStudent(sh); else impact(sh); }
  }
  // 파편
  for(let i = S.parts.length - 1; i >= 0; i--){
    const q = S.parts[i];
    q.t += dt;
    if(q.t >= q.life){ S.parts.splice(i, 1); continue; }
    q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    if(q.kind === 'confetti'){ q.rot += q.vr * dt; q.vx *= 0.99; }
  }
  if(S.parts.length > 900) S.parts.splice(0, S.parts.length - 900);
  for(const arr of [S.texts, S.rings, S.bolts]){
    for(let i = arr.length - 1; i >= 0; i--){ arr[i].t += dt; if(arr[i].t >= (arr[i].life || 1)) arr.splice(i, 1); }
  }
  if(S.banner){ S.banner.t += dt; if(S.banner.t >= S.banner.life) S.banner = null; }

  // 감쇠
  S.bossFlash = Math.max(0, S.bossFlash - dt * 5);
  S.healFlash = Math.max(0, S.healFlash - dt * 2);
  S.knock += (0 - S.knock) * Math.min(1, dt * 9);
  S.squash = Math.max(0, S.squash - dt * 5);
  S.shake = Math.max(0, S.shake - dt * 70);
  S.comboPop = Math.max(0, S.comboPop - dt * 5);
  S.attack = Math.max(0, S.attack - dt * 1.4);
  S.hitPose = Math.max(0, S.hitPose - dt);
  for(const st of S.students){ st.flash = Math.max(0, st.flash - dt * 2.5); st.wrongT = Math.max(0, st.wrongT - dt * 2); st.hurtT = Math.max(0, st.hurtT - dt * 2.5); }
  S.ghost += (S.hp - S.ghost) * Math.min(1, dt * 2.2);
}

function shotPos(sh, t){
  const u = 1 - t;
  const x = u * u * sh.x0 + 2 * u * t * sh.cx + t * t * sh.x1;
  const y = u * u * sh.y0 + 2 * u * t * sh.cy + t * t * sh.y1;
  const dx = 2 * u * (sh.cx - sh.x0) + 2 * t * (sh.x1 - sh.cx);
  const dy = 2 * u * (sh.cy - sh.y0) + 2 * t * (sh.y1 - sh.cy);
  return { x, y, a: Math.atan2(dy, dx) };
}
function trailParticle(sh, p){
  if(sh.type === 'torch') S.parts.push({ x: p.x + rand(-6, 6), y: p.y + rand(-6, 6), vx: rand(-40, 40), vy: rand(-80, -20), life: rand(0.25, 0.45), t: 0, size: rand(6, 13), color: ['#fff2a8', '#ffd166', '#ff8c42', '#ff4d2e'][randi(0, 3)], g: -60, kind: 'dot' });
  else if(sh.type === 'ink') S.parts.push({ x: p.x, y: p.y, vx: rand(-30, 30), vy: rand(-20, 40), life: rand(0.3, 0.5), t: 0, size: rand(4, 9), color: ['#10142c', '#23306e', '#3b4db0'][randi(0, 2)], g: 500, kind: 'dot' });
  else if(sh.type === 'crit') S.parts.push({ x: p.x + rand(-8, 8), y: p.y + rand(-8, 8), vx: rand(-60, 60), vy: rand(-60, 60), life: rand(0.2, 0.4), t: 0, size: rand(5, 11), color: ['#fff', '#fff3a0', '#7fd8ff'][randi(0, 2)], g: 0, kind: 'dot' });
  else if(sh.type === 'boss') S.parts.push({ x: p.x + rand(-10, 10), y: p.y + rand(-10, 10), vx: rand(-40, 40), vy: rand(-40, 40), life: rand(0.2, 0.4), t: 0, size: rand(5, 10), color: ['#ff3b30', '#b3121f', '#ff8a65'][randi(0, 2)], g: 0, kind: 'dot' });
  else if(Math.random() < 0.4) S.parts.push({ x: p.x, y: p.y, vx: 0, vy: 0, life: 0.18, t: 0, size: 3, color: 'rgba(255,255,255,.6)', g: 0, kind: 'dot' });
}
function confetti(big){
  const cols = ['#ff5a5f', '#ffd23f', '#3ec46d', '#3d8bfd', '#b86bff', '#fff'];
  S.parts.push({ x: big ? rand(200, W - 200) : rand(0, W), y: big ? rand(-200, 300) : -20, vx: rand(-200, 200), vy: big ? rand(-600, 0) : rand(50, 150), life: rand(2.5, 4), t: 0, size: rand(10, 18), color: cols[randi(0, cols.length - 1)], g: 380, kind: 'confetti', rot: rand(0, 6), vr: rand(-8, 8) });
}

// ── 그리기 ───────────────────────────────────────────
function draw(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.save();
  if(S.shake > 0) ctx.translate(rand(-S.shake, S.shake), rand(-S.shake, S.shake) * 0.7);
  drawBackground();
  drawBossLayer();
  drawRings();
  drawParticles(false);
  drawShots();
  drawBolts();
  drawTexts();
  ctx.restore();

  drawTags();
  drawHpBar();
  drawCastBar();
  drawCombo();
  drawStats();
  drawBanner();
  if(S.phase === 'intro') drawIntro();
  if(S.phase === 'victory') drawVictory();
  if(S.phase === 'lose') drawLose();
  drawParticles(true);
  if(S.phase === 'ready') drawReady();
  else if(!running && S.phase !== 'victory' && S.phase !== 'lose') drawPaused();
}

function drawBossLayer(){
  if(S.phase === 'victory') return;
  const t = S.clock / 1000;
  // 분노 오라
  if(S.rage){
    const aura = ctx.createRadialGradient(BOSS_X, BOSS_FEET - 330, 60, BOSS_X, BOSS_FEET - 330, 420 + Math.sin(t * 6) * 20);
    aura.addColorStop(0, S.enrage ? 'rgba(255,20,20,.5)' : 'rgba(255,60,30,.35)'); aura.addColorStop(1, 'rgba(255,60,30,0)');
    ctx.fillStyle = aura; ctx.fillRect(BOSS_X - 520, BOSS_FEET - 820, 1040, 900);
  }
  // 회복 의식 중: 초록 기운
  if(S.cast){
    const aura = ctx.createRadialGradient(BOSS_X, BOSS_FEET - 330, 40, BOSS_X, BOSS_FEET - 330, 380 + Math.sin(t * 8) * 30);
    aura.addColorStop(0, 'rgba(80,255,150,.45)'); aura.addColorStop(1, 'rgba(80,255,150,0)');
    ctx.fillStyle = aura; ctx.fillRect(BOSS_X - 520, BOSS_FEET - 820, 1040, 900);
    if(Math.random() < 0.5) S.parts.push({ x: BOSS_X + rand(-200, 200), y: BOSS_FEET - rand(0, 200), vx: rand(-20, 20), vy: rand(-260, -120), life: rand(0.8, 1.4), t: 0, size: rand(4, 9), color: ['#7dffb0', '#3ee07a', '#c8ffe0'][randi(0, 2)], g: -30, kind: 'dot' });
  }
  // 발밑 그림자
  const shadowScale = S.phase === 'intro' ? clamp(1 + S.bossY / 900, 0.2, 1) : 1;
  ctx.fillStyle = `rgba(0,0,0,${0.4 * shadowScale * S.bossAlpha})`;
  ctx.beginPath(); ctx.ellipse(BOSS_X, BOSS_FEET - 6, 230 * shadowScale, 34 * shadowScale, 0, 0, Math.PI * 2); ctx.fill();

  const bi = renderBoss();
  ctx.save();
  ctx.globalAlpha = S.bossAlpha;
  const stunWobble = bossStunned() ? Math.sin(t * 9) * 0.03 : 0;
  ctx.translate(BOSS_X + S.knock, BOSS_FEET + S.bossY);
  ctx.rotate(S.bossRot + stunWobble);
  const sq = S.squash;
  const breath = Math.sin(t * 2.2) * 0.008;                             // 숨쉬기
  const lunge = S.attack > 0 ? Math.sin(Math.PI * (1 - S.attack)) : 0;  // 공격할 때 앞으로 달려드는 느낌
  ctx.scale((1 + sq * 0.07) * (1 + lunge * 0.12), (1 - sq * 0.07 + breath) * (1 + lunge * 0.12));
  ctx.drawImage(bi.cvs, -bi.ax, -bi.ay);
  ctx.restore();
  // 기절: 머리 위로 별이 빙글빙글
  if(bossStunned() && S.phase === 'fight'){
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for(let i = 0; i < 5; i++){
      const a = t * 4 + i * Math.PI * 2 / 5;
      outlinedText(ctx, '★', BOSS_X + S.knock + Math.cos(a) * 110, BOSS_FEET - 735 + Math.sin(a) * 26, 40, '#ffe14d', '#5a3a00', 6);
    }
  }
}

function drawShots(){
  for(const sh of S.shots){
    const p = shotPos(sh, Math.min(1, sh.t));
    ctx.save();
    ctx.translate(p.x, p.y);
    if(sh.type === 'boss'){
      // 보스 공격: 붉은 기운을 두른 곤봉(한국사) / 창(세계사)
      const gr = ctx.createRadialGradient(0, 0, 2, 0, 0, 56);
      gr.addColorStop(0, 'rgba(255,90,70,.9)'); gr.addColorStop(1, 'rgba(160,0,0,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, 56, 0, Math.PI * 2); ctx.fill();
      if(themeKey === 'korea'){
        ctx.rotate(S.clock / 40);
        rr(ctx, -50, -9, 100, 18, 9); paint(ctx, '#6b3a24', 5);
        rr(ctx, 30, -11, 22, 22, 6); paint(ctx, '#3a2014', 4);
      } else {
        ctx.rotate(p.a);
        ctx.strokeStyle = '#5a3620'; ctx.lineWidth = 8; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-110, 0); ctx.lineTo(0, 0); ctx.stroke();
        ctx.fillStyle = '#ffb3a8'; ctx.strokeStyle = OUT; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(32, 0); ctx.lineTo(-6, -12); ctx.lineTo(-6, 12); ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    } else if(sh.type === 'torch' || sh.type === 'crit'){
      const r = sh.type === 'crit' ? 34 : 22;
      const gr = ctx.createRadialGradient(0, 0, 2, 0, 0, r * 2.2);
      if(sh.type === 'crit'){ gr.addColorStop(0, '#fff'); gr.addColorStop(0.3, 'rgba(255,240,140,.95)'); gr.addColorStop(1, 'rgba(120,200,255,0)'); }
      else { gr.addColorStop(0, '#fff6c8'); gr.addColorStop(0.35, 'rgba(255,150,60,.95)'); gr.addColorStop(1, 'rgba(255,60,20,0)'); }
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, r * 2.2, 0, Math.PI * 2); ctx.fill();
    } else if(sh.type === 'ink'){
      ctx.rotate(p.a);
      ctx.fillStyle = '#141a3c';
      ctx.beginPath(); ctx.ellipse(0, 0, 26, 14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(160,180,255,.8)'; ctx.lineWidth = 3; ctx.stroke();
    } else {
      // 화살·창
      ctx.rotate(p.a);
      const len = sh.type === 'spear' ? 120 : 78;
      ctx.strokeStyle = sh.type === 'spear' ? '#7a5230' : '#8a5a2b'; ctx.lineWidth = sh.type === 'spear' ? 8 : 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-len, 0); ctx.lineTo(0, 0); ctx.stroke();
      ctx.fillStyle = '#dfe5ee'; ctx.strokeStyle = OUT; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(sh.type === 'spear' ? 30 : 18, 0); ctx.lineTo(-6, -11); ctx.lineTo(-6, 11); ctx.closePath(); ctx.fill(); ctx.stroke();
      if(sh.type === 'arrow'){ ctx.fillStyle = '#e8e2d0'; ctx.fillRect(-len, -8, 18, 16); }
    }
    ctx.restore();
  }
}

function drawParticles(confettiOnly){
  for(const q of S.parts){
    if((q.kind === 'confetti') !== confettiOnly) continue;
    const a = 1 - q.t / q.life;
    ctx.globalAlpha = clamp(a * 1.4, 0, 1);
    ctx.fillStyle = q.color; ctx.strokeStyle = q.color;
    if(q.kind === 'spark'){
      ctx.lineWidth = q.size * 0.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.vx * 0.035, q.y - q.vy * 0.035); ctx.stroke();
    } else if(q.kind === 'confetti'){
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
      ctx.fillRect(-q.size / 2, -q.size / 4, q.size, q.size / 2);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(q.x, q.y, q.size * (0.4 + 0.6 * a), 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawRings(){
  for(const r of S.rings){
    if(r.t < 0) continue;
    const k = r.t / r.life;
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = r.color; ctx.lineWidth = r.w * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r * easeOut(k), 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawBolts(){
  for(const b of S.bolts){
    const k = b.t / (b.life || 0.35);
    if(k > 1) continue;
    ctx.globalAlpha = 1 - k;
    for(const [w, c] of [[22, 'rgba(120,200,255,.35)'], [10, 'rgba(180,230,255,.9)'], [4, '#fff']]){
      ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath(); b.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    }
    if(k < 0.25){ ctx.fillStyle = `rgba(255,255,255,${0.35 * (1 - k / 0.25)})`; ctx.fillRect(-50, -50, W + 100, H + 100); }
  }
  ctx.globalAlpha = 1;
}

function drawTexts(){
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const tx of S.texts){
    const k = tx.t / (tx.life || 1);
    const pop = tx.t < 0.12 ? 0.6 + (tx.t / 0.12) * 0.6 : 1.2 - Math.min(0.2, (tx.t - 0.12) * 0.6);
    ctx.globalAlpha = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
    const y = tx.y - easeOut(Math.min(1, k * 1.3)) * (tx.stun ? 40 : 90);
    ctx.save(); ctx.translate(tx.x, y); ctx.scale(pop, pop);
    if(tx.heal) outlinedText(ctx, tx.txt, 0, 0, tx.big ? 76 : 36, '#6dff9e', '#063a18', tx.big ? 12 : 6);
    else if(tx.stun) outlinedText(ctx, tx.txt, 0, 0, 30, tx.revive ? '#8dffb5' : '#ffd0c8');
    else if(tx.crit){
      outlinedText(ctx, 'CRITICAL!', 0, -52, 32, '#7fd8ff');
      outlinedText(ctx, tx.txt, 0, 0, 78, '#ffe14d', '#5a1a00', 12);
    } else outlinedText(ctx, tx.txt, 0, 0, 46, '#fff');
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawTags(){
  const top = S.students.reduce((m, s) => s.dmg > (m ? m.dmg : 0) ? s : m, null);
  ctx.textBaseline = 'middle';
  for(const st of S.students){
    const ko = isKo(st), stunned = !ko && st.stunUntil > S.clock;
    const targeted = !ko && st.targetUntil > S.clock;
    const shakeT = Math.max(st.wrongT, st.hurtT);
    const shakeX = shakeT > 0 ? Math.sin(shakeT * 40) * 10 * shakeT : 0;
    const x = st.tx + shakeX, y = st.ty, cy = y + TAG_H / 2;
    ctx.save();
    ctx.globalAlpha = ko ? 0.5 : stunned ? 0.7 : 0.92;
    rr(ctx, x, y, TAG_W, TAG_H, 12);
    ctx.fillStyle = ko ? '#2a2a30' : stunned ? '#3a3a50' : 'rgba(18,20,40,.88)'; ctx.fill();
    if(st.flash > 0){ ctx.globalAlpha = st.flash * 0.75; ctx.fillStyle = st.flashColor; ctx.fill(); }
    ctx.globalAlpha = 1;
    if(targeted){
      // 보스가 노리는 중: 붉은 테두리가 깜빡인다
      ctx.lineWidth = 5; ctx.strokeStyle = `rgba(255,50,40,${0.55 + 0.45 * Math.sin(S.clock / 45)})`;
    } else {
      ctx.lineWidth = 2; ctx.strokeStyle = top === st && st.dmg > 0 ? '#ffd23f' : 'rgba(255,255,255,.18)';
    }
    ctx.stroke();
    // 이름 첫 글자 동그라미
    const ccx = st.left ? x + 26 : x + TAG_W - 26;
    ctx.beginPath(); ctx.arc(ccx, cy, 17, 0, Math.PI * 2);
    ctx.fillStyle = ko ? '#555' : `hsl(${st.i * 37 % 360} 60% 52%)`; ctx.fill();
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = `800 18px ${FONT}`;
    ctx.fillText(ko ? '💀' : st.name[0], ccx, cy + 1);
    // 이름
    ctx.textAlign = st.left ? 'left' : 'right';
    ctx.font = `800 23px ${FONT}`; ctx.fillStyle = ko ? '#999' : '#fff';
    const nameX = st.left ? x + 52 : x + TAG_W - 52;
    ctx.fillText((top === st && st.dmg > 0 && !ko ? '👑 ' : '') + st.name, nameX, cy + 1);
    // 오른쪽 정보: 쓰러짐 카운트다운 · 기절 · ⚠ · 목숨
    ctx.textAlign = st.left ? 'right' : 'left';
    const infoX = st.left ? x + TAG_W - 12 : x + 12;
    if(ko){
      ctx.font = `800 18px ${FONT}`; ctx.fillStyle = '#ff8a80';
      ctx.fillText(`부활 ${Math.ceil((st.koUntil - S.clock) / 1000)}초`, infoX, cy + 1);
    } else if(targeted){
      ctx.font = `900 24px ${FONT}`; ctx.fillStyle = '#ff5a4a';
      ctx.fillText('⚠', infoX, cy + 1);
    } else {
      // 목숨 하트: 남은 것은 빨강, 잃은 것은 흐리게 (왼쪽부터 첫째 하트)
      const n = RAID.hearts, step = n > 3 ? 16 : 21;
      ctx.font = `900 ${n > 3 ? 17 : 22}px ${FONT}`;
      for(let h = 0; h < n; h++){
        const hx = st.left ? infoX - (n - 1 - h) * step : infoX + h * step;
        ctx.fillStyle = h < st.hearts ? '#ff4d5e' : 'rgba(255,255,255,.2)';
        ctx.fillText('♥', hx, cy + 1);
      }
      if(stunned){
        ctx.font = `800 17px ${FONT}`;
        ctx.fillText('😵', st.left ? infoX - n * step - 4 : infoX + n * step + 4, cy + 1);
      }
    }
    ctx.restore();
  }
}

function drawHpBar(){
  const T = THEMES[themeKey];
  const x = 440, y = 62, w = 1040, h = 38;
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  outlinedText(ctx, T.bossName, x, y - 14, 44, '#fff');
  const nameW = (() => { ctx.font = `900 44px ${FONT}`; return ctx.measureText(T.bossName).width; })();
  ctx.font = `700 22px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText(T.sub, x + nameW + 16, y - 18);
  // 상태 배지 (오른쪽 위)
  const badges = [];
  if(bossStunned() && S.phase === 'fight') badges.push(['💫 기절 · 피해 2배', '#c79a00']);
  if(S.enrage) badges.push(['🔥 광폭화', '#b3001b']);
  else if(S.rage) badges.push(['😡 분노', '#d7263d']);
  let bx = x + w;
  ctx.font = `900 22px ${FONT}`;
  for(const [label, color] of badges){
    const bw = ctx.measureText(label).width + 28;
    bx -= bw;
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(S.clock / 90);
    rr(ctx, bx, y - 50, bw, 36, 8); ctx.fillStyle = color; ctx.fill();
    ctx.globalAlpha = 1; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText(label, bx + bw / 2, y - 24);
    bx -= 10;
  }
  ctx.textAlign = 'left';
  rr(ctx, x - 5, y - 5, w + 10, h + 10, 12); ctx.fillStyle = OUT; ctx.fill();
  rr(ctx, x, y, w, h, 9); ctx.fillStyle = '#2a1a1a'; ctx.fill();
  const gw = w * clamp(S.ghost / S.max, 0, 1), hw = w * clamp(S.hp / S.max, 0, 1);
  if(gw > 0){ rr(ctx, x, y, gw, h, 9); ctx.fillStyle = 'rgba(255,240,200,.9)'; ctx.fill(); }
  if(hw > 0){
    const gr = ctx.createLinearGradient(0, y, 0, y + h);
    if(S.rage){ const p = 0.5 + 0.5 * Math.sin(S.clock / 110); gr.addColorStop(0, `rgb(255,${80 + 60 * p},${60 + 40 * p})`); gr.addColorStop(1, '#8a0f1a'); }
    else { gr.addColorStop(0, '#ff6b5a'); gr.addColorStop(1, '#b0172a'); }
    rr(ctx, x, y, hw, h, 9); ctx.fillStyle = gr; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x + 6, y + 5, Math.max(0, hw - 12), 6);
    if(S.healFlash > 0){ ctx.globalAlpha = S.healFlash * 0.8; rr(ctx, x, y, hw, h, 9); ctx.fillStyle = '#6dff9e'; ctx.fill(); ctx.globalAlpha = 1; }
  }
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2;
  for(let i = 1; i < 10; i++){ ctx.beginPath(); ctx.moveTo(x + w * i / 10, y); ctx.lineTo(x + w * i / 10, y + h); ctx.stroke(); }
  // 회복 의식이 시작되는 선(60%·30%) 표시
  for(const th of RAID.healAt){
    if(S.healsDone.includes(th)) continue;
    const lx = x + w * th;
    ctx.fillStyle = '#6dff9e'; ctx.fillRect(lx - 2, y - 4, 4, h + 8);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  outlinedText(ctx, `${fmtNum(S.hp)} / ${fmtNum(S.max)}`, x + w / 2, y + h / 2 + 2, 24, '#fff', OUT, 5);
}

// 회복 의식 진행 막대: 남은 시간(초록)과 끊기까지 남은 공격 수(노랑)
function drawCastBar(){
  const c = S.cast;
  if(!c || S.phase !== 'fight') return;
  const T = THEMES[themeKey];
  const w = 700, h = 30, x = 960 - w / 2, y = 196;
  const timeLeft = clamp((c.end - S.clock) / (c.end - c.start), 0, 1);
  const hitK = clamp(c.got / c.need, 0, 1);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const blink = 0.75 + 0.25 * Math.sin(S.clock / 70);
  ctx.globalAlpha = blink;
  outlinedText(ctx, `🩹 ${T.healName} — 공격해서 끊어라!  ${c.got} / ${c.need}`, 960, y - 26, 30, '#6dff9e', '#032a10', 6);
  ctx.globalAlpha = 1;
  rr(ctx, x - 4, y - 4, w + 8, h + 8, 10); ctx.fillStyle = OUT; ctx.fill();
  rr(ctx, x, y, w, h, 8); ctx.fillStyle = '#10301c'; ctx.fill();
  if(timeLeft > 0){ rr(ctx, x, y, w * timeLeft, h, 8); ctx.fillStyle = '#3ee07a'; ctx.fill(); }
  if(hitK > 0){ rr(ctx, x, y + h - 10, w * hitK, 10, 5); ctx.fillStyle = '#ffe14d'; ctx.fill(); }
  outlinedText(ctx, `${((c.end - S.clock) / 1000).toFixed(1)}초`, 960, y + h / 2 + 1, 20, '#fff', OUT, 4);
}

function drawCombo(){
  if(S.combo < 3 || S.clock - S.comboT > 1600 || S.phase !== 'fight') return;
  const fade = 1 - clamp((S.clock - S.comboT - 1100) / 500, 0, 1);
  const s = 1 + S.comboPop * 0.35;
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.translate(1450, 470); ctx.rotate(-0.08); ctx.scale(s, s);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const color = S.combo >= 15 ? '#ff5aa5' : S.combo >= 8 ? '#ffb020' : '#ffe14d';
  outlinedText(ctx, S.combo + ' COMBO', 0, 0, 70, color, '#3a0a00', 12);
  outlinedText(ctx, S.combo >= 15 ? '반 전체 총공격!' : S.combo >= 8 ? '불붙었다!' : '연속 타격!', 0, 56, 30, '#fff');
  ctx.restore();
}

function drawStats(){
  if(S.phase === 'ready') return;
  const used = S.phase === 'fight' ? S.clock - S.fightStart : S.phase === 'intro' ? 0 : S.endClock - S.fightStart;
  const left = Math.max(0, RAID.limitMs - used);
  const kos = S.students.filter(isKo).length;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const hurry = left <= 30000 && S.phase === 'fight';
  const timeColor = hurry ? (Math.sin(S.clock / 120) > 0 ? '#ff5a4a' : '#fff') : 'rgba(255,255,255,.95)';
  outlinedText(ctx, `⏳ ${fmtTime(Math.ceil(left / 1000) * 1000)}`, 800, 132, hurry ? 34 : 28, timeColor, OUT, 5);
  outlinedText(ctx, `✔ ${S.correct}   ✗ ${S.wrong}   💀 ${kos}명`, 1090, 132, 26, 'rgba(255,255,255,.9)', OUT, 5);
}

function drawBanner(){
  const b = S.banner;
  if(!b) return;
  const inK = clamp(b.t / 0.15, 0, 1), outK = clamp((b.t - (b.life - 0.3)) / 0.3, 0, 1);
  const alpha = inK * (1 - outK), scale = 1.5 - 0.5 * easeOut(inK);
  ctx.save();
  ctx.globalAlpha = alpha;
  if(b.red){
    ctx.fillStyle = 'rgba(120,0,0,.55)'; ctx.fillRect(0, 250, W, 150);
    ctx.fillStyle = 'rgba(255,80,60,.8)'; ctx.fillRect(0, 250, W, 5); ctx.fillRect(0, 395, W, 5);
  }
  ctx.translate(960, 310); ctx.scale(scale, scale);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  outlinedText(ctx, b.txt, 0, 0, 88, b.color, '#2a0800', 14);
  if(b.sub) outlinedText(ctx, b.sub, 0, 66, 32, '#fff');
  ctx.restore();
}

function drawIntro(){
  const t = S.introT;
  const a = t < 0.2 ? t / 0.2 : t > 2.1 ? Math.max(0, 1 - (t - 2.1) / 0.3) : 1;
  ctx.save();
  ctx.globalAlpha = a;
  const y = 420, h = 150;
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, y, W, h);
  // 노랑·검정 경고 줄무늬
  ctx.save(); ctx.beginPath(); ctx.rect(0, y, W, 22); ctx.rect(0, y + h - 22, W, 22); ctx.clip();
  ctx.fillStyle = '#ffcc00'; ctx.fillRect(0, y, W, h);
  ctx.fillStyle = '#111';
  const off2 = (S.clock / 8) % 60;
  for(let x = -60; x < W + 60; x += 60){ ctx.beginPath(); ctx.moveTo(x + off2, y); ctx.lineTo(x + 30 + off2, y); ctx.lineTo(x + off2, y + h); ctx.lineTo(x - 30 + off2, y + h); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const blink = Math.sin(S.clock / 80) > -0.3 ? 1 : 0.4;
  ctx.globalAlpha = a * blink;
  outlinedText(ctx, '⚠ WARNING ⚠  보스 등장', 960, y + h / 2 - 8, 70, '#ff4d3a', '#000', 12);
  ctx.globalAlpha = a;
  outlinedText(ctx, THEMES[themeKey].bossName + ' · 난이도 ' + DIFFS[diffIdx].name, 960, y + h / 2 + 46, 30, '#fff');
  ctx.restore();
}

function drawMvp(px, pw, y0){
  outlinedText(ctx, '🏆 MVP (피해량 순위)', 960, y0, 38, '#fff');
  const top = S.students.slice().sort((a, b) => b.dmg - a.dmg).slice(0, 5);
  const medals = ['🥇', '🥈', '🥉', '4', '5'];
  top.forEach((st, i) => {
    const y = y0 + 75 + i * 70;
    rr(ctx, px + 150, y - 28, pw - 300, 56, 14);
    ctx.fillStyle = i === 0 ? 'rgba(255,210,63,.25)' : 'rgba(255,255,255,.07)'; ctx.fill();
    ctx.textAlign = 'left'; ctx.font = `900 30px ${FONT}`; ctx.fillStyle = '#fff';
    ctx.fillText(medals[i] + '  ' + st.name, px + 185, y + 2);
    ctx.textAlign = 'right'; ctx.font = `800 28px ${FONT}`; ctx.fillStyle = '#ffd23f';
    ctx.fillText(fmtNum(st.dmg) + ' 피해 · 정답 ' + st.correct, px + pw - 185, y + 2);
  });
  ctx.textAlign = 'center';
}

function drawVictory(){
  const T = THEMES[themeKey];
  ctx.fillStyle = 'rgba(5,5,15,.72)'; ctx.fillRect(0, 0, W, H);
  const px = 460, py = 150, pw = 1000, ph = 760;
  rr(ctx, px, py, pw, ph, 28); ctx.fillStyle = 'rgba(25,28,55,.95)'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#ffd23f'; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const bob = Math.sin(S.clock / 250) * 6;
  outlinedText(ctx, '🎉 보스 격파! 🎉', 960, py + 90 + bob, 92, '#ffe14d', '#4a2000', 14);
  ctx.font = `700 30px ${FONT}`; ctx.fillStyle = '#fff';
  ctx.fillText(T.winLine, 960, py + 180);
  ctx.font = `700 26px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.fillText(`걸린 시간 ${fmtTime(S.endClock - S.fightStart)}  ·  정답 ${S.correct}개  ·  마지막 일격 ${S.lastHitter ? S.lastHitter.name : '-'}`, 960, py + 230);
  drawMvp(px, pw, py + 305);
}

function drawLose(){
  const T = THEMES[themeKey];
  ctx.fillStyle = 'rgba(30,0,0,.7)'; ctx.fillRect(0, 0, W, H);
  const px = 460, py = 150, pw = 1000, ph = 760;
  rr(ctx, px, py, pw, ph, 28); ctx.fillStyle = 'rgba(40,14,18,.95)'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#ff4d4d'; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  outlinedText(ctx, '💀 레이드 실패', 960, py + 90, 92, '#ff5a4a', '#2a0000', 14);
  ctx.font = `700 30px ${FONT}`; ctx.fillStyle = '#fff';
  ctx.fillText(T.loseLine, 960, py + 180);
  ctx.font = `700 26px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,.85)';
  const pct = Math.max(1, Math.round(S.hp / S.max * 100));
  const totalKo = S.students.reduce((n, s) => n + s.kos, 0);
  ctx.fillText(`${S.loseReason}  ·  보스 체력 ${pct}% 남음  ·  정답 ${S.correct}개  ·  쓰러진 횟수 ${totalKo}번`, 960, py + 230);
  drawMvp(px, pw, py + 305);
}

// 준비 화면의 난이도 카드 위치 (클릭 판정에도 쓴다)
const DIFF_CARD = { w: 250, h: 132, gap: 18, y: 330 };
function diffCardX(i){
  const total = DIFFS.length * DIFF_CARD.w + (DIFFS.length - 1) * DIFF_CARD.gap;
  return 960 - total / 2 + i * (DIFF_CARD.w + DIFF_CARD.gap);
}
function drawReady(){
  ctx.fillStyle = 'rgba(5,5,15,.7)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  outlinedText(ctx, '⚔️ 보스 레이드 시연', 960, 210, 92, '#ffe14d', '#3a1a00', 14);
  ctx.font = `700 26px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.fillText('난이도를 고르세요  (카드 클릭 또는 숫자 키 1~5)', 960, 296);
  DIFFS.forEach((d, i) => {
    const x = diffCardX(i), y = DIFF_CARD.y, sel = i === diffIdx;
    rr(ctx, x, y, DIFF_CARD.w, DIFF_CARD.h, 18);
    ctx.fillStyle = sel ? 'rgba(255,255,255,.16)' : 'rgba(20,22,44,.85)'; ctx.fill();
    ctx.lineWidth = sel ? 6 : 2; ctx.strokeStyle = sel ? d.color : 'rgba(255,255,255,.2)'; ctx.stroke();
    outlinedText(ctx, d.emoji + ' ' + d.name, x + DIFF_CARD.w / 2, y + 40, 34, sel ? d.color : '#fff', OUT, 6);
    ctx.font = `700 19px ${FONT}`; ctx.fillStyle = sel ? '#fff' : 'rgba(255,255,255,.7)';
    ctx.fillText(d.desc, x + DIFF_CARD.w / 2, y + 84);
    ctx.font = `600 16px ${FONT}`; ctx.fillStyle = sel ? 'rgba(255,255,255,.85)' : 'rgba(255,255,255,.5)';
    ctx.fillText(d.note, x + DIFF_CARD.w / 2, y + 110);
  });
  // 고른 난이도의 규칙 요약
  ctx.font = `600 25px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,.85)';
  const lines = [
    `보스 체력 ${fmtNum(RAID.hp)} · 제한 시간 ${RAID.limitMs / 60000}분 · 학생 목숨 ♥${RAID.hearts} · 쓰러지면 ${RAID.reviveMs / 1000}초 뒤 부활`,
    `오답을 내면 보스가 곧바로 반격 · 분노하면 호루라기로 ${RAID.whistleTargets}명을 기절시킵니다`,
    `보스는 계속 회복합니다 · 회복 의식은 ${RAID.healCastMs / 1000}초 안에 ${RAID.healNeed}번 때려야 끊을 수 있어요 (못 끊으면 ${Math.round(RAID.healAmount * 100)}% 회복)`,
    '5연속 정답 = 치명타 · 시간이 다 되거나 전원이 쓰러지면 실패'
  ];
  lines.forEach((l, i) => ctx.fillText(l, 960, 530 + i * 42));
  const blink = 0.6 + 0.4 * Math.sin(performance.now() / 300);
  ctx.globalAlpha = blink;
  outlinedText(ctx, '스페이스바 또는 ▶ 시작', 960, 740, 46, '#fff');
  ctx.globalAlpha = 1;
  ctx.font = `600 22px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.fillText('단축키: Space 시작·일시정지 · H 수동 타격 · 1~5 난이도', 960, 810);
}
function drawPaused(){
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  outlinedText(ctx, '⏸ 일시정지', 960, 520, 90, '#fff');
}

// ── 조작 ─────────────────────────────────────────────
const $ = id => document.getElementById(id);
function updateButtons(){
  $('startBtn').textContent = (S && (S.phase === 'victory' || S.phase === 'lose')) ? '↺ 다시 도전'
    : running ? '⏸ 일시정지' : '▶ 시작';
  $('themeBtn').textContent = '보스: ' + THEMES[themeKey].bossName;
  $('speedBtn').textContent = '속도: ' + SPEEDS[speedIdx].label;
  $('diffBtn').textContent = '난이도: ' + DIFFS[diffIdx].emoji + ' ' + DIFFS[diffIdx].name;
  $('soundBtn').textContent = soundOn ? '🔊 소리' : '🔇 소리';
}
function toggleRun(){
  audio();   // 브라우저 정책상 소리는 사용자가 누른 뒤에만 켤 수 있다
  if(S.phase === 'victory' || S.phase === 'lose'){ reset(); }
  if(S.phase === 'ready'){ S.phase = 'intro'; S.introT = 0; }
  running = !running;
  updateButtons();
}
$('startBtn').onclick = toggleRun;
$('themeBtn').onclick = () => { themeKey = themeKey === 'korea' ? 'world' : 'korea'; reset(); };
$('speedBtn').onclick = () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  // 이미 싸우는 중이면 다음 답 시각을 새 속도에 맞게 당긴다
  if(S.phase === 'fight') for(const st of S.students) st.next = Math.min(st.next, S.clock + expRand(SPEEDS[speedIdx].mean));
  updateButtons();
};
// 난이도를 바꾸면 처음(준비 화면)으로 돌아간다. 레이드 도중이면 한 번 물어본다.
function setDifficulty(i){
  if(i === diffIdx && S.phase === 'ready') return;
  if(S.phase === 'fight' || S.phase === 'intro' || S.phase === 'dying'){
    if(!confirm('난이도를 바꾸면 지금 레이드가 처음부터 다시 시작됩니다. 바꿀까요?')) return;
  }
  diffIdx = i;
  reset();
}
$('diffBtn').onclick = () => setDifficulty((diffIdx + 1) % DIFFS.length);
cv.addEventListener('click', e => {
  if(S.phase !== 'ready') return;
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  DIFFS.forEach((d, i) => {
    const cx = diffCardX(i);
    if(x >= cx && x <= cx + DIFF_CARD.w && y >= DIFF_CARD.y && y <= DIFF_CARD.y + DIFF_CARD.h) setDifficulty(i);
  });
});
$('hitBtn').onclick = manualHit;
$('soundBtn').onclick = () => { soundOn = !soundOn; if(soundOn) audio(); updateButtons(); };
$('resetBtn').onclick = () => reset();
document.addEventListener('keydown', e => {
  if(e.code === 'Space'){ e.preventDefault(); toggleRun(); }
  else if(e.key === 'h' || e.key === 'H' || e.key === 'ㅗ') manualHit();
  else if(S.phase === 'ready' && /^[1-5]$/.test(e.key)) setDifficulty(Number(e.key) - 1);
});
// 마우스를 3초 동안 움직이지 않으면 조작 버튼을 숨겨 전광판 화면을 깨끗하게
let idleTimer = null;
function wake(){
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
}
document.addEventListener('mousemove', wake);
cv.addEventListener('mousemove', e => {
  if(!S || S.phase !== 'ready'){ cv.style.cursor = ''; return; }
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  const on = DIFFS.some((d, i) => x >= diffCardX(i) && x <= diffCardX(i) + DIFF_CARD.w && y >= DIFF_CARD.y && y <= DIFF_CARD.y + DIFF_CARD.h);
  cv.style.cursor = on ? 'pointer' : '';
});
document.addEventListener('touchstart', wake, { passive: true });
wake();

let lastT = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if(running) update(dt);
  draw();
  requestAnimationFrame(frame);
}
reset();
// 주소 옵션: ?diff=1~5 난이도 · ?boss=world 세계사 보스로 시작 · ?auto 바로 시작(+&skip 등장 연출 생략) · ?hp=0.4 체력 비율을 정해 두고 시작(화면 점검용)
(() => {
  const q = new URLSearchParams(location.search);
  const dq = parseInt(q.get('diff'), 10);
  if(dq >= 1 && dq <= DIFFS.length){ diffIdx = dq - 1; reset(); }
  if(q.get('boss') === 'world'){ themeKey = 'world'; reset(); }
  if(q.has('auto')) toggleRun();
  if(q.has('auto') && q.has('skip')){ S.introT = 3; S.bossY = 0; S.landed = true; startFight(); }   // 등장 연출 건너뛰기
  const hp = parseFloat(q.get('hp'));
  if(hp > 0 && hp < 1){
    S.hp = S.ghost = S.max * hp;
    if(hp <= 0.5){ S.rage = true; S.counterAt = 5000; }
    if(hp <= 0.25){ S.enrage = true; S.nextHealAt = 35000; }
  }
  // ?ff=초 : 그만큼 게임을 미리 진행시킨 상태로 보여 준다 (화면 점검용)
  const ff = parseFloat(q.get('ff'));
  if(ff > 0 && running){ for(let i = 0; i < ff * 60; i++){ update(1 / 60); if(S.phase === 'victory' || S.phase === 'lose') break; } }
})();
requestAnimationFrame(frame);
</script>
</body>
</html>
