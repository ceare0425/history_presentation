<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보스 레이드</title>
<style>
  [hidden]{ display:none !important; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:#06060b; overflow:hidden; }
  body{ font-family:'Malgun Gothic','Pretendard',-apple-system,sans-serif; }
  #wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  /* 16:9 게임 화면을 창 크기에 맞춰 여백(레터박스)과 함께 보여 준다 */
  #cv{ display:block; width:min(100vw, 177.78vh); height:min(56.25vw, 100vh); }
  #ctrl{
    position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:5;
    display:flex; gap:6px; flex-wrap:nowrap; justify-content:center; max-width:calc(100vw - 16px);
    background:rgba(10,10,22,.78); padding:8px 10px; border-radius:14px; transition:opacity .35s;
  }
  #ctrl button{
    font:inherit; font-size:15px; font-weight:700; color:#fff; background:#2c3354;
    border:0; border-radius:9px; padding:8px 12px; cursor:pointer; white-space:nowrap;
  }
  #ctrl button:hover{ background:#3b4470; }
  #ctrl button.primary{ background:#c9563c; }
  .snd{ position:fixed; right:14px; top:14px; z-index:5; font:inherit; font-size:18px; font-weight:800; color:#fff; background:#c9563c; border:0; border-radius:12px; padding:10px 16px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.4); }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<button type="button" id="soundBtn" class="snd hidden">🔊 효과음 켜기</button>
<script type="module">
// Firebase는 실제 게임일 때만 불러온다 (점검 모드 ?sim 에서는 연결하지 않음)

const ROOM = /^[a-z0-9_]{1,20}$/.test(Q.get('room') || '') ? Q.get('room') : 'world';

// 가짜 학생 30명이 일정 확률로 "정답"을 내며 보스를 공격하고,
// 타격·치명타·콤보·분노·반격·격파 연출을 전광판(프로젝터) 크기로 보여 준다.

off.width = 700; off.height = 780;

// 모두 배경이 투명한 1005×900 틀에 발끝(가운데 아래)이 같은 자리에 오도록 맞춰 두었다.

sprOff.width = SPRITE_W; sprOff.height = SPRITE_H;

const POLICE = {};
['idle', 'hit', 'rage', 'hurt', 'down', 'whistle', 'swing', 'rope'].forEach(k => { const im = new Image(); im.src = 'assets/boss/police_' + k + '.webp'; POLICE[k] = im; });
function imgOk(im){ return im.complete && im.naturalWidth > 0; }

// 부하(헌병)와 바리케이드 그림
const MP_IMG = new Image(); MP_IMG.src = 'assets/boss/mp.webp';
const BARRICADE_IMG = new Image(); BARRICADE_IMG.src = 'assets/boss/barricade.webp';
const mpOff = document.createElement('canvas');   // 헌병이 맞을 때 하얗게 번쩍이는 효과용
const mpCtx = mpOff.getContext('2d');

const NAMES = ['김민준','이서연','박지호','최하은','정도윤','강서윤','조시우','윤지우','장예준','임수아',
  '한주원','오하린','서지안','신유준','권채원','황은우','안다은','송건우','류소율','전지환',
  '홍예린','고민재','문서아','양태윤','손가은','배현우','백나윤','허준서','유시은','남도현'];

const THEMES = {
  korea: {
    label: '한국사 · 일제 순사', bossName: '일제 순사', sub: '무단 통치의 앞잡이',
    critText: '대한 독립 만세!', rageText: '분노! 순사가 곤봉을 휘두른다', counterText: '호루라기 반격!',
    attackName: '곤봉 내려치기', wrongText: '오답 반격!', healName: '헌병대 지원 요청', enrageText: '광폭화! 공격이 거세진다',
    arrestName: '포승줄 체포', summonName: '헌병 증원', minionName: '헌병', censorName: '신문 검열', checkName: '불심 검문', barricadeName: '바리케이드',
    shots: ['torch', 'ink'], winLine: '반 전체가 힘을 모아 일제 순사를 물리쳤습니다!', loseLine: '순사가 버텨 냈습니다… 다시 도전하세요!'
  },

    critText: '스파르타!', rageText: '분노! 불사 부대가 깨어났다', counterText: '불사 부대 돌격!',
    attackName: '창 투척', wrongText: '오답 반격!', healName: '불사 부대 교대', enrageText: '광폭화! 공격이 거세진다',

  }
};
// 모든 난이도에 공통인 규칙
const RAID_BASE = {
  limitMs: 180000,           // 제한 시간 3분
  // 보스가 한 번에 노리는 학생 비율 (전체 학생 수 기준, 최소 1명): 평소 · 분노(50% 이하) · 광폭화(25% 이하)
  // 예) 20명이면 곤봉 5명 → 10명 → 15명, 호루라기 10명
  attackFrac: [0.25, 0.5, 0.75], whistleFrac: 0.5,
  firstAttackMs: 6000,
  telegraphMs: 1000,         // 공격 전 ⚠ 표시 시간
  whistleStunMs: 3000,
  healAt: [0.6, 0.3], healRepeatMs: 35000,   // 회복 의식: 60%·30% 도달 때, 25% 이하에선 35초마다
  healCastMs: 8000,
  breakStunMs: 4000,         // 회복 의식을 끊으면 보스 기절 (피해 2배)
  // 특수 공격 (체포·불심 검문·신문 검열·바리케이드는 번갈아, 헌병 증원은 체력 75%·40%에서)
  specialFirstMs: 15000,
  arrestMs: 10000,           // 체포: 이 시간 안에 반 전체가 arrestNeed번 공격하면 구출, 못 하면 그 학생 쓰러짐
  checkMs: 5000, checkStunMs: 2500,   // 불심 검문: 지목된 학생이 5초 안에 정답 → 보스 2.5초 기절, 오답·시간 초과 → 목숨 2개
  censorMs: 6000, censorAcc: 0.5,     // 신문 검열: 먹칠당한 학생은 문제가 잘 안 보여 정답률이 떨어진다 (가짜 학생 기준 50%)
  barricadeMs: 4000,         // 바리케이드: 모든 공격을 막는다
  minionAt: [0.75, 0.4], minionShotShare: 0.6, minionBossDmg: 0.5   // 헌병이 있으면 공격 60%가 헌병에게 가고 순사는 피해 절반
};
// 난이도 단계: 실제 게임 코드로 난이도마다 30~40판씩 돌려 맞춘 값 (2026-09-29, 공격 인원 비율 적용 뒤 20명·30명 모두 측정).
// 승률 메모는 '학생마다 약 9초에 한 번 답하는 속도' 기준: [정답률 70% / 82% / 90%] (빠름 = 약 4.5초에 한 번)
//   attackGapMs: 곤봉 공격 간격 [평소 · 분노(50% 이하) · 광폭화(25% 이하)] (공격 인원은 RAID_BASE의 비율), regenPerSec: 초당 최대 체력 대비 회복(광폭화 때 2배)
const DIFFS = [
  { name: '보통', emoji: '😐', color: '#3d8bfd', desc: '대부분 맞히면 이겨요', note: '정답률 80%면 충분',   // 약 20 / 88 / 100%
    p: { hp: 26500, hearts: 6, reviveMs: 6000,  attackGapMs: [9000, 8000, 7000],  whistleGapMs: 13000, regenPerSec: 0.002,  healNeed: 22, healAmount: 0.09,
         specialGapMs: 17000, arrestNeed: 8,  censorCount: 8,  minionHp: 0.06 } },
  { name: '어려움', emoji: '😠', color: '#ffb020', desc: '거의 다 맞혀야 해요', note: '정답률 90%는 되어야',   // 약 0 / 23 / 70%
    p: { hp: 26000, hearts: 5, reviveMs: 8000,  attackGapMs: [8000, 7000, 6000],  whistleGapMs: 12000,  regenPerSec: 0.0022, healNeed: 24, healAmount: 0.10,
         specialGapMs: 15000, arrestNeed: 10, censorCount: 10, minionHp: 0.07 } },
  { name: '매우 어려움', emoji: '🔥', color: '#ff5a4a', desc: '빠르고 정확해야 해요', note: '보통 속도로는 거의 불가능',   // 0 / 0 / 3% · 빠름 82%면 100%
    p: { hp: 30000, hearts: 5, reviveMs: 9000,  attackGapMs: [7000, 6000, 5000],  whistleGapMs: 11000,  regenPerSec: 0.0025, healNeed: 25, healAmount: 0.12,
         specialGapMs: 13000, arrestNeed: 12, censorCount: 12, minionHp: 0.08 } },
  { name: '지옥', emoji: '💀', color: '#b86bff', desc: '빨라도 버티기 힘들어요', note: '도전 과제용',   // 0 / 0 / 0% · 빠름 82% 5% · 빠름 90% 25%
    p: { hp: 40000, hearts: 4, reviveMs: 11000, attackGapMs: [6000, 5000, 4000],  whistleGapMs: 10000,  regenPerSec: 0.0028, healNeed: 28, healAmount: 0.14,
         specialGapMs: 11000, arrestNeed: 14, censorCount: 14, minionHp: 0.09 } }
];
let diffIdx = 0;   // 0 보통 · 1 어려움 · 2 매우 어려움 · 3 지옥
// round.raid_diff는 예전 번호(1 보통 ~ 4 지옥, 0 쉬움은 삭제됨)를 그대로 쓰므로 1을 빼서 DIFFS 순서로 바꾼다
function diffFromRound(r){ return clamp((Number(r.raid_diff ?? 1) || 0) - 1, 0, DIFFS.length - 1); }
let RAID = null;   // reset() 때 RAID_BASE + 고른 난이도로 채운다
const SPEEDS = [
  { label: '보통', mean: 9000 },
  { label: '빠름', mean: 4500 },
  { label: '폭주', mean: 1600 }
];

let themeKey = Q.get('boss') === 'world' ? 'world' : Q.get('boss') === 'korea' ? 'korea' : (ROOM === 'korea' ? 'korea' : 'world'), speedIdx = 0, running = false, soundOn = true;
let FAKE_ACC = 0.82;   // 가짜 학생의 정답률 (시연용)
let S = null;

// ── 유틸 ──────────────────────────────────────────────
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
function expRand(mean){ return -Math.log(1 - Math.random()) * mean; }
function fmtNum(n){ return Math.round(n).toLocaleString('ko-KR'); }
function fmtTime(ms){
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function rr(g, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function paint(g, fill, lw){
  g.fillStyle = fill; g.fill();
  if(lw !== 0){ g.lineWidth = lw || 7; g.strokeStyle = OUT; g.lineJoin = 'round'; g.stroke(); }
}
function outlinedText(g, txt, x, y, size, fill, stroke, lw){
  g.font = `900 ${size}px ${FONT}`;
  g.lineJoin = 'round';
  g.lineWidth = lw || Math.max(4, size / 7);
  g.strokeStyle = stroke || OUT;
  g.strokeText(txt, x, y);
  g.fillStyle = fill;
  g.fillText(txt, x, y);
}

// ── 효과음 (파일 없이 브라우저에서 합성) ─────────────────
let AC = null, master = null, noiseBuf = null;
const lastSfx = {};
function audio(){
  if(!AC){
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return null;
    AC = new Ctor();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(type, f0, f1, dur, vol, when){
  const a = AC, t = a.currentTime + (when || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
  return o;
}
function noise(dur, vol, filterType, f0, f1, when){
  const a = AC, t = a.currentTime + (when || 0);
  const s = a.createBufferSource(); s.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = filterType; f.frequency.setValueAtTime(f0, t);
  f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t, Math.random()); s.stop(t + dur + 0.02);
}
function sfx(kind){
  if(!soundOn || !audio()) return;
  const now = performance.now();
  const gap = { hit: 55, crit: 90, explode: 120, ouch: 70, ko: 150, warn: 200, block: 60 }[kind] || 0;
  if(gap && now - (lastSfx[kind] || 0) < gap) return;   // 한꺼번에 많이 맞아도 소리가 뭉개지지 않게
  lastSfx[kind] = now;
  switch(kind){
    case 'hit':
      noise(0.09, 0.35, 'bandpass', 1800, 600);
      tone('sine', 160, 55, 0.12, 0.35);
      break;
    case 'crit':
      tone('sawtooth', 900, 120, 0.35, 0.18);
      noise(0.45, 0.5, 'highpass', 3000, 400);
      tone('sine', 90, 35, 0.4, 0.5);
      break;
    case 'roar':
      if(themeKey === 'korea'){ tone('sawtooth', 140, 70, 1.1, 0.25); noise(0.9, 0.25, 'lowpass', 900, 150); }
      else { tone('sawtooth', 110, 55, 1.3, 0.28); tone('square', 55, 40, 1.3, 0.12); }
      break;
    case 'counter':
      if(themeKey === 'korea'){
        // 호루라기: 높은 음을 빠르게 떨리게
        for(let i = 0; i < 9; i++) tone('sine', i % 2 ? 2650 : 2950, i % 2 ? 2600 : 2900, 0.06, 0.18, i * 0.06);
      } else {
        tone('sawtooth', 196, 190, 0.5, 0.2); tone('sawtooth', 294, 290, 0.5, 0.14, 0.05);
      }
      tone('sine', 70, 30, 0.5, 0.5, 0.35);
      noise(0.6, 0.35, 'lowpass', 1500, 100, 0.35);
      break;
    case 'drop':
      tone('sine', 110, 30, 0.6, 0.7);
      noise(0.5, 0.35, 'lowpass', 800, 80);
      break;
    case 'explode':
      noise(0.8, 0.6, 'lowpass', 2500, 80);
      tone('sine', 80, 25, 0.7, 0.5);
      break;
    case 'warn':      // 보스 공격 예고
      tone('square', 880, 880, 0.08, 0.08); tone('square', 660, 660, 0.08, 0.08, 0.11);
      break;
    case 'ouch':      // 학생이 맞음
      tone('square', 330, 140, 0.14, 0.12);
      noise(0.08, 0.2, 'bandpass', 900, 400);
      break;
    case 'ko':        // 학생이 쓰러짐
      tone('triangle', 440, 110, 0.5, 0.2);
      tone('sine', 120, 40, 0.4, 0.3, 0.1);
      break;
    case 'cast':      // 회복 의식 시작
      [392, 523, 659].forEach((f, i) => tone('sine', f, f * 1.01, 0.5, 0.12, i * 0.12));
      break;
    case 'break':     // 회복 의식 끊음
      noise(0.5, 0.5, 'highpass', 4000, 600);
      tone('sawtooth', 700, 90, 0.5, 0.2);
      break;
    case 'heal':      // 보스 큰 회복
      [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, f, 0.35, 0.12, i * 0.08));
      break;
    case 'rope':      // 포승줄 휘두르기
      noise(0.5, 0.35, 'bandpass', 600, 2400);
      tone('sine', 300, 700, 0.4, 0.08);
      break;
    case 'check':     // 불심 검문 호루라기 두 번
      tone('sine', 2900, 2850, 0.12, 0.18); tone('sine', 2900, 2850, 0.3, 0.18, 0.18);
      break;
    case 'censor':    // 쾅! 도장 + 종이
      tone('sine', 120, 50, 0.25, 0.5);
      noise(0.6, 0.25, 'highpass', 2500, 800, 0.05);
      break;
    case 'barricade': // 나무 기둥이 쿵쿵
      tone('sine', 140, 60, 0.2, 0.5); tone('sine', 120, 50, 0.2, 0.5, 0.15);
      noise(0.3, 0.3, 'lowpass', 900, 200);
      break;
    case 'block':     // 공격이 막힘
      tone('square', 1400, 900, 0.05, 0.06);
      break;
    case 'summon':    // 헌병 증원: 호루라기 + 발소리
      tone('sine', 2700, 2700, 0.5, 0.15);
      for(let i = 0; i < 4; i++) tone('sine', 110, 60, 0.12, 0.35, 0.5 + i * 0.18);
      break;
    case 'lose': {
      const notes = [392, 349, 311, 262];
      notes.forEach((f, i) => tone('triangle', f, f * 0.98, i === notes.length - 1 ? 1.2 : 0.35, 0.18, i * 0.35));
      tone('sine', 80, 40, 1.5, 0.3, 1.05);
      break;
    }
    case 'win': {
      const notes = [523, 659, 784, 1047, 784, 1047];
      notes.forEach((f, i) => tone('square', f, f, i === notes.length - 1 ? 0.8 : 0.16, 0.12, i * 0.14));
      tone('triangle', 262, 262, 1.2, 0.18, 0.7);
      break;
    }
  }
}

// ── 배경 (한 번만 만들어 두는 건물 실루엣) ─────────────────
function seeded(seed){ return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
const CITY = (() => {
  const r = seeded(7), arr = [];
  let x = -20;
  while(x < W + 40){
    const w = 70 + r() * 110, h = 90 + r() * 200;
    const wins = [];
    for(let wy = 20; wy < h - 20; wy += 34) for(let wx = 14; wx < w - 20; wx += 30) if(r() < 0.35) wins.push([wx, wy]);
    arr.push({ x, w, h, wins });
    x += w + 6;
  }
  return arr;
})();
const COLUMNS = (() => {
  const r = seeded(11), arr = [];
  for(let i = 0; i < 14; i++) arr.push({ x: 60 + i * 140 + r() * 30, h: 240 + r() * 120, broken: r() < 0.3 });
  return arr;
})();
const STARS = (() => { const r = seeded(3), a = []; for(let i = 0; i < 90; i++) a.push([r() * W, r() * 480, r()]); return a; })();

function drawBackground(g){
  const t = S.clock / 1000;
  if(themeKey === 'korea'){
    const sky = ctx.createLinearGradient(0, 0, 0, 820);
    sky.addColorStop(0, '#0f1030'); sky.addColorStop(0.55, '#2b2250'); sky.addColorStop(1, '#6a3a3e');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    for(const [x, y, p] of STARS){ ctx.globalAlpha = 0.25 + 0.5 * Math.abs(Math.sin(t * 0.8 + p * 9)); ctx.fillStyle = '#fff'; ctx.fillRect(x, y, 2, 2); }
    ctx.globalAlpha = 1;
    // 둥근 지붕 건물(경성 거리 느낌)과 시가지 실루엣
    ctx.fillStyle = '#1a1530';
    ctx.fillRect(1260, 520, 420, 300);
    ctx.beginPath(); ctx.arc(1470, 520, 110, Math.PI, 0); ctx.fill();
    ctx.fillRect(1462, 360, 16, 60);
    ctx.fillStyle = '#231c3d';
    for(const b of CITY){
      ctx.fillRect(b.x, 820 - b.h, b.w, b.h);
    }
    ctx.fillStyle = 'rgba(255,208,120,.55)';
    for(const b of CITY) for(const [wx, wy] of b.wins) ctx.fillRect(b.x + wx, 820 - b.h + wy, 12, 16);
    const ground = ctx.createLinearGradient(0, 820, 0, H);
    ground.addColorStop(0, '#3a2c2a'); ground.addColorStop(1, '#16110f');
    ctx.fillStyle = ground; ctx.fillRect(0, 820, W, H - 820);
    ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 2;
    for(let i = -10; i <= 10; i++){ ctx.beginPath(); ctx.moveTo(960 + i * 60, 820); ctx.lineTo(960 + i * 260, H); ctx.stroke(); }
  } else {
    const sky = ctx.createLinearGradient(0, 0, 0, 820);
    sky.addColorStop(0, '#3a1d4a'); sky.addColorStop(0.5, '#b8563a'); sky.addColorStop(1, '#f2b25a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    sun.addColorStop(0, 'rgba(255,240,200,.95)'); sun.addColorStop(0.35, 'rgba(255,200,120,.6)'); sun.addColorStop(1, 'rgba(255,160,80,0)');
    ctx.fillStyle = sun; ctx.fillRect(600, 300, 720, 700);
    // 페르세폴리스 기둥 실루엣
    ctx.fillStyle = '#4a2530';
    for(const c of COLUMNS){
      const top = 820 - c.h * (c.broken ? 0.6 : 1);
      ctx.fillRect(c.x, top, 30, 820 - top);
      if(!c.broken){ ctx.fillRect(c.x - 16, top - 26, 62, 26); ctx.fillRect(c.x - 6, top - 44, 42, 18); }
    }
    ctx.fillRect(0, 800, W, 20);
    const ground = ctx.createLinearGradient(0, 820, 0, H);
    ground.addColorStop(0, '#b0773f'); ground.addColorStop(1, '#5a3620');
    ctx.fillStyle = ground; ctx.fillRect(0, 820, W, H - 820);
    ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.lineWidth = 3;
    for(let i = 0; i < 6; i++){ ctx.beginPath(); ctx.moveTo(0, 860 + i * 40); ctx.bezierCurveTo(600, 840 + i * 44, 1300, 880 + i * 38, W, 850 + i * 42); ctx.stroke(); }
  }
  // 분노 상태: 붉은 테두리가 맥박처럼
  if(S.rage && S.phase !== 'victory'){

}

// ── 보스 그리기 (발 가운데가 (350, 740)) ─────────────────
function limb(g, sx, sy, angle, len, width, color, handColor, handR, extra){
  g.save();
  g.translate(sx, sy); g.rotate(angle);
  rr(g, -width / 2, -width / 2, width, len + width / 2, width / 2); paint(g, color);
  if(extra) extra(g, len);
  g.beginPath(); g.arc(0, len, handR, 0, Math.PI * 2); paint(g, handColor);
  g.restore();
}

// 반격 동작: 들어 올린 팔을 더 뒤로 젖혔다가(준비) 앞으로 크게 내려친다
function swingAngle(p, base){
  if(p < 0.35) return lerp(base, base + 0.5, p / 0.35);
  if(p < 0.5) return lerp(base + 0.5, -0.5, (p - 0.35) / 0.15);
  return lerp(-0.5, base, easeOut((p - 0.5) / 0.5));
}

// 한국사 보스 그림 고르기 (위에서부터 우선)
//   쓰러짐: 격파 연출 후반·승리 화면 / 맞음: 격파 폭발 중·치명타 직후·기절 / 공격 동작: 호루라기·곤봉 휘두르기
//   크게 다침: 체력 25% 이하 / 분노: 50% 이하·실패 화면 / 그 외: 평소
function policePose(){
  if(S.phase === 'victory' || (S.phase === 'dying' && S.dyingT >= 2.2)) return 'down';
  if(S.phase === 'lose') return 'rage';
  if(S.phase === 'dying' || S.hitPose > 0 || bossStunned()) return 'hit';
  if(S.poseUntil > S.clock && S.poseKind) return S.poseKind;
  if(S.hp <= S.max * 0.25) return 'hurt';
  if(S.rage) return 'rage';
  return 'idle';
}
// 공격 동작 그림을 잠깐 보여 준다
function showPose(kind, ms){ S.poseKind = kind; S.poseUntil = S.clock + ms; }
function useSprite(){ return themeKey === 'korea' && spritesReady(); }

// 보스를 따로 그린 뒤 번쩍임·분노 색을 입히고, 본 화면에 붙일 캔버스와 발끝 기준점을 돌려준다
function renderBoss(){
  const sprite = useSprite();
  const g = sprite ? sctx : octx, cvs = sprite ? sprOff : off;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, cvs.width, cvs.height);
  if(sprite){
    g.drawImage(POLICE[policePose()], 0, 0, SPRITE_W, SPRITE_H);
  } else {
    // 그림 파일을 아직 못 불러왔거나 세계사 보스일 때는 코드로 그린 캐릭터
    const p = { t: S.clock / 1000, rage: S.rage, attack: S.attack };
    if(themeKey === 'korea') drawPolice(g, p); else drawKing(g, p);
  }
  // 맞은 순간 하얗게 번쩍, 분노 땐 붉은 기운, 쓰러질 땐 점점 하얗게
  let white = S.bossFlash;
  if(S.phase === 'dying' && S.dyingT < 2.2) white = Math.max(white, 0.25 + 0.35 * Math.abs(Math.sin(S.clock / 60)));
  g.globalCompositeOperation = 'source-atop';
  if(S.rage && S.phase === 'fight'){ g.fillStyle = `rgba(255,30,20,${0.1 + 0.06 * Math.sin(S.clock / 120)})`; g.fillRect(0, 0, cvs.width, cvs.height); }
  if(white > 0){ g.fillStyle = `rgba(255,255,255,${clamp(white, 0, 1) * 0.85})`; g.fillRect(0, 0, cvs.width, cvs.height); }
  g.globalCompositeOperation = 'source-over';
  return sprite ? { cvs, ax: SPRITE_FEET_X, ay: SPRITE_FEET_Y } : { cvs, ax: 350, ay: 740 };
}

// ── 게임 상태 ─────────────────────────────────────────
const BOSS_X = 960, BOSS_FEET = 1010;
const TAG_W = 270;
let TAG_H = 48;
function tagPos(i, n){
  const perSide = Math.max(1, Math.ceil(n / 2));
  const rowH = Math.min(57, 860 / perSide);
  const left = i < perSide, row = left ? i : i - perSide;
  return { tx: left ? 28 : W - 28 - TAG_W, ty: 138 + row * rowH, left };
}
function layoutTags(){
  const n = S.students.length;
  TAG_H = Math.round(Math.min(48, Math.min(57, 860 / Math.max(1, Math.ceil(n / 2))) - 8));
  S.students.forEach((st, i) => Object.assign(st, tagPos(i, n)));
}
function newStudent(name, i, pid){
  return { pid: pid || null, name, i, dmg: 0, correct: 0, streak: 0, next: 0, flash: 0, flashColor: '', stunUntil: 0, wrongT: 0,
    hearts: RAID.hearts, koUntil: 0, targetUntil: 0, hurtT: 0, kos: 0, tx: 0, ty: 0, left: true };
}
function anchor(st){ return { x: st.left ? st.tx + TAG_W : st.tx, y: st.ty + TAG_H / 2 }; }

function reset(){
  RAID = Object.assign({}, RAID_BASE, DIFFS[diffIdx].p);
  S = {
    clock: 0, phase: 'ready', introT: 0, landed: false,
    hp: RAID.hp, ghost: RAID.hp, max: RAID.hp,
    rage: false, enrage: false, counterAt: 0, attack: 0, hitPose: 0,
    attackAt: 0, poseKind: '', poseUntil: 0, fallen: false, regenAcc: 0, regenShowAt: 0, healFlash: 0,
    cast: null, healsDone: [], nextHealAt: 0, bossStunUntil: 0,
    specialAt: 0, lastSpecial: '', arrest: null, checkpoint: null, censor: null, barricadeUntil: 0, barricadeStart: 0,
    minions: [], minionWaves: [],
    students: [],
    shots: [], parts: [], texts: [], rings: [], bolts: [], banner: null, timers: [],
    shake: 0, bossFlash: 0, knock: 0, squash: 0, bossY: -900, bossRot: 0, bossAlpha: 1,
    combo: 0, comboT: -9999, comboPop: 0,
    correct: 0, wrong: 0, lastHitter: null, fightStart: 0, endClock: 0, dyingT: 0, nextBoom: 0,
    loseReason: '', result: ''
  };
  if(LIVE) syncStudents();
  else {
    for(let i = 0; i < SIM_N; i++) S.students.push(newStudent(NAMES[i % NAMES.length] + (i >= NAMES.length ? (Math.floor(i / NAMES.length) + 1) : ''), i));
    layoutTags();
  }
  running = false;
  updateButtons();
}

function scaleForClass(){
  const k = clamp(S.students.length / 30, 0.2, 1.4);
  RAID.hp = Math.max(3000, Math.round(RAID.hp * k / 100) * 100);
  RAID.arrestNeed = Math.max(3, Math.round(RAID.arrestNeed * k));
  RAID.healNeed = Math.max(5, Math.round(RAID.healNeed * k));
  RAID.censorCount = Math.max(1, Math.round(RAID.censorCount * k));
  S.hp = S.max = S.ghost = RAID.hp;
}
function startFight(){
  scaleForClass();
  S.phase = 'fight'; S.fightStart = S.clock;
  S.serverBase = serverNow() - S.clock;   // 게임 시계 → 서버 시각 변환용
  S.attackAt = S.clock + RAID.firstAttackMs;
  S.regenShowAt = S.clock + 1000;   // 회복 숫자는 1초 분량씩 모아서 보여 준다
  S.specialAt = S.clock + RAID.specialFirstMs;
  const mean = SPEEDS[speedIdx].mean;
  for(const st of S.students) st.next = S.clock + rand(200, mean);
}

const isKo = st => st.koUntil > S.clock;
const isArrested = st => !!(S.arrest && S.arrest.st === st);
const canAct = st => !isKo(st) && st.stunUntil <= S.clock && !isArrested(st);
const barricadeUp = () => S.barricadeUntil > S.clock;
const minionsAlive = () => S.minions.some(m => !m.dead);
const bossStunned = () => S.bossStunUntil > S.clock;

function answer(st, ok, sec){
  const T = THEMES[themeKey];
  const checked = !!(S.checkpoint && S.checkpoint.st === st);
  if(!ok){      // 오답: 공격하지 못하고, 보스가 곧바로 그 학생을 반격한다
    st.streak = 0; S.wrong++;
    st.flash = 1; st.flashColor = '#e0483c'; st.wrongT = 1;
    if(checked){ failCheckpoint(); return; }
    if(!bossStunned()){ bossStrike(st, 0.35, T.wrongText); if(!(S.poseUntil > S.clock)) showPose('swing', 450); }
    return;
  }
  if(checked) passCheckpoint();
  st.streak++; st.correct++; S.correct++;
  const crit = Math.random() < 0.08 || st.streak % 5 === 0;   // 5연속 정답마다 치명타
  const speed = sec < 5 ? 1.2 : sec < 10 ? 1 : 0.85;   // 빨리 맞힐수록 세게
  const dmg = Math.round(rand(90, 130) * speed * (1 + Math.min(st.streak, 10) * 0.05) * (crit ? 2.6 : 1));
  const a = anchor(st);
  const minion = pickMinionTarget(st);     // 헌병이 있으면 공격 대부분이 헌병에게 막힌다
  const to = minion ? { x: minion.x + rand(-45, 45), y: BOSS_FEET - rand(170, 380) } : { x: BOSS_X + rand(-120, 120), y: BOSS_FEET - rand(260, 520) };
  const type = crit ? 'crit' : T.shots[randi(0, T.shots.length - 1)];
  S.shots.push({ type, x0: a.x, y0: a.y, x1: to.x, y1: to.y, cx: (a.x + to.x) / 2, cy: Math.min(a.y, to.y) - rand(120, 260), t: 0, dur: crit ? 0.42 : rand(0.45, 0.6), st, dmg, crit, trail: 0, minion });
  st.flash = 1; st.flashColor = crit ? '#ffd23f' : '#48d17a';
}

function impact(sh){
  const T = THEMES[themeKey];
  if(S.phase !== 'fight') return;
  const x = sh.x1, y = sh.y1, st = sh.st;
  if(sh.minion && !sh.minion.dead){ hitMinion(sh); return; }
  if(barricadeUp()){
    // 바리케이드에 막힘: 피해 없음
    S.texts.push({ x: x + rand(-50, 50), y: y - 10, txt: '막힘!', block: true, t: 0 });
    burst(x, y, 'block', 10, st.left ? -1 : 1);
    sfx('block');
    return;
  }
  const weak = bossStunned();                 // 회복 의식·검문으로 기절한 동안엔 피해 2배
  const guarded = minionsAlive();             // 헌병이 지키는 동안엔 피해 절반
  const dmg = Math.round(sh.dmg * (weak ? 2 : 1) * (guarded ? RAID.minionBossDmg : 1));
  S.hp = Math.max(0, S.hp - dmg);
  st.dmg += dmg; S.lastHitter = st;
  const dir = st.left ? 1 : -1;
  S.bossFlash = sh.crit ? 1 : 0.7;
  S.knock += dir * (sh.crit ? 30 : 9);
  S.squash = sh.crit ? 1 : 0.45;
  S.shake = Math.max(S.shake, sh.crit ? 24 : 7);
  if(S.clock - S.comboT < 1600) S.combo++; else S.combo = 1;
  S.comboT = S.clock; S.comboPop = 1;
  S.texts.push({ x: x + rand(-70, 70), y: y - 20 + rand(-30, 30), txt: fmtNum(dmg) + (weak ? '!' : '') + (guarded ? ' ½' : ''), crit: sh.crit, t: 0 });
  burst(x, y, sh.type, sh.crit ? 46 : 16, dir);
  S.rings.push({ x, y, t: 0, life: sh.crit ? 0.5 : 0.3, r: sh.crit ? 190 : 70, color: sh.crit ? '#ffe98a' : 'rgba(255,255,255,.9)', w: sh.crit ? 10 : 5 });
  if(sh.crit){
    S.hitPose = 0.4;   // 치명타를 맞으면 잠깐 휘청이는 그림으로
    S.bolts.push({ x, y, t: 0, pts: boltPath(x + rand(-80, 80), -20, x, y) });
    if(!S.cast) S.banner = { txt: T.critText, sub: st.name + ' 치명타!', t: 0, life: 1.4, color: '#ffe14d' };
    sfx('crit');
  } else sfx('hit');
  // 회복 의식 끊기
  if(S.cast){
    S.cast.got++;
    if(S.cast.got >= S.cast.need) breakCast();
  }
  rescueProgress();
  if(!S.rage && S.hp <= S.max / 2) enterRage();
  if(!S.enrage && S.hp <= S.max * 0.25) enterEnrage();
  checkHealTrigger();
  checkMinionTrigger();
  if(S.hp <= 0) startDying();
}

function burst(x, y, type, n, dir){
  const pal = {
    torch: ['#fff2a8', '#ffd166', '#ff8c42', '#ff4d2e'],
    ink: ['#10142c', '#23306e', '#3b4db0', '#e8ecff'],
    arrow: ['#f2d27a', '#c9a15a', '#8a5a2b', '#fff'],
    spear: ['#e0e6f0', '#a9b3c4', '#f2d27a', '#fff'],
    crit: ['#fff', '#fff3a0', '#ffd23f', '#7fd8ff'],
    boss: ['#ff3b30', '#b3121f', '#ff8a65', '#2a0a0a'],
    heal: ['#7dffb0', '#3ee07a', '#c8ffe0', '#fff'],
    block: ['#a0d4ff', '#e0f0ff', '#8a5a2b', '#fff'],
    rope: ['#c9a36a', '#8a5a2b', '#e8d3a8'],
    paper: ['#f2ecd8', '#d8d0b8', '#222']
  }[type] || ['#fff'];
  for(let i = 0; i < n; i++){
    const ang = rand(0, Math.PI * 2), sp = rand(180, type === 'crit' ? 900 : 600);
    S.parts.push({ x, y, vx: Math.cos(ang) * sp + dir * 120, vy: Math.sin(ang) * sp - 120, life: rand(0.3, 0.7), t: 0, size: rand(4, type === 'crit' ? 12 : 9), color: pal[randi(0, pal.length - 1)], g: 900, kind: Math.random() < 0.5 ? 'spark' : 'dot' });
  }
}
function boltPath(x0, y0, x1, y1){
  const pts = [[x0, y0]], n = 12;
  for(let i = 1; i < n; i++){ const t = i / n; pts.push([lerp(x0, x1, t) + rand(-45, 45), lerp(y0, y1, t)]); }
  pts.push([x1, y1]);
  return pts;
}

// ── 보스의 공격 ─────────────────────────────────────
// 보스 손에서 학생 이름표로 날아가는 공격. 맞으면 목숨 1개가 줄고, 다 잃으면 쓰러진다.
function bossStrike(st, dur, label, stunMs){
  const hand = { x: BOSS_X + (st.left ? -150 : 150), y: BOSS_FEET - 420 };
  const a = anchor(st);
  S.shots.push({ type: 'boss', enemy: true, x0: hand.x, y0: hand.y, x1: a.x, y1: a.y, cx: (hand.x + a.x) / 2, cy: Math.min(hand.y, a.y) - rand(80, 200), t: 0, dur, st, label, stunMs: stunMs || 0, trail: 0 });
}
function hurtStudent(sh){
  const st = sh.st;
  if(S.phase !== 'fight' || isKo(st)) return;
  const a = anchor(st);
  st.hearts--; st.hurtT = 1; st.streak = 0;
  st.flash = 1; st.flashColor = '#ff2d2d';
  if(sh.stunMs) st.stunUntil = Math.max(st.stunUntil, S.clock + sh.stunMs);
  burst(a.x, a.y, 'boss', 18, st.left ? -1 : 1);
  S.rings.push({ x: a.x, y: a.y, t: 0, life: 0.35, r: 80, color: 'rgba(255,60,50,.9)', w: 8 });
  S.shake = Math.max(S.shake, 8);
  const tx = a.x + (st.left ? 90 : -90);
  if(st.hearts <= 0){
    st.koUntil = S.clock + RAID.reviveMs; st.kos++;
    st.hearts = 0; st.stunUntil = 0;
    S.texts.push({ x: tx, y: a.y, txt: '💀 쓰러짐', stun: true, t: 0 });
    sfx('ko');
    const alive = S.students.filter(s => !isKo(s)).length;
    if(alive === 0) startLose('전원 쓰러짐');
  } else {
    S.texts.push({ x: tx, y: a.y, txt: (sh.label ? sh.label + ' ' : '') + '-1 ❤', stun: true, t: 0 });
    sfx('ouch');
  }
}
// 평소 공격: 목표를 ⚠로 1초 먼저 알려 준 뒤 내려친다
function basicAttack(){
  const T = THEMES[themeKey];
  const lvl = S.enrage ? 2 : S.rage ? 1 : 0;
  const pool = S.students.filter(s => !isKo(s));
  const targets = [];
  const count = Math.max(1, Math.round(S.students.length * RAID.attackFrac[lvl]));
  for(let k = 0; k < count && pool.length; k++) targets.push(pool.splice(randi(0, pool.length - 1), 1)[0]);
  for(const st of targets) st.targetUntil = S.clock + RAID.telegraphMs;
  sfx('warn');
  S.timers.push({ at: S.clock + RAID.telegraphMs, fn: () => {
    if(S.phase !== 'fight' || bossStunned()) return;
    S.attack = 0.55;
    showPose('swing', 650);   // 곤봉 휘두르기
    for(const st of targets) bossStrike(st, 0.4, T.attackName);
  }});
  S.attackAt = S.clock + RAID.attackGapMs[lvl];
}

function enterRage(){
  const T = THEMES[themeKey];
  S.rage = true;
  S.banner = { txt: T.rageText, sub: '체력 50% 이하 · 호루라기 반격으로 여러 명이 기절합니다!', t: 0, life: 2.2, color: '#ff5a4a', red: true };
  S.shake = Math.max(S.shake, 30);
  S.counterAt = S.clock + 4000;
  for(let i = 0; i < 40; i++) S.parts.push({ x: BOSS_X + rand(-200, 200), y: BOSS_FEET - rand(0, 500), vx: rand(-60, 60), vy: rand(-420, -160), life: rand(0.8, 1.6), t: 0, size: rand(4, 10), color: Math.random() < 0.5 ? '#ff4d2e' : '#ffb347', g: -50, kind: 'dot' });
  sfx('roar');
}
function enterEnrage(){
  const T = THEMES[themeKey];
  S.enrage = true;
  S.banner = { txt: T.enrageText, sub: '체력 25% 이하 · 회복 속도 2배 · 더 자주, 더 많이 공격합니다', t: 0, life: 2.2, color: '#ff3b30', red: true };
  S.shake = Math.max(S.shake, 36);
  S.nextHealAt = S.clock + RAID.healRepeatMs;
  sfx('roar');
}

// 분노 광역기: 호루라기로 여러 명을 한꺼번에 기절시키고 목숨도 깎는다
function counterAttack(){
  const T = THEMES[themeKey];
  S.attack = 1;
  showPose('whistle', 1300);   // 호루라기 불기
  sfx('counter');
  S.timers.push({ at: S.clock + 380, fn: () => {
    if(S.phase !== 'fight' || bossStunned()) return;
    S.shake = Math.max(S.shake, 34);
    S.rings.push({ x: BOSS_X, y: BOSS_FEET - 260, t: 0, life: 0.8, r: 1300, color: 'rgba(255,70,50,.9)', w: 26 });
    S.rings.push({ x: BOSS_X, y: BOSS_FEET - 260, t: -0.12, life: 0.8, r: 1100, color: 'rgba(255,200,120,.7)', w: 12 });
    const pool = S.students.filter(s => !isKo(s));
    const n = Math.min(Math.max(1, Math.round(S.students.length * RAID.whistleFrac)), pool.length);
    for(let k = 0; k < n; k++){
      const st = pool.splice(randi(0, pool.length - 1), 1)[0];
      hurtStudent({ st, label: '😵 기절!', stunMs: RAID.whistleStunMs });
    }
    S.banner = { txt: T.counterText, sub: `${n}명이 ${RAID.whistleStunMs / 1000}초 동안 기절했습니다`, t: 0, life: 1.6, color: '#ff7a5a', red: true };
  }});
  S.counterAt = S.clock + RAID.whistleGapMs;
}

// ── 특수 공격 ───────────────────────────────────────
function doSpecial(){
  const pool = [];
  if(!S.checkpoint) pool.push('check');
  if(!barricadeUp()) pool.push('barricade');
  if(!S.censor) pool.push('censor');
  if(S.rage && !S.arrest) pool.push('arrest', 'arrest');   // 분노 뒤엔 체포가 더 자주
  const choices = pool.filter(k => k !== S.lastSpecial);
  const list = choices.length ? choices : pool;
  if(!list.length) return;
  const k = list[randi(0, list.length - 1)];
  S.lastSpecial = k;
  if(k === 'check') startCheckpoint();
  else if(k === 'barricade') startBarricade();
  else if(k === 'censor') startCensor();
  else startArrest();
}
function pickStudent(){
  const pool = S.students.filter(s => canAct(s) && !(S.checkpoint && S.checkpoint.st === s));
  return pool.length ? pool[randi(0, pool.length - 1)] : null;
}

// 🔗 체포: 포승줄을 던져 한 명을 묶는다. 반 전체가 정해진 횟수만큼 공격하면 구출.
function startArrest(){
  const st = pickStudent();
  if(!st) return;
  showPose('rope', 1100);
  sfx('rope');
  const hand = { x: BOSS_X - 260, y: BOSS_FEET - 560 };
  const a = anchor(st);
  S.shots.push({ type: 'rope', enemy: true, onHit: 'arrest', x0: hand.x, y0: hand.y, x1: a.x, y1: a.y, cx: (hand.x + a.x) / 2, cy: Math.min(hand.y, a.y) - 220, t: 0, dur: 0.6, st, trail: 0 });
}
function bindStudent(st){
  const T = THEMES[themeKey];
  if(S.phase !== 'fight' || isKo(st) || S.arrest) return;
  S.arrest = { st, got: 0, need: RAID.arrestNeed, start: S.clock, end: S.clock + RAID.arrestMs };
  st.flash = 1; st.flashColor = '#8a5a2b'; st.hurtT = 1; st.streak = 0;
  const a = anchor(st);
  burst(a.x, a.y, 'rope', 20, st.left ? -1 : 1);
  S.banner = { txt: '🔗 ' + T.arrestName + '!', sub: `${st.name} 체포 · ${RAID.arrestMs / 1000}초 안에 반 전체가 ${RAID.arrestNeed}번 공격하면 구출!`, t: 0, life: 2, color: '#e8b57a', red: true };
  S.shake = Math.max(S.shake, 14);
}
function rescueProgress(){
  if(!S.arrest) return;
  S.arrest.got++;
  if(S.arrest.got >= S.arrest.need) freeArrest(true);
}
function freeArrest(ok){
  const st = S.arrest.st;
  S.arrest = null;
  const a = anchor(st), tx = a.x + (st.left ? 90 : -90);
  if(ok){
    st.flash = 1; st.flashColor = '#48d17a';
    burst(a.x, a.y, 'rope', 24, st.left ? 1 : -1);
    S.texts.push({ x: tx, y: a.y, txt: '구출!', stun: true, revive: true, t: 0 });
    S.banner = { txt: '구출 성공!', sub: st.name + ' 학생이 풀려났습니다', t: 0, life: 1.4, color: '#6dff9e' };
    sfx('break');
  } else {
    st.koUntil = S.clock + RAID.reviveMs; st.kos++; st.hearts = 0; st.stunUntil = 0;
    S.texts.push({ x: tx, y: a.y, txt: '💀 연행됨', stun: true, t: 0 });
    S.banner = { txt: '구출 실패…', sub: st.name + ' 학생이 끌려갔습니다', t: 0, life: 1.4, color: '#ff8a80', red: true };
    sfx('ko');
    if(!S.students.some(s => !isKo(s))) startLose('전원 쓰러짐');
  }
}

// 📋 불심 검문: 한 명을 지목. 정해진 시간 안에 정답 → 보스 기절, 오답·시간 초과 → 목숨 2개
function startCheckpoint(){
  const T = THEMES[themeKey];
  const st = pickStudent();
  if(!st) return;
  S.checkpoint = { st, start: S.clock, end: S.clock + RAID.checkMs };
  showPose('whistle', 900);
  sfx('check');
  // 가짜 학생: 지목되면 서둘러 답한다 (가끔은 시간을 넘긴다)
  if(!LIVE) st.next = S.clock + rand(700, RAID.checkMs + 1500);
  S.banner = { txt: '📋 ' + T.checkName + '!', sub: `${st.name}, ${RAID.checkMs / 1000}초 안에 정답을 내라! (성공하면 보스 기절)`, t: 0, life: 1.8, color: '#ffe14d', red: true };
}
function passCheckpoint(){
  const st = S.checkpoint.st;
  S.checkpoint = null;
  S.bossStunUntil = Math.max(S.bossStunUntil, S.clock + RAID.checkStunMs);
  S.hitPose = 0.5;
  S.banner = { txt: '검문 통과!', sub: `${st.name} 덕분에 보스 ${RAID.checkStunMs / 1000}초 기절 · 받는 피해 2배`, t: 0, life: 1.6, color: '#6dff9e' };
  sfx('break');
}
function failCheckpoint(){
  const st = S.checkpoint.st;
  S.checkpoint = null;
  hurtStudent({ st, label: '검문 실패' });
  if(!isKo(st)) hurtStudent({ st, label: '검문 실패' });
}

// 📰 신문 검열: 여러 학생의 문제 화면을 먹칠해 정답률을 떨어뜨린다
function startCensor(){
  const T = THEMES[themeKey];
  const pool = S.students.filter(s => !isKo(s));
  const set = new Set();
  while(set.size < Math.min(RAID.censorCount, pool.length)) set.add(pool[randi(0, pool.length - 1)]);
  S.censor = { set, start: S.clock, end: S.clock + RAID.censorMs };
  showPose('rage', 700);
  sfx('censor');

  S.banner = { txt: '📰 ' + T.censorName + '!', sub: `${set.size}명의 문제가 ${RAID.censorMs / 1000}초 동안 먹칠됩니다 · 침착하게 읽으세요`, t: 0, life: 1.8, color: '#dcd3b8', red: true };
}

// 🚧 바리케이드: 잠깐 모든 공격을 막는다
function startBarricade(){

}

// 👮 헌병 증원: 체력 75%·40%에서 부하 둘을 부른다. 살아 있는 동안 공격 대부분이 부하에게 가고 보스는 피해 절반
function checkMinionTrigger(){
  if(minionsAlive() || S.phase !== 'fight') return;
  for(const th of RAID.minionAt){
    if(S.hp / S.max <= th && !S.minionWaves.includes(th)){ S.minionWaves.push(th); summonMinions(); return; }
  }
}
function summonMinions(){
  const T = THEMES[themeKey];
  const hp = Math.round(S.max * RAID.minionHp);
  S.minions = [-1, 1].map(side => ({ side, x: BOSS_X + side * 470, hp, max: hp, flash: 0, knock: 0, dead: false, deadT: 0, spawnT: 0 }));
  showPose('whistle', 1200);
  sfx('summon');
  S.shake = Math.max(S.shake, 22);
  for(const m of S.minions) for(let i = 0; i < 30; i++) S.parts.push({ x: m.x + rand(-120, 120), y: BOSS_FEET - rand(0, 60), vx: rand(-200, 200), vy: rand(-260, -40), life: rand(0.6, 1.2), t: 0, size: rand(10, 22), color: 'rgba(200,200,210,.7)', g: -40, kind: 'dot' });
  S.banner = { txt: '👮 ' + T.summonName + '!', sub: `${T.minionName}가 있는 동안 ${T.bossName}는 피해 절반 · 먼저 쓰러뜨려라!`, t: 0, life: 2, color: '#9fc4ff', red: true };
}
function pickMinionTarget(st){
  const alive = S.minions.filter(m => !m.dead);
  if(!alive.length || Math.random() >= RAID.minionShotShare) return null;
  return alive.find(m => (m.side < 0) === st.left) || alive[0];
}
function hitMinion(sh){
  const T = THEMES[themeKey];
  const m = sh.minion, st = sh.st;
  const dmg = Math.round(sh.dmg * (bossStunned() ? 2 : 1));
  m.hp = Math.max(0, m.hp - dmg);
  st.dmg += dmg;
  m.flash = 1; m.knock += (st.left ? 1 : -1) * (sh.crit ? 22 : 8);
  if(S.clock - S.comboT < 1600) S.combo++; else S.combo = 1;
  S.comboT = S.clock; S.comboPop = 1;
  S.texts.push({ x: sh.x1 + rand(-40, 40), y: sh.y1 - 10, txt: fmtNum(dmg), crit: sh.crit, t: 0 });
  burst(sh.x1, sh.y1, sh.type, sh.crit ? 30 : 12, st.left ? 1 : -1);
  sfx(sh.crit ? 'crit' : 'hit');
  rescueProgress();
  if(m.hp <= 0){
    m.dead = true; m.deadT = 0;
    burst(m.x, BOSS_FEET - 250, 'torch', 40, 0);
    S.rings.push({ x: m.x, y: BOSS_FEET - 250, t: 0, life: 0.5, r: 180, color: 'rgba(255,190,90,.95)', w: 12 });
    S.texts.push({ x: m.x, y: BOSS_FEET - 520, txt: T.minionName + ' 격파!', stun: true, revive: true, t: 0 });
    S.shake = Math.max(S.shake, 16);
    sfx('explode');
    if(!minionsAlive()) S.banner = { txt: '호위 격파!', sub: T.bossName + '가 다시 제 피해를 받습니다', t: 0, life: 1.4, color: '#6dff9e' };
  }
}

// ── 보스 회복 ───────────────────────────────────────
function checkHealTrigger(){
  if(S.cast || S.phase !== 'fight') return;
  const frac = S.hp / S.max;
  for(const th of RAID.healAt){
    if(frac <= th && !S.healsDone.includes(th)){ S.healsDone.push(th); startCast(); return; }
  }
}
function startCast(){
  const T = THEMES[themeKey];
  S.cast = { need: RAID.healNeed, got: 0, start: S.clock, end: S.clock + RAID.healCastMs };
  S.banner = { txt: '🩹 ' + T.healName + '!', sub: `${RAID.healCastMs / 1000}초 안에 ${RAID.healNeed}번 공격해서 끊어라!`, t: 0, life: 2, color: '#6dff9e', red: true };
  sfx('cast');
}
function breakCast(){
  S.cast = null;
  S.bossStunUntil = S.clock + RAID.breakStunMs;
  S.hitPose = 0.6;
  S.banner = { txt: '회복 차단!', sub: `보스 ${RAID.breakStunMs / 1000}초 기절 · 받는 피해 2배!`, t: 0, life: 1.8, color: '#ffe14d' };
  S.shake = Math.max(S.shake, 26);
  sfx('break');
}
function healBoss(amount, big){
  const before = S.hp;
  S.hp = Math.min(S.max, S.hp + amount);
  const got = S.hp - before;
  if(got <= 0) return;
  S.ghost = Math.max(S.ghost, S.hp);
  S.healFlash = big ? 1 : Math.max(S.healFlash, 0.4);
  if(big){
    for(let i = 0; i < 60; i++) S.parts.push({ x: BOSS_X + rand(-220, 220), y: BOSS_FEET - rand(0, 600), vx: rand(-40, 40), vy: rand(-300, -80), life: rand(0.8, 1.5), t: 0, size: rand(5, 12), color: ['#7dffb0', '#3ee07a', '#c8ffe0'][randi(0, 2)], g: -40, kind: 'dot' });
    S.texts.push({ x: BOSS_X, y: BOSS_FEET - 620, txt: '+' + fmtNum(got), heal: true, big: true, t: 0 });
  } else {
    S.texts.push({ x: BOSS_X + rand(-150, 150), y: BOSS_FEET - rand(500, 640), txt: '+' + fmtNum(got), heal: true, t: 0 });
  }
  // 회복으로 분노 기준선 위로 올라가도 한 번 시작한 분노·광폭화는 풀리지 않는다
}
function finishCastFail(){
  const T = THEMES[themeKey];
  S.cast = null;
  healBoss(S.max * RAID.healAmount, true);
  S.banner = { txt: T.bossName + ' 회복!', sub: `체력 ${Math.round(RAID.healAmount * 100)}% 회복 · 다음엔 더 빨리 공격하세요`, t: 0, life: 1.8, color: '#6dff9e', red: true };
  sfx('heal');
}

function startDying(){
  if(LIVE) onRaidEnd('win');   // 학생 화면은 쓰러지는 순간 바로 끝나게
  S.phase = 'dying'; S.dyingT = 0; S.endClock = S.clock; S.nextBoom = 0;
  S.shots = []; S.cast = null; S.timers = [];
  S.arrest = null; S.checkpoint = null; S.censor = null; S.barricadeUntil = 0;
  for(const m of S.minions) if(!m.dead){ m.dead = true; m.deadT = 0; }
  S.banner = null;
}
function startLose(reason){
  if(S.phase !== 'fight') return;
  S.phase = 'lose'; S.loseReason = reason; S.endClock = S.clock;
  S.shots = []; S.cast = null; S.timers = [];
  S.arrest = null; S.checkpoint = null; S.censor = null; S.barricadeUntil = 0;
  for(const m of S.minions) if(!m.dead){ m.dead = true; m.deadT = 0; }
  S.banner = null;
  sfx('lose');
  updateButtons();
  onRaidEnd('lose');
}

function manualHit(){
  if(S.phase !== 'fight' || !running) return;
  const pool = S.students.filter(canAct);
  if(!pool.length) return;
  const st = pool[randi(0, pool.length - 1)];
  st.streak = 4;   // 수동 타격은 치명타가 나오도록 5연속 정답으로 만든다
  const saved = Math.random;
  Math.random = () => 0;   // 반드시 정답 처리
  try { answer(st, true, 3); } finally { Math.random = saved; }
}

// ── 갱신 ─────────────────────────────────────────────
function update(dt){
  S.clock += dt * 1000;
  const now = S.clock, mean = SPEEDS[speedIdx].mean;

  if(S.phase === 'intro'){
    S.introT += dt;
    const k = clamp((S.introT - 0.3) / 0.7, 0, 1);
    S.bossY = k < 1 ? lerp(-900, 0, k * k) : 0;
    if(k >= 1 && !S.landed){
      S.landed = true; S.shake = 40; S.squash = 1.3; sfx('drop');
      for(let i = 0; i < 50; i++) S.parts.push({ x: BOSS_X + rand(-260, 260), y: BOSS_FEET - 10, vx: rand(-500, 500), vy: rand(-380, -60), life: rand(0.5, 1), t: 0, size: rand(6, 16), color: themeKey === 'korea' ? '#6b5a50' : '#d8a867', g: 700, kind: 'dot' });
    }
    if(S.introT >= 2.4) startFight();
  }

  if(S.phase === 'fight'){
    for(const st of S.students){
      // 부활
      if(st.koUntil && now >= st.koUntil){
        st.koUntil = 0; st.hearts = RAID.hearts;
        st.flash = 1; st.flashColor = '#48d17a';
        const a = anchor(st);
        S.texts.push({ x: a.x + (st.left ? 90 : -90), y: a.y, txt: '부활!', stun: true, revive: true, t: 0 });
      }
      if(LIVE || now < st.next) continue;
      st.next = now + Math.max(700, expRand(mean));
      if(!canAct(st)) continue;
      const censored = !!(S.censor && S.censor.set.has(st));
      answer(st, Math.random() <= (censored ? RAID.censorAcc : FAKE_ACC), rand(2, 9));
    }
    if(LIVE) drainHits();
    if(!bossStunned()){
      if(now >= S.attackAt) basicAttack();
      if(S.rage && now >= S.counterAt) counterAttack();
      // 초당 회복 (광폭화 땐 2배), 1초마다 모아서 숫자로 보여 준다
      S.regenAcc += S.max * RAID.regenPerSec * (S.enrage ? 2 : 1) * dt;
      if(now >= S.regenShowAt){ S.regenShowAt = now + 1000; if(S.regenAcc >= 1){ healBoss(S.regenAcc, false); S.regenAcc = 0; } }
      if(S.enrage && !S.cast && S.healsDone.length >= RAID.healAt.length && now >= S.nextHealAt){ S.nextHealAt = now + RAID.healRepeatMs; startCast(); }
      if(!S.cast && now >= S.specialAt){ doSpecial(); S.specialAt = now + RAID.specialGapMs * rand(0.85, 1.15); }
    } else {
      S.specialAt = Math.max(S.specialAt, S.bossStunUntil + 2000);
      // 기절한 동안엔 회복 의식·공격 예약이 밀린다
      S.attackAt = Math.max(S.attackAt, S.bossStunUntil + 1200);
      S.counterAt = Math.max(S.counterAt, S.bossStunUntil + 2500);
    }
    if(S.cast && now >= S.cast.end) finishCastFail();
    if(S.arrest && now >= S.arrest.end) freeArrest(false);
    if(S.checkpoint && now >= S.checkpoint.end) failCheckpoint();
    if(S.censor && now >= S.censor.end) S.censor = null;
    if(LIVE ? (roundEnd && serverNow() >= roundEnd) : now - S.fightStart >= RAID.limitMs) startLose('시간 초과');
  }

  if(S.phase === 'dying'){
    S.dyingT += dt;
    if(S.dyingT < 2.2 && S.dyingT >= S.nextBoom){
      S.nextBoom = S.dyingT + rand(0.1, 0.2);
      const x = BOSS_X + rand(-190, 190), y = BOSS_FEET - rand(80, 560);
      burst(x, y, 'torch', 26, 0);
      S.rings.push({ x, y, t: 0, life: 0.45, r: rand(110, 190), color: 'rgba(255,190,90,.95)', w: 12 });
      S.shake = Math.max(S.shake, 18);
      sfx('explode');
    }
    if(S.dyingT >= 2.2){
      if(useSprite()){
        if(!S.fallen){
          S.fallen = true; S.shake = 36; S.squash = 0.8; sfx('drop');
          for(let i = 0; i < 60; i++) S.parts.push({ x: BOSS_X + rand(-380, 380), y: BOSS_FEET - 10, vx: rand(-520, 520), vy: rand(-360, -60), life: rand(0.5, 1.1), t: 0, size: rand(6, 16), color: '#6b5a50', g: 700, kind: 'dot' });
        }
      } else {
        const k = clamp((S.dyingT - 2.2) / 0.8, 0, 1);
        S.bossRot = 0.45 * easeOut(k);
        S.bossY = 80 * k; S.bossAlpha = 1 - k;
      }
    }
    if(S.dyingT >= (useSprite() ? 4.4 : 3.1)){
      S.phase = 'victory';
      updateButtons();
      onRaidEnd('win');
      sfx('win');
      for(let i = 0; i < 160; i++) confetti(true);
    }
  }
  if(S.phase === 'victory' && Math.random() < dt * 30) confetti(false);

  // 예약된 동작
  // 예약된 동작이 게임을 끝내면 S.timers가 새 배열로 비워지므로, 매번 있는지 확인하며 돈다
  for(let i = S.timers.length - 1; i >= 0; i--){ const tm = S.timers[i]; if(!tm || now < tm.at) continue; S.timers.splice(i, 1); tm.fn(); }

  // 날아가는 공격 (학생 → 보스, 보스 → 학생)
  // 한 발이 보스를 쓰러뜨리면 S.shots가 새 배열로 비워지므로, 이번 프레임은 원래 배열을 끝까지 돈다
  const shots = S.shots;
  for(let i = shots.length - 1; i >= 0; i--){
    const sh = shots[i];
    sh.t += dt / sh.dur;
    const p = shotPos(sh, Math.min(1, sh.t));
    sh.trail += dt;
    while(sh.trail > 0.012){
      sh.trail -= 0.012;
      trailParticle(sh, p);
    }
    if(sh.t >= 1){ shots.splice(i, 1); if(sh.onHit === 'arrest') bindStudent(sh.st); else if(sh.enemy) hurtStudent(sh); else impact(sh); }
  }
  // 파편
  for(let i = S.parts.length - 1; i >= 0; i--){
    const q = S.parts[i];
    q.t += dt;
    if(q.t >= q.life){ S.parts.splice(i, 1); continue; }
    q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    if(q.kind === 'confetti'){ q.rot += q.vr * dt; q.vx *= 0.99; }
  }
  if(S.parts.length > 900) S.parts.splice(0, S.parts.length - 900);
  for(const arr of [S.texts, S.rings, S.bolts]){
    for(let i = arr.length - 1; i >= 0; i--){ arr[i].t += dt; if(arr[i].t >= (arr[i].life || 1)) arr.splice(i, 1); }
  }
  if(S.banner){ S.banner.t += dt; if(S.banner.t >= S.banner.life) S.banner = null; }

  // 감쇠
  S.bossFlash = Math.max(0, S.bossFlash - dt * 5);
  S.healFlash = Math.max(0, S.healFlash - dt * 2);
  S.knock += (0 - S.knock) * Math.min(1, dt * 9);
  S.squash = Math.max(0, S.squash - dt * 5);
  S.shake = Math.max(0, S.shake - dt * 70);
  S.comboPop = Math.max(0, S.comboPop - dt * 5);
  S.attack = Math.max(0, S.attack - dt * 1.4);
  S.hitPose = Math.max(0, S.hitPose - dt);
  for(const st of S.students){ st.flash = Math.max(0, st.flash - dt * 2.5); st.wrongT = Math.max(0, st.wrongT - dt * 2); st.hurtT = Math.max(0, st.hurtT - dt * 2.5); }
  S.ghost += (S.hp - S.ghost) * Math.min(1, dt * 2.2);
  for(const m of S.minions){ m.spawnT = Math.min(1, m.spawnT + dt * 2); m.flash = Math.max(0, m.flash - dt * 5); m.knock += (0 - m.knock) * Math.min(1, dt * 9); if(m.dead) m.deadT += dt; }
  S.minions = S.minions.filter(m => !m.dead || m.deadT < 1.2);
}

function shotPos(sh, t){
  const u = 1 - t;
  const x = u * u * sh.x0 + 2 * u * t * sh.cx + t * t * sh.x1;
  const y = u * u * sh.y0 + 2 * u * t * sh.cy + t * t * sh.y1;
  const dx = 2 * u * (sh.cx - sh.x0) + 2 * t * (sh.x1 - sh.cx);
  const dy = 2 * u * (sh.cy - sh.y0) + 2 * t * (sh.y1 - sh.cy);
  return { x, y, a: Math.atan2(dy, dx) };
}
function trailParticle(sh, p){
  if(sh.type === 'torch') S.parts.push({ x: p.x + rand(-6, 6), y: p.y + rand(-6, 6), vx: rand(-40, 40), vy: rand(-80, -20), life: rand(0.25, 0.45), t: 0, size: rand(6, 13), color: ['#fff2a8', '#ffd166', '#ff8c42', '#ff4d2e'][randi(0, 3)], g: -60, kind: 'dot' });
  else if(sh.type === 'ink') S.parts.push({ x: p.x, y: p.y, vx: rand(-30, 30), vy: rand(-20, 40), life: rand(0.3, 0.5), t: 0, size: rand(4, 9), color: ['#10142c', '#23306e', '#3b4db0'][randi(0, 2)], g: 500, kind: 'dot' });
  else if(sh.type === 'crit') S.parts.push({ x: p.x + rand(-8, 8), y: p.y + rand(-8, 8), vx: rand(-60, 60), vy: rand(-60, 60), life: rand(0.2, 0.4), t: 0, size: rand(5, 11), color: ['#fff', '#fff3a0', '#7fd8ff'][randi(0, 2)], g: 0, kind: 'dot' });
  else if(sh.type === 'rope') S.parts.push({ x: p.x, y: p.y, vx: rand(-20, 20), vy: rand(-20, 20), life: 0.3, t: 0, size: rand(3, 6), color: '#c9a36a', g: 0, kind: 'dot' });
  else if(sh.type === 'boss') S.parts.push({ x: p.x + rand(-10, 10), y: p.y + rand(-10, 10), vx: rand(-40, 40), vy: rand(-40, 40), life: rand(0.2, 0.4), t: 0, size: rand(5, 10), color: ['#ff3b30', '#b3121f', '#ff8a65'][randi(0, 2)], g: 0, kind: 'dot' });
  else if(Math.random() < 0.4) S.parts.push({ x: p.x, y: p.y, vx: 0, vy: 0, life: 0.18, t: 0, size: 3, color: 'rgba(255,255,255,.6)', g: 0, kind: 'dot' });
}
function confetti(big){
  const cols = ['#ff5a5f', '#ffd23f', '#3ec46d', '#3d8bfd', '#b86bff', '#fff'];
  S.parts.push({ x: big ? rand(200, W - 200) : rand(0, W), y: big ? rand(-200, 300) : -20, vx: rand(-200, 200), vy: big ? rand(-600, 0) : rand(50, 150), life: rand(2.5, 4), t: 0, size: rand(10, 18), color: cols[randi(0, cols.length - 1)], g: 380, kind: 'confetti', rot: rand(0, 6), vr: rand(-8, 8) });
}

// ── 그리기 ───────────────────────────────────────────
function draw(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.save();
  if(S.shake > 0) ctx.translate(rand(-S.shake, S.shake), rand(-S.shake, S.shake) * 0.7);
  drawBackground();
  drawBossLayer();
  drawMinions();
  drawBarricade();
  drawArrestRope();
  drawRings();
  drawParticles(false);
  drawShots();
  drawBolts();
  drawTexts();
  ctx.restore();

  drawTags();
  drawHpBar();
  drawObjectives();
  drawCombo();
  drawStats();
  drawBanner();
  if(S.phase === 'intro') drawIntro();
  if(S.phase === 'victory') drawVictory();
  if(S.phase === 'lose') drawLose();
  drawParticles(true);
  if(S.phase === 'ready') drawReady();
  else if(!running && S.phase !== 'victory' && S.phase !== 'lose') drawPaused();
}

function drawBossLayer(){
  if(S.phase === 'victory' && !useSprite()) return;
  const t = S.clock / 1000;
  // 분노 오라 (싸우는 중·실패 화면에서만)
  if(S.rage && (S.phase === 'fight' || S.phase === 'lose')){
    const aura = ctx.createRadialGradient(BOSS_X, BOSS_FEET - 330, 60, BOSS_X, BOSS_FEET - 330, 420 + Math.sin(t * 6) * 20);
    aura.addColorStop(0, S.enrage ? 'rgba(255,20,20,.5)' : 'rgba(255,60,30,.35)'); aura.addColorStop(1, 'rgba(255,60,30,0)');
    ctx.fillStyle = aura; ctx.fillRect(BOSS_X - 520, BOSS_FEET - 820, 1040, 900);
  }
  // 회복 의식 중: 초록 기운
  if(S.cast){
    const aura = ctx.createRadialGradient(BOSS_X, BOSS_FEET - 330, 40, BOSS_X, BOSS_FEET - 330, 380 + Math.sin(t * 8) * 30);
    aura.addColorStop(0, 'rgba(80,255,150,.45)'); aura.addColorStop(1, 'rgba(80,255,150,0)');
    ctx.fillStyle = aura; ctx.fillRect(BOSS_X - 520, BOSS_FEET - 820, 1040, 900);
    if(Math.random() < 0.5) S.parts.push({ x: BOSS_X + rand(-200, 200), y: BOSS_FEET - rand(0, 200), vx: rand(-20, 20), vy: rand(-260, -120), life: rand(0.8, 1.4), t: 0, size: rand(4, 9), color: ['#7dffb0', '#3ee07a', '#c8ffe0'][randi(0, 2)], g: -30, kind: 'dot' });
  }
  // 발밑 그림자
  const shadowScale = S.phase === 'intro' ? clamp(1 + S.bossY / 900, 0.2, 1) : 1;
  ctx.fillStyle = `rgba(0,0,0,${0.4 * shadowScale * S.bossAlpha})`;
  ctx.beginPath(); ctx.ellipse(BOSS_X, BOSS_FEET - 6, 230 * shadowScale, 34 * shadowScale, 0, 0, Math.PI * 2); ctx.fill();

  const bi = renderBoss();
  ctx.save();
  ctx.globalAlpha = S.bossAlpha;
  const stunWobble = bossStunned() ? Math.sin(t * 9) * 0.03 : 0;
  ctx.translate(BOSS_X + S.knock, BOSS_FEET + S.bossY);
  ctx.rotate(S.bossRot + stunWobble);
  const sq = S.squash;
  const breath = Math.sin(t * 2.2) * 0.008;                             // 숨쉬기
  const lunge = S.attack > 0 ? Math.sin(Math.PI * (1 - S.attack)) : 0;  // 공격할 때 앞으로 달려드는 느낌
  ctx.scale((1 + sq * 0.07) * (1 + lunge * 0.12), (1 - sq * 0.07 + breath) * (1 + lunge * 0.12));
  ctx.drawImage(bi.cvs, -bi.ax, -bi.ay);
  ctx.restore();
  // 기절: 머리 위로 별이 빙글빙글
  if(bossStunned() && S.phase === 'fight'){
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for(let i = 0; i < 5; i++){
      const a = t * 4 + i * Math.PI * 2 / 5;
      outlinedText(ctx, '★', BOSS_X + S.knock + Math.cos(a) * 110, BOSS_FEET - 735 + Math.sin(a) * 26, 40, '#ffe14d', '#5a3a00', 6);
    }
  }
}

function drawShots(){
  for(const sh of S.shots){
    const p = shotPos(sh, Math.min(1, sh.t));
    ctx.save();
    ctx.translate(p.x, p.y);
    if(sh.type === 'rope'){
      // 빙글빙글 도는 올가미
      ctx.rotate(S.clock / 60);
      ctx.strokeStyle = '#3a2410'; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.ellipse(0, 0, 46, 30, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#c9a36a'; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.ellipse(0, 0, 46, 30, 0, 0, Math.PI * 2); ctx.stroke();
    } else if(sh.type === 'boss'){
      // 보스 공격: 붉은 기운을 두른 곤봉(한국사) / 창(세계사)
      const gr = ctx.createRadialGradient(0, 0, 2, 0, 0, 56);
      gr.addColorStop(0, 'rgba(255,90,70,.9)'); gr.addColorStop(1, 'rgba(160,0,0,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, 56, 0, Math.PI * 2); ctx.fill();
      if(themeKey === 'korea'){
        ctx.rotate(S.clock / 40);
        rr(ctx, -50, -9, 100, 18, 9); paint(ctx, '#6b3a24', 5);
        rr(ctx, 30, -11, 22, 22, 6); paint(ctx, '#3a2014', 4);
      } else {
        ctx.rotate(p.a);
        ctx.strokeStyle = '#5a3620'; ctx.lineWidth = 8; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-110, 0); ctx.lineTo(0, 0); ctx.stroke();
        ctx.fillStyle = '#ffb3a8'; ctx.strokeStyle = OUT; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(32, 0); ctx.lineTo(-6, -12); ctx.lineTo(-6, 12); ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    } else if(sh.type === 'torch' || sh.type === 'crit'){
      const r = sh.type === 'crit' ? 34 : 22;
      const gr = ctx.createRadialGradient(0, 0, 2, 0, 0, r * 2.2);
      if(sh.type === 'crit'){ gr.addColorStop(0, '#fff'); gr.addColorStop(0.3, 'rgba(255,240,140,.95)'); gr.addColorStop(1, 'rgba(120,200,255,0)'); }
      else { gr.addColorStop(0, '#fff6c8'); gr.addColorStop(0.35, 'rgba(255,150,60,.95)'); gr.addColorStop(1, 'rgba(255,60,20,0)'); }
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, r * 2.2, 0, Math.PI * 2); ctx.fill();
    } else if(sh.type === 'ink'){
      ctx.rotate(p.a);
      ctx.fillStyle = '#141a3c';
      ctx.beginPath(); ctx.ellipse(0, 0, 26, 14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(160,180,255,.8)'; ctx.lineWidth = 3; ctx.stroke();
    } else {
      // 화살·창
      ctx.rotate(p.a);
      const len = sh.type === 'spear' ? 120 : 78;
      ctx.strokeStyle = sh.type === 'spear' ? '#7a5230' : '#8a5a2b'; ctx.lineWidth = sh.type === 'spear' ? 8 : 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-len, 0); ctx.lineTo(0, 0); ctx.stroke();
      ctx.fillStyle = '#dfe5ee'; ctx.strokeStyle = OUT; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(sh.type === 'spear' ? 30 : 18, 0); ctx.lineTo(-6, -11); ctx.lineTo(-6, 11); ctx.closePath(); ctx.fill(); ctx.stroke();
      if(sh.type === 'arrow'){ ctx.fillStyle = '#e8e2d0'; ctx.fillRect(-len, -8, 18, 16); }
    }
    ctx.restore();
  }
}

function drawParticles(confettiOnly){
  for(const q of S.parts){
    if((q.kind === 'confetti') !== confettiOnly) continue;
    const a = 1 - q.t / q.life;
    ctx.globalAlpha = clamp(a * 1.4, 0, 1);
    ctx.fillStyle = q.color; ctx.strokeStyle = q.color;
    if(q.kind === 'spark'){
      ctx.lineWidth = q.size * 0.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.vx * 0.035, q.y - q.vy * 0.035); ctx.stroke();
    } else if(q.kind === 'confetti'){
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
      ctx.fillRect(-q.size / 2, -q.size / 4, q.size, q.size / 2);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(q.x, q.y, q.size * (0.4 + 0.6 * a), 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawRings(){
  for(const r of S.rings){
    if(r.t < 0) continue;
    const k = r.t / r.life;
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = r.color; ctx.lineWidth = r.w * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r * easeOut(k), 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawBolts(){
  for(const b of S.bolts){
    const k = b.t / (b.life || 0.35);
    if(k > 1) continue;
    ctx.globalAlpha = 1 - k;
    for(const [w, c] of [[22, 'rgba(120,200,255,.35)'], [10, 'rgba(180,230,255,.9)'], [4, '#fff']]){
      ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath(); b.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    }
    if(k < 0.25){ ctx.fillStyle = `rgba(255,255,255,${0.35 * (1 - k / 0.25)})`; ctx.fillRect(-50, -50, W + 100, H + 100); }
  }
  ctx.globalAlpha = 1;
}

function drawTexts(){
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const tx of S.texts){
    const k = tx.t / (tx.life || 1);
    const pop = tx.t < 0.12 ? 0.6 + (tx.t / 0.12) * 0.6 : 1.2 - Math.min(0.2, (tx.t - 0.12) * 0.6);
    ctx.globalAlpha = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
    const y = tx.y - easeOut(Math.min(1, k * 1.3)) * (tx.stun ? 40 : 90);
    ctx.save(); ctx.translate(tx.x, y); ctx.scale(pop, pop);
    if(tx.block) outlinedText(ctx, tx.txt, 0, 0, 34, '#a0d4ff', '#0a1a30', 6);
    else if(tx.heal) outlinedText(ctx, tx.txt, 0, 0, tx.big ? 76 : 36, '#6dff9e', '#063a18', tx.big ? 12 : 6);
    else if(tx.stun) outlinedText(ctx, tx.txt, 0, 0, 30, tx.revive ? '#8dffb5' : '#ffd0c8');
    else if(tx.crit){
      outlinedText(ctx, 'CRITICAL!', 0, -52, 32, '#7fd8ff');
      outlinedText(ctx, tx.txt, 0, 0, 78, '#ffe14d', '#5a1a00', 12);
    } else outlinedText(ctx, tx.txt, 0, 0, 46, '#fff');
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawTags(){
  const top = S.students.reduce((m, s) => s.dmg > (m ? m.dmg : 0) ? s : m, null);
  ctx.textBaseline = 'middle';
  for(const st of S.students){
    const ko = isKo(st), stunned = !ko && st.stunUntil > S.clock;
    const targeted = !ko && st.targetUntil > S.clock;
    const arrested = !ko && isArrested(st);
    const checked = !ko && !!(S.checkpoint && S.checkpoint.st === st);
    const censored = !ko && !!(S.censor && S.censor.set.has(st));
    const shakeT = Math.max(st.wrongT, st.hurtT);
    const shakeX = shakeT > 0 ? Math.sin(shakeT * 40) * 10 * shakeT : 0;
    const x = st.tx + shakeX, y = st.ty, cy = y + TAG_H / 2;
    ctx.save();
    ctx.globalAlpha = ko ? 0.5 : stunned ? 0.7 : 0.92;
    rr(ctx, x, y, TAG_W, TAG_H, 12);
    ctx.fillStyle = ko ? '#2a2a30' : stunned ? '#3a3a50' : 'rgba(18,20,40,.88)'; ctx.fill();
    if(st.flash > 0){ ctx.globalAlpha = st.flash * 0.75; ctx.fillStyle = st.flashColor; ctx.fill(); }
    ctx.globalAlpha = 1;
    if(arrested){
      // 포승줄에 묶임: 갈색 줄무늬
      ctx.save(); rr(ctx, x, y, TAG_W, TAG_H, 12); ctx.clip();
      ctx.strokeStyle = 'rgba(201,163,106,.55)'; ctx.lineWidth = 8;
      for(let i = -2; i < 12; i++){ ctx.beginPath(); ctx.moveTo(x + i * 30, y); ctx.lineTo(x + i * 30 + 40, y + TAG_H); ctx.stroke(); }
      ctx.restore();
      rr(ctx, x, y, TAG_W, TAG_H, 12);
    }
    if(targeted){
      // 보스가 노리는 중: 붉은 테두리가 깜빡인다
      ctx.lineWidth = 5; ctx.strokeStyle = `rgba(255,50,40,${0.55 + 0.45 * Math.sin(S.clock / 45)})`;
    } else if(checked){
      ctx.lineWidth = 5; ctx.strokeStyle = `rgba(255,210,63,${0.6 + 0.4 * Math.sin(S.clock / 60)})`;
    } else if(arrested){
      ctx.lineWidth = 4; ctx.strokeStyle = '#d9a066';
    } else {
      ctx.lineWidth = 2; ctx.strokeStyle = top === st && st.dmg > 0 ? '#ffd23f' : 'rgba(255,255,255,.18)';
    }
    ctx.stroke();
    // 이름 첫 글자 동그라미
    const ccx = st.left ? x + 26 : x + TAG_W - 26;
    ctx.beginPath(); ctx.arc(ccx, cy, 17, 0, Math.PI * 2);
    ctx.fillStyle = ko ? '#555' : `hsl(${st.i * 37 % 360} 60% 52%)`; ctx.fill();
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = `800 18px ${FONT}`;
    ctx.fillText(ko ? '💀' : st.name[0], ccx, cy + 1);
    // 이름
    ctx.textAlign = st.left ? 'left' : 'right';
    ctx.font = `800 23px ${FONT}`; ctx.fillStyle = ko ? '#999' : '#fff';
    const nameX = st.left ? x + 52 : x + TAG_W - 52;
    ctx.fillText((top === st && st.dmg > 0 && !ko ? '👑 ' : '') + st.name, nameX, cy + 1);
    // 오른쪽 정보: 쓰러짐 카운트다운 · 기절 · ⚠ · 목숨
    ctx.textAlign = st.left ? 'right' : 'left';
    const infoX = st.left ? x + TAG_W - 12 : x + 12;
    if(ko){
      ctx.font = `800 18px ${FONT}`; ctx.fillStyle = '#ff8a80';
      ctx.fillText(`부활 ${Math.ceil((st.koUntil - S.clock) / 1000)}초`, infoX, cy + 1);
    } else if(arrested){
      ctx.font = `800 18px ${FONT}`; ctx.fillStyle = '#ffd9a8';
      ctx.fillText(`🔗 ${S.arrest.got}/${S.arrest.need}`, infoX, cy + 1);
    } else if(checked){
      ctx.font = `900 19px ${FONT}`; ctx.fillStyle = '#ffe14d';
      ctx.fillText(`📋 ${Math.ceil((S.checkpoint.end - S.clock) / 1000)}초`, infoX, cy + 1);
    } else if(targeted){
      ctx.font = `900 24px ${FONT}`; ctx.fillStyle = '#ff5a4a';
      ctx.fillText('⚠', infoX, cy + 1);
    } else {
      // 목숨 하트: 남은 것은 빨강, 잃은 것은 흐리게 (왼쪽부터 첫째 하트)
      // 목숨이 4개 이하면 하트 아이콘, 5개 이상이면 이름과 겹치지 않게 '♥ 남은/전체' 숫자로
      const n = RAID.hearts;
      let used;
      if(n <= 4){
        const step = n > 3 ? 16 : 21;
        ctx.font = `900 ${n > 3 ? 17 : 22}px ${FONT}`;
        for(let h = 0; h < n; h++){
          const hx = st.left ? infoX - (n - 1 - h) * step : infoX + h * step;
          ctx.fillStyle = h < st.hearts ? '#ff4d5e' : 'rgba(255,255,255,.2)';
          ctx.fillText('♥', hx, cy + 1);
        }
        used = n * step;
      } else {
        ctx.font = `900 20px ${FONT}`;
        ctx.fillStyle = st.hearts <= 2 ? '#ff8a80' : '#ff4d5e';
        const label = `♥ ${st.hearts}/${n}`;
        ctx.fillText(label, infoX, cy + 1);
        used = ctx.measureText(label).width;
      }
      if(stunned){
        ctx.font = `800 17px ${FONT}`;
        ctx.fillText('😵', st.left ? infoX - used - 6 : infoX + used + 6, cy + 1);
      }
    }
    if(censored){
      // 신문 검열: 먹칠한 띠와 '검열' 도장
      ctx.save();
      ctx.globalAlpha = 0.88;
      ctx.fillStyle = '#0c0c0c';
      ctx.fillRect(x + 46, y + 9, TAG_W - 110, 12);
      ctx.fillRect(x + 60, y + 27, TAG_W - 140, 12);
      ctx.globalAlpha = 1;
      ctx.translate(st.left ? x + TAG_W - 70 : x + 70, cy); ctx.rotate(-0.18);
      ctx.strokeStyle = '#d7263d'; ctx.lineWidth = 3; rr(ctx, -30, -14, 60, 28, 4); ctx.stroke();
      ctx.textAlign = 'center'; ctx.font = `900 17px ${FONT}`; ctx.fillStyle = '#d7263d';
      ctx.fillText('검열', 0, 1);
      ctx.restore();
    }
    ctx.restore();
  }
}

function drawHpBar(){
  const T = THEMES[themeKey];
  const x = 440, y = 62, w = 1040, h = 38;
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  outlinedText(ctx, T.bossName, x, y - 14, 44, '#fff');
  const nameW = (() => { ctx.font = `900 44px ${FONT}`; return ctx.measureText(T.bossName).width; })();
  ctx.font = `700 22px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText(T.sub, x + nameW + 16, y - 18);
  // 상태 배지 (오른쪽 위)
  const badges = [];
  if(bossStunned() && S.phase === 'fight') badges.push(['💫 기절 · 피해 2배', '#c79a00']);
  if(S.enrage) badges.push(['🔥 광폭화', '#b3001b']);
  else if(S.rage) badges.push(['😡 분노', '#d7263d']);
  let bx = x + w;
  ctx.font = `900 22px ${FONT}`;
  for(const [label, color] of badges){
    const bw = ctx.measureText(label).width + 28;
    bx -= bw;
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(S.clock / 90);
    rr(ctx, bx, y - 50, bw, 36, 8); ctx.fillStyle = color; ctx.fill();
    ctx.globalAlpha = 1; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText(label, bx + bw / 2, y - 24);
    bx -= 10;
  }
  ctx.textAlign = 'left';
  rr(ctx, x - 5, y - 5, w + 10, h + 10, 12); ctx.fillStyle = OUT; ctx.fill();
  rr(ctx, x, y, w, h, 9); ctx.fillStyle = '#2a1a1a'; ctx.fill();
  const gw = w * clamp(S.ghost / S.max, 0, 1), hw = w * clamp(S.hp / S.max, 0, 1);
  if(gw > 0){ rr(ctx, x, y, gw, h, 9); ctx.fillStyle = 'rgba(255,240,200,.9)'; ctx.fill(); }
  if(hw > 0){
    const gr = ctx.createLinearGradient(0, y, 0, y + h);
    if(S.rage){ const p = 0.5 + 0.5 * Math.sin(S.clock / 110); gr.addColorStop(0, `rgb(255,${80 + 60 * p},${60 + 40 * p})`); gr.addColorStop(1, '#8a0f1a'); }
    else { gr.addColorStop(0, '#ff6b5a'); gr.addColorStop(1, '#b0172a'); }
    rr(ctx, x, y, hw, h, 9); ctx.fillStyle = gr; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x + 6, y + 5, Math.max(0, hw - 12), 6);
    if(S.healFlash > 0){ ctx.globalAlpha = S.healFlash * 0.8; rr(ctx, x, y, hw, h, 9); ctx.fillStyle = '#6dff9e'; ctx.fill(); ctx.globalAlpha = 1; }
  }
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2;
  for(let i = 1; i < 10; i++){ ctx.beginPath(); ctx.moveTo(x + w * i / 10, y); ctx.lineTo(x + w * i / 10, y + h); ctx.stroke(); }
  // 회복 의식이 시작되는 선(60%·30%) 표시
  for(const th of RAID.healAt){
    if(S.healsDone.includes(th)) continue;
    const lx = x + w * th;
    ctx.fillStyle = '#6dff9e'; ctx.fillRect(lx - 2, y - 4, 4, h + 8);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  outlinedText(ctx, `${fmtNum(S.hp)} / ${fmtNum(S.max)}`, x + w / 2, y + h / 2 + 2, 24, '#fff', OUT, 5);
}

// 진행 중인 보스 기술 막대들 (회복 의식·체포·검문·검열·바리케이드·헌병 호위)
function drawObjectives(){
  if(S.phase !== 'fight') return;
  const T = THEMES[themeKey], now = S.clock;
  const items = [];
  const timeK = (st, en) => clamp((en - now) / (en - st), 0, 1);
  if(S.cast) items.push({ c: '#3ee07a', dark: '#10301c', label: `🩹 ${T.healName} — 공격해서 끊어라!  ${S.cast.got} / ${S.cast.need}`, k: timeK(S.cast.start, S.cast.end), p: S.cast.got / S.cast.need, sec: (S.cast.end - now) / 1000 });
  if(S.arrest) items.push({ c: '#d9a066', dark: '#3a2410', label: `🔗 ${S.arrest.st.name} 체포됨 — ${S.arrest.need}번 공격해서 구출!  ${S.arrest.got} / ${S.arrest.need}`, k: timeK(S.arrest.start, S.arrest.end), p: S.arrest.got / S.arrest.need, sec: (S.arrest.end - now) / 1000 });
  if(S.checkpoint) items.push({ c: '#ffd23f', dark: '#3a3000', label: `📋 ${T.checkName}: ${S.checkpoint.st.name} — 정답을 내라!`, k: timeK(S.checkpoint.start, S.checkpoint.end), sec: (S.checkpoint.end - now) / 1000 });
  if(S.censor) items.push({ c: '#cfc7ae', dark: '#2a2820', label: `📰 ${T.censorName} — ${S.censor.set.size}명 문제 먹칠`, k: timeK(S.censor.start, S.censor.end), sec: (S.censor.end - now) / 1000 });
  if(barricadeUp()) items.push({ c: '#e0b27a', dark: '#2a1a0a', label: `🚧 ${T.barricadeName} — 공격이 막힙니다`, k: timeK(S.barricadeStart, S.barricadeUntil), sec: (S.barricadeUntil - now) / 1000 });
  const alive = S.minions.filter(m => !m.dead);
  if(alive.length){
    const hp = alive.reduce((n, m) => n + m.hp, 0), mx = S.minions.reduce((n, m) => n + m.max, 0);
    items.push({ c: '#8fb3ff', dark: '#101c3a', label: `👮 ${T.minionName} 호위 중 (${alive.length}명) — ${T.bossName} 피해 절반`, k: hp / mx });
  }
  const w = 660, h = 18, x = 960 - w / 2;
  let y = 202;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const it of items){
    ctx.globalAlpha = 0.85 + 0.15 * Math.sin(now / 90);
    outlinedText(ctx, it.label, 960, y - 17, 23, it.c, '#000', 5);
    ctx.globalAlpha = 1;
    rr(ctx, x - 3, y - 3, w + 6, h + 6, 8); ctx.fillStyle = OUT; ctx.fill();
    rr(ctx, x, y, w, h, 6); ctx.fillStyle = it.dark; ctx.fill();
    if(it.k > 0){ rr(ctx, x, y, w * it.k, h, 6); ctx.fillStyle = it.c; ctx.fill(); }
    if(it.p > 0){ rr(ctx, x, y + h - 6, w * clamp(it.p, 0, 1), 6, 3); ctx.fillStyle = '#ffe14d'; ctx.fill(); }
    if(it.sec !== undefined) outlinedText(ctx, it.sec.toFixed(1) + '초', x + w + 36, y + h / 2 + 1, 18, '#fff', OUT, 4);
    y += 52;
  }
}

// 헌병(부하): 보스 양옆에 선다. 나타날 때는 위에서 내려오고, 쓰러지면 기울며 사라진다
function drawMinions(){
  for(const m of S.minions){
    const t = S.clock / 1000;
    const drop = (1 - easeOut(m.spawnT)) * -260;
    const k = m.dead ? clamp(m.deadT / 1.2, 0, 1) : 0;
    const H2 = 440, W2 = Math.round(H2 * 308 / 600);
    ctx.save();
    ctx.globalAlpha = m.spawnT * (1 - k);
    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(m.x, BOSS_FEET - 4, 110, 18, 0, 0, Math.PI * 2); ctx.fill();
    ctx.translate(m.x + m.knock, BOSS_FEET + drop + k * 40);
    ctx.rotate(m.side * 0.6 * easeOut(k));
    const breath = Math.sin(t * 2.4 + m.side) * 0.01;
    ctx.scale(1, 1 + breath);
    if(themeKey === 'korea' && imgOk(MP_IMG)){
      mpOff.width = W2; mpOff.height = H2;
      mpCtx.clearRect(0, 0, W2, H2);
      // 보스를 바라보도록 오른쪽 헌병은 좌우를 뒤집는다
      mpCtx.save();
      if(m.side > 0){ mpCtx.translate(W2, 0); mpCtx.scale(-1, 1); }
      mpCtx.drawImage(MP_IMG, 0, 0, W2, H2);
      mpCtx.restore();
      if(m.flash > 0){ mpCtx.globalCompositeOperation = 'source-atop'; mpCtx.fillStyle = `rgba(255,255,255,${m.flash * 0.8})`; mpCtx.fillRect(0, 0, W2, H2); mpCtx.globalCompositeOperation = 'source-over'; }
      ctx.drawImage(mpOff, -W2 / 2, -H2);
    } else {
      drawMinionVector(m);
    }
    ctx.restore();
    // 체력 막대
    if(!m.dead){
      const bw = 170, bx = m.x - bw / 2, by = BOSS_FEET - H2 - 40 + drop;
      ctx.globalAlpha = m.spawnT;
      rr(ctx, bx - 3, by - 3, bw + 6, 20, 6); ctx.fillStyle = OUT; ctx.fill();
      rr(ctx, bx, by, bw * (m.hp / m.max), 14, 5); ctx.fillStyle = '#6fa8ff'; ctx.fill();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      outlinedText(ctx, THEMES[themeKey].minionName, m.x, by - 18, 22, '#cfe0ff', OUT, 5);
      ctx.globalAlpha = 1;
    }
  }
  // 호위 중: 헌병과 보스를 잇는 푸른 보호막
  if(minionsAlive() && S.phase === 'fight'){
    ctx.save();
    ctx.globalAlpha = 0.18 + 0.08 * Math.sin(S.clock / 150);
    ctx.strokeStyle = '#8fb3ff'; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.ellipse(BOSS_X, BOSS_FEET - 360, 330, 400, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}
// 그림이 없을 때(세계사 등) 코드로 그리는 부하 병사
function drawMinionVector(m){
  const g = ctx;
  const body = themeKey === 'korea' ? '#1d2233' : '#6a2a8a', trim = '#e0b33c';
  rr(g, -34, -110, 30, 110, 8); paint(g, '#111');
  rr(g, 4, -110, 30, 110, 8); paint(g, '#111');
  rr(g, -52, -300, 104, 200, 18); paint(g, body);
  if(m.flash > 0){ g.globalAlpha *= 1; }
  g.beginPath(); g.arc(0, -340, 42, 0, Math.PI * 2); paint(g, '#d9a676');
  rr(g, -46, -392, 92, 34, 10); paint(g, themeKey === 'korea' ? '#15182a' : trim);
  g.beginPath(); g.ellipse(-m.side * 60, -210, 40, 60, 0, 0, Math.PI * 2); paint(g, trim);
  g.strokeStyle = '#6b4423'; g.lineWidth = 8; g.beginPath(); g.moveTo(m.side * 60, -60); g.lineTo(m.side * 60, -420); g.stroke();
  if(m.flash > 0){ g.fillStyle = `rgba(255,255,255,${m.flash * 0.6})`; g.fillRect(-60, -430, 120, 430); }
}

// 바리케이드: 보스 앞에 세워지고, 끝나면 사라진다
function drawBarricade(){
  if(!barricadeUp() || S.phase !== 'fight') return;
  const inK = clamp((S.clock - S.barricadeStart) / 250, 0, 1), outK = clamp((S.barricadeUntil - S.clock) / 300, 0, 1);
  const a = Math.min(inK, outK);
  const w = 820, h = Math.round(w * 566 / 900);
  ctx.save();
  ctx.globalAlpha = a;
  const y = BOSS_FEET + 20 - h + (1 - easeOut(inK)) * -200;
  if(imgOk(BARRICADE_IMG)) ctx.drawImage(BARRICADE_IMG, BOSS_X - w / 2, y, w, h);
  else {
    // 그림이 없으면 나무 기둥으로 간단히
    ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 34; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(BOSS_X - 380, y + h); ctx.lineTo(BOSS_X - 250, y + 40); ctx.moveTo(BOSS_X - 250, y + h); ctx.lineTo(BOSS_X - 380, y + 40);
    ctx.moveTo(BOSS_X + 380, y + h); ctx.lineTo(BOSS_X + 250, y + 40); ctx.moveTo(BOSS_X + 250, y + h); ctx.lineTo(BOSS_X + 380, y + 40);
    ctx.moveTo(BOSS_X - 400, y + 120); ctx.lineTo(BOSS_X + 400, y + 120); ctx.moveTo(BOSS_X - 400, y + h - 60); ctx.lineTo(BOSS_X + 400, y + h - 60); ctx.stroke();
  }
  // 막히는 느낌을 주는 옅은 방어막
  ctx.globalAlpha = a * (0.12 + 0.06 * Math.sin(S.clock / 80));
  ctx.fillStyle = '#a0d4ff';
  ctx.beginPath(); ctx.ellipse(BOSS_X, BOSS_FEET - 330, 360, 420, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// 체포된 학생과 보스 손을 잇는 포승줄
function drawArrestRope(){

const $ = id => document.getElementById(id);
function updateButtons(){}
let roundEnd = 0, roundToken = 0, roundStatus = 'idle', raidOn = false;
let livePlayers = {};
const hitQueue = [];
const lastPub = {};          // 학생별로 마지막에 보낸 상태 (바뀐 것만 보낸다)
let lastBossPub = '', lastBossPubAt = 0;
const toServer = t => t > 0 ? Math.round((S.serverBase || 0) + t) : 0;
// 남은 시간: 싸우는 중엔 라운드 종료 시각까지, 끝난 뒤엔 끝난 순간의 남은 시간
function liveLeftMs(){
  if(S.phase === 'fight' || S.phase === 'intro') return Math.max(0, roundEnd - serverNow());
  return S.leftAtEnd != null ? S.leftAtEnd : Math.max(0, roundEnd - serverNow());   // 끝난 뒤엔 끝난 순간의 남은 시간
}

function toggleRun(){   // 점검 모드(?sim)에서만 쓴다
  audio();
  if(S.phase === 'victory' || S.phase === 'lose'){ reset(); }
  if(S.phase === 'ready'){ S.phase = 'intro'; S.introT = 0; }
  running = !running;
}

// 접속한 학생(players)을 이름표로 맞춘다: 새로 온 학생은 추가, 나간 학생은 뺀다
function syncStudents(){
  if(!LIVE || !S) return;
  const ids = Object.keys(livePlayers).filter(id => livePlayers[id] && livePlayers[id].name);
  const have = new Map(S.students.map(st => [st.pid, st]));
  let changed = false;
  for(const id of ids){
    const nm = String(livePlayers[id].name).slice(0, 5);   // 이름표에 하트와 겹치지 않게 최대 5글자
    if(!have.has(id)){ S.students.push(newStudent(nm, S.students.length, id)); changed = true; }
    else if(have.get(id).name !== nm){ have.get(id).name = nm; }
  }
  const before = S.students.length;
  S.students = S.students.filter(st => ids.includes(st.pid) || (S.arrest && S.arrest.st === st));
  if(S.students.length !== before) changed = true;
  if(changed){
    S.students.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
    S.students.forEach((st, i) => { st.i = i; });
    layoutTags();
  }
}

// 학생들이 보낸 답을 차례로 처리
function drainHits(){
  while(hitQueue.length){
    const h = hitQueue.shift();
    const st = S.students.find(x => x.pid === h.pid);
    if(!st || !canAct(st)) continue;
    answer(st, !!h.ok, Number(h.sec) || 8);
  }
}

// 새 레이드 시작 (관리자가 보스 레이드로 게임을 시작하면)
function beginRaid(r){
  roundToken = r.token || 0;
  diffIdx = diffFromRound(r);
  hitQueue.length = 0;
  for(const k of Object.keys(lastPub)) delete lastPub[k];
  lastBossPub = '';
  reset();
  S.raidStartServer = serverNow();
  running = true;
  S.phase = 'intro'; S.introT = 0;
}

// 이긴·진 순간: 결과를 남기고 라운드를 끝내 학생 화면도 멈추게 한다
function onRaidEnd(res){
  if(!LIVE || S.result) return;
  S.result = res;
  S.endServer = serverNow();
  S.leftAtEnd = Math.max(0, roundEnd - S.endServer);   // 라운드 종료 시각을 지금으로 바꾸기 전에 남은 시간을 기억
  publish(true);
  FB.update(FB.ref(FB.db), {
    [`rooms/${ROOM}/round/end_time`]: serverNow(),
    [`rooms/${ROOM}/round/raid_result`]: res
  }).catch(() => {});
}

// 학생별 상태·보스 상태를 raid_state로 내보낸다 (바뀐 것만)
function publish(force){
  if(!LIVE || !FB || !S || !roundToken || S.phase === 'ready') return;
  const updates = {};
  const now = S.clock;
  for(const st of S.students){
    if(!st.pid) continue;
    const o = {
      h: st.hearts,
      ko: st.koUntil > now ? toServer(st.koUntil) : 0,
      st: st.stunUntil > now ? toServer(st.stunUntil) : 0,
      ar: S.arrest && S.arrest.st === st ? toServer(S.arrest.end) : 0,
      ce: S.censor && S.censor.set.has(st) ? toServer(S.censor.end) : 0,
      ck: S.checkpoint && S.checkpoint.st === st ? toServer(S.checkpoint.end) : 0,
      tg: st.targetUntil > now ? toServer(st.targetUntil) : 0,
      dmg: Math.round(st.dmg), tk: roundToken
    };
    const key = JSON.stringify(o);
    if(lastPub[st.pid] !== key){ lastPub[st.pid] = key; updates[`rooms/${ROOM}/raid_state/p/${st.pid}`] = o; }
  }
  const boss = {
    hp: Math.round(S.hp), max: Math.round(S.max), ph: S.phase, rage: !!S.rage, en: !!S.enrage,
    stun: bossStunned() ? toServer(S.bossStunUntil) : 0, bar: barricadeUp() ? toServer(S.barricadeUntil) : 0,
    res: S.result || '', tk: roundToken, name: THEMES[themeKey].bossName
  };
  const bkey = JSON.stringify(boss);
  if(bkey !== lastBossPub && (force || serverNow() - lastBossPubAt > 400)){
    lastBossPub = bkey; lastBossPubAt = serverNow();
    updates[`rooms/${ROOM}/raid_state/boss`] = boss;
  }
  if(Object.keys(updates).length) FB.update(FB.ref(FB.db), updates).catch(() => {});
}

function initLive(m){
  FB = m;
  serverNow = m.serverNow;
  const { onValue, onChildAdded, roomRef } = m;
  onValue(roomRef(ROOM, 'round'), snap => {
    const r = snap.val() || {};
    raidOn = !!r.raid_mode;
    roundStatus = r.status || 'idle';
    roundEnd = r.end_time || 0;
    const live = raidOn && roundStatus === 'running' && roundEnd > serverNow();
    if(live && (r.token || 0) !== roundToken && !r.raid_result) beginRaid(r);
    else if(!raidOn || roundStatus === 'idle'){
      if(S.phase !== 'ready' || roundToken){ roundToken = 0; diffIdx = diffFromRound(r); reset(); }
      else if(S.phase === 'ready'){ const d = diffFromRound(r); if(d !== diffIdx){ diffIdx = d; reset(); } }
    }
  });
  onValue(roomRef(ROOM, 'players'), snap => { livePlayers = snap.val() || {}; syncStudents(); });
  onChildAdded(roomRef(ROOM, 'raid_hits'), snap => {
    const h = snap.val();
    if(!h || !h.pid || !roundToken) return;
    if((h.at || 0) < (S.raidStartServer || 0) - 2000) return;   // 지난 판의 답은 무시
    if(S.phase === 'fight') hitQueue.push(h);
  });
  setInterval(() => publish(false), 250);
}
if(LIVE) import('./shared/lib.js?v=20260928g').then(initLive).catch(e => console.error('Firebase 연결 실패', e));

// 효과음은 이 화면을 한 번 눌러야 켜진다 (브라우저 정책)
function refreshSoundBtn(){ $('soundBtn').classList.toggle('hidden', !!(AC && AC.state === 'running')); }
$('soundBtn').onclick = () => { audio(); setTimeout(refreshSoundBtn, 100); };
document.addEventListener('pointerdown', () => { audio(); setTimeout(refreshSoundBtn, 100); });
setInterval(refreshSoundBtn, 1500);
if(!LIVE) document.addEventListener('keydown', e => {
  if(e.code === 'Space'){ e.preventDefault(); toggleRun(); }
  else if(e.key === 'h' || e.key === 'H') manualHit();
});

let lastT = performance.now();
function frame(now){
  let dt = Math.min(5, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  // 다음 프레임을 먼저 예약해 두어, 한 번 오류가 나도 화면이 멈추지 않게 한다
  requestAnimationFrame(frame);
  try {
    if(running){ while(dt > 0){ const step = Math.min(0.05, dt); update(step); dt -= step; } }
    draw();
  } catch(e){ console.error(e); }
}
reset();
// 주소 옵션: ?diff=1~4 난이도(1 보통 ~ 4 지옥) · ?boss=world 세계사 보스로 시작 · ?auto 바로 시작(+&skip 등장 연출 생략) · ?hp=0.4 체력 비율을 정해 두고 시작(화면 점검용)
if(!LIVE) (() => {
  const q = Q;
  const dq = parseInt(q.get('diff'), 10);
  if(dq >= 1 && dq <= DIFFS.length){ diffIdx = dq - 1; reset(); }
  if(q.has('auto')) toggleRun();
  if(q.has('auto') && q.has('skip')){ S.introT = 3; S.bossY = 0; S.landed = true; startFight(); }   // 등장 연출 건너뛰기
  const hp = parseFloat(q.get('hp'));
  if(hp > 0 && hp < 1){
    S.hp = S.ghost = S.max * hp;
    if(hp <= 0.5){ S.rage = true; S.counterAt = 5000; }
    if(hp <= 0.25){ S.enrage = true; S.nextHealAt = 35000; }
  }
  // ?ff=초 : 그만큼 게임을 미리 진행시킨 상태로 보여 준다 (화면 점검용)
  const ff = parseFloat(q.get('ff'));
  if(ff > 0 && running){ for(let i = 0; i < ff * 60; i++){ update(1 / 60); if(S.phase === 'victory' || S.phase === 'lose') break; } }
})();
requestAnimationFrame(frame);
</script>
