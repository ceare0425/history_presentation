<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>세계사 탑 오르기 - 혼자 연습</title>
<style>
  :root{
    --sky1:#1e3c72; --sky2:#2a5298;
    --gold:#e8c76f; --gold-dark:#c5a028;
    --card:#ffffff; --ink:#22314f; --sub:#5b6a8a;
    --good:#2e9e5b; --bad:#d9534f; --line:#e3e8f2;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Malgun Gothic','Pretendard',-apple-system,sans-serif;
    background:linear-gradient(180deg,#0f2447,var(--sky1) 35%,var(--sky2) 65%,#3a6b8a);
    color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:16px; position:relative; overflow:hidden;
  }
  .sky-layer{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .star{ position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; animation:twinkle 3.4s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.85;} }
  .cloud{
    position:absolute; border-radius:50%; background:rgba(255,255,255,.35); filter:blur(8px);
    animation-name:drift; animation-timing-function:linear; animation-iteration-count:infinite;
  }
  @keyframes drift{ from{ transform:translateX(-16vw); } to{ transform:translateX(116vw); } }
  .card{ position:relative; z-index:1; }
  .card{
    width:min(1100px, 94vw);
    height:min(860px, 94vh);
    min-height:560px;
    background:var(--card); border-radius:22px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35); padding:2.6vh 4vw; position:relative; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:6px;
    background:linear-gradient(90deg,var(--gold-dark),var(--gold));
  }
  h1{ font-size:clamp(1.2rem,2.4vw,1.7rem); margin:0 0 1.2vh; text-align:center; color:var(--sky1); flex:0 0 auto; }
  .sub{ text-align:center; color:var(--sub); font-size:1rem; margin-bottom:1.4rem; }

  .view{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .view.center{ justify-content:center; align-items:center; }

  input[type=text], input[type=number]{
    width:100%; padding:14px 16px; font-size:1.15rem; border:2px solid #dfe3ec; border-radius:12px;
    outline:none; margin-bottom:12px; font-family:inherit;
  }
  input[type=text]:focus, input[type=number]:focus{ border-color:var(--gold-dark); }
  button{
    width:100%; padding:14px; font-size:1.1rem; font-weight:700; color:#fff; border:none;
    border-radius:12px; cursor:pointer; background:linear-gradient(90deg,var(--sky1),var(--sky2));
    transition:transform .1s; flex:0 0 auto;
  }
  button:active{ transform:scale(.98); }
  button:disabled{ opacity:.5; cursor:default; }
  button.secondary{ background:#8b96ab; }

  #setupView, #setupView .inner{ width:100%; max-width:520px; }
  #setupView.view.center{ justify-content:flex-start; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  #setupView .inner{ padding-right:4px; padding-bottom:8px; }
  label{ font-size:.85rem; color:var(--sub); display:block; margin:10px 0 4px; text-align:left; }
  .units{ max-height:22vh; overflow-y:auto; border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:6px; text-align:left; }
  .unit-row{ display:flex; align-items:center; gap:8px; padding:5px 4px; font-size:.9rem; }
  .unit-row span.cnt{ color:var(--sub); font-size:.78rem; margin-left:auto; }
  .pool-count{ font-size:.8rem; color:var(--sub); margin:0 0 10px; text-align:left; }
  .pool-count b{ color:var(--sky1); }
  .row{ display:flex; gap:8px; }
  .row > *{ flex:1; margin-bottom:12px; }
  .toggle-row{ display:flex; gap:8px; margin-bottom:12px; }
  .toggle-row button{ flex:1; background:#e6e9f0; color:var(--sub); font-weight:700; }
  .toggle-row button.active{ background:var(--sky1); color:#fff; }
  .class-row{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:12px; }
  .class-row button{ width:auto; padding:10px 0; font-size:.95rem; font-weight:700; background:#e6e9f0; color:var(--sub); border:none; border-radius:10px; cursor:pointer; }
  .class-row button.active{ background:var(--sky1); color:#fff; }
  .setup-msg{ font-size:.85rem; color:var(--bad); min-height:1.2em; margin-bottom:8px; text-align:left; }
  .muted{ color:var(--sub); font-size:.85rem; }

  .waiting{ text-align:center; }
  .waiting .big{ font-size:3rem; margin-bottom:.6rem; }

  .hud{ display:flex; justify-content:space-between; align-items:center; margin-bottom:1vh; flex:0 0 auto; }
  .floor-badge{
    background:linear-gradient(135deg,var(--gold),var(--gold-dark)); color:#3a2c05; font-weight:800;
    border-radius:14px; padding:8px 16px; font-size:1.25rem; box-shadow:0 4px 10px rgba(197,160,40,.4);
  }
  .timer{ font-weight:700; color:var(--sky1); font-variant-numeric:tabular-nums; font-size:1.25rem; }
  .streak{ font-size:.9rem; color:var(--sub); text-align:right; min-height:1.3em; flex:0 0 auto; }

  .qbox{
    background:#f4f6fb; border:2px solid #e3e8f2; border-radius:16px; padding:2.4vh 3vw; margin:1vh 0;
    flex:1 1 auto; min-height:26vh; display:flex; align-items:center; justify-content:center;
    overflow-y:auto;
  }
  .qbox .qtext-inner{
    width:100%; font-size:clamp(1.2rem,2.6vw,1.85rem); line-height:1.65;
    text-align:center; word-break:keep-all; overflow-wrap:break-word;
  }
  .qbox .blank-mark{
    display:inline-block; width:3em; height:0.9em; margin:0 .2em -0.15em;
    border-bottom:4px solid var(--sky1); border-radius:2px;
  }
  .qbox .blank-mark.filled{
    width:auto; height:auto; margin:0 .12em; padding:0 .12em; vertical-align:baseline;
    border-bottom-color:var(--bad); color:var(--bad); font-weight:800;
  }
  .unit-tag-row{ display:flex; align-items:center; gap:8px; margin-bottom:.8vh; flex:0 0 auto; }
  .unit-tag{
    display:inline-block; font-size:.8rem; color:#fff; background:var(--sky2); border-radius:6px;
    padding:3px 10px; flex:0 0 auto;
  }
  .mini-btn{
    width:auto; padding:4px 10px; font-size:.72rem; font-weight:700; border-radius:8px;
    background:#e6e9f0; color:var(--sub); flex:0 0 auto; cursor:pointer; border:none; font-family:inherit;
  }
  .mini-btn.gold{ background:#fff2cc; color:var(--gold-dark); }
  #relearnBtn{ margin-left:auto; }

  .avatar-char{
    text-align:center; font-size:2.4rem; line-height:1; margin:.2vh 0 .4vh;
    flex:0 0 auto; user-select:none;
  }
  .avatar-char.happy{ animation:avatarHappy .8s ease; }
  @keyframes avatarHappy{
    0%{ transform:translateY(0) scale(1) rotate(0deg); }
    25%{ transform:translateY(-16px) scale(1.2) rotate(-10deg); }
    50%{ transform:translateY(0) scale(1.05) rotate(10deg); }
    75%{ transform:translateY(-9px) scale(1.12) rotate(-6deg); }
    100%{ transform:translateY(0) scale(1) rotate(0deg); }
  }
  .avatar-char.sad{ animation:avatarSad .9s ease; }
  @keyframes avatarSad{
    0%{ transform:translateY(0) rotate(0deg) scale(1); }
    20%{ transform:translateY(5px) rotate(-7deg) scale(.97); }
    40%{ transform:translateY(9px) rotate(7deg) scale(.95); }
    60%{ transform:translateY(9px) rotate(-5deg) scale(.95); }
    100%{ transform:translateY(3px) rotate(0deg) scale(.97); }
  }

  .feedback{
    text-align:center; font-weight:800; font-size:1.15rem; border-radius:12px; padding:10px;
    margin-bottom:.8vh; display:none; flex:0 0 auto;
  }
  .feedback.show{ display:block; }
  .feedback.correct{ background:#e6f7ec; color:var(--good); }
  .feedback.wrong{ background:#fbeaea; color:var(--bad); }

  .answer-row{ display:flex; gap:10px; flex:0 0 auto; }
  .answer-row input[type=text]{ flex:1; margin-bottom:0; }
  .answer-row button{ width:auto; padding:14px 28px; flex:0 0 auto; }

  .hint-row{ display:flex; align-items:center; gap:10px; margin-top:8px; flex:0 0 auto; min-height:2.2em; }
  .hint-row button{ width:auto; flex:0 0 auto; padding:8px 14px; font-size:.9rem; }
  .hint-row #endPracticeBtn{ margin-left:auto; background:#c96f5b; }
  .idle-warn{ font-size:.9rem; font-weight:800; color:#c96f5b; }
  .hint-text{ font-size:1.2rem; font-weight:800; letter-spacing:.18em; color:var(--sky1); }

  /* ── 선생님 실시간 쪽지 배너 ── */
  .msg-toolbar{ display:flex; justify-content:flex-end; align-items:center; gap:8px; flex:0 0 auto; margin:-0.4vh 0 .6vh; }
  .msg-toolbar button{ position:relative; width:auto; padding:5px 12px; font-size:.78rem; font-weight:700; background:#dbe6fb; color:var(--sky1); border-radius:999px; }
  .msg-toolbar .report-btn{ background:#ffe6cf; color:#c96f5b; }
  .msg-toolbar .bookmark-btn.active{ background:#fff2cc; color:var(--gold-dark); }
  .msg-toolbar .unread-badge{ position:absolute; top:-6px; right:-6px; background:var(--bad); color:#fff; font-size:.65rem; font-weight:800; border-radius:999px; padding:1px 5px; min-width:16px; text-align:center; }
  /* 선생님과의 대화창 — 관리자 화면과 같은 형태의 채팅창을 학생 쪽에도 그대로 띄운다 */
  .chat-panel{
    position:absolute; inset:0; z-index:6; background:#fff; border-radius:22px;
    display:flex; flex-direction:column; padding:2.4vh 4vw;
  }
  .chat-panel-head{ display:flex; align-items:center; gap:8px; flex:0 0 auto; margin-bottom:1.4vh; }
  .chat-panel-head .title{ font-size:1.1rem; font-weight:800; color:var(--sky1); }
  .chat-panel-head .close{ margin-left:auto; width:auto; flex:0 0 auto; background:#e6e9f0; color:var(--sub); padding:8px 14px; font-size:.9rem; border-radius:10px; }
  .chat-log{ flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:12px; padding:10px; background:#f4f6fb; display:flex; flex-direction:column; gap:8px; }
  .chat-row{ display:flex; align-items:flex-end; gap:6px; }
  .chat-row.me{ justify-content:flex-end; }
  .chat-row.admin{ justify-content:flex-start; }
  .chat-unread{ font-size:.68rem; font-weight:800; color:var(--gold-dark); flex:0 0 auto; }
  .chat-msg{ max-width:78%; padding:8px 12px; border-radius:12px; font-size:.92rem; line-height:1.5; word-break:break-word; }
  .chat-msg.me{ background:var(--sky1); color:#fff; border-bottom-right-radius:3px; }
  .chat-msg.admin{ background:#fff; border:1px solid var(--line); border-bottom-left-radius:3px; }
  .chat-msg .ct{ font-size:.68rem; opacity:.7; margin-top:3px; }
  .chat-input-row{ display:flex; gap:8px; flex:0 0 auto; margin-top:10px; }
  .chat-input-row input[type=text]{ flex:1; margin:0; }
  .chat-input-row button{ width:auto; flex:0 0 auto; padding:12px 20px; }

  .floor-badge{ transition:transform .15s ease; }
  .floor-badge.pop{ animation:floorPop .5s ease; }
  @keyframes floorPop{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.35); filter:drop-shadow(0 0 10px #ffe9a8); }
    100%{ transform:scale(1); }
  }

  .ended{ text-align:center; width:100%; max-width:420px; }
  .ended .big{ font-size:3.4rem; font-weight:800; color:var(--sky1); margin:6px 0; }
  .final-stat{ font-size:1.05rem; font-weight:700; color:var(--sub); margin-bottom:1.2rem; word-break:keep-all; }
  .best-note{ font-size:.85rem; color:var(--gold-dark); font-weight:700; margin-bottom:1.2rem; min-height:1.2em; }

  .hidden{ display:none !important; }

  /* ── '선택 범위 전부 완료' 안내 ── */
  .clear-prompt{
    position:absolute; inset:0; z-index:5; background:rgba(244,246,251,.97);
    display:flex; align-items:center; justify-content:center; padding:6vw; border-radius:22px;
  }
  .clear-box{ text-align:center; max-width:420px; }
  .clear-emoji{ font-size:3.2rem; margin-bottom:.4rem; animation:avatarHappy .8s ease; }
  .clear-title{ font-size:1.3rem; font-weight:800; color:var(--sky1); margin-bottom:.6rem; word-break:keep-all; }
  .clear-sub{ font-size:.95rem; color:var(--sub); margin-bottom:1.5rem; line-height:1.65; word-break:keep-all; }
  .clear-btns{ display:flex; flex-direction:column; gap:10px; }

  /* ── 내 기록 요약 스트립 (setup 화면) ── */
  .record-teaser{
    width:100%; text-align:left; border:2px solid var(--line); background:#f4f6fb;
    border-radius:12px; padding:10px 14px; margin-bottom:12px; cursor:pointer;
    display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; font-family:inherit;
    color:var(--ink); font-weight:700; font-size:.9rem; transition:border-color .15s;
  }
  .record-teaser:hover{ border-color:var(--gold-dark); }
  .record-teaser:disabled, .record-teaser.empty{ cursor:default; color:var(--sub); font-weight:600; }
  .record-teaser:disabled:hover, .record-teaser.empty:hover{ border-color:var(--line); }
  .record-teaser .rt-item{ white-space:nowrap; }
  .record-teaser .rt-more{ margin-left:auto; color:var(--sky1); font-weight:800; }
  .record-teaser.empty .rt-more, .record-teaser:disabled .rt-more{ display:none; }

  /* ── setup 화면 "복습 추천 다시 풀기" 바로가기 ── */
  .review-quick-btn{
    width:100%; text-align:left; border:2px solid var(--gold-dark); background:#fff7e0;
    border-radius:12px; padding:10px 14px; margin-bottom:12px; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; gap:10px; font-family:inherit;
    color:var(--ink); font-weight:700; font-size:.9rem; transition:border-color .15s;
  }
  .review-quick-btn:hover{ border-color:var(--sky1); }
  .review-quick-btn .rq-count{ color:var(--gold-dark); font-weight:800; white-space:nowrap; }

  /* ── 내 학습 기록 대시보드 ── */
  .dash-panel{
    position:absolute; inset:0; z-index:6; background:#fff; border-radius:22px;
    display:flex; flex-direction:column; padding:2.4vh 4vw;
  }
  .dash-head{ display:flex; align-items:flex-start; gap:12px; flex:0 0 auto; margin-bottom:1.4vh; }
  .dash-title{ font-size:1.2rem; font-weight:800; color:var(--sky1); }
  .dash-sub{ font-size:.82rem; color:var(--sub); margin-top:3px; }
  .dash-close{
    margin-left:auto; width:auto; flex:0 0 auto; background:#e6e9f0; color:var(--sub);
    padding:8px 14px; font-size:1rem; border-radius:10px;
  }
  .dash-body{ flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:4px; }

  .dash-section{ margin-bottom:18px; }
  .dash-section h3{ font-size:.9rem; color:var(--ink); margin:0 0 8px; font-weight:800; }
  .dash-section h3 .note{ font-weight:600; color:var(--sub); font-size:.78rem; }

  .dash-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .dash-stats .cell{ background:#f4f6fb; border:1px solid var(--line); border-radius:12px; padding:10px 8px; text-align:center; }
  .dash-stats .cell .k{ font-size:.72rem; color:var(--sub); }
  .dash-stats .cell .v{ font-size:1.15rem; font-weight:800; color:var(--sky1); margin-top:2px; }

  .streak-box{ display:flex; gap:10px; }
  .streak-box .s{ flex:1; background:linear-gradient(135deg,#fff4d9,#ffe8ad); border:1px solid var(--gold); border-radius:12px; padding:10px; text-align:center; }
  .streak-box .s .v{ font-size:1.3rem; font-weight:800; color:var(--gold-dark); }
  .streak-box .s .k{ font-size:.72rem; color:#8a6d1f; margin-top:2px; }
  .streak-box .s.blue{ background:linear-gradient(135deg,#e8f0fb,#d3e4f7); border-color:var(--sky2); }
  .streak-box .s.blue .v{ color:var(--sky1); }
  .streak-box .s.blue .k{ color:var(--sub); }

  .badge-wrap{ display:flex; flex-wrap:wrap; gap:6px; }
  .badge{ background:linear-gradient(135deg,var(--gold),var(--gold-dark)); color:#3a2c05; font-weight:800; font-size:.78rem; border-radius:999px; padding:4px 12px; }

  .utable{ width:100%; border-collapse:collapse; font-size:.82rem; }
  .utable td{ padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; word-break:keep-all; overflow-wrap:anywhere; }
  .utable .uname{ font-weight:700; color:var(--ink); }
  .utable .tag{ font-size:.66rem; font-weight:800; border-radius:6px; padding:1px 6px; margin-left:6px; }
  .utable .tag.weak{ background:#fbeaea; color:var(--bad); }
  .utable .tag.master{ background:#e6f7ec; color:var(--good); }
  .utable .bar{ height:8px; border-radius:5px; background:#e6e9f0; overflow:hidden; min-width:56px; }
  .utable .bar > i{ display:block; height:100%; background:var(--sky2); }
  .utable .bar > i.lo{ background:var(--bad); }
  .utable .bar > i.hi{ background:var(--good); }
  .utable .pct{ font-weight:800; color:var(--sub); white-space:nowrap; text-align:right; }
  .utable button.mini{ width:auto; padding:5px 10px; font-size:.72rem; border-radius:8px; flex:0 0 auto; }
  .utable button.mini:disabled{ opacity:.4; }

  .wrong-list{ max-height:240px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; }
  .wrong-row{ padding:8px 10px; border-bottom:1px solid var(--line); font-size:.82rem; }
  .wrong-row:last-child{ border-bottom:none; }
  .wrong-row .wunit{ display:inline-block; font-size:.7rem; color:var(--sky1); background:#eef2fb; padding:1px 6px; border-radius:6px; margin-right:6px; }
  .wrong-row .wtext{ color:var(--ink); }
  .wrong-row .wans{ display:block; color:var(--sub); font-size:.76rem; margin-top:2px; }
  .dash-empty{ color:var(--sub); font-size:.85rem; padding:8px 0; line-height:1.6; }

  .ptable{ width:100%; border-collapse:collapse; font-size:.84rem; }
  .ptable td{ padding:8px 6px; border-bottom:1px solid var(--line); }
  .ptable td:first-child{ color:var(--ink); font-weight:700; white-space:nowrap; }
  .ptable .pv{ color:var(--sky1); font-weight:800; white-space:nowrap; text-align:right; padding-right:12px; }
  .ptable .pr{ color:var(--sub); width:99%; }
  .ptable .pr b{ color:var(--good); }

  /* ── 연습 방식: 👹 보스 레이드(화면 반쪽에 보스) · 🃏 암기 카드 ── */
  .mode-desc{ font-size:.8rem; color:var(--sub); margin:-6px 0 12px; text-align:left; line-height:1.55; word-break:keep-all; }
  .toggle-row.small button{ padding:10px 4px; font-size:.9rem; }
  #playView{ flex-direction:row; gap:14px; }
  .quiz-col{ flex:1 1 0; min-width:0; min-height:0; display:flex; flex-direction:column; position:relative; }
  .raid-frame{ flex:1.3 1 0; min-width:0; align-self:center; aspect-ratio:16/9; background:#06060b; border-radius:16px; overflow:hidden; position:relative; }
  .raid-frame iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
  .raid-frame .raid-fail{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; padding:20px; text-align:center; font-weight:700; }
  body.raid-mode .card{ width:min(1680px, 98vw); padding:2vh 1.4vw; }
  body.raid-mode .avatar-char, body.card-mode .avatar-char{ display:none; }
  .qbox{ position:relative; }
  .raid-hud{ display:flex; align-items:center; gap:10px; margin:0 0 .6vh; padding:8px 12px; border-radius:14px; background:#1b1d33; color:#fff; font-weight:800; flex:0 0 auto; }
  .raid-hud .rb-name{ font-size:.9rem; white-space:nowrap; }
  .raid-hud .rb-bar{ flex:1; height:14px; background:#3a1a1a; border-radius:8px; overflow:hidden; border:2px solid #0b0b12; }
  .raid-hud .rb-bar i{ display:block; height:100%; width:100%; background:linear-gradient(#ff6b5a,#b0172a); transition:width .3s; }
  .raid-hud .rb-hearts{ font-size:1.1rem; letter-spacing:1px; color:#ff4d5e; white-space:nowrap; }
  .raid-hud .rb-hearts .lost{ color:rgba(255,255,255,.25); }
  .raid-hud .rb-hearts .sh{ font-size:.92rem; }
  .raid-check, .raid-warn{ margin:0 0 .6vh; padding:8px 12px; border-radius:14px; font-weight:900; text-align:center; font-size:1rem; flex:0 0 auto; }
  .raid-check{ background:#ffe14d; color:#3a2a00; animation:raidPulse .5s ease-in-out infinite alternate; }
  .raid-warn{ background:#ff4d3a; color:#fff; animation:raidPulse .25s ease-in-out infinite alternate; }
  @keyframes raidPulse{ from{ transform:scale(1); } to{ transform:scale(1.02); } }
  .raid-block{ position:absolute; inset:0; z-index:4; display:flex; align-items:center; justify-content:center; background:rgba(10,10,20,.72); border-radius:16px; }

function buildBackground(){
  const layer = el('skyLayer');
  const frag = document.createDocumentFragment();
  for(let i=0;i<25;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = (Math.random()*100)+'%';
    s.style.top = (Math.random()*45)+'%';
    s.style.animationDelay = (Math.random()*3.4)+'s';
    frag.appendChild(s);
  }
  for(let i=0;i<4;i++){
    const c = document.createElement('div');
    c.className = 'cloud';
    const size = 50 + Math.random()*70;
    c.style.width = size+'px';
    c.style.height = (size*0.45)+'px';
    c.style.top = (8 + Math.random()*30)+'%';
    c.style.animationDuration = (35 + Math.random()*30)+'s';
    c.style.animationDelay = (-Math.random()*35)+'s';
    frag.appendChild(c);
  }
  layer.appendChild(frag);
}
buildBackground();

// ══════════════ 👹 혼자 보스 레이드 ══════════════
// 화면 왼쪽 반에 raid.html?solo 를 띄우고, 답을 낼 때마다 window.SOLO.answer()로 넘긴다.
// 보스·목숨·제한 시간(5분)은 레이드 화면이 정하고, 이 화면은 250ms마다 state()를 읽어 표시한다.
const RAID_SAFETY_MS = 330000;   // 레이드 화면을 못 불러와도 이 시간이 지나면 연습을 끝낸다
let raidWin = null, raidLast = null, raidEnding = false, raidLoadTimer = null;
let raidLastHearts = null, raidLastShields = null;
function raidApi(){ try{ return raidWin && raidWin.SOLO ? raidWin.SOLO : null; }catch(_e){ return null; } }
function startRaidFrame(){
  stopRaidFrame();
  raidLast = null; raidEnding = false; raidLastHearts = null; raidLastShields = null;
  const f = document.createElement('iframe');
  f.title = '보스 레이드';
  f.src = '../raid.html?solo=1&boss=world&name=' + encodeURIComponent(myName()) + '&v=20261001c';
  el('raidFrameWrap').appendChild(f);
  const t0 = Date.now();
  raidLoadTimer = setInterval(()=>{
    let api = null;
    try{ api = f.contentWindow && f.contentWindow.SOLO; }catch(_e){}
    if(api){
      clearInterval(raidLoadTimer); raidLoadTimer = null;
      raidWin = f.contentWindow;
      api.start(sessionRaidDiff);
      api.audio();
    } else if(Date.now() - t0 > 15000){
      clearInterval(raidLoadTimer); raidLoadTimer = null;
      el('raidFrameWrap').innerHTML = '<div class="raid-fail">보스 화면을 불러오지 못했어요. 문제는 계속 풀 수 있어요.</div>';
    }
  }, 100);
}
function stopRaidFrame(){
  if(raidLoadTimer){ clearInterval(raidLoadTimer); raidLoadTimer = null; }
  raidWin = null;
  el('raidFrameWrap').innerHTML = '';
}
// 지금 답을 낼 수 없는 이유 (없으면 null)
function raidBlockInfo(s){
  if(!s) return { icon:'👹', text:'보스를 불러오는 중…', sub:'문제를 먼저 읽어 두세요' };
  if(s.phase === 'ready' || s.phase === 'intro') return { icon:'👹', text:'보스 등장!', sub:'곧 싸움이 시작돼요 · 문제를 먼저 읽어 두세요' };
  if(s.result) return null;
  if(s.ko > 0) return { icon:'💀', text:'쓰러졌어요!', sub:`${Math.ceil(s.ko/1000)}초 뒤에 부활해요` };
  if(s.stun > 0) return { icon:'😵', text:'기절했어요!', sub:`${Math.ceil(s.stun/1000)}초 뒤에 다시 싸울 수 있어요` };
  return null;
}
function raidCanAnswer(){
  if(sessionMode !== 'raid') return true;
  if(raidEnding) return false;
  if(!raidApi()) return !raidLoadTimer;   // 못 불러왔으면 문제 풀기만 계속
  return !raidBlockInfo(raidLast);
}
function updateRaidUI(){
  const api = raidApi();
  const s = api ? api.state() : null;
  if(s) raidLast = s;
  const b = api || raidLoadTimer ? raidBlockInfo(s) : null;
  el('raidBlock').classList.toggle('hidden', !b);
  if(b){ el('raidBlockIcon').textContent = b.icon; el('raidBlockText').textContent = b.text; el('raidBlockSub').textContent = b.sub; }
  if(!s){ el('timerVal').textContent = '5:00'; return; }
  el('timerVal').textContent = fmtTime(Math.ceil(s.left / 1000));
  el('raidBossName').textContent = '👹 ' + s.bossName;
  el('raidHpFill').style.width = Math.max(0, Math.min(100, s.hp / Math.max(1, s.max) * 100)) + '%';
  const lost = Math.max(0, s.maxHearts - s.hearts);
  el('raidHearts').innerHTML = '♥'.repeat(Math.max(0, s.hearts)) + '<span class="lost">' + '♥'.repeat(lost) + '</span>'
    + (s.shields ? ' <span class="sh">' + '🛡️'.repeat(s.shields) + '</span>' : '') + (s.ko > 0 ? ' 💀' : '');
  // 맞았을 때 붉게, 방패로 막았을 때 파랗게 번쩍
  if(raidLastHearts != null && s.hearts < raidLastHearts) flashRaid('');
  else if(raidLastHearts != null && s.hearts === raidLastHearts && raidLastShields != null && s.shields < raidLastShields && !(s.ko > 0)) flashRaid('shield');
  raidLastHearts = s.hearts; raidLastShields = s.shields;
  const g = s.guard;
  el('raidWarn').classList.toggle('hidden', !g || !!s.result);
  if(g) el('raidWarn').textContent = `⚠ ${g.label.replace('😵 ', '')} 예고! ${Math.ceil(g.left/1000)}초 안에 다음 문제를 맞히면 막아요`;
  const info = s.arrest ? `🔗 포승줄에 묶였어요! 정답 ${s.arrest.need - s.arrest.got}개를 더 맞히면 풀려나요 · ${Math.ceil(s.arrest.left/1000)}초`
    : s.check ? `📋 ${s.checkName || '불심 검문'}! ${Math.ceil(s.check/1000)}초 안에 정답을 내면 보스가 기절해요!` : '';
  el('raidCheck').classList.toggle('hidden', !info || !!s.result);
  if(info) el('raidCheck').textContent = info;
  el('qbox').classList.toggle('raid-censor', s.censor > 0 && !s.result);
  if(s.result && !raidEnding){
    // 보스가 쓰러지는 연출·결과 화면을 잠깐 보여 준 뒤 종료 화면으로
    raidEnding = true;
    setTimeout(()=>{ if(!ended && sessionMode === 'raid') showEndedView(); }, s.result === 'win' ? 6500 : 3500);
  }
}
// 🧍 혼자 보스 레이드 칭호: 이긴 판(정답 1개 이상)을 titles log/solo<시작 시각>_<종류>로 남긴다 (shared/titles.js가 칭호로 바꿈)
function recordSoloRaidTitles(r){
  if(!r || !sessionStartedAt) return;
  if(r.parries >= 10) titles.unlockHidden('soloparry');                 // 숨은 칭호 '철벽 수비'
  if(r.result !== 'win' || correctCount < 1) return;
  const keys = ['soloraidwin'];
  for(let d = 2; d <= sessionRaidDiff + 1; d++) keys.push('soloraidd' + d);   // 어려움(2)~지옥(4): 그 난이도 이하 칭호도 함께
  titles.recordLog('solo' + sessionStartedAt, keys);
  if(r.used <= 120000) titles.unlockHidden('soloswift');                // 숨은 칭호 '번개 토벌'
}
function flashRaid(kind){
  const f = document.createElement('div');
  f.className = 'raid-flash' + (kind ? ' ' + kind : '');
  document.body.appendChild(f);
  setTimeout(()=> f.remove(), 600);

// ══════════════ 🃏 암기 카드 ══════════════
// 문제를 보고 답을 떠올린 뒤 '정답 보기' → 알았어요/몰랐어요를 스스로 고른다. 스스로 매기는 것이라 정답률·칭호에는 넣지 않고,
// '몰랐어요' 카드만 wrong_items에 남겨 🔁 복습 추천으로 이어지게 한다(탑 오르기·레이드에서 실제로 맞혀야 빠짐).
const CARD_MAX_SHOWS = 3;   // 몰랐던 카드는 3~5장 뒤에 다시 — 한 카드는 최대 3번까지
let cardDeck = [], cardRevealed = false, cardSeen = 0, cardKnownFirst = 0, cardUnknown = new Set(), cardTotal = 0, cardShows = {};
let cardDone = new Set();   // 한 번이라도 알았어요/몰랐어요를 고른 카드
let cardFinished = false;
function startCardDeck(pool, order, weight){
  const src = pool.map(([qid, q])=>[qid, q]);
  if(order === 'sequential') cardDeck = src.map(([qid])=>qid);
  else {
    const wFn = weight === 'recent' ? recencyWeightFn(src.map(([,q])=>q.unit)) : null;
    cardDeck = wFn ? weightedSample(src, wFn, src.length) : shuffle(src.map(([qid])=>qid));
  }
  cardTotal = cardDeck.length;
  cardRevealed = false; cardSeen = 0; cardKnownFirst = 0; cardUnknown = new Set(); cardShows = {}; cardFinished = false; cardDone = new Set();
}
function updateCardUI(){
  el('cardRevealBtn').classList.toggle('hidden', cardRevealed);
  el('cardKnowBtn').classList.toggle('hidden', !cardRevealed);
  el('cardDontBtn').classList.toggle('hidden', !cardRevealed);
  el('modeBadge').textContent = `🃏 남은 카드 ${cardDeck.length + (currentQid ? 1 : 0)}장`;
}
function showNextCard(){
  while(cardDeck.length && !questionsObj[cardDeck[0]]) cardDeck.shift();   // 그 사이 지워진 문제는 건너뛴다
  if(!cardDeck.length){ currentQid = null; cardFinished = true; showEndedView(); return; }
  const qid = cardDeck.shift();
  currentQid = qid;
  currentQuestion = questionsObj[qid];
  currentStartedAt = serverNow();
  cardShows[qid] = (cardShows[qid] || 0) + 1;
  cardRevealed = false;
  renderQuestion({ id: qid, text: currentQuestion.question, unit: currentQuestion.unit, page: currentQuestion.page });
  el('answerInput').disabled = true;
  el('answerInput').blur();
  if(cardShows[qid] > 1) el('unitTag').textContent = '🔁 다시 · ' + el('unitTag').textContent;
  updateCardUI();
}
function revealCard(){
  if(ended || sessionMode !== 'card' || !currentQuestion || cardRevealed) return;
  cardRevealed = true;
  lastActiveAt = serverNow();
  const answers = currentQuestion.answers || [];
  const marks = el('qText').querySelectorAll('.blank-mark');
  marks.forEach(bm=>{ bm.textContent = answers[0] || ''; bm.classList.add('reveal'); });
  if(!marks.length || answers.length > 1){
    const d = document.createElement('div');
    d.className = 'card-answer';
    d.textContent = (marks.length ? '다른 정답: ' + answers.slice(1).join(' / ') : '정답: ' + answers.join(' / '));
    el('qText').appendChild(d);
  }
  updateCardUI();
}
function judgeCard(knew){
  if(ended || sessionMode !== 'card' || !cardRevealed || !currentQuestion) return;
  lastActiveAt = serverNow();
  const qid = currentQid, q = currentQuestion;
  cardSeen += 1;
  cardDone.add(qid);
  if(knew){ if(cardShows[qid] === 1) cardKnownFirst += 1; }
  else {
    cardUnknown.add(qid);
    wrongMap.set(qid, { qid, unit: q.unit || '(기타)', qtext: q.question, answer: (q.answers||[])[0] || '', ts: serverNow() });
    if(cardShows[qid] < CARD_MAX_SHOWS) cardDeck.splice(Math.min(cardDeck.length, 3 + Math.floor(Math.random()*3)), 0, qid);
  }
  syncSoloLog(false);
  showNextCard();
}
el('cardRevealBtn').onclick = revealCard;
el('cardKnowBtn').onclick = () => judgeCard(true);
el('cardDontBtn').onclick = () => judgeCard(false);
document.addEventListener('keydown', e=>{
  if(sessionMode !== 'card' || ended || chatPanelOpen || el('playView').classList.contains('hidden')) return;
  const ae = document.activeElement;
  if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && !ae.disabled) return;
  if(!cardRevealed && (e.code === 'Space' || e.key === 'Enter')){ e.preventDefault(); revealCard(); }
  else if(cardRevealed && e.key === 'ArrowRight'){ e.preventDefault(); judgeCard(true); }    // → 알았어요 (오른쪽 버튼)
  else if(cardRevealed && e.key === 'ArrowLeft'){ e.preventDefault(); judgeCard(false); }    // ← 몰랐어요 (왼쪽 버튼)
});

function currentPool(){
  if(roundState && roundState.qids && roundState.qids.length>0){
    return roundState.qids.filter(qid=>questionsObj[qid]).map(qid=>[qid, questionsObj[qid]]);
  }
  return [];
}

function assignNextQuestion(){
  const pool = currentPool();
  if(pool.length===0){
    currentQid = null; currentQuestion = null; currentStartedAt = null;
    renderQuestion(null);
    return;
  }

  // 선택 범위를 한 번씩 다 맞히기 전까지는 아직 못 맞힌 문제만 낸다 ('계속 연습하기' 뒤부터 전체 범위 복습)
  const firstPass = !allClearedPrompted;
  if(firstPass) retryList = retryList.filter(r=>!clearedQids.has(r.qid));   // 복습 차례 전에 이미 맞힌 문제는 빼기

  // 오답 복습: 다시 낼 때가 된 문제가 있으면 그 문제를 먼저 출제한다
  retryList.forEach(r=>r.wait--);
  const dueIdx = retryList.findIndex(r=> r.wait<=0 && questionsObj[r.qid] && r.qid!==lastQid);
  if(dueIdx !== -1){
    const [due] = retryList.splice(dueIdx, 1);
    currentQid = due.qid;
    currentQuestion = questionsObj[due.qid];
    currentStartedAt = serverNow();
    currentIsRetry = true;
    lastQid = due.qid;
    renderQuestion({ id: due.qid, text: currentQuestion.question, unit: currentQuestion.unit, page: currentQuestion.page });
    el('unitTag').textContent = '🔁 복습 · ' + currentQuestion.unit + (currentQuestion.page ? ' · ' + currentQuestion.page : '');
    return;
  }
  currentIsRetry = false;

  if(firstPass) queue = queue.filter(qid=>!clearedQids.has(qid));
  if(queue.length===0){
    const left = firstPass ? pool.filter(([qid])=>!clearedQids.has(qid)) : pool;
    const src = left.length ? left : pool;
    if(roundState.order === 'sequential'){
      queue = src.map(([qid])=>qid);
    } else {
      const wFn = roundState.weight === 'recent' ? recencyWeightFn(pool.map(([,q])=>q.unit)) : null;
      queue = !wFn ? shuffle(src.map(([qid])=>qid))
        : firstPass ? weightedSample(src, wFn, src.length)   // 겹치지 않게 한 번씩, 최근 단원일수록 앞쪽에
        : weightedQueue(src, wFn);
      if(queue.length>1 && queue[0]===lastQid){
        [queue[0],queue[1]] = [queue[1],queue[0]];
      }
    }
  }
  const qid = queue.shift();
  currentQid = qid;
  currentQuestion = questionsObj[qid];
  currentStartedAt = serverNow();
  lastQid = qid;
  renderQuestion({ id: qid, text: currentQuestion.question, unit: currentQuestion.unit, page: currentQuestion.page });
}

let feedbackTimer = null;
function flashFeedback(correct, correctAnswer, gain, wasRetry, usedHint){
  const f = el('feedback');
  f.classList.add('show');
  if(correct){
    f.classList.remove('wrong'); f.classList.add('correct');
    const tail = usedHint ? ' (힌트 사용)' : '';
    if(sessionMode === 'raid') f.textContent = (wasRetry ? '🔁 복습 문제 정답! ' : '정답! ') + '💥 보스 공격' + tail;
    else f.textContent = wasRetry ? `🔁 복습 문제 정답! +${gain}층${tail} 🎉` : `정답! +${gain}층${tail} 올라갑니다 🎉`;
  } else {
    f.classList.remove('correct'); f.classList.add('wrong');
    f.textContent = `아쉬워요! 곧 다시 나옵니다`;
    fillBlanksWithAnswer(correctAnswer);
  }
  clearTimeout(feedbackTimer);
  feedbackTimer = setTimeout(()=>{ f.classList.remove('show'); }, correct ? 400 : 2000);
}

function submitAnswer(){
  if(sessionMode === 'card' || !raidCanAnswer()) return;   // 레이드: 쓰러짐·기절·등장 연출 중엔 답을 낼 수 없다
  const text = el('answerInput').value.trim();
  if(!text || !currentQid || !currentQuestion || ended) return;
  el('submitBtn').disabled = true;
  el('answerInput').disabled = true;
  el('hintBtn').disabled = true;

  const q = currentQuestion;
  const answeredQid = currentQid;
  const wasRetry = currentIsRetry;
  const usedHint = hintUsed;
  const elapsed = (serverNow() - currentStartedAt) / 1000;
  const correct = isCorrect(text, q.answers);
  titles.recordAnswer(answeredQid, correct);
  if(sessionMode === 'raid'){ const api = raidApi(); if(api) api.answer(correct, elapsed); }   // 정답이면 보스 공격, 틀리면 반격
  let gain = 0;

  const uName = q.unit || '(기타)';
  const uStat = unitStats[uName] || (unitStats[uName] = { c:0, w:0 });
  uStat[correct ? 'c' : 'w'] += 1;
  const qStat = qStats[answeredQid] || (qStats[answeredQid] = { c:0, w:0 });
  qStat[correct ? 'c' : 'w'] += 1;
  if(correct){
    qStat.last = serverNow(); // 마지막으로 맞힌 시각 — 오래되면 복습 추천에 다시 뜬다
    wrongMap.delete(answeredQid); // 끝까지 못 맞힌 문제만 오답 노트에 남도록, 맞히면 제거
  } else {
    wrongMap.set(answeredQid, { qid: answeredQid, unit: uName, qtext: q.question, answer: q.answers[0], ts: serverNow() });
  }

  if(correct){
    gain = usedHint ? 1 : computeGain(elapsed);
    floor += gain;
    correctCount += 1;
    streak += 1;
    retryMiss[answeredQid] = 0;
    clearedQids.add(answeredQid);
  } else {
    wrongCount += 1;
    streak = 0;
    // 틀린 문제는 잠시 후 다시 출제. 틀릴수록 간격을 늘리고 RETRY_TRIES번까지만 강제로 다시 낸다
    const misses = (retryMiss[answeredQid] = (retryMiss[answeredQid]||0) + 1);
    if(misses < RETRY_TRIES && !retryList.some(r=>r.qid===answeredQid)){
      retryList.push({ qid: answeredQid, wait: RETRY_GAP + Math.min(6, (misses-1)*2) });
      if(retryList.length > RETRY_MAX) retryList.shift();
    }
    // 다음 문제로 넘어간 뒤에도 방금 틀린 문제를 신고할 수 있게 남겨둔다 (이미 신고한 문제는 다시 띄우지 않음)
    if(!reportedQids.has(answeredQid)){
      lastWrongInfo = { qid: answeredQid, unit: uName, qtext: q.question, answer: q.answers[0] };
    }
  }

  el('floorVal').textContent = floor;
  el('streakVal').textContent = streak >= 2 ? `🔥 ${streak}연속 정답!` : '';
  if(floor > lastFloor) popFloorBadge();
  lastFloor = floor;
  syncSoloLog(false);
  if(streak >= 20) titles.unlockHidden('flawless');                      // 숨은 칭호 '무결점' (20연속 정답)
  if(correctCount >= 100) titles.unlockHidden('marathon');               // 숨은 칭호 '마라토너'
  flashFeedback(correct, q.answers[0], gain, wasRetry, usedHint);
  playCharacterReaction(correct);

  setTimeout(()=>{
    if(ended) return;
    if(maybeShowClearPrompt()) return;   // 선택 범위를 다 풀었으면 계속할지 물어본다 (입력창은 잠근 채로)
    el('submitBtn').disabled = false; el('answerInput').disabled = false;
    assignNextQuestion();
  }, correct ? 400 : 2000);
}

// 이번 세션에서 고른 주제(범위)를 사람이 읽기 좋은 문구로. 예: 「08. …」 / 「08. …」 외 2개 주제 / 전체 범위
function selectedRangeLabel(){
  const u = sessionUnits;
  if(!u || !u.length) return '전체 범위';
  if(u.length === 1) return `「${u[0]}」`;
  return `「${u[0]}」 외 ${u.length - 1}개 주제`;
}

// 선택한 범위의 문제를 한 번씩 모두 맞혔는지 검사하고, 그렇다면 계속/종료 안내를 띄운다 (세션당 1회).
function maybeShowClearPrompt(){
  if(allClearedPrompted || ended) return false;
  const pool = currentPool();
  if(pool.length === 0) return false;
  let done = 0;
  for(const [qid] of pool){ if(clearedQids.has(qid)) done++; }
  if(done < pool.length) return false;

  allClearedPrompted = true;
  if(sessionMode === 'raid'){ queue = []; return false; }   // 레이드는 멈추지 않고 같은 범위를 다시 섞어 계속
  paused = true;
  pausedAt = serverNow();
  const total = correctCount + wrongCount;
  const acc = total ? Math.round(100*correctCount/total) : 0;
  el('clearSub').textContent =
    `선택한 ${selectedRangeLabel()}의 문제 ${pool.length}개를 한 번씩 모두 맞혔어요. 지금 ${floor}층 · 정답률 ${acc}%. 계속하면 같은 범위가 복습으로 다시 나와요.`;
  el('clearPrompt').classList.remove('hidden');
  return true;
}

function resumeFromClear(){
  el('clearPrompt').classList.add('hidden');
  lastActiveAt = serverNow(); // 안내를 읽고 버튼을 누른 것도 활동으로 센다
  if(paused){
    if(roundState) roundState.end_time += serverNow() - pausedAt;  // 안내 보는 동안 흐른 시간만큼 제한시간 연장
    paused = false;
  }
}

// Ctrl 키만 눌렀다 떼면 초성 힌트 보기
// - Ctrl+V 같은 조합키, Ctrl+휠(화면 확대)·Ctrl+클릭으로 쓴 경우는 무시
// - 채팅·답장 입력칸에 커서가 있을 때도 무시 (정답 입력칸만 허용)
let ctrlAlone = false;

// 연습 기록을 solo_log에 남긴다.
// 첫 호출 때 항목을 만들고 그 뒤로는 같은 항목을 갱신하므로,
// 학생이 제한시간 전에 창을 닫거나 나가도 마지막으로 갱신된 상태가 남는다.
// final=true 는 정상 종료(제한시간 끝) 또는 확정 이탈을 뜻한다.
// 실제로 연습이 끝난 시각. 폰 화면이 꺼지거나 탭이 뒤로 가면 타이머가 멈춰서, 제한 시간·1분 무응답 종료가
// 한참 뒤(다시 화면을 켜거나 창을 닫을 때)에야 처리될 수 있다. '모두 맞혔어요' 안내를 띄운 채 두는 동안도 타이머가 멈춘다.
// 그래서 지금 시각을 그대로 쓰지 않고 제한 시간 끝, 마지막 활동 + 1분 중 이른 시각으로 자른다.
function soloEndAt(){
  const now = serverNow();
  let end = now, idle = false;
  if(roundState && roundState.end_time && !paused) end = Math.min(end, roundState.end_time);
  if(lastActiveAt && lastActiveAt + IDLE_LIMIT_MS < end){ end = lastActiveAt + IDLE_LIMIT_MS; idle = true; }
  return { end, idle };
}

function syncSoloLog(final){
  if(correctCount + wrongCount === 0 && !(sessionMode === 'card' && cardSeen > 0)) return; // 문제를 하나도 안 푼 세션은 기록하지 않음
  const name = (el('nameInput').value.trim() || '(이름 없음)').slice(0, 20);
  const fin = final ? soloEndAt() : null;
  const data = {
    name,
    cls: sessionClassKey || null,
    ts: fin ? fin.end : serverNow(),
    started_ts: sessionStartedAt || null,
    end_ts: fin ? fin.end : null,
    end_fix: fin ? true : null,   // 종료 시각을 제한 시간·마지막 활동 기준으로 잘라 저장한 기록 (2026-09-30부터)
    ended: !!final,
    idle_end: (fin && (idleEnded || fin.idle) && !relearnEnded) || null,
    relearn_end: (final && relearnEnded) || null,
    duration_sec: sessionDuration || null,
    order: sessionOrder || null,
    weight: sessionWeight || null,
    units: (sessionUnits && sessionUnits.length) ? sessionUnits : 'all',
    floor: floor,
    correct: correctCount,
    wrong: wrongCount,
    hints: hintCount,
    unit_stats: Object.entries(unitStats).map(([u,x]) => ({ u, c: x.c, w: x.w })),
    q_stats: Object.entries(qStats).map(([qid,x]) => ({ qid, c: x.c, w: x.w, last: x.last||null })),
    wrong_items: [...wrongMap.values()].slice(-30),
    mode: sessionMode !== 'tower' ? sessionMode : null,   // 없으면 탑 오르기
    raid_diff: sessionMode === 'raid' ? sessionRaidDiff + 1 : null,   // 1 보통 ~ 4 지옥
    raid_result: sessionMode === 'raid' ? ((raidLast && raidLast.result) || (final ? 'stop' : null)) : null,
    cards_total: sessionMode === 'card' ? cardTotal : null,
    cards_seen: sessionMode === 'card' ? cardSeen : null,
    cards_known: sessionMode === 'card' ? cardKnownFirst : null,     // 처음 보자마자 '알았어요'
    cards_unknown: sessionMode === 'card' ? cardUnknown.size : null  // 한 번이라도 '몰랐어요'
  };
  try{
    if(soloLogRef) update(soloLogRef, data);
    else soloLogRef = push(roomRef(ROOM, 'solo_log'), data);
  }catch(_e){ /* 기록 실패해도 연습에는 지장 없음 */ }
}

function logSoloSession(){

  soloLogged = true;

}

let chatUnsub = null;
let chatChangeUnsub = null;
let chatPanelOpen = false;
let pendingAdminMsgKeys = []; // 대화창이 닫혀 있는 동안 도착해 아직 확인 안 한 선생님 쪽지 key들
let unreadIncomingCount = 0;
let lastAdminMsgText = ''; // 연습 종료 팝업에 보여줄, 가장 최근 받은 선생님 쪽지 내용
let missedPopupKeys = []; // 연습 종료 팝업에서 "확인했어요/답장"을 누르면 읽음 처리할 key들

// 수업 참여(play.html)에 들어갔다가 혼자 연습으로 넘어오면, 수업 참여 화면이 다른 탭에 남아 있거나
// 폰에서 뒤로 밀린 채 연결이 살아 있어 '연결 끊김'이 기록되지 않는다. 그러면 관리자 화면 ④ 실시간 현황과
// ⑤ 온라인 연습 학생 두 곳에 같은 학생이 뜬다. 그래서 혼자 연습을 시작할 때 같은 기기에서 참여했던
// 수업 게임 기록(두 과목 모두)을 찾아 끊긴 것으로 표시한다 → ④에 '연결 끊김'으로 보이다가 10초 뒤 자동으로 빠진다.
// (left_solo 표시를 본 수업 참여 탭은 스스로 나간다)
function leaveClassGame(cls, name){
  for(const room of ['world', 'korea']){
    let pid = '';
    try{ pid = localStorage.getItem('rg_fb_' + room + '_player_id') || ''; }catch(_e){}
    if(!pid) continue;
    runTransaction(roomRef(room, 'players', pid), (cur) => {
      if(cur === null) return null;   // 처음엔 이 기기에 캐시된 값이 없어 null로 불린다 — 서버 값으로 다시 불리도록 넘긴다(실제로 없으면 그대로 없음)
      if(cur.name !== name || (cur.cls && cur.cls !== cls)) return undefined;   // 다른 학생이거나 이미 나갔으면 그대로 둔다
      if(cur.left_solo && cur.offlineAt) return undefined;
      return { ...cur, offlineAt: serverNow(), left_solo: true };
    }).catch(()=>{});
  }
}

function startPresenceAndChat(){
  const cls = sessionClassKey;
  const name = (el('nameInput').value.trim() || '').slice(0, 20);
  if(!cls || !name) return;
  stopPresenceAndChat();
  leaveClassGame(cls, name);

  const pRef = presenceRef(ROOM, cls, name);
  presenceSessionRef = pRef;
  // 와이파이가 잠깐 끊기거나 화면이 꺼졌다 켜지는 등으로 연결이 끊기면 서버가 onDisconnect를
  // 실행해 온라인 표시를 지운다. ".info/connected"는 재연결될 때마다 다시 true가 되므로,
  // 그때마다 onDisconnect와 실제 값을 다시 등록해서 연습 중인데도 목록에서 사라지는 일을 막는다.
  presenceConnUnsub = onValue(ref(db, '.info/connected'), (snap) => {
    if(snap.val() === true){
      onDisconnect(pRef).remove();
      set(pRef, { since: Date.now() }).catch(()=>{});
    }
  });

  const cRef = chatRef(ROOM, cls, name);
  const mySeen = chatSeenKeys = new Set();
  chatMsgs = {};
  get(cRef).then(snap => {
    if(chatSeenKeys !== mySeen) return;
    snap.forEach(msgSnap => { chatSeenKeys.add(msgSnap.key); chatMsgs[msgSnap.key] = msgSnap.val(); });
  }).catch(()=>{}).finally(() => {
    // 불러오는 사이 연습이 끝났거나 새 연습이 시작됐으면 이 세션의 구독은 걸지 않는다 (안 그러면 풀리지 않는 구독이 남아 쪽지가 두 번 세어짐)
    if(chatSeenKeys !== mySeen) return;
    chatUnsub = onChildAdded(cRef, (msgSnap) => {
      if(chatSeenKeys.has(msgSnap.key)) return;
      chatSeenKeys.add(msgSnap.key);
      const msg = msgSnap.val();
      if(!msg) return;
      chatMsgs[msgSnap.key] = msg;
      if(msg.from === 'admin'){
        if(chatPanelOpen){
          // 대화창을 보고 있는 중에 온 쪽지는 관리자 쪽과 마찬가지로 바로 읽음 처리한다.
          update(ref(db, `messages/${ROOM}/${cls}/${name}/${msgSnap.key}`), { read: true }).catch(()=>{});
        } else {
          // 대화창이 닫혀 있으면 화면에 바로 띄우지 않고 "💬쪽지" 버튼에 숫자 배지만 올린다.
          lastAdminMsgText = msg.text;
          pendingAdminMsgKeys.push(msgSnap.key);
          unreadIncomingCount++;
          updateMsgBadge();
        }
      }
      if(chatPanelOpen) renderChatPanel();
    });
    chatChangeUnsub = onChildChanged(cRef, (msgSnap) => {
      const msg = msgSnap.val();
      if(!msg) return;
      chatMsgs[msgSnap.key] = msg;
      if(chatPanelOpen) renderChatPanel();
    });
  });
}

function stopPresenceAndChat(){
  if(presenceConnUnsub){ presenceConnUnsub(); presenceConnUnsub = null; }
  if(presenceSessionRef){ remove(presenceSessionRef).catch(()=>{}); presenceSessionRef = null; }
  if(chatUnsub){ chatUnsub(); chatUnsub = null; }
  if(chatChangeUnsub){ chatChangeUnsub(); chatChangeUnsub = null; }
  chatSeenKeys = null;
  chatMsgs = {};
  chatPanelOpen = false;
  el('chatPanel').classList.add('hidden');
  pendingAdminMsgKeys = [];
  unreadIncomingCount = 0;
  updateMsgBadge();
}

function updateMsgBadge(){
  const badge = el('msgUnreadBadge');
  if(unreadIncomingCount > 0){
    badge.textContent = unreadIncomingCount;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

// 대화창이 닫혀 있는 동안 밀린 선생님 쪽지를 전부 읽음 처리한다(대화창을 열 때 호출).
function markIncomingRead(){
  if(pendingAdminMsgKeys.length && sessionClassKey){
    const name = (el('nameInput').value.trim() || '').slice(0, 20);
    pendingAdminMsgKeys.forEach(key => {
      if(chatMsgs[key]) chatMsgs[key] = { ...chatMsgs[key], read: true };
      update(ref(db, `messages/${ROOM}/${sessionClassKey}/${name}/${key}`), { read: true }).catch(()=>{});
    });
    pendingAdminMsgKeys = [];
  }
  unreadIncomingCount = 0;
  updateMsgBadge();
}

function chatBubbleHtml(msg){
  const who = msg.from === 'student' ? 'me' : 'admin';
  const label = msg.from === 'admin' ? '선생님' : '나';
  const t = msg.ts ? new Date(msg.ts) : null;
  const tLabel = t ? `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}` : '';
  // 내가 보낸 말풍선을 선생님이 아직 안 읽었으면 "1"을 붙여둔다(카카오톡 방식).
  const unreadTick = (who === 'me' && !msg.read) ? '<span class="chat-unread">1</span>' : '';
  return `<div class="chat-row ${who}">${unreadTick}<div class="chat-msg ${who}">${escapeHtml(msg.text||'')}<div class="ct">${label} · ${tLabel}</div></div></div>`;
}
function renderChatPanel(){
  const keys = Object.keys(chatMsgs).sort();
  const log = el('chatLog');
  log.innerHTML = keys.length ? keys.map(k => chatBubbleHtml(chatMsgs[k])).join('') : '<div class="muted">아직 대화가 없습니다.</div>';
  log.scrollTop = log.scrollHeight;
}

// "💬쪽지" 버튼 — 관리자 화면과 같은 형태의 대화창을 열고, 밀린 쪽지를 읽음 처리한다.
el('msgOpenBtn').onclick = () => {
  chatPanelOpen = true;
  { const api = raidApi(); if(api) api.pause(true); }
  el('chatPanel').classList.remove('hidden');
  markIncomingRead();
  renderChatPanel();
  el('chatInput').focus();
};
el('chatPanelClose').onclick = () => {
  chatPanelOpen = false;
  el('chatPanel').classList.add('hidden');
  { const api = raidApi(); if(api) api.pause(false); }
  if(sessionMode === 'raid' && !ended) el('answerInput').focus();
};
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && chatPanelOpen) el('chatPanelClose').click();
});

function sendChatMsg(){
  const text = el('chatInput').value.trim();
  if(!text || !sessionClassKey) return;
  const name = (el('nameInput').value.trim() || '').slice(0, 20);
  const newRef = push(chatRef(ROOM, sessionClassKey, name));
  const msgObj = { from:'student', text: text.slice(0,300), ts: Date.now(), read:false };
  if(chatSeenKeys) chatSeenKeys.add(newRef.key);
  chatMsgs[newRef.key] = msgObj;
  set(newRef, msgObj).catch(()=>{});
  el('chatInput').value = '';
  renderChatPanel();
}
el('chatSendBtn').onclick = sendChatMsg;
el('chatInput').addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); sendChatMsg(); } });

// "🚩 신고" 버튼 — 정답이든 오답이든 상관없이 언제나 눌러 문제 자체(오타 등)를 신고할 수 있다.
// 방금 오답 처리된 문제(lastWrongInfo)가 있으면 그걸 우선 신고 대상으로 삼고("정답을 입력했는데 틀렸다고
// 떴어요" 케이스), 없으면 지금 화면에 보이는 문제(currentQuestion)를 신고 대상으로 삼는다.
function reportCurrentWrong(){
  const info = lastWrongInfo || (currentQid && currentQuestion
    ? { qid: currentQid, unit: currentQuestion.unit || '(기타)', qtext: currentQuestion.question, answer: (currentQuestion.answers||[])[0] }
    : null);
  if(!info || !sessionClassKey) return;
  if(reportedQids.has(info.qid)){ alert('이미 신고한 문제예요. 확인 감사합니다!'); return; }
  const reason = prompt('어떤 점이 이상했나요? (예: 오타가 있어요 / 정답을 입력했는데 오답 처리됨)', '');
  lastActiveAt = serverNow();
  if(reason === null) return; // 취소
  if(!reason.trim()){ alert('간단히 이유를 적어야 신고할 수 있어요.'); return; }
  const name = (el('nameInput').value.trim() || '').slice(0, 20);
  const text = `🚩 문제 신고 [${info.unit || '(기타)'}] "${info.qtext}" (정답: ${info.answer||''}) — ${reason.trim()}`.slice(0, 300);
  const newRef = push(chatRef(ROOM, sessionClassKey, name));
  const msgObj = { from:'student', text, ts: Date.now(), read:false };
  if(chatSeenKeys) chatSeenKeys.add(newRef.key);
  chatMsgs[newRef.key] = msgObj;
  set(newRef, msgObj).catch(()=>{});
  renderChatPanel();
  reportedQids.add(info.qid);
  if(lastWrongInfo && lastWrongInfo.qid === info.qid) lastWrongInfo = null;
  alert('신고했어요. 선생님께 전달됐어요. 감사합니다!');
  lastActiveAt = serverNow();
}
el('reportWrongBtn').onclick = reportCurrentWrong;

function showEndedView(){
  // stopPresenceAndChat()이 pendingAdminMsgKeys를 비우기 전에, 못 보고 넘어간 쪽지가
  // 있었는지부터 챙겨둔다 — 있었으면 종료 화면 위에 팝업으로 띄워준다.
  const missedKeys = pendingAdminMsgKeys.slice();
  const missedText = lastAdminMsgText;
  stopPresenceAndChat();
  ended = true;
  paused = false;
  el('clearPrompt').classList.add('hidden');
  { const api = raidApi(); if(api){ try{ raidLast = api.state() || raidLast; }catch(_e){} } }
  logSoloSession();
  stopRaidFrame();
  clearModeLayout();
  el('finalFloor').textContent = floor;
  const total = correctCount + wrongCount;
  const acc = total ? Math.round(100*correctCount/total) : null;
  el('finalStat').textContent = acc!==null ? `정답 ${correctCount}개 · 오답 ${wrongCount}개 · 정답률 ${acc}%` : '아직 문제를 풀지 않았어요';
  el('endedView').classList.toggle('m-raid', sessionMode === 'raid');
  el('endedView').classList.toggle('m-card', sessionMode === 'card');
  const mr = el('modeResult');
  mr.className = 'mode-result hidden';
  if(sessionMode === 'raid'){
    const r = raidLast;
    const diffName = ['😐 보통','😠 어려움','🔥 매우 어려움','💀 지옥'][sessionRaidDiff] || '';
    if(r && r.result === 'win') { mr.className = 'mode-result win'; mr.textContent = `🎉 ${r.bossName} 격파! (${diffName} · ${fmtTime(Math.ceil(r.used/1000))} 만에)`; }
    else if(r && r.result === 'lose'){ mr.className = 'mode-result lose'; mr.textContent = `💀 레이드 실패 · ${r.bossName} 체력 ${Math.max(1, Math.round(r.hp / Math.max(1, r.max) * 100))}% 남음 (${diffName})`; }
    else { mr.className = 'mode-result'; mr.textContent = `👹 레이드를 중간에 마쳤어요 (${diffName})`; }
    if(r) el('finalStat').textContent += ` · 준 피해 ${r.dmg.toLocaleString('ko-KR')} · 막은 공격 ${r.parries || 0}번 · 쓰러진 횟수 ${r.kos}번`;
    recordSoloRaidTitles(r);
  } else if(sessionMode === 'card'){
    mr.className = 'mode-result m-card';
    mr.textContent = cardFinished ? `🃏 카드 ${cardTotal}장을 모두 넘겼어요!` : `🃏 카드 ${cardTotal}장 중 ${cardDone.size}장을 넘겼어요`;
    el('finalStat').textContent = cardSeen
      ? `바로 안 카드 ${cardKnownFirst}장 · 몰랐던 카드 ${cardUnknown.size}장` + (cardUnknown.size ? ' → 🔁 복습 추천에 들어갔어요. 탑 오르기나 보스 레이드로 직접 맞혀 보세요!' : ' · 모두 알고 있었어요 🎉')
      : '아직 카드를 넘기지 않았어요';
  }

  const prevBest = parseInt(localStorage.getItem(STORAGE_BEST_KEY) || '0', 10);
  const bestNote = el('bestNote');
  if(sessionMode !== 'tower'){
    bestNote.textContent = '';
  } else if(floor > prevBest){
    localStorage.setItem(STORAGE_BEST_KEY, String(floor));
    bestNote.textContent = prevBest > 0 ? `🎉 개인 최고 기록 갱신! (이전 ${prevBest}층)` : '🎉 첫 기록 달성!';
  } else {
    bestNote.textContent = `개인 최고 기록: ${prevBest}층`;
  }
  el('idleWarn').textContent = '';
  el('endReason').textContent = idleEnded ? '⏸ 1분 동안 답을 내지 않아 연습이 자동으로 끝났어요.'
    : relearnEnded ? '📖 다시 배우기를 열어 연습이 끝났어요.' : '';
  el('endReason').classList.toggle('hidden', !idleEnded && !relearnEnded);
  showView('endedView');
  refreshRecord(true); // 방금 끝낸 세션의 오답·정답까지 반영해 종료 화면의 복습 추천 버튼을 갱신
  if(missedKeys.length) showMissedMsgPopup(missedText, missedKeys);
}

function showMissedMsgPopup(text, keys){
  missedPopupKeys = keys || [];
  el('missedMsgText').textContent = text || '';
  el('missedMsgReplyInput').value = '';
  el('missedMsgPopup').classList.remove('hidden');
}
function markMissedPopupRead(){
  if(missedPopupKeys.length && sessionClassKey){
    const name = (el('nameInput').value.trim() || '').slice(0, 20);
    missedPopupKeys.forEach(key => {
      update(ref(db, `messages/${ROOM}/${sessionClassKey}/${name}/${key}`), { read: true }).catch(()=>{});
    });
    missedPopupKeys = [];
  }
}
el('missedMsgCloseBtn').onclick = () => {
  markMissedPopupRead();
  el('missedMsgPopup').classList.add('hidden');
};
function sendMissedMsgReply(){
  const text = el('missedMsgReplyInput').value.trim();
  if(!text || !sessionClassKey) return;
  markMissedPopupRead();
  const name = (el('nameInput').value.trim() || '').slice(0, 20);
  const newRef = push(chatRef(ROOM, sessionClassKey, name));
  set(newRef, { from:'student', text: text.slice(0,300), ts: Date.now(), read:false }).catch(()=>{});
  el('missedMsgReplyInput').value = '';
  el('missedMsgPopup').classList.add('hidden');
}
el('missedMsgReplyBtn').onclick = sendMissedMsgReply;
el('missedMsgReplyInput').addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); sendMissedMsgReply(); } });

function tick(){
  if(!roundState || ended || paused) return;
  const remaining = Math.max(0, Math.round((roundState.end_time - serverNow())/1000));
  if(sessionMode === 'raid') updateRaidUI();   // 남은 시간은 레이드 화면 기준
  else if(sessionMode === 'card') el('timerVal').textContent = fmtTime(Math.round((serverNow() - sessionStartedAt)/1000));   // 암기 카드는 걸린 시간
  else el('timerVal').textContent = fmtTime(remaining);
  if(ended) return;
  if(remaining<=0){
    showEndedView();
    return;
  }
  if(currentQid === null && sessionMode !== 'card'){
    assignNextQuestion();
  }
  checkIdle();
}

function checkIdle(){
  // 채점 중(입력창 잠김)이거나 쪽지 창을 보고 있는 동안은 세지 않는다
  // (레이드에서 쓰러짐·기절로 답을 못 내는 동안도 세지 않는다 · 암기 카드는 입력창 없이 버튼으로 넘기므로 그대로 센다)
  if(!currentQid || (sessionMode !== 'card' && el('answerInput').disabled) || chatPanelOpen || !raidCanAnswer()){ lastActiveAt = serverNow(); el('idleWarn').textContent = ''; return; }
  const left = IDLE_LIMIT_MS - (serverNow() - lastActiveAt);
  if(left <= 0){
    idleEnded = true;
    showEndedView();
    return;
  }
  el('idleWarn').textContent = left <= 10000 ? `⏳ ${Math.ceil(left/1000)}초 안에 답을 내지 않으면 연습이 끝나요` : '';
}

let tickHandle = null;

// 선생님이 admin.html의 '학생 명단 관리'에 반별 명단을 등록해 두면, 그 반은 명단에 있는
// 이름만 입력해 연습을 시작할 수 있다. 명단을 한 명도 등록하지 않은 반은 제한 없이 통과시킨다.
async function checkRosterAllowed(cls, name){
  try{
    const snap = await get(ref(db, 'roster/' + cls));
    const roster = snap.val();
    if(roster && Object.keys(roster).length > 0 && !roster[name]) return false;
  }catch(_e){ /* 명단 조회 실패 시엔 연습에 지장 없도록 통과시킨다 */ }
  return true;
}

el('startBtn').onclick = async () => {
  const msg = el('setupMsg');
  if(!selectedGrade){
    msg.textContent = '학년을 선택해야 연습을 시작할 수 있어요.';
    return;
  }
  if(!selectedClass){
    msg.textContent = '반을 선택해야 연습을 시작할 수 있어요.';
    return;
  }
  const nameNow = el('nameInput').value.trim();
  if(!nameNow){
    msg.textContent = '이름을 입력해야 연습을 시작할 수 있어요.';
    el('nameInput').focus();
    return;
  }
  el('startBtn').disabled = true;
  const allowed = await checkRosterAllowed(classKey(), nameNow);
  el('startBtn').disabled = false;
  if(!allowed){
    showIdentityFields();
    msg.textContent = '명단에 없는 이름이에요. 이름을 정확히 입력했는지 확인하거나 선생님께 문의하세요.';
    el('nameInput').focus();
    return;
  }
  const units = Array.from(selectedUnits);
  const pool = poolFromQuestions(questionsObj, units);
  if(pool.length===0){ msg.textContent = '선택한 범위에 문제가 없습니다.'; return; }

  const mode = practiceMode;
  const minutes = parseFloat(el('durationInput').value) || 5;
  const duration_sec = mode === 'raid' ? 300 : mode === 'card' ? null : Math.max(30, Math.min(3600, Math.round(minutes*60)));
  msg.textContent = '';

  floor = 0; correctCount = 0; wrongCount = 0; streak = 0; lastFloor = 0; ended = false;
  hintCount = 0; soloLogRef = null; unitStats = {}; qStats = {}; wrongMap = new Map();
  lastWrongInfo = null; reportedQids = new Set();
  clearedQids = new Set(); allClearedPrompted = false; paused = false; idleEnded = false; relearnEnded = false;
  el('clearPrompt').classList.add('hidden');
  queue = []; retryList = []; retryMiss = {}; currentQid = null; currentQuestion = null; lastQid = null;

  // 이번 세션 정보 기록용으로 저장 (종료 시 선생님 화면으로 보냄)

const WEAK_MIN   = 5;    // 이 문제 수 이상 + 정답률 60% 미만이면 '약점'

// 로컬 자정 기준 '며칠째'인지 (정수). 연속 학습일 계산용.
function dayNum(ms){
  const d = new Date(ms || 0);
  d.setHours(0,0,0,0);
  return Math.round(d.getTime() / 86400000);
}

function streaks(daySet){
  if(!daySet.size) return { cur:0, max:0 };
  const days = [...daySet].sort((a,b)=>a-b);
  let max = 1, run = 1;
  for(let i=1;i<days.length;i++){
    run = days[i] === days[i-1] + 1 ? run + 1 : 1;
    if(run > max) max = run;
  }
  const today = dayNum(Date.now());
  const last = days[days.length-1];
  let cur = 0;
  if(last === today || last === today - 1){
    cur = 1;
    for(let i=days.length-1;i>0;i--){
      if(days[i] === days[i-1] + 1) cur++; else break;
    }
  }
  return { cur, max };
}

function aggregate(list){
  const units = {}; // 단원명 -> {c, w}
  let c = 0, w = 0, h = 0, best = 0;
  const daySet = new Set();
  const floors = []; // {ts, floor}
  list.forEach(e=>{
    c += e.correct || 0; w += e.wrong || 0; h += e.hints || 0;
    if(!e.mode) best = Math.max(best, e.floor || 0);   // 층수는 탑 오르기만 (레이드·암기 카드는 층이 화면에 안 보임)
    daySet.add(dayNum(e.started_ts || e.ts));
    if(!e.mode) floors.push({ ts: e.started_ts || e.ts, floor: e.floor || 0 });   // 층수는 탑 오르기만
    (Array.isArray(e.unit_stats) ? e.unit_stats : []).forEach(us=>{
      if(!us || !us.u) return;
      const t = units[us.u] || (units[us.u] = { c:0, w:0 });
      t.c += us.c || 0; t.w += us.w || 0;
    });
  });
  floors.sort((a,b)=>a.ts - b.ts);
  return { units, c, w, h, best, daySet, floors, count: list.length };
}

// 세션들을 시간순으로 훑으며 "지금 시점에 아직 못 맞힌 문제"만 남긴다.
// 한 세션에서 q_stats에 정답(c>0)이 있는 문제는 그 시점에 해결된 것으로 보고 지우고,
// 그 세션이 끝날 때도 여전히 wrong_items에 남아있던 문제만 다시 넣는다.
// 이렇게 하면 이전 세션에서 틀렸던 문제를 나중 세션에서 맞혔을 때 오답 노트에서 자연히 빠진다.
function aggregateWrongItems(list){
  const sorted = list.slice().sort((a,b)=>(a.ts||0)-(b.ts||0));
  const wrongAgg = new Map();
  sorted.forEach(e=>{
    (Array.isArray(e.q_stats) ? e.q_stats : []).forEach(qs=>{
      if(qs && qs.qid && (qs.c||0) > 0) wrongAgg.delete(qs.qid);
    });
    (Array.isArray(e.wrong_items) ? e.wrong_items : []).forEach(wi=>{
      if(wi && wi.qid) wrongAgg.set(wi.qid, wi);
    });
  });
  return [...wrongAgg.values()].sort((a,b)=>(b.ts||0)-(a.ts||0));
}

// 세션들의 q_stats에서 문제별 "마지막으로 맞힌 시각"을 구해,
// 오답 노트에 없는(적어도 한 번은 맞힌) 문제 중 REVIEW_DUE_DAYS일 넘게 지난 것을 다시 확인해보도록 추천한다.
// 문제가 삭제됐거나 아직 한 번도 못 맞혔으면(오답 노트에 있으면) 제외한다.
function aggregateDueReview(list, wrongQidSet){
  const lastCorrect = new Map();
  list.forEach(e=>{
    (Array.isArray(e.q_stats) ? e.q_stats : []).forEach(qs=>{
      if(!qs || !qs.qid || !qs.last) return;
      if(!lastCorrect.has(qs.qid) || qs.last > lastCorrect.get(qs.qid)) lastCorrect.set(qs.qid, qs.last);
    });
  });
  const cutoff = serverNow() - REVIEW_DUE_DAYS*24*60*60*1000;
  return [...lastCorrect.entries()]
    .filter(([qid, ts]) => ts <= cutoff && !wrongQidSet.has(qid) && questionsObj[qid])
    .map(([qid, ts]) => ({ qid, ts, unit: questionsObj[qid].unit, qtext: questionsObj[qid].question }))
    .sort((a,b)=> a.ts - b.ts)
    .slice(0, 30);
}

// 오답 노트 + 복습 추천을 하나로 합친 "복습 추천" 목록. 대시보드와 setup 화면 바로가기 버튼이 공유해서 쓴다.
function computeReviewItems(list){
  const wrongItems = aggregateWrongItems(list);
  const dueItems = aggregateDueReview(list, new Set(wrongItems.map(w=>w.qid)));
  return [
    ...wrongItems.map(w => ({ qid: w.qid, unit: w.unit, qtext: w.qtext, note: `${w.src === 'class' ? '수업 게임에서 틀림 · ' : ''}정답: ${w.answer||''}` })),
    ...dueItems.map(d => ({ qid: d.qid, unit: d.unit, qtext: d.qtext, note: `${dayNum(serverNow()) - dayNum(d.ts)}일 전에 맞혔어요` }))
  ];
}

function median(arr){
  if(!arr.length) return 0;
  const a = arr.slice().sort((x,y)=>x-y);
  const m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : Math.round((a[m-1] + a[m]) / 2);
}

// solo_log 전체를 학생(이름+반)별로 합산 — 친구들과 비교용
function allStudentTotals(obj){
  const map = new Map();
  Object.values(obj || {}).forEach(e=>{
    if(!e || !e.ts || !e.name) return;
    const key = e.name + '␟' + String(e.cls ?? '');
    let m = map.get(key);
    if(!m){ m = { correct:0, attempted:0, sessions:0, best:0, daySet:new Set() }; map.set(key, m); }
    m.correct   += e.correct || 0;
    m.attempted += (e.correct || 0) + (e.wrong || 0);
    m.sessions  += 1;
    if(!e.mode) m.best = Math.max(m.best, e.floor || 0);
    m.daySet.add(dayNum(e.started_ts || e.ts));
  });
  return map;
}

async function refreshRecord(force){

    lastReviewItems = [];
    el('reviewQuickBtn').classList.add('hidden');
    el('reviewQuickBtnEnd').classList.add('hidden');
    return;
  }
  t.disabled = false;
  const { soloList: list, reviewList } = await loadReviewSessions(force);

    t.classList.add('empty');

  }
  t.classList.remove('empty');
  const s = streaks(lastAgg.daySet);

    const tt = x.c + x.w; return tt >= MASTER_MIN && x.c / tt >= 0.8;

    `<span class="rt-item">🔥 ${s.cur ? s.cur + '일 연속' : '연속 끊김'}</span>` +
    `<span class="rt-item">🏅 정복 ${conquered}단원</span>` +
    `<span class="rt-item">🏢 최고 ${lastAgg.best}층</span>` +
    `<span class="rt-item">🎯 정답률 ${acc}%</span>` +
    `<span class="rt-more">자세히 ▸</span>`;
}

  }

    const t = x.c + x.w;

  const isMaster = r => r.t >= MASTER_MIN && r.acc >= 0.8;

      <table class="ptable"><tbody>

    </div>`;

  el('dashBody').innerHTML = `
    <div class="dash-section">
      <div class="dash-stats">
        <div class="cell"><div class="k">연습 횟수</div><div class="v">${agg.count}</div></div>
        <div class="cell"><div class="k">푼 문제</div><div class="v">${totQ}</div></div>
        <div class="cell"><div class="k">정답률</div><div class="v">${acc}%</div></div>
        <div class="cell"><div class="k">누적 힌트</div><div class="v">${agg.h}</div></div>
      </div>
    </div>
    ${peerHtml}

    <div class="dash-section">
      <h3>🔥 연속 학습</h3>
      <div class="streak-box">
        <div class="s"><div class="v">${s.cur}일</div><div class="k">지금 연속 (하루 1번 이상)</div></div>
        <div class="s"><div class="v">${s.max}일</div><div class="k">최장 기록</div></div>
      </div>
    </div>

    <div class="dash-section">
      <h3>🏢 층수</h3>
      <div class="streak-box">
        <div class="s blue"><div class="v">${lastFloorVal}층</div><div class="k">가장 최근 연습</div></div>
        <div class="s blue"><div class="v">${agg.best}층</div><div class="k">최고 기록</div></div>
      </div>
    </div>

    <div class="dash-section">
      <h3>🔁 복습 추천 <span class="note">아직 못 맞혔거나 맞힌 지 ${REVIEW_DUE_DAYS}일 넘은 문제 ${reviewItems.length}개</span></h3>
      ${reviewItems.length ? `
        <div class="wrong-list">
          ${reviewItems.slice(0,30).map(r=>`<div class="wrong-row">
            <span class="wunit">${escapeHtml(r.unit||'')}</span>
            <span class="wtext">${escapeHtml(r.qtext||'')}</span>
            <span class="wans" style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
              <span>${escapeHtml(r.note||'')}</span>
              ${relearnLinkHtml(r.unit)}
            </span>
          </div>`).join('')}
        </div>
        <button type="button" class="mini" id="reviewRetryBtn" style="margin-top:10px; width:auto; padding:9px 16px;">🔁 복습 추천 다시 풀기 (${reviewItems.length}문제)</button>
      ` : `<div class="dash-empty">아직 복습 추천 문제가 없어요. 틀린 문제를 끝까지 못 맞히거나, 맞힌 지 ${REVIEW_DUE_DAYS}일이 지나면 여기 쌓여요.</div>`}
    </div>

    <div class="dash-section">
      <h3>⭐ 즐겨찾기 <span class="note">연습 중 직접 표시해 둔 문제 ${lastBookmarkItems.length}개</span></h3>
      ${lastBookmarkItems.length ? `
        <div class="wrong-list">
          ${lastBookmarkItems.slice(0,30).map(b=>`<div class="wrong-row">
            <span class="wunit">${escapeHtml(b.unit||'')}</span>
            <span class="wtext">${escapeHtml(b.qtext||'')}</span>
            <span class="wans" style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
              <span>정답: ${escapeHtml(b.answer||'')}</span>
              <span style="display:flex; gap:6px; flex:0 0 auto;">
                ${relearnLinkHtml(b.unit)}
                <button type="button" class="mini-btn" data-unbookmark="${escapeHtml(b.qid)}">✕ 해제</button>
              </span>
            </span>
          </div>`).join('')}
        </div>
        <button type="button" class="mini" id="bookmarkRetryBtn" style="margin-top:10px; width:auto; padding:9px 16px;">⭐ 즐겨찾기 문제만 풀기 (${lastBookmarkItems.length}문제)</button>
      ` : `<div class="dash-empty">연습 중 문제 화면의 ☆ 즐겨찾기 버튼을 누르면 헷갈렸던 문제를 여기 모아뒀다가 다시 풀 수 있어요.</div>`}
    </div>

    <div class="dash-section">
      <h3>🏅 단원 정복 ${conquered.length} / ${totalUnits}단원 <span class="note">정답률 80%↑ · ${MASTER_MIN}문제 이상</span></h3>
      <div class="badge-wrap">
        ${conquered.length
          ? conquered.map(u=>`<span class="badge">🏅 ${escapeHtml(u)}</span>`).join('')
          : `<span class="dash-empty">아직 정복한 단원이 없어요. 한 단원을 집중해서 연습해 정답률 80%를 넘겨 보세요!</span>`}
      </div>
    </div>

    <div class="dash-section">
      <h3>📚 단원별 정답률 <span class="note">낮은 순 · 약점부터</span></h3>
      ${urows.length ? `<table class="utable"><tbody>
        ${urows.map(r=>{
          const p = Math.round(100 * r.acc);
          const barCls = r.acc < 0.6 ? 'lo' : (r.acc >= 0.8 ? 'hi' : '');
          const tag = isMaster(r) ? '<span class="tag master">정복</span>'
                    : isWeak(r)   ? '<span class="tag weak">약점</span>' : '';
          const avail = allUnits.some(x=>x.unit === r.u);
          return `<tr>
            <td><span class="uname">${escapeHtml(r.u)}</span>${tag}<div style="font-size:.7rem;color:var(--sub)">${r.t}문제</div></td>
            <td style="width:32%"><div class="bar"><i class="${barCls}" style="width:${p}%"></i></div></td>
            <td class="pct">${p}%</td>
            <td><button type="button" class="mini secondary" data-practice-unit="${escapeHtml(r.u)}"${avail ? '' : ' disabled title="지금 이 범위엔 문제가 없어요"'}>연습</button></td>
          </tr>`;
        }).join('')}
      </tbody></table>` : `<div class="dash-empty">단원별 정답률은 이 업데이트 이후 연습부터 쌓여요. 조금만 더 연습하면 여기에 나타나요!</div>`}
    </div>
  `;
}

async function loadDashBookmarks(){
  const cls = classKey(), nm = myName();
  if(!cls || !nm) return [];
  try{
    const snap = await get(bookmarksRef(ROOM, cls, nm));
    const obj = snap.val() || {};
    return Object.entries(obj)
      .map(([qid,v])=>({ qid, unit:v.unit, qtext:v.qtext, answer:v.answer, ts:v.ts }))
      .sort((a,b)=>(b.ts||0)-(a.ts||0));
  }catch(_e){ return []; }
}

function openDash(){
  el('dashPanel').classList.remove('hidden');
  el('dashBody').innerHTML = '<div class="dash-empty">불러오는 중…</div>';
  Promise.all([loadReviewSessions(true), loadDashBookmarks()]).then(([rs, bookmarks])=>{
    lastBookmarkItems = bookmarks;
    lastDashList = rs.soloList;
    lastDashReviewList = rs.reviewList;
    lastDashSoloObj = rs.soloObj;
    renderDash(lastDashList, lastDashSoloObj);
    refreshRecord(false);
  });
}
function closeDash(){ el('dashPanel').classList.add('hidden'); }

el('recordTeaser').onclick = () => { if(!el('recordTeaser').disabled) openDash(); };
const startReviewQuick = () => {
  if(!lastReviewItems.length) return;
  startReviewSession(lastReviewItems.map(r=>r.qid));
};
el('reviewQuickBtn').onclick = startReviewQuick;
el('reviewQuickBtnEnd').onclick = startReviewQuick;
el('dashClose').onclick = closeDash;
el('dashFromEndBtn').onclick = openDash;

// 대시보드의 '연습' 버튼: 그 단원만 범위로 잡고 setup 으로
el('dashBody').addEventListener('click', (ev)=>{
  const reviewBtn = ev.target.closest('#reviewRetryBtn');
  if(reviewBtn){
    const qids = lastReviewItems.map(r=>r.qid);
    closeDash();
    startReviewSession(qids);
    return;
  }
  const bmRetryBtn = ev.target.closest('#bookmarkRetryBtn');
  if(bmRetryBtn){
    const qids = lastBookmarkItems.map(x=>x.qid);
    closeDash();
    startReviewSession(qids, '⭐ 즐겨찾기');
    return;
  }
  const relearnBtn = ev.target.closest('[data-relearn-unit]');
  if(relearnBtn){
    const lesson = findLessonForUnit(pagesData, SUBJECT_NAME, relearnBtn.dataset.relearnUnit);
    if(lesson) window.open('../../' + lesson.path, '_blank');
    return;
  }
  const unbookmarkBtn = ev.target.closest('[data-unbookmark]');
  if(unbookmarkBtn){
    const qid = unbookmarkBtn.dataset.unbookmark;
    const cls = classKey(), nm = myName();
    lastBookmarkItems = lastBookmarkItems.filter(x=>x.qid !== qid);
    bookmarkedQids.delete(qid);
    if(cls && nm) remove(bookmarkRef(ROOM, cls, nm, qid)).catch(()=>{});
    renderDash(lastDashList, lastDashSoloObj);
    return;
  }
  const b = ev.target.closest('[data-practice-unit]');
  if(!b || b.disabled) return;
  const u = b.dataset.practiceUnit;
  selectedUnits = new Set([u]);
  renderUnits();
  closeDash();
  ended = true; roundState = null;
  showView('setupView');
  el('unitList').scrollIntoView({ block:'center', behavior:'smooth' });
});

// 이름/학년/반이 바뀌면 요약 스트립 갱신
el('nameInput').addEventListener('change', ()=>refreshRecord(false));
el('gradeRow').querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('click', ()=>refreshRecord(false));
});
el('classRow').querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('click', ()=>refreshRecord(false));
});
refreshRecord(false); // 첫 진입 (기기에 이름·반이 저장돼 있으면 바로 표시)
</script>
</body>
