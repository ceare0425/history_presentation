<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>세계사 탑 오르기</title>
<style>
  :root{
    --sky1:#1e3c72; --sky2:#2a5298;
    --gold:#e8c76f; --gold-dark:#c5a028;
    --card:#ffffff; --ink:#22314f; --sub:#5b6a8a;
    --good:#2e9e5b; --bad:#d9534f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Malgun Gothic','Pretendard',-apple-system,sans-serif;
    background:linear-gradient(180deg,#0f2447,var(--sky1) 35%,var(--sky2) 65%,#3a6b8a);
    color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:16px; position:relative; overflow:hidden;
  }
  .sky-layer{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .star{ position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; animation:twinkle 3.4s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.85;} }
  .cloud{
    position:absolute; border-radius:50%; background:rgba(255,255,255,.35); filter:blur(8px);
    animation-name:drift; animation-timing-function:linear; animation-iteration-count:infinite;
  }
  @keyframes drift{ from{ transform:translateX(-16vw); } to{ transform:translateX(116vw); } }
  .card{ position:relative; z-index:1; }
  .card{
    width:min(1100px, 94vw);
    aspect-ratio:16/9;
    max-height:92vh;
    background:var(--card); border-radius:22px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35); padding:2.6vh 4vw; position:relative; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:6px;
    background:linear-gradient(90deg,var(--gold-dark),var(--gold));
  }
  h1{ font-size:clamp(1.2rem,2.4vw,1.7rem); margin:0 0 1.2vh; text-align:center; color:var(--sky1); flex:0 0 auto; }
  .sub{ text-align:center; color:var(--sub); font-size:1rem; margin-bottom:1.4rem; }

  .view{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .view.center{ justify-content:center; align-items:center; }

  input[type=text]{
    width:100%; padding:14px 16px; font-size:1.15rem; border:2px solid #dfe3ec; border-radius:12px;
    outline:none; margin-bottom:12px;
  }
  input[type=text]:focus{ border-color:var(--gold-dark); }
  button{
    width:100%; padding:14px; font-size:1.1rem; font-weight:700; color:#fff; border:none;
    border-radius:12px; cursor:pointer; background:linear-gradient(90deg,var(--sky1),var(--sky2));
    transition:transform .1s; flex:0 0 auto;
  }
  button:active{ transform:scale(.98); }
  button:disabled{ opacity:.5; cursor:default; }
  #joinView, #joinView .inner{ width:100%; max-width:480px; }

  .waiting{ text-align:center; }
  .waiting .big{ font-size:3rem; margin-bottom:.6rem; }
  .pulse{ animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }

  .hud{ display:flex; justify-content:space-between; align-items:center; margin-bottom:1vh; flex:0 0 auto; }
  .floor-badge{
    background:linear-gradient(135deg,var(--gold),var(--gold-dark)); color:#3a2c05; font-weight:800;
    border-radius:14px; padding:8px 16px; font-size:1.25rem; box-shadow:0 4px 10px rgba(197,160,40,.4);
  }
  .timer{ font-weight:700; color:var(--sky1); font-variant-numeric:tabular-nums; font-size:1.25rem; }
  .streak{ font-size:.9rem; color:var(--sub); text-align:right; min-height:1.3em; flex:0 0 auto; }

  .qbox{
    background:#f4f6fb; border:2px solid #e3e8f2; border-radius:16px; padding:3vh 3vw; margin:1vh 0;
    flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
    overflow-y:auto;
  }
  .qbox .qtext-inner{
    width:100%; font-size:clamp(1.2rem,2.6vw,1.85rem); line-height:1.9;
    text-align:center; word-break:keep-all; overflow-wrap:break-word;
  }
  .qbox .blank-mark{
    display:inline-block; width:3em; height:0.9em; margin:0 .2em -0.15em;
    border-bottom:4px solid var(--sky1); border-radius:2px;
  }
  .unit-tag{
    display:inline-block; font-size:.8rem; color:#fff; background:var(--sky2); border-radius:6px;
    padding:3px 10px; margin-bottom:.8vh; flex:0 0 auto;
  }

  .avatar-char{
    text-align:center; font-size:2.4rem; line-height:1; margin:.2vh 0 .4vh;
    flex:0 0 auto; user-select:none;
  }
  .avatar-char.happy{ animation:avatarHappy .8s ease; }
  @keyframes avatarHappy{
    0%{ transform:translateY(0) scale(1) rotate(0deg); }
    25%{ transform:translateY(-16px) scale(1.2) rotate(-10deg); }
    50%{ transform:translateY(0) scale(1.05) rotate(10deg); }
    75%{ transform:translateY(-9px) scale(1.12) rotate(-6deg); }
    100%{ transform:translateY(0) scale(1) rotate(0deg); }
  }
  .avatar-char.sad{ animation:avatarSad .9s ease; }
  @keyframes avatarSad{
    0%{ transform:translateY(0) rotate(0deg) scale(1); }
    20%{ transform:translateY(5px) rotate(-7deg) scale(.97); }
    40%{ transform:translateY(9px) rotate(7deg) scale(.95); }
    60%{ transform:translateY(9px) rotate(-5deg) scale(.95); }
    100%{ transform:translateY(3px) rotate(0deg) scale(.97); }
  }

  .feedback{
    text-align:center; font-weight:800; font-size:1.15rem; border-radius:12px; padding:10px;
    margin-bottom:.8vh; display:none; flex:0 0 auto;
  }
  .feedback.show{ display:block; }
  .feedback.correct{ background:#e6f7ec; color:var(--good); }
  .feedback.wrong{ background:#fbeaea; color:var(--bad); }

  .answer-row{ display:flex; gap:10px; flex:0 0 auto; }
  .answer-row input[type=text]{ flex:1; margin-bottom:0; }
  .answer-row button{ width:auto; padding:14px 28px; flex:0 0 auto; }

  .tower-mini{
    height:6vh; min-height:36px; display:flex; align-items:flex-end; justify-content:center;
    margin-top:1vh; gap:3px; flex:0 0 auto;
  }
  .tower-mini .bar{
    width:10px; border-radius:3px 3px 0 0; transition:height .35s cubic-bezier(.34,1.56,.64,1);
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.4) 0px, rgba(255,255,255,.4) 2px, transparent 2px, transparent 9px),
      linear-gradient(180deg,var(--gold),var(--gold-dark));
  }

  .floor-badge{ transition:transform .15s ease; }
  .floor-badge.pop{ animation:floorPop .5s ease; }
  @keyframes floorPop{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.35); filter:drop-shadow(0 0 10px #ffe9a8); }
    100%{ transform:scale(1); }
  }

  .ended{ text-align:center; }
  .ended .big{ font-size:3.4rem; font-weight:800; color:var(--sky1); margin:6px 0; }
  .final-rank{ font-size:1.1rem; font-weight:700; color:var(--sub); margin-bottom:.4rem; min-height:1.4em; }
  .final-rank.rank1{ font-size:1.6rem; color:var(--gold-dark); animation:rank1Pop .7s cubic-bezier(.34,1.56,.64,1); }
  @keyframes rank1Pop{ 0%{ transform:scale(.5); opacity:0; } 100%{ transform:scale(1); opacity:1; } }

  .hidden{ display:none !important; }
  .conn-warn{ position:fixed; left:0; right:0; bottom:0; background:#d9534f; color:#fff; text-align:center;
    font-size:.8rem; padding:6px; z-index:5; display:none; }
  .conn-warn.show{ display:block; }

  /* 스마트폰(세로 화면)에서는 16:9 카드 대신 화면 전체를 채우는 세로형 레이아웃으로 자동 전환 */
  @media (max-width:700px), (orientation:portrait){
    body{ padding:0; }
    .card{
      width:100vw; height:100vh; max-height:100vh;
      aspect-ratio:auto; border-radius:0; box-shadow:none;
      padding:3vh 5vw;
    }
  }
</style>
</head>
<body>

<div class="sky-layer" id="skyLayer"></div>

<div class="card">
  <h1>🏯 세계사 탑 오르기</h1>

  <div id="joinView" class="view center">
    <div class="inner">
      <p class="sub">이름을 입력하고 참여하세요. 선생님이 게임을 시작하면 자동으로 시작됩니다.</p>
      <input type="text" id="nameInput" placeholder="이름 (예: 2반 홍길동)" maxlength="20">
      <button id="joinBtn">참여하기</button>
    </div>
  </div>

  <div id="waitingView" class="view center hidden">
    <div class="waiting">
      <div class="big pulse">🕐</div>
      <div id="waitName" style="font-weight:700; margin-bottom:4px; font-size:1.1rem;"></div>
      <div class="sub">선생님이 게임을 시작하기를 기다리는 중...</div>
    </div>
  </div>

  <div id="playView" class="view hidden">
    <div class="hud">
      <div class="floor-badge">🏢 <span id="floorVal">0</span>층</div>
      <div class="timer">⏱ <span id="timerVal">--:--</span></div>
    </div>
    <div class="streak" id="streakVal"></div>

    <div class="avatar-char" id="avatarChar">🧗</div>

    <div id="feedback" class="feedback"></div>

    <div class="unit-tag" id="unitTag"></div>
    <div class="qbox"><div class="qtext-inner" id="qText">문제를 불러오는 중...</div></div>

    <div class="answer-row">
      <input type="text" id="answerInput" placeholder="정답 입력 후 Enter" autocomplete="off">
      <button id="submitBtn">제출</button>
    </div>

    <div class="tower-mini" id="towerMini"></div>
  </div>

  <div id="endedView" class="view center hidden">
    <div class="ended">
      <div id="finalRank" class="final-rank"></div>
      <div>🏁 게임 종료!</div>
      <div class="big"><span id="finalFloor">0</span>층</div>
      <div class="sub" id="finalStat"></div>
    </div>
  </div>
</div>

<div class="conn-warn" id="connWarn">인터넷 연결을 확인해주세요</div>

<script type="module">
import {
  roomRef, ref, onValue, get, set, update, serverNow, db, onDisconnect,
  isCorrect, computeGain, fmtTime, shuffle, pickAvatarEmoji, rankedPlayers
} from '../shared/lib.js';

const ROOM = 'world';
const STORAGE_ID_KEY = 'rg_fb_' + ROOM + '_player_id';
const STORAGE_NAME_KEY = 'rg_fb_' + ROOM + '_name';

let playerId = localStorage.getItem(STORAGE_ID_KEY) || '';
let playerName = localStorage.getItem(STORAGE_NAME_KEY) || '';

let questionsObj = {};
let roundState = { status: 'idle', units: [], duration_sec: 300, end_time: null, token: 0, order: 'random', qids: [] };
let lastSeenToken = null;
let prevEffective = null;

let queue = [];
let currentQid = null;
let currentQuestion = null;
let currentStartedAt = null;
let lastQid = null;
let lastFloor = 0;
let kicked = false;
let myAnswered = false; // 이번 라운드에서 한 문제라도 제출했는지 (아직 안 했으면 종료 화면 대신 대기 화면을 보여줌)

const el = (id) => document.getElementById(id);

function showView(name){
  ['joinView','waitingView','playView','endedView'].forEach(v=>{
    el(v).classList.toggle('hidden', v!==name);
  });
}

function genId(){
  if(crypto.randomUUID) return crypto.randomUUID().replace(/-/g,'').slice(0,12);
  return (Date.now().toString(16) + Math.random().toString(16).slice(2)).slice(0,12);
}

function buildBackground(){
  const layer = el('skyLayer');
  const frag = document.createDocumentFragment();
  for(let i=0;i<25;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = (Math.random()*100)+'%';
    s.style.top = (Math.random()*45)+'%';
    s.style.animationDelay = (Math.random()*3.4)+'s';
    frag.appendChild(s);
  }
  for(let i=0;i<4;i++){
    const c = document.createElement('div');
    c.className = 'cloud';
    const size = 50 + Math.random()*70;
    c.style.width = size+'px';
    c.style.height = (size*0.45)+'px';
    c.style.top = (8 + Math.random()*30)+'%';
    c.style.animationDuration = (35 + Math.random()*30)+'s';
    c.style.animationDelay = (-Math.random()*35)+'s';
    frag.appendChild(c);
  }
  layer.appendChild(frag);
}
buildBackground();

function popFloorBadge(){
  const badge = document.querySelector('.floor-badge');
  badge.classList.remove('pop'); void badge.offsetWidth; badge.classList.add('pop');
}

function renderTowerMini(floor){
  const box = el('towerMini');
  box.innerHTML = '';
  const n = Math.min(24, Math.max(4, floor));
  for(let i=0;i<n;i++){
    const bar = document.createElement('div');
    bar.className = 'bar';
    const active = i < Math.min(floor, n);
    bar.style.height = active ? (14 + (i%6)*6)+'px' : '4px';
    bar.style.opacity = active ? '1' : '.25';
    box.appendChild(bar);
  }
}

function renderQuestion(q){
  if(!q){
    el('qText').textContent = '출제할 문제가 없습니다. 선생님께 문의하세요.';
    el('unitTag').textContent = '';
    return;
  }
  el('unitTag').textContent = q.unit;
  el('qText').innerHTML = q.text.replace(/____/g, '<span class="blank-mark"></span>');
  el('answerInput').value = '';
  el('answerInput').disabled = false;
  el('submitBtn').disabled = false;
  el('answerInput').focus();
}

function currentPool(){
  if(roundState.qids && roundState.qids.length>0){
    return roundState.qids.filter(qid=>questionsObj[qid]).map(qid=>[qid, questionsObj[qid]]);
  }
  const entries = Object.entries(questionsObj);
  if(!roundState.units || roundState.units.length===0) return entries;
  const unitSet = new Set(roundState.units);
  return entries.filter(([,q])=> unitSet.has(q.unit));
}

function assignNextQuestion(){
  const pool = currentPool();
  if(pool.length===0){
    currentQid = null; currentQuestion = null; currentStartedAt = null;
    renderQuestion(null);
    return;
  }
  if(queue.length===0){
    if(roundState.order === 'sequential'){
      queue = pool.map(([qid])=>qid);
    } else {
      queue = shuffle(pool.map(([qid])=>qid));
      if(queue.length>1 && queue[0]===lastQid){
        [queue[0],queue[1]] = [queue[1],queue[0]];
      }
    }
  }
  const qid = queue.shift();
  currentQid = qid;
  currentQuestion = questionsObj[qid];
  currentStartedAt = serverNow();
  lastQid = qid;
  renderQuestion({ id: qid, text: currentQuestion.question, unit: currentQuestion.unit });
}

let AVATAR_IDLE = '🧗'; // 입장 시 배정받는 개인 캐릭터로 바뀜
const AVATAR_HAPPY = '🙌';
const AVATAR_SAD = '😢';

function playCharacterReaction(correct){
  const av = el('avatarChar');
  av.classList.remove('happy','sad');
  void av.offsetWidth; // 애니메이션 재시작을 위해 리플로우 강제
  av.textContent = correct ? AVATAR_HAPPY : AVATAR_SAD;
  av.classList.add(correct ? 'happy' : 'sad');
  setTimeout(()=>{
    av.textContent = AVATAR_IDLE;
    av.classList.remove('happy','sad');
  }, correct ? 750 : 950);
}

function flashFeedback(correct, correctAnswer, gain){
  const f = el('feedback');
  f.classList.add('show');
  if(correct){
    f.classList.remove('wrong'); f.classList.add('correct');
    f.textContent = `정답! +${gain}층 올라갑니다 🎉`;
  } else {
    f.classList.remove('correct'); f.classList.add('wrong');
    f.textContent = `아쉬워요. 정답: ${correctAnswer}`;
  }
  setTimeout(()=>{ f.classList.remove('show'); }, 1400);
}

async function submitAnswer(){
  const text = el('answerInput').value.trim();
  if(!text || !currentQid || !currentQuestion) return;
  el('submitBtn').disabled = true;
  el('answerInput').disabled = true;

  const q = currentQuestion;
  const elapsed = (serverNow() - currentStartedAt) / 1000;
  const correct = isCorrect(text, q.answers);

  const pRef = roomRef(ROOM, 'players', playerId);
  const snap = await get(pRef);
  const existed = snap.exists();
  const p = snap.val() || { name: playerName, floor:0, correct:0, wrong:0, streak:0, bestStreak:0 };
  let gain = 0;

  if(correct){
    gain = computeGain(elapsed);
    p.floor = (p.floor||0) + gain;
    p.correct = (p.correct||0) + 1;
    p.streak = (p.streak||0) + 1;
    p.bestStreak = Math.max(p.bestStreak||0, p.streak);
  } else {
    p.wrong = (p.wrong||0) + 1;
    p.streak = 0;
  }

  // 관리자가 "전체 초기화"를 눌러 내 기록이 삭제된 뒤에도(새로고침 없이) 계속 제출할 수 있도록,
  // 노드가 사라졌으면 이름을 다시 포함해서 씀 (보안 규칙이 name 필드를 요구함)
  const payload = {
    floor: p.floor, correct: p.correct, wrong: p.wrong,
    streak: p.streak, bestStreak: p.bestStreak, lastActive: serverNow()
  };
  if(!existed){ payload.name = playerName; payload.avatar = AVATAR_IDLE; }
  await update(pRef, payload);

  el('floorVal').textContent = p.floor;
  el('streakVal').textContent = p.streak >= 2 ? `🔥 ${p.streak}연속 정답!` : '';
  if(p.floor > lastFloor) popFloorBadge();
  lastFloor = p.floor;
  renderTowerMini(p.floor);
  flashFeedback(correct, q.answers[0], gain);
  playCharacterReaction(correct);

  setTimeout(()=>{
    el('submitBtn').disabled = false; el('answerInput').disabled = false;
    assignNextQuestion();
  }, correct ? 700 : 1100);
}

el('submitBtn').onclick = submitAnswer;
el('answerInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submitAnswer(); });

async function showEndedView(){
  const snap = await get(roomRef(ROOM, 'players'));
  const players = Object.entries(snap.val()||{}).map(([id,p])=>({id, ...p}));
  const me = players.find(p=>p.id===playerId) || { floor:0, correct:0, wrong:0 };

  el('finalFloor').textContent = me.floor||0;
  const total = (me.correct||0)+(me.wrong||0);
  const acc = total ? Math.round(100*(me.correct||0)/total) : null;
  el('finalStat').textContent = acc!==null ? `정답 ${me.correct}개 · 정답률 ${acc}%` : '아직 문제를 풀지 않았어요';

  const ranked = rankedPlayers(players); // 정답률 70% 초과인 학생만 순위에 포함
  const rankEl = el('finalRank');
  const idx = ranked.findIndex(p=>p.id===playerId);
  const rank = idx>=0 ? idx+1 : null;
  if(rank){
    rankEl.textContent = rank===1 ? '🏆 1등입니다!' : `${rank}등 / ${ranked.length}명 중`;
    rankEl.classList.toggle('rank1', rank===1);
  } else {
    rankEl.textContent = '정답률 70%를 넘어야 순위에 포함돼요';
    rankEl.classList.remove('rank1');
  }
  showView('endedView');
}

function tick(){
  if(!playerId) return;
  const remaining = roundState.end_time!=null ? Math.max(0, Math.round((roundState.end_time - serverNow())/1000)) : null;
  let effective = roundState.status;
  if(roundState.status === 'running' && remaining!==null && remaining<=0) effective = 'ended';

  if(effective === 'idle'){
    el('waitName').textContent = playerName + '님';
    showView('waitingView');
  } else if(effective === 'running'){
    if(lastSeenToken !== roundState.token){
      lastSeenToken = roundState.token;
      queue = []; lastQid = null; currentQid = null; currentQuestion = null; currentStartedAt = null;
    }
    el('timerVal').textContent = fmtTime(remaining);
    if(currentQid === null && Object.keys(questionsObj).length>0){
      assignNextQuestion();
    }
    showView('playView');
  } else if(effective === 'ended'){
    if(!myAnswered){
      // 이 라운드가 시작된 뒤 한 번도 참여하지 못했다면(예: 라운드가 끝난 뒤 새로 들어온 학생)
      // 지난 게임의 종료 화면 대신 대기 화면을 보여준다
      el('waitName').textContent = playerName + '님';
      showView('waitingView');
    } else if(prevEffective !== 'ended'){
      showEndedView();
    }
  }
  prevEffective = effective;
}

function startListening(){
  showView('waitingView');

  onValue(roomRef(ROOM, 'questions'), (snap)=>{
    questionsObj = snap.val() || {};
  });

  onValue(roomRef(ROOM, 'round'), (snap)=>{
    const r = snap.val();
    roundState = r ? {
      status: r.status || 'idle', units: r.units || [],
      duration_sec: r.duration_sec || 300, end_time: r.end_time ?? null, token: r.token || 0,
      order: r.order || 'random', qids: r.qids || []
    } : { status:'idle', units:[], duration_sec:300, end_time:null, token:0, order:'random', qids:[] };
  });

  onValue(roomRef(ROOM, 'players', playerId), (snap)=>{
    const p = snap.val();
    if(!p){
      handleRemovedFromRoster();
      return;
    }
    lastFloor = p.floor||0;
    myAnswered = ((p.correct||0) + (p.wrong||0)) > 0;
    el('floorVal').textContent = p.floor||0;
    renderTowerMini(p.floor||0);
    if(p.avatar && AVATAR_IDLE !== p.avatar){
      AVATAR_IDLE = p.avatar;
      const av = el('avatarChar');
      if(!av.classList.contains('happy') && !av.classList.contains('sad')){
        av.textContent = AVATAR_IDLE;
      }
    }
  });

  // 연결이 끊기면(탭을 닫거나 네트워크가 끊기면) 서버가 자동으로 이 학생을 명단에서 지우도록 예약.
  // 재연결될 때마다(.info/connected가 true가 될 때마다) 다시 걸어줘야 안전하다 (Firebase 권장 방식)
  onValue(ref(db, '.info/connected'), (snap)=>{
    if(snap.val() === true){
      onDisconnect(roomRef(ROOM, 'players', playerId)).remove();
    }
  });

  setInterval(tick, 250);
}

function handleRemovedFromRoster(){
  if(kicked) return; // 중복 알림 방지
  kicked = true;
  localStorage.removeItem(STORAGE_ID_KEY);
  localStorage.removeItem(STORAGE_NAME_KEY);
  playerId = '';
  el('nameInput').value = '';
  showView('joinView');
  alert('선생님이 참여 목록에서 내보냈어요. 이름을 다시 입력하고 참여해주세요.');
}

async function join(name){
  kicked = false;
  if(!playerId) playerId = genId();
  playerName = name;
  localStorage.setItem(STORAGE_ID_KEY, playerId);
  localStorage.setItem(STORAGE_NAME_KEY, playerName);

  const pRef = roomRef(ROOM, 'players', playerId);
  const snap = await get(pRef);
  if(snap.exists()){
    await update(pRef, { name: playerName, lastActive: serverNow() });
  } else {
    const existingSnap = await get(roomRef(ROOM, 'players'));
    const existingAvatars = Object.values(existingSnap.val()||{}).map(pp=>pp.avatar).filter(Boolean);
    const avatar = pickAvatarEmoji(existingAvatars);
    await set(pRef, {
      name: playerName, avatar, floor:0, correct:0, wrong:0, streak:0, bestStreak:0,
      joinedAt: serverNow(), lastActive: serverNow()
    });
  }
  startListening();
}

el('joinBtn').onclick = () => {
  const name = el('nameInput').value.trim();
  if(!name){ el('nameInput').focus(); return; }
  el('joinBtn').disabled = true;
  join(name).catch(err=>{ alert('참여 실패: '+err.message); }).finally(()=>{ el('joinBtn').disabled=false; });
};
el('nameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') el('joinBtn').click(); });

window.addEventListener('offline', ()=> el('connWarn').classList.add('show'));
window.addEventListener('online', ()=> el('connWarn').classList.remove('show'));

if(playerId){
  el('nameInput').value = playerName;
  join(playerName || '이름없음').catch(()=>{});
}
</script>
