<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세계사 탑 오르기 - 전광판</title>
<style>
  :root{
    --sky-top:#0b1a3a; --sky-mid:#1e3c72; --sky-low:#3f6ea5; --sky-horizon:#f2a65a; --sky-glow:#ffd98a;
    --gold:#f2d27a; --gold-dark:#c5a028;
    --panel:rgba(255,255,255,.07); --line:rgba(255,255,255,.15);
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; margin:0; }
  body{
    font-family:'Malgun Gothic','Pretendard',-apple-system,sans-serif;
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 42%,var(--sky-low) 66%,var(--sky-horizon) 90%,var(--sky-glow) 100%);
    color:#fff; overflow:hidden; display:flex; flex-direction:column; height:100vh; position:relative;
  }

  .sky-layer{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .star{ position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; animation:twinkle 3.4s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.95;} }
  .cloud{
    position:absolute; border-radius:50%; background:rgba(255,255,255,.55); filter:blur(7px);
    animation-name:drift; animation-timing-function:linear; animation-iteration-count:infinite;
  }
  @keyframes drift{ from{ transform:translateX(-16vw); } to{ transform:translateX(116vw); } }
  .sun{
    position:absolute; left:50%; bottom:14%; transform:translateX(-50%); width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle,#fff8e2,#ffd98a 55%,rgba(255,217,138,0) 72%);
    box-shadow:0 0 90px 45px rgba(255,217,138,.3); animation:sunpulse 4.5s ease-in-out infinite;
  }
  @keyframes sunpulse{ 0%,100%{opacity:.8;} 50%{opacity:1;} }
  .mountains{ position:absolute; left:0; right:0; bottom:56px; height:36vh; z-index:1; }
  .mountains svg{ width:100%; height:100%; display:block; }

  header{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px; border-bottom:1px solid var(--line);
  }
  header h1{ margin:0; font-size:2rem; text-shadow:0 2px 8px rgba(0,0,0,.4); }
  .status{ display:flex; align-items:center; gap:20px; }
  .bgm-btn{
    padding:6px 14px; border-radius:999px; font-weight:800; font-size:.85rem;
    border:1px solid var(--line); background:rgba(255,255,255,.12); color:#fff; cursor:pointer;
  }
  .bgm-btn.muted{ opacity:.55; }
  .pill{ padding:6px 16px; border-radius:999px; font-weight:800; font-size:1rem; }
  .pill.idle{ background:#4a5a7a; }
  .pill.running{ background:#2e9e5b; }
  .pill.ended{ background:#d9534f; }
  .timer{ font-size:2.4rem; font-weight:900; font-variant-numeric:tabular-nums; color:var(--gold); text-shadow:0 2px 10px rgba(0,0,0,.5); }

  main{ position:relative; z-index:2; flex:1; display:grid; grid-template-columns:280px 1fr; gap:0; overflow:hidden; }

  .leaderboard{ padding:20px; border-right:1px solid var(--line); overflow-y:auto; background:rgba(10,20,45,.25); backdrop-filter:blur(2px); }
  .leaderboard h2{ font-size:1rem; opacity:.8; margin:0 0 14px; letter-spacing:.05em; }
  .lb-row{
    display:flex; align-items:center; gap:10px; padding:10px 8px; border-radius:10px; margin-bottom:6px;
    background:var(--panel); transition:background .3s ease;
  }
  .lb-row.rank1{ background:linear-gradient(90deg,rgba(242,210,122,.4),rgba(242,210,122,.08)); box-shadow:0 0 16px rgba(242,210,122,.25); }
  .lb-medal{ width:28px; text-align:center; font-size:1.2rem; }
  .lb-name{ flex:1; font-weight:700; font-size:1.02rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lb-floor{ font-weight:900; color:var(--gold); }

  .tower-area{ position:relative; overflow-x:auto; overflow-y:hidden; padding:0 20px; display:flex; align-items:flex-end; }
  .tower-track{ position:relative; display:flex; align-items:flex-end; gap:26px; height:100%; padding-bottom:56px; padding-top:20px; }

  .climber{
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; width:58px; flex:0 0 auto;
    position:relative;
  }
  .climber .crown-badge{
    font-size:1.05rem; line-height:1; height:1.05rem; margin-bottom:1px;
    opacity:0; transform:translateY(0) scale(.6); transition:opacity .2s, transform .2s;
  }
  .climber.leader .crown-badge{
    opacity:1; transform:scale(1); animation:crownBob 1.2s ease-in-out infinite;
  }
  @keyframes crownBob{
    0%,100%{ transform:translateY(0) rotate(-6deg) scale(1); }
    50%{ transform:translateY(-4px) rotate(6deg) scale(1); }
  }
  .climber .avatar-wrap{ position:relative; }
  .climber .avatar-wrap::before{
    content:''; position:absolute; left:50%; top:50%; width:0; height:0; border-radius:50%;
    background:radial-gradient(circle, rgba(255,150,40,.9), rgba(255,80,0,.55) 55%, rgba(255,80,0,0) 76%);
    transform:translate(-50%,-50%); opacity:0; pointer-events:none; z-index:-1;
    transition:opacity .25s;
  }
  .climber.onfire .avatar-wrap::before{
    width:50px; height:50px; opacity:1; animation:fireHalo .9s ease-in-out infinite;
  }
  @keyframes fireHalo{
    0%,100%{ transform:translate(-50%,-50%) scale(.85); }
    50%{ transform:translate(-50%,-50%) scale(1.15); }
  }
  .climber .fire-badge{
    position:absolute; left:100%; top:-4px; margin-left:1px; font-size:.95rem;
    opacity:0; pointer-events:none;
  }
  .climber.onfire .fire-badge{
    opacity:1; animation:fireFlicker .5s ease-in-out infinite alternate;
  }
  @keyframes fireFlicker{
    from{ transform:scale(.85) rotate(-6deg); }
    to{ transform:scale(1.05) rotate(6deg); }
  }
  .climber .avatar{
    font-size:1.8rem; margin-bottom:4px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));
    transform-origin:center bottom;
  }
  .climber.leveling .avatar{ animation:levelPop .6s ease; }
  @keyframes levelPop{
    0%{ transform:scale(1) translateY(0); }
    35%{ transform:scale(1.55) translateY(-16px); filter:drop-shadow(0 0 12px #ffe9a8); }
    100%{ transform:scale(1) translateY(0); }
  }
  .climber.sad .avatar{ animation:climberSad .7s ease; }
  @keyframes climberSad{
    0%{ transform:translateY(0) rotate(0deg) scale(1); }
    20%{ transform:translateY(4px) rotate(-8deg) scale(.95); }
    40%{ transform:translateY(7px) rotate(8deg) scale(.92); }
    60%{ transform:translateY(7px) rotate(-6deg) scale(.92); }
    100%{ transform:translateY(0) rotate(0deg) scale(1); }
  }
  .climber .col{
    width:18px; border-radius:6px 6px 0 0; position:relative; overflow:hidden;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.35) 0px, rgba(255,255,255,.35) 2px, transparent 2px, transparent 13px),
      linear-gradient(180deg,var(--gold),var(--gold-dark));
    background-size:100% 26px, 100% 100%;
    box-shadow:0 0 10px rgba(242,210,122,.5);
    transition:height .5s cubic-bezier(.34,1.56,.64,1);
    animation:rungs 1.8s linear infinite;
  }
  @keyframes rungs{ from{ background-position:0 0, 0 0; } to{ background-position:0 26px, 0 0; } }
  .climber .base{
    margin-top:6px; font-size:.72rem; text-align:center; max-width:64px; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; opacity:.9;
  }
  .climber .floorno{ font-size:.7rem; color:var(--gold); font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.5); }

  .popup{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    font-size:.85rem; font-weight:800; color:#ffe9a8; text-shadow:0 1px 4px rgba(0,0,0,.6);
    pointer-events:none; animation:floatUp .9s ease-out forwards;
  }
  @keyframes floatUp{
    0%{ opacity:1; transform:translate(-50%,0); }
    100%{ opacity:0; transform:translate(-50%,-34px); }
  }

  .ground{
    position:absolute; left:0; right:0; bottom:0; height:56px; z-index:1;
    background:linear-gradient(180deg,#3d2b1a,#2a1c10); border-top:4px solid #5c4326;
  }

  .empty-msg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.4rem; opacity:.6; z-index:2; }

  footer{ position:relative; z-index:2; text-align:center; padding:8px; font-size:.75rem; opacity:.5; }

  .end-overlay{
    position:fixed; inset:0; z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 32%, rgba(40,70,130,.55), rgba(6,14,32,.94) 72%);
    text-align:center; overflow:hidden;
  }
  .end-overlay.show{ display:flex; animation:overlayFade .5s ease; }
  @keyframes overlayFade{ from{ opacity:0; } to{ opacity:1; } }

  .end-title{
    font-size:3rem; font-weight:900; margin:0 0 2.2rem; color:var(--gold);
    text-shadow:0 4px 24px rgba(0,0,0,.6); animation:titlePop .7s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes titlePop{ 0%{ transform:scale(.4); opacity:0; } 100%{ transform:scale(1); opacity:1; } }

  .podium{ display:flex; align-items:flex-end; gap:28px; z-index:1; }
  .podium .place{ display:flex; flex-direction:column; align-items:center; width:150px; }
  .podium .place .crown{ font-size:2.4rem; margin-bottom:8px; animation:crownBounce 1.1s ease-in-out infinite; }
  @keyframes crownBounce{ 0%,100%{ transform:translateY(0) rotate(-6deg); } 50%{ transform:translateY(-8px) rotate(6deg); } }
  .podium .place .pname{
    font-weight:800; font-size:1.15rem; margin-bottom:2px; max-width:145px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .podium .place .pfloor{ font-weight:900; color:var(--gold); margin-bottom:10px; }
  .podium .stand{
    width:100%; border-radius:10px 10px 0 0; display:flex; align-items:flex-start; justify-content:center;
    padding-top:10px; font-size:2rem; font-weight:900; color:#3a2c05;
    background:linear-gradient(180deg,var(--gold),var(--gold-dark)); box-shadow:0 0 30px rgba(242,210,122,.4);
    animation:standRise .6s cubic-bezier(.34,1.56,.64,1) backwards;
  }
  @keyframes standRise{ from{ transform:scaleY(0); transform-origin:bottom; opacity:0; } to{ transform:scaleY(1); opacity:1; } }
  .podium .place.p1{ order:2; } .podium .place.p2{ order:1; } .podium .place.p3{ order:3; }
  .podium .place.p1 .stand{ height:170px; animation-delay:.15s; }
  .podium .place.p2 .stand{ height:120px; animation-delay:.3s; }
  .podium .place.p3 .stand{ height:90px; animation-delay:.45s; }
  .podium .place.p1 .pname{ font-size:1.5rem; }
  .podium .place.p1 .pfloor{ font-size:1.3rem; }

  .confetti-piece{
    position:absolute; top:-5vh; width:10px; height:16px; opacity:.9;
    animation-name:confettiFall; animation-timing-function:linear; animation-fill-mode:forwards;
  }
  @keyframes confettiFall{
    from{ transform:translateY(0) rotate(0deg); }
    to{ transform:translateY(112vh) rotate(600deg); }
  }
  .end-hint{ margin-top:2.4rem; font-size:.95rem; opacity:.65; }
</style>
</head>
<body>

<div class="sky-layer" id="skyLayer">
  <div class="sun"></div>
  <div class="mountains">
    <svg viewBox="0 0 1000 200" preserveAspectRatio="none">
      <polygon points="0,200 0,120 140,40 260,110 380,55 520,130 650,60 780,115 900,70 1000,120 1000,200" fill="#16264d" opacity="0.55"></polygon>
      <polygon points="0,200 0,150 180,90 320,140 460,85 600,150 760,95 900,145 1000,110 1000,200" fill="#1f3560" opacity="0.75"></polygon>
    </svg>
  </div>
</div>

<header>
  <h1>🏯 세계사 탑 오르기</h1>
  <div class="status">
    <button class="bgm-btn" id="bgmToggle" type="button">🔊 배경음</button>
    <span class="pill idle" id="statusPill">대기중</span>
    <span class="timer" id="timerVal">--:--</span>
  </div>
</header>

<main>
  <div class="leaderboard">
    <h2>🏆 순위</h2>
    <div id="lbList"></div>
  </div>
  <div class="tower-area">
    <div class="ground"></div>
    <div class="tower-track" id="towerTrack"></div>
    <div class="empty-msg" id="emptyMsg">학생들이 접속하면 여기에 나타납니다</div>
  </div>
</main>

<footer>play.html 주소로 학생들이 접속합니다 (어느 네트워크에서든 가능)</footer>

<div class="end-overlay" id="endOverlay">
  <div class="confetti-layer" id="confettiLayer" style="position:absolute; inset:0; pointer-events:none;"></div>
  <div class="end-title">🎉 게임 종료! 축하합니다 🎉</div>
  <div class="podium" id="podium"></div>
  <div class="end-hint">다음 라운드를 시작하면 이 화면은 사라집니다</div>
</div>

<script type="module">
import { roomRef, onValue, serverNow, fmtTime, escapeHtml, rankedPlayers } from '../shared/lib.js';

const ROOM = 'world';
const el = (id) => document.getElementById(id);
const MEDALS = ['🥇','🥈','🥉'];
const lastFloor = {};
const lastWrong = {};
const climberEls = {};

let roundState = { status:'idle', end_time:null };
let playersObj = {};
let prevEffective = null;

// ── 배경음악: 외부 파일 없이 Web Audio API로 자체 생성하는 잔잔한 루프 ──
const BGM_MUTE_KEY = 'rg_fb_bgm_muted';
const BGM_VOLUME = 0.55; // 마스터 볼륨(컴퓨터 볼륨은 그대로 따라가고, 이 값은 우리 소리 자체의 크기)
let audioCtx = null;
let masterGain = null;
let bgmStarted = false;
let bgmMuted = localStorage.getItem(BGM_MUTE_KEY) === '1';

// 코드 진행 C - Am - F - G (패드 + 아르페지오)
const BGM_CHORDS = [
  { pad: [130.81, 164.81, 196.00], arp: [261.63, 329.63, 392.00, 523.25] },
  { pad: [110.00, 130.81, 164.81], arp: [220.00, 261.63, 329.63, 440.00] },
  { pad: [87.31, 110.00, 130.81], arp: [174.61, 220.00, 261.63, 349.23] },
  { pad: [98.00, 123.47, 146.83], arp: [196.00, 246.94, 293.66, 392.00] },
];
const BGM_BEAT_SEC = 0.55;
const BGM_BEATS_PER_CHORD = 4;
let bgmChordIndex = 0, bgmBeatIndex = 0, bgmNextTime = 0, bgmSchedulerId = null;

function ensureAudioCtx(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = bgmMuted ? 0 : BGM_VOLUME;
  // 여러 음이 겹쳐도 소리가 찌그러지지 않도록 리미터 역할의 컴프레서를 마지막 단에 건다
  const compressor = audioCtx.createDynamicsCompressor();
  compressor.threshold.value = -18;
  compressor.knee.value = 24;
  compressor.ratio.value = 8;
  compressor.attack.value = 0.003;
  compressor.release.value = 0.25;
  masterGain.connect(compressor);
  compressor.connect(audioCtx.destination);
}

function playTone(freq, startTime, duration, peak, type){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(peak, startTime + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(gain); gain.connect(masterGain);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.05);
}

function scheduleBgmNote(){
  const chord = BGM_CHORDS[bgmChordIndex];
  if(bgmBeatIndex === 0){
    chord.pad.forEach(f => playTone(f, bgmNextTime, BGM_BEAT_SEC*BGM_BEATS_PER_CHORD*0.95, 0.16, 'sine'));
  }
  const note = chord.arp[bgmBeatIndex % chord.arp.length];
  playTone(note, bgmNextTime, BGM_BEAT_SEC*0.9, 0.14, 'triangle');

  bgmBeatIndex++;
  if(bgmBeatIndex >= BGM_BEATS_PER_CHORD){
    bgmBeatIndex = 0;
    bgmChordIndex = (bgmChordIndex+1) % BGM_CHORDS.length;
  }
  bgmNextTime += BGM_BEAT_SEC;
}

function bgmSchedulerTick(){
  while(bgmNextTime < audioCtx.currentTime + 0.2){
    scheduleBgmNote();
  }
}

function updateBgmBtn(){
  const btn = el('bgmToggle');
  btn.textContent = bgmMuted ? '🔇 배경음 꺼짐' : '🔊 배경음 켜짐';
  btn.classList.toggle('muted', bgmMuted);
}

function startBgm(){
  window.removeEventListener('click', tryAutoStartBgm);
  window.removeEventListener('keydown', tryAutoStartBgm);
  window.removeEventListener('touchstart', tryAutoStartBgm);
  if(bgmStarted) return;
  ensureAudioCtx();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  bgmStarted = true;
  bgmNextTime = audioCtx.currentTime + 0.1;
  bgmSchedulerId = setInterval(bgmSchedulerTick, 100);
  updateBgmBtn();
}

function setBgmMuted(muted){
  bgmMuted = muted;
  localStorage.setItem(BGM_MUTE_KEY, muted ? '1' : '0');
  if(masterGain) masterGain.gain.value = muted ? 0 : BGM_VOLUME;
  updateBgmBtn();
}

// 게임 종료 · 1등 발표 팡파레 (상승 아르페지오 + 마무리 화음)
function playFanfare(){
  ensureAudioCtx();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const t0 = audioCtx.currentTime + 0.05;
  const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
  notes.forEach((f,i)=>{
    playTone(f, t0 + i*0.12, 0.35, 0.5, 'triangle');
  });
  const chordTime = t0 + notes.length*0.12 + 0.05;
  [783.99, 987.77, 1174.66, 1567.98].forEach(f=>{ // G5 B5 D6 G6
    playTone(f, chordTime, 1.1, 0.4, 'sawtooth');
  });
}

el('bgmToggle').onclick = () => {
  if(!bgmStarted) startBgm();
  else setBgmMuted(!bgmMuted);
};

// 브라우저 자동재생 정책 때문에 화면을 처음 클릭/터치/키 입력하면 자동으로 시작
function tryAutoStartBgm(){
  startBgm();
}
window.addEventListener('click', tryAutoStartBgm);
window.addEventListener('keydown', tryAutoStartBgm);
window.addEventListener('touchstart', tryAutoStartBgm);
updateBgmBtn();

function buildBackground(){
  const layer = el('skyLayer');
  const frag = document.createDocumentFragment();
  for(let i=0;i<45;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = (Math.random()*100)+'%';
    s.style.top = (Math.random()*55)+'%';
    s.style.animationDelay = (Math.random()*3.4)+'s';
    frag.appendChild(s);
  }
  const cloudCount = 6;
  for(let i=0;i<cloudCount;i++){
    const c = document.createElement('div');
    c.className = 'cloud';
    const size = 60 + Math.random()*90;
    c.style.width = size+'px';
    c.style.height = (size*0.45)+'px';
    c.style.top = (6 + Math.random()*32)+'%';
    c.style.animationDuration = (40 + Math.random()*35)+'s';
    c.style.animationDelay = (-Math.random()*40)+'s';
    frag.appendChild(c);
  }
  layer.appendChild(frag);
}

function ensureClimberEl(track, id){
  if(climberEls[id]) return climberEls[id];
  const div = document.createElement('div');
  div.className = 'climber';
  div.innerHTML = `
    <div class="floorno"></div>
    <div class="crown-badge">👑</div>
    <div class="avatar-wrap">
      <div class="avatar"></div>
      <div class="fire-badge">🔥</div>
    </div>
    <div class="col" style="height:6px"></div>
    <div class="base"></div>
  `;
  track.appendChild(div);
  climberEls[id] = div;
  return div;
}

function renderTower(players, leaderId){
  const track = el('towerTrack');
  const maxFloor = Math.max(10, ...players.map(p=>p.floor||0));
  const trackHeight = track.clientHeight || 500;
  const usable = trackHeight - 20;
  const seen = new Set();

  players.forEach((p)=>{
    seen.add(p.id);
    const node = ensureClimberEl(track, p.id);
    track.appendChild(node);
    const floor = p.floor||0;
    const h = Math.round((floor / maxFloor) * usable);
    const avatar = p.avatar || '🐱'; // 입장 시 배정된 개인 캐릭터 (예전 데이터엔 없을 수 있어 기본값)

    node.querySelector('.floorno').textContent = floor;
    node.querySelector('.avatar').textContent = avatar;
    node.querySelector('.col').style.height = Math.max(6,h)+'px';
    node.querySelector('.base').textContent = p.name || '';
    node.classList.toggle('leader', leaderId != null && p.id === leaderId);
    node.classList.toggle('onfire', (p.streak||0) >= 3);

    const prev = lastFloor[p.id];
    if(prev !== undefined && floor > prev){
      node.classList.remove('leveling'); void node.offsetWidth; node.classList.add('leveling');
      const gain = floor - prev;
      const popup = document.createElement('div');
      popup.className = 'popup';
      popup.textContent = '+' + gain;
      node.appendChild(popup);
      setTimeout(()=> popup.remove(), 900);
    }
    lastFloor[p.id] = floor;

    const wrong = p.wrong||0;
    const prevWrong = lastWrong[p.id];
    if(prevWrong !== undefined && wrong > prevWrong){
      node.classList.remove('sad'); void node.offsetWidth; node.classList.add('sad');
    }
    lastWrong[p.id] = wrong;
  });

  Object.keys(climberEls).forEach(id=>{
    if(!seen.has(id)){
      climberEls[id].remove();
      delete climberEls[id];
      delete lastFloor[id];
      delete lastWrong[id];
    }
  });
}

const CONFETTI_COLORS = ['#f2d27a','#e85d75','#5aa9e6','#7bd389','#c792ea','#ffffff'];
let confettiTimer = null;

function spawnConfettiBatch(n){
  const layer = el('confettiLayer');
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = (Math.random()*100)+'%';
    p.style.background = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    p.style.borderRadius = Math.random()<0.5 ? '50%' : '2px';
    const duration = 2.6 + Math.random()*2.2;
    p.style.animationDuration = duration+'s';
    p.style.animationDelay = (Math.random()*0.6)+'s';
    layer.appendChild(p);
    setTimeout(()=> p.remove(), (duration+1)*1000);
  }
}

function buildPodium(ranked){
  const podium = el('podium');
  if(!ranked.length){
    podium.innerHTML = '<div style="opacity:.75; font-size:1.1rem;">정답률 70%를 넘는 학생이 없어 시상대가 비어있습니다</div>';
    return;
  }
  const top3 = ranked.slice(0,3);
  const classes = ['p1','p2','p3'];
  const crowns = ['👑','🥈','🥉'];
  podium.innerHTML = top3.map((p,i)=>`
    <div class="place ${classes[i]}">
      <div class="crown">${crowns[i]}</div>
      <div class="pname">${escapeHtml(p.name)}</div>
      <div class="pfloor">${p.floor||0}층</div>
      <div class="stand">${i+1}</div>
    </div>
  `).join('');
}

function showEndCelebration(players, ranked){
  if(!players.length) return;
  buildPodium(ranked);
  el('endOverlay').classList.add('show');
  spawnConfettiBatch(70);
  if(confettiTimer) clearInterval(confettiTimer);
  confettiTimer = setInterval(()=> spawnConfettiBatch(12), 900);
  playFanfare();
}

function hideEndCelebration(){
  el('endOverlay').classList.remove('show');
  el('confettiLayer').innerHTML = '';
  if(confettiTimer){ clearInterval(confettiTimer); confettiTimer = null; }
}

function render(){
  const remaining = roundState.end_time!=null ? Math.max(0, Math.round((roundState.end_time - serverNow())/1000)) : null;
  let effective = roundState.status;
  if(roundState.status==='running' && remaining!==null && remaining<=0) effective='ended';

  const pill = el('statusPill');
  pill.className = 'pill ' + effective;
  pill.textContent = effective==='idle' ? '대기중' : effective==='running' ? '진행중' : '종료';
  el('timerVal').textContent = fmtTime(remaining);

  const players = Object.entries(playersObj).map(([id,p])=>({id,...p}));
  players.sort((a,b)=> (b.floor||0)-(a.floor||0) || (b.correct||0)-(a.correct||0));
  const ranked = rankedPlayers(players); // 정답률 70% 초과인 학생만 순위에 포함

  el('emptyMsg').style.display = players.length ? 'none' : 'flex';

  el('lbList').innerHTML = ranked.length ? ranked.slice(0,10).map((p,i)=>`
    <div class="lb-row ${i===0?'rank1':''}">
      <div class="lb-medal">${MEDALS[i] || (i+1)}</div>
      <div class="lb-name">${escapeHtml(p.name||'')}</div>
      <div class="lb-floor">${p.floor||0}층</div>
    </div>
  `).join('') : '<div style="opacity:.6; font-size:.85rem; padding:6px 4px;">정답률 70%를 넘는 학생이 아직 없습니다</div>';

  renderTower(players, ranked[0]?.id);

  if(effective === 'ended' && prevEffective !== 'ended'){
    showEndCelebration(players, ranked);
  } else if(effective !== 'ended' && prevEffective === 'ended'){
    hideEndCelebration();
  }
  prevEffective = effective;
}

onValue(roomRef(ROOM,'round'), (snap)=>{
  const r = snap.val();
  roundState = r ? { status: r.status||'idle', end_time: r.end_time ?? null } : { status:'idle', end_time:null };
});
onValue(roomRef(ROOM,'players'), (snap)=>{
  playersObj = snap.val() || {};
});

buildBackground();
setInterval(render, 500);
</script>
