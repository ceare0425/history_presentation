<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국사 탑 오르기 - 관리자</title>
<style>
  :root{
    --sky1:#1e3c72; --sky2:#2a5298; --gold:#e8c76f; --gold-dark:#c5a028;
    --bg:#f2f4f9; --card:#fff; --ink:#22314f; --sub:#68758f; --line:#e3e8f2;
    --good:#2e9e5b; --bad:#d9534f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Malgun Gothic','Pretendard',-apple-system,sans-serif;
    background:var(--bg); color:var(--ink); padding:20px;
  }
  h1{ font-size:1.3rem; margin:0 0 4px; }
  .sub{ color:var(--sub); font-size:.85rem; margin-bottom:18px; }
  .grid{ display:grid; grid-template-columns:340px 1fr; gap:18px; align-items:start; }
  @media (max-width:860px){ .grid{ grid-template-columns:1fr; } }

  .card{ background:var(--card); border-radius:14px; padding:18px; box-shadow:0 4px 16px rgba(30,60,114,.08); margin-bottom:16px; }
  .card h2{ font-size:1rem; margin:0 0 12px; color:var(--sky1); }

  .units{ max-height:260px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:10px; }
  .unit-row{ display:flex; align-items:center; gap:8px; padding:5px 4px; font-size:.9rem; }
  .unit-row span.cnt{ color:var(--sub); font-size:.78rem; margin-left:auto; }
  .pool-count{ font-size:.8rem; color:var(--sub); margin:-4px 0 10px; }
  .pool-count b{ color:var(--sky1); }

  label{ font-size:.85rem; color:var(--sub); display:block; margin:10px 0 4px; }
  input[type=text], input[type=number], textarea{
    width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:8px; font-size:.92rem;
    font-family:inherit;
  }
  textarea{ resize:vertical; min-height:90px; }
  .row{ display:flex; gap:8px; }
  .row > *{ flex:1; }

  button{
    padding:10px 14px; border:none; border-radius:9px; font-weight:700; cursor:pointer; font-size:.9rem;
    color:#fff; background:var(--sky1);
  }
  button.secondary{ background:#8b96ab; }
  button.good{ background:var(--good); }
  button.bad{ background:var(--bad); }
  button:disabled{ opacity:.5; cursor:default; }
  .btnrow{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }

  .status-line{ display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .pill{ padding:4px 10px; border-radius:999px; font-size:.78rem; font-weight:700; }
  .pill.idle{ background:#e6e9f0; color:#5b6a8a; }
  .pill.running{ background:#e2f4e9; color:var(--good); }
  .pill.ended{ background:#fdeaea; color:var(--bad); }
  .timer-big{ font-size:1.3rem; font-weight:800; font-variant-numeric:tabular-nums; color:var(--sky1); }

  table{ width:100%; border-collapse:collapse; font-size:.88rem; }
  th, td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  th{ color:var(--sub); font-weight:600; font-size:.78rem; text-transform:uppercase; }
  tr:first-child td{ font-weight:700; }
  .rank{ width:28px; }
  .acc-ok{ color:var(--good); font-weight:700; }
  .acc-bad{ color:var(--bad); font-weight:700; }
  .muted{ color:var(--sub); }

  .toggle-row{ display:flex; gap:8px; margin-top:4px; }
  .toggle-row button{ flex:1; background:#e6e9f0; color:var(--sub); font-weight:700; }
  .toggle-row button.active{ background:var(--sky1); color:#fff; }
  .hidden{ display:none !important; }

  .team-standings{ display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
  .team-bar-row{ display:flex; align-items:center; gap:8px; font-size:.82rem; }
  .team-bar-row .tlabel{ width:78px; flex-shrink:0; font-weight:700; }
  .team-bar-track{ flex:1; height:10px; background:#e6e9f0; border-radius:6px; overflow:hidden; }
  .team-bar-fill{ height:100%; border-radius:6px; transition:width .3s ease; }
  .team-bar-row .tval{ width:52px; text-align:right; flex-shrink:0; color:var(--sub); }

  .kick-btn{ padding:5px 10px; font-size:.76rem; background:var(--bad); }
  .msg{ font-size:.82rem; margin-top:8px; min-height:1.2em; }
  .msg.err{ color:var(--bad); }
  .msg.ok{ color:var(--good); }
  details{ margin-top:10px; }
  summary{ cursor:pointer; font-size:.85rem; color:var(--sub); }

  select{
    width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:8px; font-size:.92rem;
    font-family:inherit; background:#fff;
  }
  .qlist{ max-height:320px; overflow-y:auto; margin-top:10px; border:1px solid var(--line); border-radius:10px; }
  .qrow{ display:flex; align-items:flex-start; gap:8px; padding:8px 10px; border-bottom:1px solid var(--line); font-size:.85rem; }
  .qrow:last-child{ border-bottom:none; }
  .qrow .qtext{ flex:1; }
  .qrow .qunit{ display:inline-block; font-size:.72rem; color:var(--sky1); background:#eef2fb; padding:1px 6px; border-radius:6px; margin-right:6px; }
  .qrow .qans{ color:var(--sub); font-size:.78rem; margin-top:2px; }
  .qrow button{ padding:5px 10px; font-size:.76rem; background:var(--bad); flex-shrink:0; }
</style>
</head>
<body>

<h1>🏯 한국사 탑 오르기 · 관리자</h1>
<div class="sub">학생 화면 <code>play.html</code> · 대형 화면 <code>board.html</code> — 어느 네트워크에서 접속해도 됩니다 (인터넷으로 동기화)</div>

<div class="grid">
  <div>
    <div class="card">
      <h2>① 출제 범위</h2>
      <div class="units" id="unitList">불러오는 중...</div>
      <div class="pool-count" id="poolCountInfo"></div>
      <div class="row">
        <button class="secondary" id="selectAllBtn" type="button">전체 선택</button>
        <button class="secondary" id="selectNoneBtn" type="button">전체 해제</button>
      </div>
      <label>제한 시간 (분)</label>
      <input type="number" id="durationInput" value="7" min="1" max="60" step="1">
      <label>출제 순서</label>
      <div class="toggle-row" id="orderToggle">
        <button type="button" class="active" data-order="random">🔀 랜덤</button>
        <button type="button" data-order="sequential">➡ 순서대로</button>
      </div>
      <label>출제 문항 수 (비워두면 선택 범위 전체 사용)</label>
      <input type="number" id="questionCountInput" min="1" placeholder="전체 사용">
      <label>팀전 모드 (학생이 참여 화면에서 팀을 고릅니다)</label>
      <div class="toggle-row" id="teamModeToggle">
        <button type="button" class="active" data-mode="off">개인전</button>
        <button type="button" data-mode="on">팀전</button>
      </div>
      <div class="toggle-row hidden" id="teamCountRow">
        <button type="button" data-count="2">2팀</button>
        <button type="button" data-count="3">3팀</button>
        <button type="button" class="active" data-count="4">4팀</button>
      </div>
      <div class="btnrow hidden" id="teamShuffleRow">
        <button type="button" class="secondary" id="teamShuffleBtn">🎲 참여자 랜덤 배정</button>
      </div>
      <div class="msg" id="teamShuffleMsg"></div>
      <div class="btnrow">
        <button id="startBtn">▶ 게임 시작</button>
        <button class="bad" id="endBtn">■ 종료</button>
        <button class="secondary" id="resetBtn">↺ 전체 초기화</button>
      </div>
      <div class="msg" id="startMsg"></div>
    </div>

    <div class="card">
      <h2>② 문제 추가</h2>
      <label>주제 태그</label>
      <input type="text" id="qUnit" placeholder="예: 주제 01. 문명의 형성" list="unitOptions">
      <datalist id="unitOptions"></datalist>
      <label>문제 (빈칸은 ____ 로 표시, 안 쓰면 자동으로 뒤에 붙습니다)</label>
      <input type="text" id="qQuestion" placeholder="예: 함무라비왕이 편찬한 법전은 ____이다.">
      <label>정답 (여러 정답은 / 로 구분)</label>
      <input type="text" id="qAnswer" placeholder="예: 함무라비 법전">
      <div class="btnrow">
        <button id="addBtn">문제 추가</button>
      </div>
      <div class="msg" id="addMsg"></div>

      <details>
        <summary>여러 문제 한번에 붙여넣기 / 엑셀(xlsx) 불러오기</summary>
        <label>한 줄에 하나씩: <code>주제 | 문제(____포함) | 정답</code></label>
        <textarea id="bulkInput" placeholder="주제 01. 문명의 형성 | 현생 인류인 ____은/는 약 20~30만 년 전 아프리카에서 등장하였다. | 호모 사피엔스"></textarea>
        <label>또는 엑셀(xlsx) 파일 선택 (양식 다운로드 후 표에 입력해서 작성하는 게 가장 편합니다)</label>
        <input type="file" id="xlsxFileInput" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
        <div class="btnrow">
          <button class="secondary" id="xlsxTemplateBtn" type="button">엑셀 양식 다운로드</button>
          <button class="secondary" id="bulkAddBtn">일괄 추가</button>
        </div>
        <div class="msg" id="bulkMsg"></div>
      </details>
    </div>

    <div class="card">
      <h2>③ 문제 목록 관리 / 삭제</h2>
      <label>주제 필터</label>
      <select id="manageUnitFilter">
        <option value="">전체 (<span id="manageAllCount">0</span>개)</option>
      </select>
      <div class="btnrow">
        <button class="bad" id="deleteUnitBtn" type="button">선택한 주제 문제 전체 삭제</button>
      </div>
      <div class="qlist" id="questionList"><div class="qrow muted">불러오는 중...</div></div>
      <div class="msg" id="manageMsg"></div>
    </div>
  </div>

  <div class="card">
    <h2>④ 실시간 현황</h2>
    <div class="status-line">
      <span class="pill idle" id="statusPill">대기중</span>
      <span class="timer-big" id="timerBig">--:--</span>
      <span class="muted" id="poolInfo"></span>
      <button type="button" id="bonusNowBtn" class="secondary" style="flex:0 0 auto; padding:6px 12px; font-size:.82rem;" disabled>🔥 지금 2배 찬스 발동</button>
      <span class="muted" id="bonusNowMsg"></span>
    </div>
    <div class="team-standings hidden" id="teamStandingsBox"></div>
    <table>
      <thead>
        <tr><th class="rank">#</th><th>이름</th><th id="teamTh" class="hidden">팀</th><th>층수</th><th>정답/오답</th><th>정답률</th><th>연속</th><th>상태</th><th>관리</th></tr>
      </thead>
      <tbody id="roster"><tr><td colspan="9" class="muted">학생이 아직 없습니다.</td></tr></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script type="module">
import {
  roomRef, ref, onValue, get, set, update, remove, push, db, serverNow,
  fmtTime, escapeHtml, parseQuestionLine, unitsFromQuestions, poolFromQuestions, shuffle,
  teamInfo, teamStandings, activeBonus, TEAM_OPTIONS
} from '../shared/lib.js';

const ROOM = 'korea';
const el = (id) => document.getElementById(id);

let questionsObj = {};
let allUnits = [];
let selectedUnits = new Set();
let roundState = { status:'idle', units:[], duration_sec:420, end_time:null, token:0, order:'random', qids:[], team_mode:false, team_count:4, bonus:[] };
let playersObj = {};
let questionOrder = 'random';
let teamModeState = false;
let teamCountState = 4;
let teamStateHydrated = false; // round 리스너에서 한 번이라도 값을 읽어왔는지 (버튼 초기 상태 복원용)

el('orderToggle').querySelectorAll('button').forEach(btn=>{
  btn.onclick = () => {
    questionOrder = btn.dataset.order;
    el('orderToggle').querySelectorAll('button').forEach(b=>b.classList.toggle('active', b===btn));
  };
});

el('teamModeToggle').querySelectorAll('button').forEach(btn=>{
  btn.onclick = async () => {
    teamModeState = btn.dataset.mode === 'on';
    el('teamModeToggle').querySelectorAll('button').forEach(b=>b.classList.toggle('active', b===btn));
    el('teamCountRow').classList.toggle('hidden', !teamModeState);
    el('teamShuffleRow').classList.toggle('hidden', !teamModeState);
    await update(roomRef(ROOM,'round'), { team_mode: teamModeState, team_count: teamCountState });
  };
});
el('teamCountRow').querySelectorAll('button').forEach(btn=>{
  btn.onclick = async () => {
    teamCountState = parseInt(btn.dataset.count, 10);
    el('teamCountRow').querySelectorAll('button').forEach(b=>b.classList.toggle('active', b===btn));
    await update(roomRef(ROOM,'round'), { team_mode: teamModeState, team_count: teamCountState });
  };
});

el('teamShuffleBtn').onclick = async () => {
  const msg = el('teamShuffleMsg');
  if(!teamModeState){ msg.className='msg err'; msg.textContent='먼저 팀전 모드를 켜주세요.'; return; }
  const pids = Object.keys(playersObj);
  if(!pids.length){ msg.className='msg err'; msg.textContent='참여한 학생이 없습니다.'; return; }
  const teamKeys = TEAM_OPTIONS.slice(0, teamCountState).map(t=>t.key);
  const shuffled = shuffle(pids);
  const updates = {};
  shuffled.forEach((pid, i)=>{
    updates[`rooms/${ROOM}/players/${pid}/team`] = teamKeys[i % teamKeys.length];
  });
  el('teamShuffleBtn').disabled = true;
  try{
    await update(ref(db), updates);
    msg.className='msg ok'; msg.textContent = `${pids.length}명을 ${teamKeys.length}개 팀에 랜덤 배정했습니다.`;
  } catch(err){
    msg.className='msg err'; msg.textContent = '배정 실패: ' + err.message;
  } finally {
    el('teamShuffleBtn').disabled = false;
  }
};

function updatePoolCountInfo(){
  const totalCount = Object.keys(questionsObj).length;
  const selectedCount = poolFromQuestions(questionsObj, Array.from(selectedUnits)).length;
  el('poolCountInfo').innerHTML = totalCount===0 ? '' :
    `전체 등록 문제 <b>${totalCount}</b>개 · 선택한 범위 <b>${selectedCount}</b>개`;
  const countInput = el('questionCountInput');
  countInput.max = selectedCount || '';
  countInput.placeholder = selectedCount ? `전체 사용 (${selectedCount}개)` : '전체 사용';
}

function renderUnits(){
  const box = el('unitList');
  if(allUnits.length===0){ box.innerHTML = '<div class="muted">아직 문제가 없습니다. 아래 ②에서 추가해주세요.</div>'; updatePoolCountInfo(); return; }
  box.innerHTML = '';
  allUnits.forEach(u=>{
    const row = document.createElement('label');
    row.className = 'unit-row';
    const checked = selectedUnits.has(u.unit) ? 'checked' : '';
    row.innerHTML = `<input type="checkbox" data-unit="${escapeHtml(u.unit)}" ${checked}> ${escapeHtml(u.unit)} <span class="cnt">${u.count}문제</span>`;
    box.appendChild(row);
  });
  box.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.onchange = () => {
      if(cb.checked) selectedUnits.add(cb.dataset.unit);
      else selectedUnits.delete(cb.dataset.unit);
      updatePoolCountInfo();
    };
  });
  const dl = el('unitOptions');
  dl.innerHTML = allUnits.map(u=>`<option value="${escapeHtml(u.unit)}">`).join('');
  updatePoolCountInfo();
}

el('selectAllBtn').onclick = () => { selectedUnits = new Set(allUnits.map(u=>u.unit)); renderUnits(); };
el('selectNoneBtn').onclick = () => { selectedUnits = new Set(); renderUnits(); };

el('startBtn').onclick = async () => {
  const msg = el('startMsg');
  const units = Array.from(selectedUnits);
  const minutes = parseFloat(el('durationInput').value) || 5;
  const duration_sec = Math.max(30, Math.min(3600, Math.round(minutes*60)));

  const pool = poolFromQuestions(questionsObj, units);
  if(pool.length===0){ msg.className='msg err'; msg.textContent = '선택한 범위에 문제가 없습니다.'; return; }

  const countRaw = el('questionCountInput').value.trim();
  const desiredCount = countRaw ? Math.max(1, Math.round(parseFloat(countRaw))) : null;
  let qids = pool.map(([qid])=>qid);
  if(desiredCount && desiredCount < qids.length){
    qids = shuffle(qids).slice(0, desiredCount);
  }

  el('startBtn').disabled = true;
  try{
    const bonus = [];
    const updates = {};
    updates[`rooms/${ROOM}/round`] = {
      status: 'running', units, duration_sec,
      end_time: serverNow() + duration_sec*1000,
      token: serverNow(),
      order: questionOrder,
      qids,
      team_mode: teamModeState,
      team_count: teamCountState,
      bonus
    };
    Object.keys(playersObj).forEach(pid=>{
      updates[`rooms/${ROOM}/players/${pid}/floor`] = 0;
      updates[`rooms/${ROOM}/players/${pid}/correct`] = 0;
      updates[`rooms/${ROOM}/players/${pid}/wrong`] = 0;
      updates[`rooms/${ROOM}/players/${pid}/streak`] = 0;
      updates[`rooms/${ROOM}/players/${pid}/bestStreak`] = 0;
    });
    await update(ref(db), updates);
    const bonusNote = bonus.length ? ` · 🔥 2배 찬스 ${bonus.length}회 예정` : '';
    msg.className='msg ok'; msg.textContent = `시작! 출제 문항 ${qids.length}개 (선택 범위 ${pool.length}개 중)${bonusNote}`;
  } catch(err){
    msg.className='msg err'; msg.textContent = '시작 실패: ' + err.message;
  } finally {
    el('startBtn').disabled = false;
  }
};

el('endBtn').onclick = () => update(roomRef(ROOM,'round'), { status: 'ended' });

el('resetBtn').onclick = async () => {
  if(!confirm('모든 학생의 점수와 참여 목록을 초기화할까요?')) return;
  const msg = el('startMsg');
  // players 상위 노드 자체는 보안 규칙상 쓰기 권한이 없고 players/$playerId 단위에만 있으므로,
  // 각 학생 id를 하나씩 지우는 멀티패스 업데이트로 보낸다 (경로별로 권한이 개별 검사됨)
  const updates = {};
  Object.keys(playersObj).forEach(pid=>{
    updates[`rooms/${ROOM}/players/${pid}`] = null;
  });
  updates[`rooms/${ROOM}/round`] = { status: 'idle', end_time: null, team_mode: teamModeState, team_count: teamCountState };
  try{
    await update(ref(db), updates);
    msg.className='msg ok'; msg.textContent = '전체 초기화 완료! 접속해 있던 학생은 모두 내보내졌습니다.';
  } catch(err){
    msg.className='msg err'; msg.textContent = '초기화 실패: ' + err.message;
  }
};

el('bonusNowBtn').onclick = async () => {
  const r = roundState;
  if(r.status !== 'running' || r.end_time == null) return;
  const bonusMsg = el('bonusNowMsg');
  const elapsedNow = r.duration_sec - Math.max(0, Math.round((r.end_time - serverNow())/1000));
  const newWindow = { start: elapsedNow, end: elapsedNow + 20, mult: 2 };
  const bonus = [...(r.bonus||[]), newWindow];
  el('bonusNowBtn').disabled = true;
  try{
    await update(roomRef(ROOM,'round'), { bonus });
    bonusMsg.textContent = '🔥 발동! 20초간 2배';
    setTimeout(()=>{ bonusMsg.textContent=''; }, 4000);
  } catch(err){
    bonusMsg.textContent = '발동 실패: ' + err.message;
  }
};

el('addBtn').onclick = async () => {
  const unit = el('qUnit').value.trim();
  const question0 = el('qQuestion').value.trim();
  const answer = el('qAnswer').value.trim();
  const msg = el('addMsg');
  if(!unit || !question0 || !answer){ msg.className='msg err'; msg.textContent='주제/문제/정답을 모두 입력하세요.'; return; }
  const question = question0.includes('____') ? question0 : question0 + ' ____';
  const answers = answer.split('/').map(a=>a.trim()).filter(Boolean);
  if(!answers.length){ msg.className='msg err'; msg.textContent='정답을 입력하세요.'; return; }

  try{
    const newRef = push(roomRef(ROOM,'questions'));
    await set(newRef, { unit, question, answers });
    msg.className='msg ok'; msg.textContent = '추가 완료!';
    el('qQuestion').value=''; el('qAnswer').value='';
  } catch(err){
    msg.className='msg err'; msg.textContent = '추가 실패: ' + err.message;
  }
};

const XLSX_TEMPLATE_ROWS = [
  ['주제', '문제 (빈칸은 ____ 로 표시)', '정답 (여러 정답은 / 로 구분)'],
  ['주제 01. 삼국 통일과 남북국', '백제를 정복하고 이어서 고구려까지 멸망시킨 뒤 삼국을 통일한 신라의 왕은 ____이다.', '문무왕'],
  ['주제 01. 삼국 통일과 남북국', '고려 광종은 노비안검법과 함께 ____를 실시하여 인재를 등용하였다.', '과거제'],
  ['주제 02. 조선의 성립과 발전', '세종은 강력한 화포를 앞세워 대마도(쓰시마섬)를 정벌하도록 ____를 파견하였다.', '이종무'],
];

const XLSX_GUIDE_ROWS = [
  ['한국사 복습 게임 - 문제 양식 사용법'],
  [''],
  ["1. '문제' 시트에 주제 / 문제 / 정답 순서로 한 행에 문제 하나씩 입력하세요."],
  ['2. 문제 칸의 빈칸은 ____ (밑줄 4개)로 표시하세요. 안 쓰면 문제 끝에 자동으로 붙습니다.'],
  ['3. 정답이 여러 개일 수 있으면 / 로 구분해서 적으세요. 예: 세종/세종대왕'],
  ['4. 주제 태그는 자유롭게 정하면 됩니다. 관리자 화면에서 이 태그 기준으로 출제 범위를 고릅니다.'],
  ['5. 첫 줄(머리글)은 그대로 두고, 예시 행은 지운 뒤 문제를 입력하세요.'],
  [''],
  ["작성이 끝나면 관리자 화면에서 이 파일을 업로드하고 '일괄 추가'를 누르세요."],
];

el('xlsxTemplateBtn').onclick = () => {
  const ws = XLSX.utils.aoa_to_sheet(XLSX_TEMPLATE_ROWS);
  ws['!cols'] = [{ wch: 22 }, { wch: 60 }, { wch: 24 }];
  const guideWs = XLSX.utils.aoa_to_sheet(XLSX_GUIDE_ROWS);
  guideWs['!cols'] = [{ wch: 60 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '문제');
  XLSX.utils.book_append_sheet(wb, guideWs, '안내');
  XLSX.writeFile(wb, 'questions_양식.xlsx');
};

el('xlsxFileInput').onchange = async () => {
  const file = el('xlsxFileInput').files[0];
  const msg = el('bulkMsg');
  if(!file) return;
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, { type: 'array' });
    const sheetName = wb.SheetNames.includes('문제') ? '문제' : wb.SheetNames[0];
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
    let dataRows = rows;
    if(dataRows.length && String(dataRows[0][0] || '').trim() === '주제'){ dataRows = dataRows.slice(1); }
    const lines = dataRows
      .map(r => [String(r[0] ?? '').trim(), String(r[1] ?? '').trim(), String(r[2] ?? '').trim()])
      .filter(([u,q,a]) => u || q || a)
      .map(([u,q,a]) => `${u} | ${q} | ${a}`);
    if(!lines.length){
      msg.className='msg err'; msg.textContent = '엑셀 파일에서 문제를 찾지 못했습니다. "문제" 시트에 주제/문제/정답 순서로 입력했는지 확인하세요.';
      return;
    }
    el('bulkInput').value = lines.join('\n');
    msg.className='msg ok'; msg.textContent = `"${file.name}"에서 ${lines.length}개 줄을 불러왔습니다. 내용을 확인하고 "일괄 추가"를 누르세요.`;
  } catch(err){
    msg.className='msg err'; msg.textContent = '엑셀 파일을 읽지 못했습니다: ' + err.message;
  } finally {
    el('xlsxFileInput').value = '';
  }
};

el('bulkAddBtn').onclick = async () => {
  const msg = el('bulkMsg');
  const lines = el('bulkInput').value.split('\n');
  const updates = {};
  let n = 0;
  for(const line of lines){
    const parsed = parseQuestionLine(line);
    if(!parsed) continue;
    const key = push(roomRef(ROOM,'questions')).key;
    updates[`rooms/${ROOM}/questions/${key}`] = parsed;
    n++;
  }
  if(n===0){ msg.className='msg err'; msg.textContent='추가할 수 있는 줄이 없습니다. 형식을 확인하세요 (주제 | 문제 | 정답).'; return; }
  try{
    await update(ref(db), updates);
    msg.className='msg ok'; msg.textContent = `${n}개 문제를 추가했습니다.`;
    el('bulkInput').value = '';
  } catch(err){
    msg.className='msg err'; msg.textContent = '일괄 추가 실패: ' + err.message;
  }
};

function renderManageUnitOptions(){
  const sel = el('manageUnitFilter');
  const prev = sel.value;
  el('manageAllCount').textContent = Object.keys(questionsObj).length;
  sel.innerHTML = `<option value="">전체 (${Object.keys(questionsObj).length}개)</option>` +
    allUnits.map(u=>`<option value="${escapeHtml(u.unit)}">${escapeHtml(u.unit)} (${u.count}개)</option>`).join('');
  sel.value = prev && allUnits.some(u=>u.unit===prev) ? prev : '';
}

function renderQuestionList(){
  const filter = el('manageUnitFilter').value;
  const box = el('questionList');
  const entries = Object.entries(questionsObj).filter(([, q]) => !filter || q.unit === filter);
  if(!entries.length){ box.innerHTML = '<div class="qrow muted">문제가 없습니다.</div>'; return; }
  box.innerHTML = entries.map(([id, q]) => `
    <div class="qrow">
      <div class="qtext">
        <span class="qunit">${escapeHtml(q.unit||'')}</span>${escapeHtml(q.question||'')}
        <div class="qans">정답: ${escapeHtml((q.answers||[]).join(' / '))}</div>
      </div>
      <button type="button" data-id="${id}">삭제</button>
    </div>`).join('');
}

el('manageUnitFilter').onchange = renderQuestionList;

el('questionList').addEventListener('click', async (e)=>{
  const btn = e.target.closest('button[data-id]');
  if(!btn) return;
  if(!confirm('이 문제를 삭제할까요?')) return;
  btn.disabled = true;
  try{
    await remove(roomRef(ROOM, 'questions', btn.dataset.id));
  } catch(err){
    alert('삭제 실패: ' + err.message);
    btn.disabled = false;
  }
});

el('deleteUnitBtn').onclick = async () => {
  const filter = el('manageUnitFilter').value;
  const msg = el('manageMsg');
  if(!filter){ msg.className='msg err'; msg.textContent='삭제할 주제를 먼저 선택하세요 (전체 일괄 삭제는 지원하지 않습니다).'; return; }
  const ids = Object.entries(questionsObj).filter(([, q]) => q.unit === filter).map(([id]) => id);
  if(!ids.length) return;
  if(!confirm(`"${filter}" 주제의 문제 ${ids.length}개를 모두 삭제할까요? 되돌릴 수 없습니다.`)) return;
  const updates = {};
  ids.forEach(id => { updates[`rooms/${ROOM}/questions/${id}`] = null; });
  try{
    await update(ref(db), updates);
    msg.className='msg ok'; msg.textContent = `${ids.length}개 문제를 삭제했습니다.`;
  } catch(err){
    msg.className='msg err'; msg.textContent = '삭제 실패: ' + err.message;
  }
};

function renderRoster(){
  const r = roundState;
  const remaining = r.end_time!=null ? Math.max(0, Math.round((r.end_time - serverNow())/1000)) : null;
  let effective = r.status;
  if(r.status==='running' && remaining!==null && remaining<=0) effective='ended';

  const pill = el('statusPill');
  pill.className = 'pill ' + effective;
  pill.textContent = effective==='idle' ? '대기중' : effective==='running' ? '진행중' : '종료';
  el('timerBig').textContent = fmtTime(remaining);
  const poolCount = (r.qids && r.qids.length) ? r.qids.length : poolFromQuestions(questionsObj, r.units).length;
  const orderLabel = r.order === 'sequential' ? '순서대로' : '랜덤';
  el('poolInfo').textContent = effective!=='idle' ? `출제 문항 ${poolCount}개 · ${orderLabel} 출제` : '';

  el('bonusNowBtn').disabled = effective !== 'running';
  const bonus = activeBonus(r, serverNow());
  if(bonus && !el('bonusNowMsg').textContent){
    el('bonusNowMsg').textContent = `🔥 2배 찬스 진행 중 (${bonus.remaining}초)`;
  } else if(!bonus && el('bonusNowMsg').textContent.startsWith('🔥 2배 찬스 진행')){
    el('bonusNowMsg').textContent = '';
  }

  const players = Object.entries(playersObj).map(([id,p])=>({id,...p}));
  players.sort((a,b)=> (b.floor||0)-(a.floor||0) || (b.correct||0)-(a.correct||0));

  const teamBox = el('teamStandingsBox');
  const teamTh = el('teamTh');
  if(r.team_mode){
    teamTh.classList.remove('hidden');
    const standings = teamStandings(players);
    teamBox.classList.toggle('hidden', standings.length===0);
    const maxFloor = Math.max(1, ...standings.map(s=>s.floor));
    teamBox.innerHTML = standings.map(s=>{
      const info = teamInfo(s.team);
      const pct = Math.round((s.floor/maxFloor)*100);
      return `<div class="team-bar-row">
        <span class="tlabel">${info ? info.label : s.team}</span>
        <span class="team-bar-track"><span class="team-bar-fill" style="width:${pct}%; background:${info ? info.color : '#999'};"></span></span>
        <span class="tval">${s.floor}층</span>
      </div>`;
    }).join('');
  } else {
    teamTh.classList.add('hidden');
    teamBox.classList.add('hidden');
    teamBox.innerHTML = '';
  }

  const tbody = el('roster');
  if(!players.length){
    tbody.innerHTML = `<tr><td colspan="${r.team_mode?9:8}" class="muted">학생이 아직 없습니다.</td></tr>`;
    return;
  }
  tbody.innerHTML = players.map((p,i)=>{
    const total = (p.correct||0)+(p.wrong||0);
    const accuracy = total ? Math.round(100*(p.correct||0)/total) : null;
    const accClass = accuracy===null ? 'muted' : (accuracy>=70 ? 'acc-ok' : 'acc-bad');
    const idleSec = p.lastActive ? Math.round((serverNow()-p.lastActive)/1000) : null;
    const status = idleSec!==null && idleSec>20 ? `<span class="muted">${idleSec}초 유휴</span>` : '';
    const nameAttr = escapeHtml(p.name||'').replace(/"/g,'&quot;');
    const tInfo = p.team ? teamInfo(p.team) : null;
    const teamCell = r.team_mode ? `<td>${tInfo ? tInfo.label : '-'}</td>` : '';
    return `<tr>
      <td class="rank">${i+1}</td>
      <td>${p.avatar||''} ${escapeHtml(p.name||'')}</td>
      ${teamCell}
      <td>${p.floor||0}층</td>
      <td>${p.correct||0}/${p.wrong||0}</td>
      <td class="${accClass}">${accuracy===null?'-':accuracy+'%'}</td>
      <td>${(p.streak||0)>=2 ? '🔥'+p.streak : (p.streak||0)}</td>
      <td>${status}</td>
      <td><button class="kick-btn" data-id="${p.id}" data-name="${nameAttr}">내보내기</button></td>
    </tr>`;
  }).join('');
}

el('roster').addEventListener('click', async (e)=>{
  const btn = e.target.closest('.kick-btn');
  if(!btn) return;
  const pid = btn.dataset.id;
  const name = btn.dataset.name || '이 학생';
  if(!confirm(`${name} 학생을 내보낼까요? 학생 화면은 다시 이름을 입력하는 화면으로 돌아갑니다.`)) return;
  btn.disabled = true;
  await remove(roomRef(ROOM, 'players', pid));
});

onValue(roomRef(ROOM,'questions'), (snap)=>{
  questionsObj = snap.val() || {};
  allUnits = unitsFromQuestions(questionsObj);
  if(selectedUnits.size===0){ allUnits.forEach(u=>selectedUnits.add(u.unit)); }
  renderUnits();
  renderManageUnitOptions();
  renderQuestionList();
});

onValue(roomRef(ROOM,'round'), (snap)=>{
  const r = snap.val();
  roundState = r ? {
    status: r.status||'idle', units: r.units||[],
    duration_sec: r.duration_sec||420, end_time: r.end_time ?? null, token: r.token||0,
    order: r.order||'random', qids: r.qids||[],
    team_mode: !!r.team_mode, team_count: r.team_count||4, bonus: r.bonus||[]
  } : { status:'idle', units:[], duration_sec:420, end_time:null, token:0, order:'random', qids:[], team_mode:false, team_count:4, bonus:[] };

  if(!teamStateHydrated){
    teamStateHydrated = true;
    teamModeState = roundState.team_mode;
    teamCountState = roundState.team_count;
    el('teamModeToggle').querySelectorAll('button').forEach(b=>b.classList.toggle('active', (b.dataset.mode==='on')===teamModeState));
    el('teamCountRow').classList.toggle('hidden', !teamModeState);
    el('teamShuffleRow').classList.toggle('hidden', !teamModeState);
    el('teamCountRow').querySelectorAll('button').forEach(b=>b.classList.toggle('active', parseInt(b.dataset.count,10)===teamCountState));
  }
});

onValue(roomRef(ROOM,'players'), (snap)=>{
  playersObj = snap.val() || {};
});

setInterval(renderRoster, 500);
</script>
</body>
</html>
