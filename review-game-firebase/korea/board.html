<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국사 탑 오르기 - 전광판</title>
<style>
  :root{
    --sky-top:#0b1a3a; --sky-mid:#1e3c72; --sky-low:#3f6ea5; --sky-horizon:#f2a65a; --sky-glow:#ffd98a;
    --gold:#f2d27a; --gold-dark:#c5a028;
    --panel:rgba(255,255,255,.07); --line:rgba(255,255,255,.15);
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; margin:0; }
  body{
    font-family:'Malgun Gothic','Pretendard',-apple-system,sans-serif;
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 42%,var(--sky-low) 66%,var(--sky-horizon) 90%,var(--sky-glow) 100%);
    color:#fff; overflow:hidden; display:flex; flex-direction:column; height:100vh; position:relative;
  }

  .sky-layer{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .star{ position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; animation:twinkle 3.4s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.95;} }
  .cloud{
    position:absolute; border-radius:50%; background:rgba(255,255,255,.55); filter:blur(7px);
    animation-name:drift; animation-timing-function:linear; animation-iteration-count:infinite;
  }
  @keyframes drift{ from{ transform:translateX(-16vw); } to{ transform:translateX(116vw); } }
  .sun{
    position:absolute; left:50%; bottom:14%; transform:translateX(-50%); width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle,#fff8e2,#ffd98a 55%,rgba(255,217,138,0) 72%);
    box-shadow:0 0 90px 45px rgba(255,217,138,.3); animation:sunpulse 4.5s ease-in-out infinite;
  }
  @keyframes sunpulse{ 0%,100%{opacity:.8;} 50%{opacity:1;} }
  .mountains{ position:absolute; left:0; right:0; bottom:56px; height:36vh; z-index:1; }
  .mountains svg{ width:100%; height:100%; display:block; }

  header{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px; border-bottom:1px solid var(--line);
  }
  header h1{ margin:0; font-size:2rem; text-shadow:0 2px 8px rgba(0,0,0,.4); }
  .status{ display:flex; align-items:center; gap:20px; }
  .bgm-btn{
    padding:6px 14px; border-radius:999px; font-weight:800; font-size:.85rem;
    border:1px solid var(--line); background:rgba(255,255,255,.12); color:#fff; cursor:pointer;
  }
  .bgm-btn.muted{ opacity:.55; }
  .pill{ padding:6px 16px; border-radius:999px; font-weight:800; font-size:1rem; }
  .pill.idle{ background:#4a5a7a; }
  .pill.running{ background:#2e9e5b; }
  .pill.ended{ background:#d9534f; }
  .timer{ font-size:2.4rem; font-weight:900; font-variant-numeric:tabular-nums; color:var(--gold); text-shadow:0 2px 10px rgba(0,0,0,.5); }

  main{ position:relative; z-index:2; flex:1; display:grid; grid-template-columns:280px 1fr; gap:0; overflow:hidden; }

  .leaderboard{ padding:20px; border-right:1px solid var(--line); overflow-y:auto; background:rgba(10,20,45,.25); backdrop-filter:blur(2px); }
  .leaderboard h2{ font-size:1rem; opacity:.8; margin:0 0 14px; letter-spacing:.05em; }
  .lb-row{
    display:flex; align-items:center; gap:10px; padding:10px 8px; border-radius:10px; margin-bottom:6px;
    background:var(--panel); transition:background .3s ease;
  }
  .lb-row.rank1{ background:linear-gradient(90deg,rgba(242,210,122,.4),rgba(242,210,122,.08)); box-shadow:0 0 16px rgba(242,210,122,.25); }
  .lb-medal{ width:28px; text-align:center; font-size:1.2rem; }
  .lb-name{ flex:1; font-weight:700; font-size:1.02rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lb-floor{ font-weight:900; color:var(--gold); }

  .tower-area{ position:relative; overflow-x:auto; overflow-y:hidden; padding:0 20px; display:flex; align-items:flex-end; grid-column:2; grid-row:1; }
  .tower-track{ position:relative; display:flex; align-items:flex-end; gap:26px; height:100%; padding-bottom:56px; padding-top:20px; }

  .climber{
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; width:58px; flex:0 0 auto;
    position:relative;
  }
  .climber .crown-badge{
    font-size:1.05rem; line-height:1; height:1.05rem; margin-bottom:1px;
    opacity:0; transform:translateY(0) scale(.6); transition:opacity .2s, transform .2s;
  }
  .climber.leader .crown-badge{
    opacity:1; transform:scale(1); animation:crownBob 1.2s ease-in-out infinite;
  }
  @keyframes crownBob{
    0%,100%{ transform:translateY(0) rotate(-6deg) scale(1); }
    50%{ transform:translateY(-4px) rotate(6deg) scale(1); }
  }
  .climber .avatar-wrap{ position:relative; }
  .climber .avatar-wrap::before{
    content:''; position:absolute; left:50%; top:50%; width:0; height:0; border-radius:50%;
    background:radial-gradient(circle, rgba(255,150,40,.9), rgba(255,80,0,.55) 55%, rgba(255,80,0,0) 76%);
    transform:translate(-50%,-50%); opacity:0; pointer-events:none; z-index:-1;
    transition:opacity .25s;
  }
  .climber.onfire .avatar-wrap::before{
    width:50px; height:50px; opacity:1; animation:fireHalo .9s ease-in-out infinite;
  }
  @keyframes fireHalo{
    0%,100%{ transform:translate(-50%,-50%) scale(.85); }
    50%{ transform:translate(-50%,-50%) scale(1.15); }
  }
  .climber .fire-badge{
    position:absolute; left:100%; top:-4px; margin-left:1px; font-size:.95rem;
    opacity:0; pointer-events:none;
  }
  .climber.onfire .fire-badge{
    opacity:1; animation:fireFlicker .5s ease-in-out infinite alternate;
  }
  @keyframes fireFlicker{
    from{ transform:scale(.85) rotate(-6deg); }
    to{ transform:scale(1.05) rotate(6deg); }
  }
  .climber .avatar{
    font-size:1.8rem; margin-bottom:4px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));
    transform-origin:center bottom;
  }
  .climber.leveling .avatar{ animation:levelPop .6s ease; }
  @keyframes levelPop{
    0%{ transform:scale(1) translateY(0); }
    35%{ transform:scale(1.55) translateY(-16px); filter:drop-shadow(0 0 12px #ffe9a8); }
    100%{ transform:scale(1) translateY(0); }
  }
  .climber.sad .avatar{ animation:climberSad .7s ease; }
  @keyframes climberSad{
    0%{ transform:translateY(0) rotate(0deg) scale(1); }
    20%{ transform:translateY(4px) rotate(-8deg) scale(.95); }
    40%{ transform:translateY(7px) rotate(8deg) scale(.92); }
    60%{ transform:translateY(7px) rotate(-6deg) scale(.92); }
    100%{ transform:translateY(0) rotate(0deg) scale(1); }
  }
  .climber .col{
    width:18px; border-radius:6px 6px 0 0; position:relative; overflow:hidden;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.35) 0px, rgba(255,255,255,.35) 2px, transparent 2px, transparent 13px),
      linear-gradient(180deg,var(--team-color,var(--gold)),var(--team-color,var(--gold-dark)));
    background-size:100% 26px, 100% 100%;
    box-shadow:0 0 10px rgba(242,210,122,.5);
    transition:height .5s cubic-bezier(.34,1.56,.64,1);
    animation:rungs 1.8s linear infinite;
  }

  .bonus-banner{
    display:none; position:relative; z-index:3; text-align:center; font-weight:900; font-size:1.4rem;
    padding:10px; margin:0; color:#3a2c05;
    background:linear-gradient(90deg,#ffe08a,#ffc857);
    animation:bonusPulseBoard 1s ease-in-out infinite;
  }
  .bonus-banner.show{ display:block; }
  @keyframes bonusPulseBoard{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.015); } }

  #festivalBanner{ background:linear-gradient(90deg,#ffe08a,#a6e8ff,#ffd0f0); }
  .items-mode-badge{
    padding:5px 14px; border-radius:999px; font-weight:800; font-size:.85rem;
    background:rgba(255,255,255,.14); border:1px solid var(--line);
  }
  .item-toasts{
    position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:40;
    display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none;
  }
  .item-toast{
    background:rgba(8,16,38,.86); border:1px solid rgba(255,255,255,.28); color:#fff;
    padding:9px 20px; border-radius:999px; font-weight:800; font-size:1.1rem;
    box-shadow:0 8px 24px rgba(0,0,0,.45); animation:itemToast 3s ease forwards; white-space:nowrap;
  }
  @keyframes itemToast{
    0%{ opacity:0; transform:translateY(-12px) scale(.9); }
    12%{ opacity:1; transform:translateY(0) scale(1); }
    78%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-6px); }
  }
  .climber .fx-badge{
    position:absolute; top:-28px; left:50%; transform:translateX(-50%);
    font-size:1.4rem; z-index:4; animation:fxBadge 1s ease-in-out infinite;
  }
  @keyframes fxBadge{ 0%,100%{ transform:translateX(-50%) translateY(0); } 50%{ transform:translateX(-50%) translateY(-6px); } }
  .climber.fx-fog .avatar{ filter:blur(3px); }
  .team-fx{ position:relative; animation:teamFxShake .5s ease-in-out 0s 4; }
  @keyframes teamFxShake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-7px); } 75%{ transform:translateX(7px); } }
  .team-fx-badge{ position:absolute; top:8px; left:50%; transform:translateX(-50%); font-size:2.2rem; z-index:6; pointer-events:none; animation:fxBadge 1s ease-in-out infinite; }

  .team-scorebar{
    display:none; gap:14px; padding:8px 32px; position:relative; z-index:2; flex-wrap:wrap;
    border-bottom:1px solid var(--line); background:rgba(10,20,45,.2);
  }
  .team-scorebar.show{ display:flex; }
  .team-chip{
    display:flex; align-items:center; gap:8px; padding:6px 14px; border-radius:999px;
    font-weight:800; font-size:.95rem; background:rgba(255,255,255,.1);
  }
  .team-chip .tfloor{ color:var(--gold); }
  .team-chip.leading{ box-shadow:0 0 0 2px var(--gold); }

  .team-winner{ font-size:1.4rem; font-weight:800; color:#fff; margin:-1.4rem 0 1.8rem; text-shadow:0 2px 8px rgba(0,0,0,.5); z-index:1; }

  /* ── 팀전 대형화면 아레나 (개인 탑 대신 표시) ── */
  .team-arena{
    grid-column:2; grid-row:1; position:relative; z-index:2; overflow:hidden;
    padding:28px 40px 60px; display:flex; flex-direction:column; justify-content:center; gap:26px;
  }
  /* 줄다리기 (2팀) */
  .tug{ display:flex; flex-direction:column; gap:20px; }
  .tug-ends{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  .tug-end{ display:flex; flex-direction:column; gap:10px; max-width:46%; }
  .tug-end.right{ align-items:flex-end; text-align:right; }
  .tug-team{ font-size:1.9rem; font-weight:900; text-shadow:0 2px 10px rgba(0,0,0,.5); white-space:nowrap; }
  .tug-team .tug-floor{ color:var(--gold); }
  .tug-avatars{ display:flex; flex-wrap:wrap; gap:5px; font-size:1.7rem; line-height:1.1; }
  .tug-end.right .tug-avatars{ justify-content:flex-end; }
  .tug-bar{
    position:relative; height:104px; border-radius:16px; overflow:hidden;
    background:rgba(255,255,255,.07); box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
    transition:box-shadow .4s ease;
  }
  .tug-fill{ position:absolute; top:0; bottom:0; transition:width .6s cubic-bezier(.34,1.4,.64,1); }
  .tug-fill.left{ left:0; background:linear-gradient(90deg, var(--cl,#888) 0%, rgba(255,255,255,0) 100%); }
  .tug-fill.right{ right:0; background:linear-gradient(270deg, var(--cr,#888) 0%, rgba(255,255,255,0) 100%); }
  .tug-rope{
    position:absolute; left:2%; right:2%; top:50%; height:8px; transform:translateY(-50%); border-radius:4px;
    background:repeating-linear-gradient(90deg,#e2caa0 0 16px,#b7995f 16px 24px);
  }
  .tug-knot{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:3rem; line-height:1;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.55)); transition:left .6s cubic-bezier(.34,1.4,.64,1);
  }
  .tug-bar.lead-left{ box-shadow:inset 0 0 0 3px var(--cl,#888), 0 0 30px rgba(255,255,255,.15); }
  .tug-bar.lead-right{ box-shadow:inset 0 0 0 3px var(--cr,#888), 0 0 30px rgba(255,255,255,.15); }
  /* 땅따먹기 (3팀 이상) — 원그래프 */
  .terr-pie{ display:flex; align-items:center; justify-content:center; gap:44px; height:82%; min-height:300px; }
  .terr-chart{ flex:0 0 auto; height:100%; aspect-ratio:1/1; max-width:52%; }
  .terr-chart svg{ width:100%; height:100%; overflow:visible; filter:drop-shadow(0 12px 30px rgba(0,0,0,.5)); }
  .terr-slice path{ stroke:#0b1024; stroke-width:1.3; stroke-linejoin:round; }
  .terr-slice.leader path{ stroke:#fff; stroke-width:2; }
  .terr-slabel{ fill:#fff; font-weight:900; text-anchor:middle; dominant-baseline:middle;
    paint-order:stroke; stroke:rgba(0,0,0,.55); stroke-width:3px; }
  .terr-sname{ font-size:7px; }
  .terr-sval{ font-size:9.5px; }
  .terr-legend{ display:flex; flex-direction:column; gap:14px; min-width:220px; max-width:36%; }
  .terr-leg-row{ display:flex; align-items:center; gap:12px; padding:9px 14px; border-radius:14px;
    background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1px rgba(255,255,255,.1); transition:box-shadow .3s ease; }
  .terr-leg-row.leader{ box-shadow:inset 0 0 0 2px var(--gold), 0 0 22px rgba(242,210,122,.28); }
  .terr-leg-dot{ width:22px; height:22px; border-radius:7px; flex:0 0 auto; box-shadow:0 0 0 1px rgba(0,0,0,.35); }
  .terr-leg-main{ flex:1; min-width:0; }
  .terr-leg-name{ font-size:1.2rem; font-weight:900; white-space:nowrap; text-shadow:0 2px 6px rgba(0,0,0,.5); }
  .terr-leg-mem{ font-size:1.35rem; line-height:1.25; margin-top:2px; overflow:hidden; max-height:2.7em; }
  .terr-leg-val{ font-size:2rem; font-weight:900; color:var(--gold); text-shadow:0 2px 8px rgba(0,0,0,.5); flex:0 0 auto; }

  .hidden{ display:none !important; }
  @keyframes rungs{ from{ background-position:0 0, 0 0; } to{ background-position:0 26px, 0 0; } }
  .climber .base{
    margin-top:6px; font-size:.72rem; text-align:center; max-width:64px; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; opacity:.9;
  }
  .climber .floorno{ font-size:.7rem; color:var(--gold); font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.5); }

  .popup{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    font-size:.85rem; font-weight:800; color:#ffe9a8; text-shadow:0 1px 4px rgba(0,0,0,.6);
    pointer-events:none; animation:floatUp .9s ease-out forwards;
  }
  @keyframes floatUp{
    0%{ opacity:1; transform:translate(-50%,0); }
    100%{ opacity:0; transform:translate(-50%,-34px); }
  }

  .ground{
    position:absolute; left:0; right:0; bottom:0; height:56px; z-index:1;
    background:linear-gradient(180deg,#3d2b1a,#2a1c10); border-top:4px solid #5c4326;
  }

  .empty-msg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.4rem; opacity:.6; z-index:2; }

  footer{ position:relative; z-index:2; text-align:center; padding:8px; font-size:.75rem; opacity:.5; }

  .end-overlay{
    position:fixed; inset:0; z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 32%, rgba(40,70,130,.55), rgba(6,14,32,.94) 72%);
    text-align:center; overflow:hidden;
  }
  .end-overlay.show{ display:flex; animation:overlayFade .5s ease; }
  @keyframes overlayFade{ from{ opacity:0; } to{ opacity:1; } }

  .end-title{
    font-size:3rem; font-weight:900; margin:0 0 2.2rem; color:var(--gold);
    text-shadow:0 4px 24px rgba(0,0,0,.6); animation:titlePop .7s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes titlePop{ 0%{ transform:scale(.4); opacity:0; } 100%{ transform:scale(1); opacity:1; } }

  .podium{ display:flex; align-items:flex-end; gap:28px; z-index:1; }
  .podium .place{ display:flex; flex-direction:column; align-items:center; width:150px; }
  .podium .place .crown{ font-size:2.4rem; margin-bottom:8px; animation:crownBounce 1.1s ease-in-out infinite; }
  @keyframes crownBounce{ 0%,100%{ transform:translateY(0) rotate(-6deg); } 50%{ transform:translateY(-8px) rotate(6deg); } }
  .podium .place .pname{
    font-weight:800; font-size:1.15rem; margin-bottom:2px; max-width:145px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .podium .place .pfloor{ font-weight:900; color:var(--gold); margin-bottom:10px; }
  .podium .stand{
    width:100%; border-radius:10px 10px 0 0; display:flex; align-items:flex-start; justify-content:center;
    padding-top:10px; font-size:2rem; font-weight:900; color:#3a2c05;
    background:linear-gradient(180deg,var(--gold),var(--gold-dark)); box-shadow:0 0 30px rgba(242,210,122,.4);
    animation:standRise .6s cubic-bezier(.34,1.56,.64,1) backwards;
  }
  @keyframes standRise{ from{ transform:scaleY(0); transform-origin:bottom; opacity:0; } to{ transform:scaleY(1); opacity:1; } }
  .podium .place.p1{ order:2; } .podium .place.p2{ order:1; } .podium .place.p3{ order:3; }
  .podium .place.p1 .stand{ height:170px; animation-delay:.15s; }
  .podium .place.p2 .stand{ height:120px; animation-delay:.3s; }
  .podium .place.p3 .stand{ height:90px; animation-delay:.45s; }
  .podium .place.p1 .pname{ font-size:1.5rem; }
  .podium .place.p1 .pfloor{ font-size:1.3rem; }

  .confetti-piece{
    position:absolute; top:-5vh; width:10px; height:16px; opacity:.9;
    animation-name:confettiFall; animation-timing-function:linear; animation-fill-mode:forwards;
  }
  @keyframes confettiFall{
    from{ transform:translateY(0) rotate(0deg); }
    to{ transform:translateY(112vh) rotate(600deg); }
  }
  .end-hint{ margin-top:2.4rem; font-size:.95rem; opacity:.65; }
</style>
</head>
<body>

<div class="sky-layer" id="skyLayer">
  <div class="sun"></div>
  <div class="mountains">
    <svg viewBox="0 0 1000 200" preserveAspectRatio="none">
      <polygon points="0,200 0,120 140,40 260,110 380,55 520,130 650,60 780,115 900,70 1000,120 1000,200" fill="#16264d" opacity="0.55"></polygon>
      <polygon points="0,200 0,150 180,90 320,140 460,85 600,150 760,95 900,145 1000,110 1000,200" fill="#1f3560" opacity="0.75"></polygon>
    </svg>
  </div>
</div>

<header>
  <h1>🏯 한국사 탑 오르기</h1>
  <div class="status">
    <span class="items-mode-badge hidden" id="itemsModeBadge"></span>
    <button class="bgm-btn" id="bgmToggle" type="button">🔊 배경음</button>
    <span class="pill idle" id="statusPill">대기중</span>
    <span class="timer" id="timerVal">--:--</span>
  </div>
</header>

<div class="bonus-banner" id="bonusBanner">🔥 2배 찬스! 남은 시간 <span id="bonusRemain"></span>초</div>
<div class="bonus-banner" id="festivalBanner">🌈 <span id="festivalWho"></span>축제! 남은 시간 <span id="festivalRemain"></span>초 · 모두 2배</div>
<div class="item-toasts" id="itemToasts"></div>
<div class="team-scorebar" id="teamScoreBar"></div>

<main>
  <div class="leaderboard">
    <h2>🏆 순위</h2>
    <div id="lbList"></div>
  </div>
  <div class="tower-area" id="towerArea">
    <div class="ground"></div>
    <div class="tower-track" id="towerTrack"></div>
    <div class="empty-msg" id="emptyMsg">학생들이 접속하면 여기에 나타납니다</div>
  </div>
  <div class="team-arena hidden" id="teamArena"></div>
</main>

<footer>play.html 주소로 학생들이 접속합니다 (어느 네트워크에서든 가능)</footer>

<div class="end-overlay" id="endOverlay">
  <div class="confetti-layer" id="confettiLayer" style="position:absolute; inset:0; pointer-events:none;"></div>
  <div class="end-title">🎉 게임 종료! 축하합니다 🎉</div>
  <div class="team-winner hidden" id="teamWinner"></div>
  <div class="podium" id="podium"></div>
  <div class="end-hint">다음 라운드를 시작하면 이 화면은 사라집니다</div>
</div>

<script type="module">
import { roomRef, onValue, serverNow, fmtTime, escapeHtml, rankedPlayers, teamInfo, teamStandings, activeBonus, ITEMS, ITEM_FX_MS, TEAM_OPTIONS } from '../shared/lib.js';

const ROOM = 'korea';
const el = (id) => document.getElementById(id);
const MEDALS = ['🥇','🥈','🥉'];
const lastFloor = {};
const lastWrong = {};
const climberEls = {};

// ── 배경음악: 외부 파일 없이 Web Audio로 만든 '신나는' 루프. 라운드마다 여러 곡 중 랜덤 ──
const BGM_MUTE_KEY = 'rg_fb_bgm_muted';
const BGM_VOLUME = 0.5; // 마스터 볼륨(컴퓨터 볼륨은 그대로 따라가고, 이 값은 우리 소리 자체의 크기)
let audioCtx = null;
let masterGain = null;
let bgmStarted = false;
let bgmMuted = localStorage.getItem(BGM_MUTE_KEY) === '1';

// 음이름 → 주파수 (C1~C6)
const NOTE = (() => {
  const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const map = {};
  for(let oct = 1; oct <= 6; oct++){
    for(let i = 0; i < 12; i++){
      const midi = (oct + 1) * 12 + i;           // C1 = midi 24
      map[names[i] + oct] = 440 * Math.pow(2, (midi - 69) / 12);
    }
  }
  return map;
})();
const nf = (n) => (n && NOTE[n]) || 0;

// 스텝 = 8분음표. 남은 시간이 충분하면 느긋, 임박하면 빨라진다.
const BGM_STEP_SEC = 0.30;        // 기본 (≈100 BPM)
const BGM_STEP_SEC_FAST = 0.17;  // 최고 속도 (≈176 BPM)
let bgmIntensity = 0;            // render()에서 0~1로 갱신
function currentBeatSec(){
  return BGM_STEP_SEC - (BGM_STEP_SEC - BGM_STEP_SEC_FAST) * bgmIntensity;
}

// drums: 스텝별 문자열 (K=킥, S=스네어, h=닫힌 하이햇, H=열린 하이햇)

    bass: ['A1','A2','A1','A2','F1','F2','F1','F2','C2','C3','C2','C3','G1','G2','G1','G2'],

    bass: ['C2','.','G2','.','C2','.','G2','.','F2','.','C3','.','G2','.','G2','D3'],
    lead: ['C4','.','.','C4','E4','.','G4','.','C5','.','G4','.','E4','.','D4','.'],
    drums:['K','h','S','h','K','h','S','h','K','h','S','h','K','S','KH','h'],

  drums: d.drums,
  leadWave: d.leadWave || 'triangle',

}));

let bgmStep = 0, bgmNextTime = 0, bgmSchedulerId = null;

function pickRandomSong(){

}

function ensureAudioCtx(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = bgmMuted ? 0 : BGM_VOLUME;
  // 여러 음이 겹쳐도 소리가 찌그러지지 않도록 리미터 역할의 컴프레서를 마지막 단에 건다
  const compressor = audioCtx.createDynamicsCompressor();
  compressor.threshold.value = -18;
  compressor.knee.value = 24;
  compressor.ratio.value = 8;
  compressor.attack.value = 0.003;
  compressor.release.value = 0.25;
  masterGain.connect(compressor);
  compressor.connect(audioCtx.destination);
}

function playTone(freq, startTime, duration, peak, type){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(peak, startTime + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(gain); gain.connect(masterGain);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.05);
}

function noiseBurst(t, dur, filterType, freq, peak){
  const n = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const filt = audioCtx.createBiquadFilter(); filt.type = filterType; filt.frequency.value = freq;
  const g = audioCtx.createGain(); g.gain.value = peak;
  src.connect(filt); filt.connect(g); g.connect(masterGain);
  src.start(t);
}
function playKick(t){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.11);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.95, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.2);
}
function playSnare(t){
  noiseBurst(t, 0.2, 'bandpass', 1900, 0.3);
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(220, t);
  g.gain.setValueAtTime(0.28, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.14);
}
function playHat(t, open){
  noiseBurst(t, open ? 0.13 : 0.04, 'highpass', 8000, open ? 0.15 : 0.10);
}

function scheduleBgmStep(){
  const stepSec = currentBeatSec();
  const s = bgmStep % 16;
  const song = currentSong;
  const chord = song.chords[(s >> 2) & 3];

  const d = song.drums[s] || '';
  if(d.indexOf('K') >= 0) playKick(bgmNextTime);
  if(d.indexOf('S') >= 0) playSnare(bgmNextTime);
  if(d.indexOf('H') >= 0) playHat(bgmNextTime, true);
  else if(d.indexOf('h') >= 0) playHat(bgmNextTime, false);

  const bass = song.bass[s];
  if(bass) playTone(bass, bgmNextTime, stepSec * 1.9, 0.24, song.bassWave);

  const lead = song.lead[s];
  if(lead) playTone(lead, bgmNextTime, stepSec * 1.5, 0.15, song.leadWave);

  if((s & 3) === 0 && chord){
    chord.forEach(fr => playTone(fr, bgmNextTime, stepSec * 4 * 0.9, 0.07, 'sine'));
  }

  bgmStep++;
  bgmNextTime += stepSec;
}

function bgmSchedulerTick(){
  while(bgmNextTime < audioCtx.currentTime + 0.2){
    scheduleBgmStep();
  }
}

function updateBgmBtn(){
  const btn = el('bgmToggle');
  if(!bgmStarted) btn.textContent = '🔊 배경음';
  else btn.textContent = bgmMuted ? '🔇 배경음 꺼짐' : `🔊 ${currentSong.name}`;
  btn.classList.toggle('muted', bgmMuted);
}

function startBgm(){
  window.removeEventListener('click', tryAutoStartBgm);
  window.removeEventListener('keydown', tryAutoStartBgm);
  window.removeEventListener('touchstart', tryAutoStartBgm);
  if(bgmStarted) return;
  ensureAudioCtx();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  bgmStarted = true;
  bgmStep = 0;
  pickRandomSong();
  bgmNextTime = audioCtx.currentTime + 0.1;
  bgmSchedulerId = setInterval(bgmSchedulerTick, 100);
  updateBgmBtn();
}

function setBgmMuted(muted){
  bgmMuted = muted;
  localStorage.setItem(BGM_MUTE_KEY, muted ? '1' : '0');
  if(masterGain) masterGain.gain.value = muted ? 0 : BGM_VOLUME;
  updateBgmBtn();
}

// 게임 종료 · 1등 발표 팡파레 (상승 아르페지오 + 마무리 화음)
function playFanfare(){
  ensureAudioCtx();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const t0 = audioCtx.currentTime + 0.05;
  const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
  notes.forEach((f,i)=>{
    playTone(f, t0 + i*0.12, 0.35, 0.5, 'triangle');
  });
  const chordTime = t0 + notes.length*0.12 + 0.05;
  [783.99, 987.77, 1174.66, 1567.98].forEach(f=>{ // G5 B5 D6 G6
    playTone(f, chordTime, 1.1, 0.4, 'sawtooth');
  });
}

// 2배 찬스 발동 알림음 (짧은 상승 두 음)
function playBonusChime(){
  ensureAudioCtx();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const t0 = audioCtx.currentTime + 0.02;
  [880, 1318.51].forEach((f,i)=>{ // A5, E6
    playTone(f, t0 + i*0.11, 0.3, 0.45, 'triangle');
  });
}

function ensureClimberEl(track, id){
  if(climberEls[id]) return climberEls[id];
  const div = document.createElement('div');
  div.className = 'climber';
  div.innerHTML = `
    <div class="floorno"></div>
    <div class="crown-badge">👑</div>
    <div class="avatar-wrap">
      <div class="avatar"></div>
      <div class="fire-badge">🔥</div>
    </div>
    <div class="col" style="height:6px"></div>
    <div class="base"></div>
  `;
  track.appendChild(div);
  climberEls[id] = div;
  return div;
}

function renderTower(players, leaderId){
  const track = el('towerTrack');
  const maxFloor = Math.max(10, ...players.map(p=>p.floor||0));
  const trackHeight = track.clientHeight || 500;
  const usable = trackHeight - 20;
  const seen = new Set();

  players.forEach((p)=>{
    seen.add(p.id);
    const node = ensureClimberEl(track, p.id);
    track.appendChild(node);
    const floor = p.floor||0;
    const h = Math.round((floor / maxFloor) * usable);
    const avatar = p.avatar || '🐱'; // 입장 시 배정된 개인 캐릭터 (예전 데이터엔 없을 수 있어 기본값)

    const tInfo = p.team ? teamInfo(p.team) : null;
    node.querySelector('.floorno').textContent = floor;
    node.querySelector('.avatar').textContent = avatar;
    const colEl = node.querySelector('.col');
    colEl.style.height = Math.max(6,h)+'px';
    if(tInfo) colEl.style.setProperty('--team-color', tInfo.color);
    else colEl.style.removeProperty('--team-color');
    node.querySelector('.base').textContent = p.name || '';
    node.classList.toggle('leader', leaderId != null && p.id === leaderId);
    node.classList.toggle('onfire', (p.streak||0) >= 3);

    const prev = lastFloor[p.id];
    if(prev !== undefined && floor > prev){
      node.classList.remove('leveling'); void node.offsetWidth; node.classList.add('leveling');
      const gain = floor - prev;
      const popup = document.createElement('div');
      popup.className = 'popup';
      popup.textContent = '+' + gain;
      node.appendChild(popup);
      setTimeout(()=> popup.remove(), 900);
    }
    lastFloor[p.id] = floor;

    const wrong = p.wrong||0;
    const prevWrong = lastWrong[p.id];
    if(prevWrong !== undefined && wrong > prevWrong){
      node.classList.remove('sad'); void node.offsetWidth; node.classList.add('sad');
    }
    lastWrong[p.id] = wrong;
  });

  Object.keys(climberEls).forEach(id=>{
    if(!seen.has(id)){
      climberEls[id].remove();
      delete climberEls[id];
      delete lastFloor[id];
      delete lastWrong[id];
    }
  });
}

// ── 팀전 아레나: 2팀=줄다리기 / 3팀 이상=영역 넓히기 ──────────
let arenaMode = '';   // 'tug' | 'territory'
let arenaKeys = '';    // 스켈레톤을 다시 만들지 판단 (팀 구성이 바뀌면 재생성)

function teamRows(players){
  const keys = TEAM_OPTIONS.slice(0, roundState.team_count || 4).map(t=>t.key);
  const st = {}; teamStandings(players).forEach(s=> st[s.team] = s);
  const rows = keys.map(k=>{
    const s = st[k] || { floor:0, members:0 };
    return { key:k, info:teamInfo(k), floor:s.floor||0, members:s.members||0 };
  });
  const membersBy = {};
  players.forEach(p=>{ if(p.team){ (membersBy[p.team] = membersBy[p.team] || []).push(p); } });
  Object.values(membersBy).forEach(a=> a.sort((x,y)=> (y.floor||0) - (x.floor||0)));
  return { keys, rows, membersBy };
}

function avatarStrip(members, cap){
  const list = members || [];
  const shown = list.slice(0, cap).map(m=> m.avatar || '🐱').join(' ');
  return shown + (list.length > cap ? `  +${list.length - cap}` : '');
}

function renderTeamArena(players){
  const arena = el('teamArena');
  const { keys, rows, membersBy } = teamRows(players);
  const wantMode = (roundState.team_count || 4) <= 2 ? 'tug' : 'territory';
  if(arenaMode !== wantMode || arenaKeys !== keys.join(',')){
    arenaMode = wantMode; arenaKeys = keys.join(',');
    arena.innerHTML = wantMode === 'tug' ? tugSkeleton() : territorySkeleton(keys);
  }
  if(wantMode === 'tug') updateTug(rows, membersBy);
  else updateTerritory(rows, membersBy);
}

function tugSkeleton(){
  return `
    <div class="tug">
      <div class="tug-ends">
        <div class="tug-end left"><div class="tug-team" id="tugTeamL"></div><div class="tug-avatars" id="tugAvaL"></div></div>
        <div class="tug-end right"><div class="tug-team" id="tugTeamR"></div><div class="tug-avatars" id="tugAvaR"></div></div>
      </div>
      <div class="tug-bar" id="tugBar">
        <div class="tug-fill left" id="tugFillL"></div>
        <div class="tug-fill right" id="tugFillR"></div>
        <div class="tug-rope"></div>
        <div class="tug-knot" id="tugKnot">🚩</div>
      </div>
    </div>`;
}

function updateTug(rows, membersBy){
  const L = rows[0] || { key:'', info:null, floor:0 };
  const R = rows[1] || { key:'', info:null, floor:0 };
  const bar = el('tugBar');
  bar.style.setProperty('--cl', L.info ? L.info.color : '#888');
  bar.style.setProperty('--cr', R.info ? R.info.color : '#888');
  const total = L.floor + R.floor;
  const share = total > 0 ? L.floor / total : 0.5;       // 왼쪽 팀 점유율
  const knotPct = Math.max(14, Math.min(86, (1 - share) * 100)); // 앞선 팀 쪽으로 매듭 이동
  el('tugFillL').style.width = knotPct + '%';
  el('tugFillR').style.width = (100 - knotPct) + '%';
  el('tugKnot').style.left = knotPct + '%';
  bar.classList.toggle('lead-left', total > 0 && share > 0.5);
  bar.classList.toggle('lead-right', total > 0 && share < 0.5);
  el('tugTeamL').innerHTML = `${L.info ? L.info.label : '-'} · <span class="tug-floor">${L.floor}${unitLabel()}</span>`;
  el('tugTeamR').innerHTML = `${R.info ? R.info.label : '-'} · <span class="tug-floor">${R.floor}${unitLabel()}</span>`;
  el('tugAvaL').textContent = avatarStrip(membersBy[L.key], 16);
  el('tugAvaR').textContent = avatarStrip(membersBy[R.key], 16);
}

function territorySkeleton(keys){
  return `<div class="terr-pie">
    <div class="terr-chart">
      <svg viewBox="-60 -60 120 120" preserveAspectRatio="xMidYMid meet">
        <g id="terrSlices"></g>
      </svg>
    </div>
    <div class="terr-legend" id="terrLegend">${keys.map(k=>
      `<div class="terr-leg-row" data-key="${k}">
         <span class="terr-leg-dot"></span>
         <div class="terr-leg-main"><div class="terr-leg-name"></div><div class="terr-leg-mem"></div></div>
         <div class="terr-leg-val"></div>
       </div>`).join('')}</div>
  </div>`;
}

let terrFrac = {};          // 화면에 그려지고 있는 팀별 점유율 (목표치로 부드럽게 이동)
let terrRaf = null;

function terrPolar(r, ang){ return [r * Math.cos(ang), r * Math.sin(ang)]; }
function terrArc(r, a0, a1){
  if(a1 - a0 >= Math.PI * 2 - 1e-6){                       // 한 팀만 있을 때: 꽉 찬 원
    return `M ${-r} 0 A ${r} ${r} 0 1 1 ${r} 0 A ${r} ${r} 0 1 1 ${-r} 0 Z`;
  }
  const [x0, y0] = terrPolar(r, a0), [x1, y1] = terrPolar(r, a1);
  const large = (a1 - a0) > Math.PI ? 1 : 0;
  return `M 0 0 L ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
}

function drawTerritory(rows){
  const g = el('terrSlices');
  if(!g) return;
  const R = 52;
  const maxFloor = Math.max(0, ...rows.map(r=>r.floor));
  let ang = -Math.PI / 2;                                  // 12시 방향에서 시작
  g.innerHTML = rows.map(r=>{
    const f = terrFrac[r.key] || 0;
    const a0 = ang, a1 = ang + f * Math.PI * 2; ang = a1;
    const mid = (a0 + a1) / 2;
    const isLeader = maxFloor > 0 && r.floor === maxFloor;
    const [ox, oy] = terrPolar(isLeader ? 4 : 0, mid);     // 선두 팀 조각만 살짝 튀어나옴
    const [lx, ly] = terrPolar(R * 0.56, mid);
    let label = '';
    if(f >= 0.11){                                         // 조각이 크면: 팀 이름 + 점수 두 줄
      label = `<text class="terr-slabel terr-sname" x="${lx.toFixed(2)}" y="${(ly - 4).toFixed(2)}">${escapeHtml(r.info.label)}</text>` +
              `<text class="terr-slabel terr-sval" x="${lx.toFixed(2)}" y="${(ly + 5.5).toFixed(2)}">${r.floor}${unitLabel()}</text>`;
    } else if(f >= 0.055){                                 // 좁으면 점수만
      label = `<text class="terr-slabel terr-sval" x="${lx.toFixed(2)}" y="${ly.toFixed(2)}">${r.floor}${unitLabel()}</text>`;
    }
    return `<g class="terr-slice${isLeader ? ' leader' : ''}" data-key="${r.key}" transform="translate(${ox.toFixed(2)} ${oy.toFixed(2)})">
      <path d="${terrArc(R, a0, a1)}" fill="${r.info.color}"></path>${label}
    </g>`;
  }).join('');
}

function updateTerritory(rows, membersBy){
  const total = rows.reduce((s, r)=> s + r.floor, 0);
  const maxFloor = Math.max(0, ...rows.map(r=>r.floor));
  const target = {};
  rows.forEach(r=> target[r.key] = total > 0 ? r.floor / total : 1 / rows.length);
  rows.forEach(r=>{ if(terrFrac[r.key] == null) terrFrac[r.key] = 1 / rows.length; });
  Object.keys(terrFrac).forEach(k=>{ if(!(k in target)) delete terrFrac[k]; });

  const legend = el('terrLegend');
  if(legend){
    Array.from(legend.children).forEach(row=>{
      const r = rows.find(x=> x.key === row.dataset.key);
      if(!r) return;
      row.querySelector('.terr-leg-dot').style.background = r.info.color;
      row.querySelector('.terr-leg-name').textContent = r.info.label;
      row.querySelector('.terr-leg-val').textContent = r.floor + unitLabel();
      row.querySelector('.terr-leg-mem').textContent = avatarStrip(membersBy[r.key], 20);
      row.classList.toggle('leader', maxFloor > 0 && r.floor === maxFloor);
    });
  }

  cancelAnimationFrame(terrRaf);
  const step = ()=>{
    let moving = false;
    rows.forEach(r=>{
      const d = target[r.key] - terrFrac[r.key];
      if(Math.abs(d) > 0.0015){ terrFrac[r.key] += d * 0.18; moving = true; }
      else terrFrac[r.key] = target[r.key];
    });
    drawTerritory(rows);
    if(moving) terrRaf = requestAnimationFrame(step);
  };
  step();
}

const CONFETTI_COLORS = ['#f2d27a','#e85d75','#5aa9e6','#7bd389','#c792ea','#ffffff'];
let confettiTimer = null;

function spawnConfettiBatch(n){
  const layer = el('confettiLayer');
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = (Math.random()*100)+'%';
    p.style.background = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    p.style.borderRadius = Math.random()<0.5 ? '50%' : '2px';
    const duration = 2.6 + Math.random()*2.2;
    p.style.animationDuration = duration+'s';
    p.style.animationDelay = (Math.random()*0.6)+'s';
    layer.appendChild(p);
    setTimeout(()=> p.remove(), (duration+1)*1000);
  }
}

function buildPodium(ranked){
  const podium = el('podium');
  if(!ranked.length){
    podium.innerHTML = '<div style="opacity:.75; font-size:1.1rem;">참가한 학생이 없어 시상대가 비어있습니다</div>';
    return;
  }
  const top3 = ranked.slice(0,3);
  const classes = ['p1','p2','p3'];
  const crowns = ['👑','🥈','🥉'];
  podium.innerHTML = top3.map((p,i)=>`
    <div class="place ${classes[i]}">
      <div class="crown">${crowns[i]}</div>
      <div class="pname">${escapeHtml(p.name)}</div>
      <div class="pfloor">${p.floor||0}${unitLabel()}</div>
      <div class="stand">${i+1}</div>
    </div>
  `).join('');
}

function showEndCelebration(players, ranked){
  if(!players.length) return;
  buildPodium(ranked);
  const teamWinnerEl = el('teamWinner');
  if(roundState.team_mode){
    const standings = teamStandings(players);
    if(standings.length){
      const info = teamInfo(standings[0].team);
      teamWinnerEl.textContent = `🏆 우승팀: ${info ? info.label : standings[0].team} (${standings[0].floor}${unitLabel()})`;
      teamWinnerEl.classList.remove('hidden');
    } else {
      teamWinnerEl.classList.add('hidden');
    }
  } else {
    teamWinnerEl.classList.add('hidden');
  }
  el('endOverlay').classList.add('show');
  spawnConfettiBatch(70);
  if(confettiTimer) clearInterval(confettiTimer);
  confettiTimer = setInterval(()=> spawnConfettiBatch(12), 900);
  playFanfare();
}

function hideEndCelebration(){
  el('endOverlay').classList.remove('show');
  el('confettiLayer').innerHTML = '';
  if(confettiTimer){ clearInterval(confettiTimer); confettiTimer = null; }
}

// ── 아이템전 연출 ──────────────────────────────────
function itemToast(text){
  const box = el('itemToasts');
  if(!box) return;
  const d = document.createElement('div');
  d.className = 'item-toast';
  d.textContent = text;
  box.appendChild(d);
  setTimeout(()=> d.remove(), 3000);
}

function flashClimberFx(pid, type){
  const node = climberEls[pid];
  if(!node) return;
  const emoji = type==='fog' ? '🌫️' : type==='ice' ? '🧊' : type==='snail' ? '🐌' : '⬇️';
  let badge = node.querySelector('.fx-badge');
  if(!badge){ badge = document.createElement('div'); badge.className = 'fx-badge'; node.appendChild(badge); }
  badge.textContent = emoji;
  if(type==='fog') node.classList.add('fx-fog');
  const dur = type==='fog' ? ITEM_FX_MS.fog : type==='ice' ? ITEM_FX_MS.ice : 2600;
  setTimeout(()=>{ if(badge) badge.remove(); node.classList.remove('fx-fog'); }, dur);
}

// 팀전: 팀 아레나에서 피격 팀 구역을 잠깐 흔든다 (땅따먹기 범례·조각 / 줄다리기 tug-end)
function flashTeamFx(teamKey, type){
  const emoji = type==='fog' ? '🌫️' : type==='ice' ? '🧊' : type==='snail' ? '🐌' : '⬇️';
  const keys = TEAM_OPTIONS.slice(0, roundState.team_count || 4).map(t=>t.key);
  const ti = keys.indexOf(teamKey);
  const nodes = [];
  // 땅따먹기(원그래프): 범례 줄 + 해당 조각을 함께 흔든다
  document.querySelectorAll(`.terr-leg-row[data-key="${teamKey}"], .terr-slice[data-key="${teamKey}"]`)
    .forEach(n=> nodes.push(n));
  if((roundState.team_count || 4) <= 2 && (ti === 0 || ti === 1)){
    const end = document.querySelector(ti === 0 ? '.tug-end.left' : '.tug-end.right');
    if(end) nodes.push(end);
  }
  nodes.forEach(n=>{
    n.classList.add('team-fx');
    if(n instanceof HTMLElement){
      let b = n.querySelector('.team-fx-badge');
      if(!b){ b = document.createElement('div'); b.className = 'team-fx-badge'; n.appendChild(b); }
      b.textContent = emoji;
      setTimeout(()=>{ n.classList.remove('team-fx'); if(b) b.remove(); }, 2600);
    } else {
      setTimeout(()=> n.classList.remove('team-fx'), 2600);
    }
  });
}

function showItemEvent(e){
  const it = ITEMS[e.type];
  if(!it) return;
  const who = escapeHtml(e.byName || '누군가');
  if(it.kind === 'global'){
    if(e.type === 'santa'){ itemToast(`🎁 ${who} → 모두 +1${unitLabel()}!`); spawnConfettiBatch(20); }
    else { itemToast(`🌈 ${who} → 20초간 모두 2배!`); festivalUntil = e.at + ITEM_FX_MS.festival; festivalBy = e.byName || ''; spawnConfettiBatch(16); }
    return;
  }
  if(it.kind === 'attack'){
    if(e.targetTeam){
      const tgt = teamInfo(e.targetTeam);
      itemToast(`${it.emoji} ${who} → ${tgt ? tgt.label : '상대 팀'}에 ${it.name}!`);
      flashTeamFx(e.targetTeam, e.type);
    } else {
      itemToast(`${it.emoji} ${who} → 선두권에게 ${it.name}!`);
      flashClimberFx(e.target, e.type);
    }
    return;
  }
  itemToast(`${it.emoji} ${who} → ${it.name}`);
}

function render(){
  const remaining = roundState.end_time!=null ? Math.max(0, Math.round((roundState.end_time - serverNow())/1000)) : null;
  let effective = roundState.status;
  if(roundState.status==='running' && remaining!==null && remaining<=0) effective='ended';

  // 후반부로 갈수록 배경음 템포를 서서히 올린다 (마지막 30초는 최고 속도)
  if(effective === 'running' && remaining !== null && roundState.duration_sec){
    const frac = remaining / roundState.duration_sec;   // 1 → 0
    let t = (0.55 - frac) / 0.55;                       // 남은 55% 지점부터 가속 시작
    if(remaining <= 30) t = 1;
    bgmIntensity = Math.min(1, Math.max(0, t));
  } else {
    bgmIntensity = 0;
  }

  const pill = el('statusPill');
  pill.className = 'pill ' + effective;
  pill.textContent = effective==='idle' ? '대기중' : effective==='running' ? '진행중' : '종료';
  el('timerVal').textContent = fmtTime(remaining);

  const players = Object.entries(playersObj).map(([id,p])=>({id,...p}));
  players.sort((a,b)=> (b.floor||0)-(a.floor||0) || (b.correct||0)-(a.correct||0));
  const ranked = rankedPlayers(players);

  el('emptyMsg').style.display = players.length ? 'none' : 'flex';

  el('lbList').innerHTML = ranked.length ? ranked.slice(0,10).map((p,i)=>`
    <div class="lb-row ${i===0?'rank1':''}">
      <div class="lb-medal">${MEDALS[i] || (i+1)}</div>
      <div class="lb-name">${escapeHtml(p.name||'')}</div>
      <div class="lb-floor">${p.floor||0}${unitLabel()}</div>
    </div>
  `).join('') : '<div style="opacity:.6; font-size:.85rem; padding:6px 4px;">아직 참가한 학생이 없습니다</div>';

  const teamOn = !!roundState.team_mode;
  el('towerArea').classList.toggle('hidden', teamOn);
  el('teamArena').classList.toggle('hidden', !teamOn);
  el('teamScoreBar').classList.remove('show');
  if(teamOn){
    renderTeamArena(players);
  } else {
    renderTower(players, ranked[0]?.id);
  }

  const bonus = activeBonus(roundState, serverNow());
  const banner = el('bonusBanner');
  if(bonus){
    banner.classList.add('show');
    el('bonusRemain').textContent = bonus.remaining;
    if(!prevBonusActive){ spawnConfettiBatch(24); playBonusChime(); }
  } else {
    banner.classList.remove('show');
  }
  prevBonusActive = !!bonus;

  const fb = el('festivalBanner');
  if(serverNow() < festivalUntil){
    fb.classList.add('show');
    el('festivalWho').textContent = festivalBy ? festivalBy + ' 님의 ' : '';
    el('festivalRemain').textContent = Math.ceil((festivalUntil - serverNow())/1000);
  } else {
    fb.classList.remove('show');
    festivalBy = '';
  }

  const imb = el('itemsModeBadge');
  const im = roundState.items_mode;
  imb.classList.toggle('hidden', !im || im === 'off');
  imb.textContent = im === 'spicy' ? '⚔️ 아이템전 · 매운맛' : im === 'mild' ? '🎁 아이템전 · 순한맛' : '';

  if(effective === 'ended' && prevEffective !== 'ended'){
    showEndCelebration(players, ranked);
  } else if(effective !== 'ended' && prevEffective === 'ended'){
    hideEndCelebration();
  }
  // 새 라운드가 시작될 때마다 배경음 곡을 새로 뽑는다
  if(effective === 'running' && prevEffective !== 'running' && bgmStarted){
    pickRandomSong();
    bgmStep = 0;
  }
  prevEffective = effective;
}

onValue(roomRef(ROOM,'round'), (snap)=>{
  const r = snap.val();
  roundState = r ? {
    status: r.status||'idle', end_time: r.end_time ?? null, duration_sec: r.duration_sec||420,
    bonus: r.bonus||[], team_mode: !!r.team_mode, team_count: r.team_count||4,
    items_mode: r.items_mode||'off'
  } : { status:'idle', end_time:null, duration_sec:420, bonus:[], team_mode:false, team_count:4, items_mode:'off' };
});
onValue(roomRef(ROOM,'item_events'), (snap)=>{
  const obj = snap.val() || {};
  const now = serverNow();
  Object.entries(obj).forEach(([k,e])=>{
    if(seenItemEvents.has(k)) return;
    seenItemEvents.add(k);
    if(!e || !e.at || now - e.at > 12000) return;
    showItemEvent(e);
  });
});
onValue(roomRef(ROOM,'players'), (snap)=>{
  playersObj = snap.val() || {};
});

buildBackground();
setInterval(render, 500);
</script>
